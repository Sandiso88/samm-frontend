<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ SAMM Core AI Platform</title>
    <!-- React core (pinned, production builds) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Standalone in-browser Babel compiler (fine for a demo; use a real build for production) -->
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <!-- Tailwind CSS framework (pinned) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #191919; color: #E3E3E3; font-family: sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG
      // Leave API_URL empty for DEMO MODE (simulated replies, nothing is sent).
      // Set it to your API Gateway / Function URL that fronts lambda_function.py, e.g.
      //   "https://abc123.execute-api.us-east-1.amazonaws.com/prod/query"
      // The endpoint must allow CORS for this page's origin.
      // ------------------------------------------------------------------
      const API_URL = "";
      const DEMO_MODE = !API_URL;

      // Roles shown in the selector. This is a UI PREVIEW ONLY: real permissions are enforced
      // by the backend from the signed-in user's token, never from this dropdown.
      const ROLES = [
        { value: "viewer", label: "Viewer (Cap: 100 Rows)" },
        { value: "analyst", label: "Analyst (BI View Controls)" },
        { value: "engineer", label: "Engineer (Ingestion Access)" },
        { value: "admin", label: "Administrator (Full Access)" },
      ];
      const CAN_ONBOARD = ["engineer", "admin"];

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const demoReply = (text) => {
        const t = text.toLowerCase();
        if (t.includes("score") || t.includes("velocity")) {
          return "### Compiled SQL (simulated)\nSELECT tenant_id, account_matrix_id, profile_score \nFROM glue_db_cvvdr97yl50zyt.gold_accounts_profile_matrix \nWHERE profile_score > 0.75 \nORDER BY activity_velocity DESC \nLIMIT 10\n\n### Analytical Summary (simulated)\nThis is a canned demo response. No query was run against your lakehouse.";
        }
        return "### Compiled SQL (simulated)\nSELECT account_matrix_id \nFROM glue_db_cvvdr97yl50zyt.gold_accounts_profile_matrix \nLIMIT 5\n\n### Analytical Summary (simulated)\nThis is a canned demo response. No query was run against your lakehouse.";
      };

      async function callBackend(prompt) {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        let data = {};
        try { data = await res.json(); } catch (_) { /* non-JSON error body */ }
        if (!res.ok || data.error) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      }

      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0]);
        const shown = rows.slice(0, 10);
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {shown.map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-[10px] text-[#A0A0A0] mt-1 font-mono">Showing {shown.length} of {rows.length} rows</div>
          </div>
        );
      }

      function SammConsole() {
        const nextId = useRef(0);
        const stamp = () => new Date().toLocaleTimeString();
        const makeMsg = (role, content, rows) => ({ id: `m${++nextId.current}`, role, content, rows, timestamp: stamp() });

        const [messages, setMessages] = useState([
          {
            id: "init",
            role: "assistant",
            content: DEMO_MODE
              ? "Welcome to the SAMM Core Engine Console (DEMO MODE). Replies are simulated and nothing is sent to your lakehouse. Set API_URL in this file to connect it."
              : "Welcome to the SAMM Core Engine Console. Ask a natural language question to compile secure SQL against the Gold layer.",
            timestamp: "System Ready",
          },
        ]);
        const [input, setInput] = useState("");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);
        const [systemRole, setSystemRole] = useState("viewer");

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const addMessage = (role, content, rows) => setMessages((prev) => [...prev, makeMsg(role, content, rows)]);
        // Strict Role Responsibility Mapping Matrix
        const isEngineer = ["engineer", "admin"].includes(systemRole);
        const isAnalyst = ["analyst", "viewer", "engineer", "admin"].includes(systemRole);
        const canOnboard = isEngineer; // Keeps compatibility with any existing buttons

        // Automatically evict non-privileged users from backend data pipelines
        useEffect(() => {
          if (!isEngineer && activeTab === "onboarding") {
            setActiveTab("chat");
            setMessages((prev) => [
              ...prev,
              {
                id: `sys-${Date.now()}`,
                role: "assistant",
                content: "⚠️ **Access Policy Enforcement:** Your active profile limits you strictly to reports and views. Pipeline management from Silver to Gold is locked for your role.",
                timestamp: new Date().toLocaleTimeString()
              }
            ]);
          }
        }, [systemRole, activeTab]);

        const handleRoleChange = (role) => {
          setSystemRole(role);
          if (!CAN_ONBOARD.includes(role) && activeTab === "onboarding") setActiveTab("chat");
        };

        const handleSendMessage = async (e) => {
          e.preventDefault();
          const userText = input.trim();
          if (!userText || isLoading) return;
          addMessage("user", userText);
          setInput("");
          setIsLoading(true);
          try {
            if (DEMO_MODE) {
              await sleep(1000);
              addMessage("assistant", demoReply(userText));
            } else {
              const d = await callBackend(userText);
              addMessage(
                "assistant",
                `### Compiled SQL\n${d.executed_sql}\n\n### Analytical Summary\n${d.report_markdown}`,
                d.raw_data_grid
              );
            }
          } catch (err) {
            addMessage("assistant", `⚠️ ${err.message}`);
          } finally {
            setIsLoading(false);
          }
        };

        const handlePipelineTrigger = async () => {
          setFormError("");
          if (!/^s3:\/\/[^/\s]+\/\S+/.test(s3Path.trim())) {
            setFormError("Source path must look like s3://bucket/key.");
            return;
          }
          try {
            JSON.parse(contextPayload);
          } catch (_) {
            setFormError("Context payload is not valid JSON.");
            return;
          }
          setIsLoading(true);
          await sleep(800);
          // The ingestion endpoint is not connected yet, so this is always a simulation.
          addMessage(
            "assistant",
            `### Simulated ingestion request\nTarget handler: shiftleft-superposition-pipeline-orchestrator\nAsset: ${s3Path.trim()}\n\nNo request was sent: the ingestion endpoint is not connected to this page yet.`
          );
          setActiveTab("chat");
          setIsLoading(false);
        };

        const navClass = (tab, disabled) =>
          `w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${
            activeTab === tab
              ? "bg-[#2D2D2D] text-white border-l-4 border-amber-500"
              : disabled
              ? "text-[#555555] cursor-not-allowed"
              : "text-[#A0A0A0] hover:bg-[#252525] hover:text-white"
          }`;

        return (
          <div className="flex h-screen bg-[#191919] text-[#E3E3E3] font-sans overflow-hidden w-full">
            {/* LEFT SIDEBAR PANEL */}
            <div className="w-64 bg-[#202020] border-r border-[#2D2D2D] flex flex-col justify-between">
              <div>
                <div className="p-5 flex items-center space-x-3 border-b border-[#2D2D2D]">
                  <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                  <div>
                    <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                    <p className="text-[10px] text-amber-500 font-mono">Serverless Core v2.4</p>
                  </div>
                </div>
                <nav className="p-4 space-y-2">
                  <button onClick={() => setActiveTab("chat")} className={navClass("chat", false)}>
                    <span>💬 Cognitive Chat</span>
                  </button>
                  <button
                    onClick={() => canOnboard && setActiveTab("onboarding")}
                    disabled={!canOnboard}
                    title={canOnboard ? "" : "Requires Engineer or Administrator"}
                    className={navClass("onboarding", !canOnboard)}
                  >
                    <span>📦 Data Onboarding</span>
                  </button>
                </nav>
              </div>
              <div className="p-4 border-t border-[#2D2D2D] bg-[#1E1E1E]">
                <div className="text-xs text-[#A0A0A0] mb-2"><span>🛡️ Identity Firewall</span></div>
                <select
                  aria-label="Preview role"
                  value={systemRole}
                  onChange={(e) => handleRoleChange(e.target.value)}
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                >
                  {ROLES.map((r) => <option key={r.value} value={r.value}>{r.label}</option>)}
                </select>
                <p className="text-[10px] text-[#707070] mt-2 leading-snug">
                  UI preview only. The server enforces your real role from your sign-in.
                </p>
              </div>
            </div>

            {/* CENTRAL INTERACTIVE CHAT ENGINE FEED */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#191919]">
              <header className="h-16 border-b border-[#2D2D2D] px-6 flex items-center justify-between bg-[#1A1A1A]">
                <div className="flex items-center space-x-3">
                  <span className="text-xs uppercase bg-[#2D2D2D] text-amber-500 font-mono px-2.5 py-1 rounded border border-[#3D3D3D]">Active Console Context</span>
                  {DEMO_MODE && (
                    <span className="text-xs uppercase bg-amber-900/40 text-amber-400 font-mono px-2.5 py-1 rounded border border-amber-700">Demo mode: simulated</span>
                  )}
                </div>
                <div className="flex items-center space-x-4 text-xs font-mono text-[#A0A0A0]">
                  <span>👤 Context: {systemRole.toUpperCase()}</span>
                  <span>💾 Workgroup: shiftleft-superposition</span>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {activeTab === "chat" && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                        <div className={`max-w-[85%] rounded-xl p-5 shadow-lg ${msg.role === "user" ? "bg-amber-600 text-white" : "bg-[#222222] border border-[#2D2D2D] text-[#E3E3E3]"}`}>
                          <div className="text-xs font-mono text-[#A0A0A0] mb-2 flex justify-between items-center space-x-6">
                            <span className="font-bold text-amber-500">{msg.role === "user" ? "USER TRANSACTION" : "SAMM AI ENGINE"}</span>
                            <span>{msg.timestamp}</span>
                          </div>
                          <div className="text-sm leading-relaxed whitespace-pre-wrap font-sans">{msg.content}</div>
                          <ResultTable rows={msg.rows} />
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-4 flex items-center space-x-3">
                          <span className="text-xs font-mono text-[#A0A0A0] animate-pulse">⚙️ Compiling Bedrock pipeline...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                )}

                {activeTab === "onboarding" && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <p className="text-xs text-[#A0A0A0] mt-1">Simulated: the ingestion endpoint is not connected yet.</p>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className="block text-xs font-mono text-[#A0A0A0] mb-1">Source file (S3 path)</label>
                        <input
                          id="s3path"
                          value={s3Path}
                          onChange={(e) => setS3Path(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label htmlFor="ctx" className="block text-xs font-mono text-[#A0A0A0] mb-1">Context payload (JSON)</label>
                        <textarea
                          id="ctx"
                          rows={4}
                          value={contextPayload}
                          onChange={(e) => setContextPayload(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      {formError && <div className="text-xs text-red-400 font-mono">{formError}</div>}
                      <button
                        onClick={handlePipelineTrigger}
                        disabled={isLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
                      >
                        Trigger Pipeline Ingestion
                      </button>
                    </div>
                  </div>
                )}
              </div>

              {activeTab === "chat" && (
                <form onSubmit={handleSendMessage} className="border-t border-[#2D2D2D] bg-[#1A1A1A] p-4">
                  <div className="max-w-4xl mx-auto flex space-x-3">
                    <input
                      aria-label="Ask a question"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      disabled={isLoading}
                      placeholder="Ask a question about your Gold data..."
                      className="flex-1 bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 disabled:opacity-50"
                    />
                    <button
                      type="submit"
                      disabled={isLoading || !input.trim()}
                      className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-6 rounded-lg transition"
                    >
                      Send
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<SammConsole />);
    </script>
  </body>
</html>
