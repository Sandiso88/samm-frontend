    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG
      // Paste your Lambda Function URL below (the one for SAMM-AI-Query-Engine), e.g.

        admin: "Manages the users and policies of their own client.",
        system_admin: "Platform owner. Every client, every role.",
      };
      const ROLE_ROW_CAP = { viewer: 100, analyst: 500, engineer: 1000, admin: 1000, system_admin: 1000 };
      const CAN_ONBOARD = ["engineer", "admin", "system_admin"];
      const CAN_GOVERN = ["admin", "system_admin"];
      const PERSONAS = [
        { value: "architect", label: "Architect" },

      ];

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ------------------------------------------------------------------
      // Markdown helpers: split text into plain parts and fenced code blocks.
      // An unterminated fence is left as plain text (never swallowed).
      // ------------------------------------------------------------------
      function splitBlocks(text) {
        const parts = [];
        const re = /```([\w+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
        let last = 0;
        let m;
        while ((m = re.exec(text || "")) !== null) {
          if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
          parts.push({ type: "code", lang: (m[1] || "text").toLowerCase(), code: m[2].replace(/\s+$/, "") });
          last = re.lastIndex;
        }
        if (last < (text || "").length) parts.push({ type: "text", text: text.slice(last) });
        return parts;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      // ------------------------------------------------------------------
      // Backend client with detailed diagnostics.
      // ------------------------------------------------------------------
      class ApiError extends Error {
        constructor(message, details, status) {
          super(message);
          this.details = details || [];
          this.status = status || 0;
        }
      }

      async function callBackend(url, token, payload) {
        let res;
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify(payload),
          });
        } catch (err) {
          // The browser hides the real reason for security reasons. These are the usual causes.
          throw new ApiError(
            "Could not reach the SAMM endpoint (the browser reported: " + (err && err.message ? err.message : "network error") + ").",
            [
              "Duplicate CORS headers: CORS must be configured on the Lambda Function URL only. Deploy lambda_function.py v4, which sends no CORS headers itself.",
              "The Function URL's CORS 'Allow headers' must include both: content-type and authorization (preflight fails otherwise).",
              "The Function URL's CORS 'Allow origins' must include this page's origin (" + window.location.origin + ") or *, and 'Allow methods' must include POST.",
              "Function URL auth type must be NONE and its resource policy must allow public invocation (otherwise AWS returns 403 without CORS headers).",
              "Check the URL is correct, and that the Lambda timeout (about 60 s) is long enough for Athena and Bedrock.",
              "Open the browser console (F12), Network tab, and look at the OPTIONS and POST rows for the exact status.",
            ],
            0
          );
        }
        let data = {};
        let rawText = "";
        try {
          rawText = await res.text();
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          data = {};
        }
        if (res.ok && !data.error) return data;

        const serverMsg = data.error || data.message || (rawText ? rawText.slice(0, 200) : "");
        const status = res.status;
        const hints = {
          400: ["The request or the generated SQL was rejected. Try rephrasing the question."],
          401: ["Your token is missing, wrong or expired. Sign out and enter a valid access token.", "Ask an admin to check SAMM_TOKEN_REGISTRY on the Lambda."],
          403: [
            "If the message names a role or column, your role is not allowed to do that.",
            "If it is a bare AWS 'Forbidden', the Function URL resource policy does not allow public invocation (auth NONE needs a lambda:InvokeFunctionUrl permission for principal *).",
          ],
          409: ["The Gold view has no tenant column, so tenant isolation cannot be enforced. Add tenant_id to the Gold view, or set ALLOW_UNSCOPED=true for single-tenant testing only."],
          413: ["FinOps circuit breaker: this question would scan more than the per-query data limit, so SAMM stopped it before it could cost money.", "Narrow it by date range, dataset or site, then ask again."],
          429: ["Too many requests or Bedrock throttling. Wait a moment and retry."],
          502: ["The model returned an empty or unusable answer. Retry; check Bedrock model access and MODEL_ID."],
          503: ["The server has no token registry configured (SAMM_TOKEN_REGISTRY is empty)."],
          504: ["The Lambda timed out. Raise the function timeout (about 60 s)."],
        };
        throw new ApiError(
          serverMsg || "Request failed (HTTP " + status + ").",
          hints[status] || (status >= 500 ? ["Server error. Check the CloudWatch logs for SAMM-AI-Query-Engine."] : []),
          status
        );
      }

      // ------------------------------------------------------------------
      // Demo data (clearly labelled as simulated everywhere it is shown)
      // ------------------------------------------------------------------
      const fmtBytes = (n) => { n = Number(n) || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; };
      const DEMO_IDENTITY = { email: "demo@samm.local", role: "admin", tenant_id: "DEMO_TENANT", row_cap: 1000 };

      function demoQuery(prompt) {
        const wantsBi = /power\s*bi|dax|sisense|json/i.test(prompt);
        const sql = "SELECT account_matrix_id, profile_score\nFROM tenant_scoped\nWHERE profile_score > 0.75\nORDER BY profile_score DESC\nLIMIT 10";
        let report = "**Simulated answer.** No query ran against your lakehouse.\n\nTen demo accounts have a profile score above 0.75.";
        if (wantsBi) {
          report += "\n\n```dax\nEVALUATE\nTOPN(10, FILTER('Gold', 'Gold'[profile_score] > 0.75), 'Gold'[profile_score], DESC)\n```\n\n```json\n{\n  \"table_name\": \"gold_accounts_profile_matrix\",\n  \"columns\": [\"account_matrix_id\", \"profile_score\"]\n}\n```";
        }
        return {
          generated_sql: sql,
          executed_sql: "WITH tenant_scoped AS (SELECT * FROM gold WHERE tenant_id = 'DEMO_TENANT')\n" + sql,
          report_markdown: report,
          raw_data_grid: [
            { account_matrix_id: "1001", profile_score: "0.93" },
            { account_matrix_id: "1002", profile_score: "0.88" },
            { account_matrix_id: "1003", profile_score: "0.81" },
          ],
          role: "admin",
          tenant_id: "DEMO_TENANT",
          row_cap: 1000,
          truncated: false,
          finops: { scanned_bytes: 2400000, ceiling_bytes: 5368709120, est_cost_usd: 0.00005, pct_of_ceiling: 0.04, queries: 1 },
        };
      }

      // ------------------------------------------------------------------
      // Small components
      // ------------------------------------------------------------------
      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0]);
        const shown = rows.slice(0, 10);
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {shown.map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-[10px] text-[#A0A0A0] mt-1 font-mono">Showing {shown.length} of {rows.length} rows</div>
          </div>
        );
      }

      function ErrorCard({ message, details, status }) {
        return (
          <div data-testid="error-card" className="border border-red-800 bg-red-950/40 rounded-lg p-4 text-sm">
            <div className="font-bold text-red-300">
              ⚠️ {status === 413 ? "FinOps circuit breaker" : status ? "Error " + status : "Connection problem"}
            </div>
            <div className="text-red-200 mt-1 whitespace-pre-wrap">{message}</div>
            {details && details.length > 0 && (
              <ul className="list-disc ml-5 mt-3 space-y-1 text-xs text-red-200/90">
                {details.map((d, i) => <li key={i}>{d}</li>)}
              </ul>
            )}
          </div>
        );
      }

      function SimBadge({ children }) {
        return (
          <span className="text-xs uppercase bg-amber-900/40 text-amber-400 font-mono px-2.5 py-1 rounded border border-amber-700">
            {children}
          </span>
        );
      }

      function SignIn({ onSignedIn, onDemo, defaultUrl }) {
        const [url, setUrl] = useState(defaultUrl);
        const [token, setToken] = useState("");
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);

        const submit = async (e) => {
          e.preventDefault();
          setError(null);
          const u = url.trim();
          const t = token.trim();
          if (!/^https:\/\/\S+$/.test(u)) {
            setError(new ApiError("Endpoint must be an https:// URL (your Lambda Function URL).", []));
            return;
          }
          if (!t) {
            setError(new ApiError("Enter your access token.", []));
            return;
          }
          setBusy(true);
          try {
            const who = await callBackend(u, t, { action: "whoami" });
            onSignedIn({ url: u, token: t, identity: who });
          } catch (err) {
            setError(err);
          } finally {
            setBusy(false);
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center bg-[#191919] p-4">
            <form onSubmit={submit} className="w-full max-w-md bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-4">
              <div className="flex items-center space-x-3 border-b border-[#2D2D2D] pb-4">
                <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                <div>
                  <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                  <p className="text-[10px] text-amber-500 font-mono">Sign in with your access token</p>
                </div>
              </div>
              <div>
                <label htmlFor="endpoint" className="block text-xs font-mono text-[#A0A0A0] mb-1">Endpoint (Lambda Function URL)</label>
                <input
                  id="endpoint"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://xxxx.lambda-url.eu-west-2.on.aws/"
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                />
              </div>
              <div>
                <label htmlFor="token" className="block text-xs font-mono text-[#A0A0A0] mb-1">Access token</label>
                <input
                  id="token"
                  type="password"
                  autoComplete="off"
                  value={token}
                  onChange={(e) => setToken(e.target.value)}
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                />
                <p className="text-[10px] text-[#707070] mt-1">Kept in memory only. It is gone when you close or refresh the tab.</p>
              </div>
              {error && <ErrorCard message={error.message} details={error.details} status={error.status} />}
              <button
                type="submit"
                disabled={busy}
                className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
              >
                {busy ? "Checking token..." : "Sign in"}
              </button>
              <button
                type="button"
                onClick={onDemo}
                className="w-full text-xs text-[#A0A0A0] hover:text-white underline"
              >
                Explore in demo mode (simulated, nothing is sent)
              </button>
            </form>
          </div>
        );
      }

      function ArtifactPanel({ open, artifacts, activeId, onSelect, onClose }) {
        const [copied, setCopied] = useState("");
        const [copyFailed, setCopyFailed] = useState(false);
        const active = artifacts.find((a) => a.id === activeId) || artifacts[artifacts.length - 1];

        const doCopy = async () => {
          if (!active) return;
          const ok = await copyText(active.code);
          setCopyFailed(!ok);
          setCopied(ok ? active.id : "");
          if (ok) setTimeout(() => setCopied(""), 1800);
        };

        return (
          <aside
            data-testid="artifact-panel"
            aria-hidden={!open}
            style={{ width: open ? 480 : 0, transition: "width 300ms ease" }}
            className="bg-[#1E1E1E] border-l border-[#2D2D2D] overflow-hidden flex-shrink-0"
          >
            <div style={{ width: 480 }} className="h-full flex flex-col">
              <div className="h-16 px-4 border-b border-[#2D2D2D] flex items-center justify-between">
                <span className="text-xs uppercase text-amber-500 font-mono">Artifacts ({artifacts.length})</span>
                <button onClick={onClose} aria-label="Close artifact panel" className="text-[#A0A0A0] hover:text-white text-lg px-2">×</button>
              </div>
              <div className="flex overflow-x-auto border-b border-[#2D2D2D] text-xs font-mono">
                {artifacts.map((a) => (
                  <button
                    key={a.id}
                    onClick={() => onSelect(a.id)}
                    className={"px-3 py-2 whitespace-nowrap " + (active && active.id === a.id ? "text-white border-b-2 border-amber-500" : "text-[#A0A0A0] hover:text-white")}
                  >
                    {a.title}
                  </button>
                ))}
              </div>
              {active ? (
                <div className="flex-1 flex flex-col min-h-0 p-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] uppercase text-[#A0A0A0] font-mono">{active.lang}</span>
                    <button
                      onClick={doCopy}
                      data-testid="copy-btn"
                      className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-md transition"
                    >
                      {copied === active.id ? "Copied ✓" : "Copy"}
                    </button>
                  </div>
                  {copyFailed && <div className="text-xs text-red-300 mb-2">Copy was blocked by the browser. Select the text below and press Ctrl+C.</div>}
                  <pre data-testid="artifact-code" className="flex-1 overflow-auto bg-[#151515] border border-[#2D2D2D] rounded-md p-3 text-xs font-mono text-[#E3E3E3] whitespace-pre">{active.code}</pre>
                </div>
              ) : (
                <div className="p-4 text-xs text-[#A0A0A0]">Nothing here yet. DAX, JSON and SQL from replies appear here.</div>
              )}
            </div>
          </aside>
        );
      }

      // Renders message text; fenced code blocks become clickable chips that open the artifact panel.
      function MessageBody({ msg, onOpenArtifact }) {
        const parts = splitBlocks(msg.text || "");
        let codeIdx = 0;
        return (
          <div className="text-sm leading-relaxed font-sans">
            {parts.map((p, i) => {
              if (p.type === "text") return <div key={i} className="whitespace-pre-wrap">{p.text}</div>;
              const art = (msg.artifacts || [])[codeIdx++];
              return (
                <button
                  key={i}
                  data-testid="artifact-chip"
                  onClick={() => art && onOpenArtifact(art.id)}
                  className="my-2 w-full text-left bg-[#151515] border border-[#3D3D3D] hover:border-amber-500 rounded-lg px-3 py-2 transition"
                >
                  <span className="text-amber-500 font-mono text-xs uppercase">{p.lang}</span>
                  <span className="text-[#A0A0A0] text-xs ml-2">{p.code.split("\n").length} lines · click to open in side panel</span>
                </button>
              );
            })}
          </div>
        );
      }


      // ------------------------------------------------------------------
      // Data Onboarding hub (live): upload -> Bronze -> Silver -> field mapping -> Gold view
      // ------------------------------------------------------------------
      const STAGES = [["upload", "Upload"], ["bronze", "Bronze"], ["silver", "Silver"], ["map", "Map fields"], ["gold", "Gold view"]];
      const ACCEPT = ".xlsx,.xlsm,.csv,.tsv,.json,.jsonl,.txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.xml,.parquet,.zip,.md,.log";

      async function putFile(url, file) {
        let res;
        try {
          res = await fetch(url, { method: "PUT", body: file });
        } catch (_) {
          throw new ApiError("The browser could not upload the file to S3.", [
            "The S3 bucket needs a CORS rule that allows PUT from this site (" + window.location.origin + "). Run deploy_samm.py again with --origin set to this address.",
            "The upload link lasts 15 minutes; try again if it expired.",
          ], 0);
        }
        if (!res.ok) {
          throw new ApiError("S3 refused the upload (HTTP " + res.status + ").", [
            "The upload link may have expired; try again.",
            "The SAMM Lambda role must be allowed to write to the bucket (s3:PutObject).",
          ], res.status);
        }
      }

      function ErrBox({ err }) {
        if (!err) return null;
        return (
          <div className="mt-2 bg-[#2A1515] border border-red-900 rounded-lg p-3 text-xs text-red-200" data-testid="onb-error">
            <div className="font-bold">{err.status ? "Error " + err.status : "Error"}: {err.message}</div>
            {(err.details || []).length > 0 && (
              <ul className="list-disc ml-5 mt-1 space-y-0.5 text-red-300">
                {err.details.map((d, i) => <li key={i}>{d}</li>)}
              </ul>
            )}
          </div>
        );
      }

      function OnboardingHub({ session, onAsk, onViewsChanged }) {
        const [items, setItems] = useState([]);
        const [over, setOver] = useState(false);
        const [pipe, setPipe] = useState({ busy: false, msg: "", err: null });
        const seq = useRef(0);
        const itemsRef = useRef([]);
        itemsRef.current = items;
        const api = (payload) => callBackend(session.url, session.token, payload);
        const upd = (id, patch) => setItems((p) => p.map((i) => (i.id === id ? { ...i, ...patch } : i)));
        const updDs = (id, ds, patch) =>
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { ...i.datasets[ds], ...patch } } } : i)));

        const loadMapping = async (id, ds) => {
          const pm = await api({ action: "profile_map", dataset: ds });
          const edits = {};
          pm.rows.forEach((r) => { edits[r.name] = (r.status === "auto" || r.status === "saved" || r.status === "duplicate") ? (r.target || "") : ""; });
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { rows: pm.rows, targets: pm.targets, edits, estimated: pm.estimated_rows, building: false, built: null, error: null } } } : i)));
        };

        const runFile = async (id, file) => {
          try {
            upd(id, { stage: "upload", msg: "Requesting a secure upload link..." });
            const init = await api({ action: "upload_init", filename: file.name, size: file.size });
            upd(id, { msg: "Uploading to Bronze..." });
            await putFile(init.upload_url, file);
            upd(id, { stage: "bronze", msg: "Stored in Bronze. Structuring..." });
            const ing = await api({ action: "ingest", key: init.key });
            if (ing.mode === "archived") {
              upd(id, { stage: "done", msg: ing.note, done: true });
              return;
            }
            let names = [];
            if (ing.mode === "done") {
              names = ing.datasets.map((d) => d.dataset);
            } else {
              upd(id, { stage: "silver", msg: ing.note + " Waiting for it to finish (up to 2 minutes)..." });
              for (let n = 0; n < 24 && names.length === 0; n++) {
                await sleep(5000);
                const r = await api({ action: "datasets", since: ing.since });
                names = r.datasets.map((d) => d.dataset);
              }
              if (names.length === 0) {
                throw new ApiError("The orchestrator has not produced any dataset yet.", [
                  "It may still be running: use 'Check for new datasets' below in a minute.",
                  "Check the CloudWatch logs of shiftleft-superposition-pipeline-orchestrator for errors.",
                ], 0);
              }
            }
            upd(id, { stage: "map", msg: "Reading columns and suggesting field mappings...", order: names, datasets: {} });
            for (const ds of names) await loadMapping(id, ds);
            upd(id, { msg: "Review the suggested mapping, then build the Gold view." });
          } catch (err) {
            upd(id, { error: err, msg: "Stopped." });
          }
        };

        const addFiles = (fileList) => {
          Array.from(fileList || []).forEach((file) => {
            const id = "f" + ++seq.current;
            setItems((p) => [{ id, name: file.name, size: file.size, stage: "upload", msg: "Queued", datasets: {}, order: [], error: null, done: false }, ...p]);
            runFile(id, file);
          });
        };

        const build = async (id, ds) => {
          const it = itemsRef.current.find((i) => i.id === id);
          const d = it.datasets[ds];
          const mapping = {};
          d.rows.forEach((r) => { if (r.status !== "skip") mapping[r.name] = (d.edits[r.name] || "").trim() || null; });
          updDs(id, ds, { building: true, error: null });
          try {
            const res = await api({ action: "build_view", dataset: ds, mapping });
            updDs(id, ds, { building: false, built: res });
            upd(id, { stage: "gold", done: true, msg: "Gold view ready." });
            onViewsChanged();
          } catch (err) {
            updDs(id, ds, { building: false, error: err });
          }
        };

        const runPipeline = async () => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "run_pipeline" });
            setPipe({ busy: false, msg: "Pipeline started (" + r.function + "). Files already in Bronze are being converted. Click 'Check for new datasets' in a minute.", err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const checkNew = async (all) => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "datasets" });
            const fresh = all === true ? r.datasets : r.datasets.filter((d) => !d.view);
            if (fresh.length === 0) {
              setPipe({ busy: false, msg: all === true ? "No datasets found yet." : "No datasets are waiting for a Gold view.", err: null });
              return;
            }
            const id = "f" + ++seq.current;
            const order = fresh.map((d) => d.dataset);
            setItems((p) => [{ id, name: "Datasets already in Silver", size: 0, stage: "map", msg: "Review the mapping, then build (or rebuild) the Gold view.", datasets: {}, order, error: null, done: false }, ...p]);
            for (const ds of order) await loadMapping(id, ds);
            setPipe({ busy: false, msg: order.length + (all === true ? " dataset(s) loaded." : " dataset(s) found without a Gold view."), err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const badge = (st) => {
          const c = { auto: "bg-green-900 text-green-200", review: "bg-amber-900 text-amber-200", saved: "bg-blue-900 text-blue-200", new: "bg-[#333] text-[#BBB]", duplicate: "bg-[#333] text-[#BBB]", skip: "bg-[#333] text-[#777]" }[st] || "bg-[#333] text-[#BBB]";
          return <span className={"px-2 py-0.5 rounded text-[10px] font-mono " + c}>{st}</span>;
        };

        return (
          <div className="max-w-4xl mx-auto space-y-5" data-testid="onboarding-hub">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-4">
              <div>
                <h2 className="text-lg font-bold text-white">📦 Data Onboarding</h2>
                <p className="text-xs text-[#A0A0A0] mt-1">Upload raw files. SAMM lands them in Bronze, structures them in Silver, suggests how their fields map to your standard names, and builds a Gold view the chat can query. csv, tsv, json, jsonl, txt and Excel are structured; other formats are archived untouched.</p>
              </div>
              <label
                htmlFor="onb-file"
                onDragOver={(e) => { e.preventDefault(); setOver(true); }}
                onDragLeave={() => setOver(false)}
                onDrop={(e) => { e.preventDefault(); setOver(false); addFiles(e.dataTransfer.files); }}
                className={"block cursor-pointer text-center rounded-xl border-2 border-dashed p-8 text-sm transition " + (over ? "border-amber-500 bg-[#2A2418]" : "border-[#3D3D3D] hover:border-amber-600")}
              >
                <div className="text-white font-semibold">Drop files here, or click to choose</div>
                <div className="text-[11px] text-[#808080] mt-1">Up to 25 MB for csv/json/txt, 50 MB for Excel, 100 MB for archives</div>
                <input id="onb-file" data-testid="onb-file" type="file" multiple accept={ACCEPT} className="hidden" onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
              </label>
              <div className="flex flex-wrap items-center gap-3">
                <button onClick={runPipeline} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">▶ Run pipeline now</button>
                <button onClick={() => checkNew(false)} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">🔎 Check for new datasets</button>
                <button onClick={() => checkNew(true)} disabled={pipe.busy} data-testid="review-all" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">✏️ Review existing mappings</button>
                <span className="text-[11px] text-[#808080]">Run pipeline = convert files already in Bronze with your orchestrator.</span>
              </div>
              {pipe.msg && <div className="text-xs text-green-300">{pipe.msg}</div>}
              <ErrBox err={pipe.err} />
            </div>

            {items.map((it) => {
              const idx = STAGES.findIndex((s) => s[0] === it.stage);
              return (
                <div key={it.id} className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3" data-testid="onb-item">
                  <div className="flex justify-between items-center">
                    <div className="text-sm text-white font-mono truncate">{it.name}</div>
                    {it.size > 0 && <div className="text-[11px] text-[#808080]">{(it.size / 1024).toFixed(0)} KB</div>}
                  </div>
                  <div className="flex flex-wrap gap-2 text-[11px] font-mono">
                    {STAGES.map((s, n) => (
                      <span key={s[0]} className={"px-2 py-1 rounded border " + (it.done || n < idx ? "border-green-700 text-green-300" : n === idx && !it.error ? "border-amber-500 text-amber-300" : "border-[#333] text-[#707070]")}>
                        {(it.done || n < idx ? "✓ " : "") + s[1]}
                      </span>
                    ))}
                  </div>
                  <div className="text-xs text-[#C0C0C0]" data-testid="onb-msg">{it.msg}</div>
                  <ErrBox err={it.error} />

                  {(it.order || []).map((ds) => {
                    const d = it.datasets[ds];
                    if (!d) return null;
                    return (
                      <div key={ds} className="border border-[#2D2D2D] rounded-lg p-4 space-y-3 bg-[#1D1D1D]" data-testid="onb-dataset">
                        <div className="flex justify-between items-center">
                          <div className="text-sm text-amber-400 font-mono">{ds}</div>
                          <div className="text-[11px] text-[#808080]">about {d.estimated} rows · {d.rows.length} fields</div>
                        </div>
                        <div className="overflow-x-auto">
                          <table className="w-full text-xs">
                            <thead>
                              <tr className="text-left text-[#808080]">
                                <th className="py-1 pr-3">Source field</th><th className="pr-3">Type</th><th className="pr-3">Filled</th><th className="pr-3">Examples</th><th className="pr-3">Maps to</th><th>Match</th>
                              </tr>
                            </thead>
                            <tbody>
                              {d.rows.map((r) => (
                                <tr key={r.name} className="border-t border-[#2A2A2A]">
                                  <td className="py-1.5 pr-3 font-mono text-white">{r.name}</td>
                                  <td className="pr-3 text-[#A0A0A0]">{r.kind}</td>
                                  <td className="pr-3 text-[#A0A0A0]">{r.fill_pct}%</td>
                                  <td className="pr-3 text-[#808080] max-w-[160px] truncate" title={r.samples.join(", ")}>{r.samples.join(", ")}</td>
                                  <td className="pr-3">
                                    {r.status === "skip" ? <span className="text-[#606060]">skipped</span> : r.status === "duplicate" ? (
                                      <label className="flex items-center gap-2 text-[11px] text-[#C0C0C0]" title={r.reason}>
                                        <input type="checkbox" aria-label={"Hide " + r.name} disabled={!!d.built} checked={d.edits[r.name] === "-"}
                                          onChange={(e) => updDs(it.id, ds, { edits: { ...d.edits, [r.name]: e.target.checked ? "-" : "" } })} />
                                        hide (same as {r.duplicate_of})
                                      </label>
                                    ) : (
                                      <div>
                                        <input
                                          list={"targets-" + it.id}
                                          aria-label={"Maps to for " + r.name}
                                          value={d.edits[r.name] || ""}
                                          disabled={!!d.built}
                                          placeholder={r.name + " (keep)"}
                                          onChange={(e) => updDs(it.id, ds, { edits: { ...d.edits, [r.name]: e.target.value } })}
                                          className="w-44 bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white font-mono focus:outline-none focus:border-amber-500 disabled:opacity-60"
                                        />
                                        {r.status === "review" && r.target && !d.built && (d.edits[r.name] || "") !== r.target && (
                                          <button data-testid={"use-" + r.name} onClick={() => updDs(it.id, ds, { edits: { ...d.edits, [r.name]: r.target } })}
                                            className="block mt-1 text-[10px] text-amber-400 hover:text-amber-300 underline">use suggestion "{r.target}"?</button>
                                        )}
                                      </div>
                                    )}
                                  </td>
                                  <td>{badge(r.status)} {r.confidence > 0 && <span className="text-[10px] text-[#707070]">{Math.round(r.confidence * 100)}%</span>}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                          <datalist id={"targets-" + it.id}>{d.targets.map((t) => <option key={t} value={t} />)}</datalist>
                        </div>
                        <p className="text-[11px] text-[#707070]">Leave "Maps to" empty to keep the field's own name. Only confident matches are filled in for you; uncertain ones show a "use suggestion" link. Names must be lowercase letters, digits and underscores.</p>
                        <ErrBox err={d.error} />
                        {d.built ? (
                          <div className="flex flex-wrap items-center gap-3 text-xs" data-testid="onb-built">
                            <span className="text-green-300">✓ Built <span className="font-mono">{d.built.view}</span> ({d.built.rows == null ? "?" : d.built.rows} rows, {d.built.mapped} fields renamed{d.built.hidden ? ", " + d.built.hidden + " hidden" : ""})</span>
                            <button data-testid="edit-mapping" onClick={() => updDs(it.id, ds, { built: null })} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1.5 rounded-lg">Edit mapping</button>
                            <button onClick={() => onAsk(d.built.view)} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg">Ask about this dataset</button>
                          </div>
                        ) : (
                          <button onClick={() => build(it.id, ds)} disabled={d.building} data-testid="onb-build" className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-4 py-2 rounded-lg">
                            {d.building ? "Building Gold view..." : "Approve mapping & build Gold view"}
                          </button>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        );
      }


      // ------------------------------------------------------------------
      // Governance: users and per-client policy (admins only; the server enforces everything)
      // ------------------------------------------------------------------
      function GovernanceHub({ session, identity }) {
        const api = (payload) => callBackend(session.url, session.token, payload);
        const [data, setData] = useState(null);
        const [err, setErr] = useState("");
        const [busy, setBusy] = useState(false);
        const [issued, setIssued] = useState(null);
        const [copied, setCopied] = useState(false);
        const [form, setForm] = useState({ email: "", role: "viewer", tenant_id: "", expires_days: "" });
        const [tenants, setTenants] = useState([]);
        const [policyTenant, setPolicyTenant] = useState(identity.tenant_id);
        const [pol, setPol] = useState(null);
        const [polMsg, setPolMsg] = useState("");
        const isSys = identity.role === "system_admin";

        const fail = (e) => setErr((e && e.message) || "Something went wrong.");
        const loadUsers = async () => {
          try { setData(await api({ action: "users" })); setErr(""); } catch (e) { fail(e); }
        };
        const loadPolicy = async (t) => {
          try {
            const r = await api({ action: "policy_get", tenant_id: t });
            const p = r.policy || {};
            setPol({ restricted: (p.restricted_columns || []).join(", "), caps: { ...(p.row_caps || {}) }, scan: p.scan_limit_gb == null ? "" : String(p.scan_limit_gb), meta: r });
            setPolMsg("");
          } catch (e) { fail(e); }
        };
        useEffect(() => { loadUsers(); if (isSys) api({ action: "tenants" }).then((r) => setTenants(r.tenants || [])).catch(() => {}); }, []);
        useEffect(() => { loadPolicy(policyTenant); }, [policyTenant]);

        const save = async (payload) => {
          setBusy(true); setErr("");
          try {
            const r = await api({ action: "user_save", ...payload });
            if (r.token) { setIssued({ email: r.user.email, token: r.token }); setCopied(false); }
            await loadUsers();
            return true;
          } catch (e) { fail(e); return false; } finally { setBusy(false); }
        };
        const addUser = async (e) => {
          e.preventDefault();
          const payload = { email: form.email, role: form.role };
          if (isSys && form.tenant_id) payload.tenant_id = form.tenant_id;
          if (form.expires_days) payload.expires_days = Number(form.expires_days);
          if (await save(payload)) setForm({ ...form, email: "", expires_days: "" });
        };
        const copy = async () => {
          try { await navigator.clipboard.writeText(issued.token); setCopied(true); } catch (_) { setCopied(false); }
        };
        const savePolicy = async () => {
          setBusy(true); setPolMsg(""); setErr("");
          try {
            const caps = {};
            Object.keys(pol.caps).forEach((r) => { if (pol.caps[r] !== "" && pol.caps[r] != null) caps[r] = Number(pol.caps[r]); });
            await api({ action: "policy_save", tenant_id: policyTenant, policy: { restricted_columns: pol.restricted, row_caps: caps, scan_limit_gb: pol.scan === "" ? null : Number(pol.scan) } });
            setPolMsg("Saved. It applies to the next request.");
          } catch (e) { fail(e); } finally { setBusy(false); }
        };

        const inp = "bg-[#151515] border border-[#3D3D3D] rounded-md px-2 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-amber-500";
        const btn = "px-3 py-1.5 rounded-md text-xs font-semibold bg-amber-500 text-black hover:bg-amber-400 disabled:opacity-50";
        const link = "text-xs underline text-[#A0A0A0] hover:text-white";
        const roles = (data && data.assignable_roles) || [];
        const rows = (data && data.users) || [];
        const boot = (data && data.bootstrap) || [];

        return (
          <div data-testid="governance-hub" className="max-w-3xl mx-auto space-y-5">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
              <p className="text-xs text-[#A0A0A0] leading-relaxed">
                {isSys ? "You manage every client." : "You manage the users and policy of client " + identity.tenant_id + "."} Tokens are shown once and only a hash is stored. The server checks your role on every call.
              </p>
              {err && <div data-testid="gov-error" className="text-xs text-red-300 bg-red-900/20 border border-red-800 rounded-md p-2">{err}</div>}
              {issued && (
                <div data-testid="issued-token" className="text-xs bg-amber-500/10 border border-amber-600 rounded-md p-3 space-y-2">
                  <div className="text-amber-300 font-semibold">New access token for {issued.email}. It is shown only once.</div>
                  <div className="font-mono break-all text-white bg-[#151515] rounded p-2 select-all">{issued.token}</div>
                  <div className="flex gap-3 items-center">
                    <button onClick={copy} className={btn}>{copied ? "Copied" : "Copy token"}</button>
                    <button onClick={() => setIssued(null)} className={link}>I have saved it, hide</button>
                  </div>
                  <div className="text-[#A0A0A0]">Send it to the user privately. They paste it on the sign-in screen.</div>
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Add a user</h3>
              <form onSubmit={addUser} className="flex flex-wrap gap-2 items-end">
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">E-mail
                  <input aria-label="User e-mail" required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className={inp + " w-56"} placeholder="name@company.com" />
                </label>
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Role
                  <select aria-label="User role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className={inp}>
                    {roles.map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                  </select>
                </label>
                {isSys && (
                  <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Client
                    <input aria-label="User client" list="gov-tenants" value={form.tenant_id} onChange={(e) => setForm({ ...form, tenant_id: e.target.value })} className={inp + " w-32"} placeholder={identity.tenant_id} />
                    <datalist id="gov-tenants">{tenants.map((t) => <option key={t} value={t} />)}</datalist>
                  </label>
                )}
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Expires (days)
                  <input aria-label="Expiry days" type="number" min="1" max="730" value={form.expires_days} onChange={(e) => setForm({ ...form, expires_days: e.target.value })} className={inp + " w-24"} placeholder="never" />
                </label>
                <button type="submit" disabled={busy} className={btn}>Create user</button>
              </form>
              <p className="text-[10px] text-[#707070]">{ROLE_HELP[form.role]}</p>
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Users ({rows.length})</h3>
              {!data && !err && <div className="text-xs text-[#A0A0A0]">Loading...</div>}
              <div className="space-y-2">
                {rows.map((u) => (
                  <div key={u.email + u.tenant_id} data-testid="user-row" className="bg-[#151515] border border-[#2D2D2D] rounded-md p-3 flex flex-wrap gap-2 items-center text-xs font-mono">
                    <div className="flex-1 min-w-[12rem]">
                      <div className="text-white truncate">{u.email}</div>
                      <div className="text-[#707070]">{u.tenant_id}{u.expires_at ? " | expires " + u.expires_at.slice(0, 10) : ""}{u.status === "disabled" ? " | DISABLED" : ""}</div>
                    </div>
                    <select aria-label={"Role for " + u.email} value={u.role} disabled={busy || u.email === identity.email || !roles.includes(u.role)} onChange={(e) => save({ email: u.email, tenant_id: u.tenant_id, role: e.target.value })} className={inp}>
                      {ROLES_ORDER.map((r) => <option key={r} value={r} disabled={!roles.includes(r)}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <button disabled={busy || u.email === identity.email} onClick={() => save({ email: u.email, tenant_id: u.tenant_id, status: u.status === "disabled" ? "active" : "disabled" })} className={link}>{u.status === "disabled" ? "Enable" : "Disable"}</button>
                    <button disabled={busy} onClick={() => { if (window.confirm("Issue a new token for " + u.email + "? The old token stops working.")) save({ email: u.email, tenant_id: u.tenant_id, reset_token: true, expires_days: u.expires_at ? 90 : undefined }); }} className={link}>Reset token</button>
                  </div>
                ))}
                {data && rows.length === 0 && <div className="text-xs text-[#A0A0A0]">No managed users yet. Create the first one above.</div>}
              </div>
              {boot.length > 0 && (
                <div className="pt-2 border-t border-[#2D2D2D]">
                  <div className="text-[10px] text-[#707070] mb-1">Break-glass tokens (set in the Lambda environment, not editable here)</div>
                  {boot.map((b, i) => <div key={i} className="text-xs font-mono text-[#A0A0A0]">{b.email} | {ROLE_LABELS[b.role] || b.role} | {b.tenant_id}</div>)}
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <div className="flex items-center gap-3">
                <h3 className="text-sm font-bold text-white">Client policy</h3>
                {isSys && (
                  <>
                    <input aria-label="Policy client" list="gov-tenants" value={policyTenant} onChange={(e) => setPolicyTenant(e.target.value)} className={inp + " w-36"} />
                  </>
                )}
                {!isSys && <span className="text-xs font-mono text-[#A0A0A0]">{policyTenant}</span>}
              </div>
              {pol && (
                <div className="space-y-3 text-xs">
                  <label className="flex flex-col gap-1 text-[#A0A0A0]">Hidden columns (comma separated, hidden from Viewer and Data Analyst)
                    <input aria-label="Restricted columns" value={pol.restricted} onChange={(e) => setPol({ ...pol, restricted: e.target.value })} className={inp} placeholder="salary, id_number" />
                    {pol.meta.platform_restricted.length > 0 && <span className="text-[10px] text-[#707070]">Always hidden platform-wide: {pol.meta.platform_restricted.join(", ")}</span>}
                  </label>
                  <div className="grid grid-cols-5 gap-2">
                    {ROLES_ORDER.map((r) => (
                      <label key={r} className="flex flex-col gap-1 text-[10px] text-[#A0A0A0]">{ROLE_LABELS[r]} rows
                        <input aria-label={"Row cap " + r} type="number" min="1" max={pol.meta.hard_max_rows} value={pol.caps[r] == null ? "" : pol.caps[r]} onChange={(e) => setPol({ ...pol, caps: { ...pol.caps, [r]: e.target.value } })} className={inp} placeholder={String(pol.meta.default_row_caps[r])} />
                      </label>
                    ))}
                  </div>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Scan limit per question (GB)
                    <input aria-label="Scan limit" type="number" step="0.01" value={pol.scan} onChange={(e) => setPol({ ...pol, scan: e.target.value })} className={inp} placeholder={"platform " + pol.meta.platform_scan_limit_gb} />
                    <span className="text-[10px] text-[#707070]">Can only be lower than the platform limit ({pol.meta.platform_scan_limit_gb} GB). A lower limit is checked after the query; the platform limit is the hard stop.</span>
                  </label>
                  <div className="flex items-center gap-3">
                    <button onClick={savePolicy} disabled={busy} className={btn}>Save policy</button>
                    {polMsg && <span data-testid="policy-saved" className="text-green-400">{polMsg}</span>}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }
      const ROLES_ORDER = ["viewer", "analyst", "engineer", "admin", "system_admin"];

      // ------------------------------------------------------------------
      // Main app
      // ------------------------------------------------------------------
      function SammConsole({ session, demo, onSignOut }) {

        const role = demo ? previewRole : identity.role;

        const [messages, setMessages] = useState([
          {
            id: "init",

              ? "Welcome to the SAMM Core Engine Console (DEMO MODE). Replies are simulated and nothing is sent to your lakehouse."

            timestamp: "System Ready",

        ]);
        const [artifacts, setArtifacts] = useState([]);

        const [persona, setPersona] = useState("architect");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");
        const [views, setViews] = useState([]);
        const [defaultView, setDefaultView] = useState("");
        const [activeView, setActiveView] = useState("");
        const loadViews = async () => {
          if (demo) return;
          try {
            const r = await callBackend(session.url, session.token, { action: "views" });
            setViews(r.views || []);
            setDefaultView(r.default || "");
          } catch (_) {
            /* older backend without datasets: the chat still works on the default view */
          }
        };
        useEffect(() => { loadViews(); }, []);

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current && messagesEndRef.current.scrollIntoView) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const canOnboard = CAN_ONBOARD.includes(role);
        const canGovern = CAN_GOVERN.includes(role);
        useEffect(() => {
          if (activeTab === "onboarding" && !canOnboard) setActiveTab("chat");
          if (activeTab === "governance" && !canGovern) setActiveTab("chat");
        }, [role]);

        const addMessage = (m) => setMessages((prev) => [...prev, { id: "m" + ++nextId.current, timestamp: stamp(), ...m }]);

        const registerArtifacts = (msgId, text, sql) => {
          const created = [];
          splitBlocks(text).forEach((p) => {
            if (p.type === "code") {
              created.push({ id: msgId + "-a" + created.length, lang: p.lang, title: p.lang.toUpperCase(), code: p.code });
            }
          });
          const list = [...created];
          let sqlArt = null;
          if (sql) {
            sqlArt = { id: msgId + "-sql", lang: "sql", title: "SQL (executed)", code: sql };
            list.push(sqlArt);
          }
          setArtifacts((prev) => [...prev, ...list]);
          // Open the panel automatically for BI output (DAX/JSON), not for plain SQL.
          if (created.length > 0) {
            setActiveArtifact(created[0].id);
            setPanelOpen(true);
          }
          return { inline: created, sqlArt };
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          return sendText(input.trim());
        };

        const sendText = async (userText) => {
          if (!userText || isLoading) return;
          addMessage({ role: "user", text: userText });
          setInput("");
          setIsLoading(true);
          try {
            let d;
            if (demo) {
              await sleep(700);
              d = demoQuery(userText);
            } else {
              // Note: no role and no tenant are sent. The server derives both from the token.
              d = await callBackend(session.url, session.token, { action: "query", prompt: userText, previous: (() => { const u = messages.filter((x) => x.role === "user"); return u.length ? String(u[u.length - 1].text).slice(0, 500) : undefined; })(), persona, view: activeView && activeView !== defaultView ? activeView : undefined });
            }
            const msgId = "r" + ++nextId.current;
            if (d.routed_view && d.view) setActiveView(d.view);   // the question named a dataset: stay on it for follow-ups
            const { inline, sqlArt } = registerArtifacts(msgId, d.report_markdown, d.executed_sql);
            setMessages((prev) => [
              ...prev,
              {
                id: msgId,
                role: "assistant",
                text: d.report_markdown || "",
                rows: d.raw_data_grid,
                artifacts: inline,
                sqlArtifact: sqlArt,
                meta: { role: d.role, tenant: d.tenant_id, cap: d.row_cap, truncated: d.truncated, finops: d.finops },
                suggestions: Array.isArray(d.suggestions) ? d.suggestions.slice(0, 5) : [],
                simulated: demo,
                timestamp: stamp(),
              },
            ]);
          } catch (err) {
            addMessage({
              role: "assistant",
              error: { message: err.message || String(err), details: err.details || [], status: err.status || 0 },
            });
          } finally {
            setIsLoading(false);
          }
        };

        const handlePipelineTrigger = async () => {
          setFormError("");
          if (!/^s3:\/\/[^/\s]+\/\S+/.test(s3Path.trim())) {
            setFormError("Source path must look like s3://bucket/key.");
            return;
          }
          try {
            JSON.parse(contextPayload);
          } catch (_) {
            setFormError("Context payload is not valid JSON.");
            return;
          }
          setIsLoading(true);
          await sleep(600);
          // The ingestion endpoint is not connected yet, so this is always a simulation.
          addMessage({
            role: "assistant",
            simulated: true,
            text: "Simulated ingestion request\nTarget handler: shiftleft-superposition-pipeline-orchestrator\nAsset: " + s3Path.trim() + "\n\nNo request was sent: the ingestion endpoint is not connected to this page yet.",
          });
          setActiveTab("chat");
          setIsLoading(false);
        };

        const openArtifact = (id) => {
          setActiveArtifact(id);
          setPanelOpen(true);
        };

        const navClass = (tab, disabled) =>
          "w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition " +
          (activeTab === tab
            ? "bg-[#2D2D2D] text-white border-l-4 border-amber-500"
            : disabled
            ? "text-[#555555] cursor-not-allowed"
            : "text-[#A0A0A0] hover:bg-[#252525] hover:text-white");

        return (
          <div className="flex h-screen bg-[#191919] text-[#E3E3E3] font-sans overflow-hidden w-full">
            {/* LEFT SIDEBAR PANEL */}
            <div className="w-64 bg-[#202020] border-r border-[#2D2D2D] flex flex-col justify-between flex-shrink-0">
              <div>
                <div className="p-5 flex items-center space-x-3 border-b border-[#2D2D2D]">
                  <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                  <div>
                    <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                    <p className="text-[10px] text-amber-500 font-mono">Serverless Core v2.5</p>
                  </div>
                </div>
                <nav className="p-4 space-y-2">
                  <button onClick={() => setActiveTab("chat")} className={navClass("chat", false)}>
                    <span>💬 Cognitive Chat</span>
                  </button>
                  <button
                    onClick={() => canOnboard && setActiveTab("onboarding")}
                    disabled={!canOnboard}
                    title={canOnboard ? "" : "Requires Data Engineer or above"}
                    className={navClass("onboarding", !canOnboard)}
                  >
                    <span>📦 Data Onboarding</span>
                  </button>
                  <button
                    onClick={() => canGovern && setActiveTab("governance")}
                    disabled={!canGovern}
                    title={canGovern ? "" : "Requires a Client or System Administrator"}
                    className={navClass("governance", !canGovern)}
                  >
                    <span>🛡️ Governance</span>
                  </button>
                </nav>
              </div>
              <div className="p-4 border-t border-[#2D2D2D] bg-[#1E1E1E]">
                <div className="text-xs text-[#A0A0A0] mb-2"><span>🛡️ Identity Firewall</span></div>
                {demo ? (
                  <>
                    <select
                      aria-label="Preview role"
                      value={previewRole}
                      onChange={(e) => setPreviewRole(e.target.value)}
                      className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                    >
                      {Object.keys(ROLE_LABELS).map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <p className="text-[10px] text-[#707070] mt-2 leading-snug">Demo preview only. In live mode your role comes from the server.</p>
                  </>
                ) : (
                  <div className="text-xs font-mono space-y-1">
                    <div data-testid="who-role" className="text-white">{ROLE_LABELS[identity.role] || identity.role}</div>
                    <div className="text-[#A0A0A0] truncate" title={identity.email}>{identity.email}</div>
                    <div className="text-[#A0A0A0] truncate" title={identity.tenant_id}>{identity.all_clients ? "All clients (home: " + identity.tenant_id + ")" : "Client: " + identity.tenant_id}</div>
                    <button onClick={onSignOut} className="mt-2 text-[#A0A0A0] hover:text-white underline">Sign out</button>
                  </div>
                )}
                {demo && <button onClick={onSignOut} className="mt-2 text-xs text-[#A0A0A0] hover:text-white underline">Exit demo</button>}
              </div>
            </div>

            {/* CENTRAL INTERACTIVE CHAT ENGINE FEED */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#191919]">
              <header className="h-16 border-b border-[#2D2D2D] px-6 flex items-center justify-between bg-[#1A1A1A]">
                <div className="flex items-center space-x-3">
                  <span className="text-xs uppercase bg-[#2D2D2D] text-amber-500 font-mono px-2.5 py-1 rounded border border-[#3D3D3D]">Active Console Context</span>
                  {demo && <SimBadge>Demo mode: simulated</SimBadge>}
                </div>
                <div className="flex items-center space-x-4 text-xs font-mono text-[#A0A0A0]">
                  <span>👤 {String(role).toUpperCase()}</span>
                  {!demo && views.length > 1 && (
                    <label className="flex items-center space-x-1">
                      <span>📚</span>
                      <select
                        aria-label="Dataset"
                        data-testid="dataset-select"
                        value={activeView || defaultView}
                        onChange={(e) => setActiveView(e.target.value)}
                        className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-xs text-white font-mono max-w-[220px] focus:outline-none focus:border-amber-500"
                      >
                        {views.map((v) => <option key={v.name} value={v.name}>{v.name.replace(/^gold_ai_/, "")}</option>)}
                      </select>
                    </label>
                  )}
                  <span>💾 Workgroup: shiftleft-superposition</span>
                  <button
                    onClick={() => setPanelOpen((o) => !o)}
                    data-testid="panel-toggle"
                    className="border border-[#3D3D3D] rounded px-2 py-1 hover:text-white hover:border-amber-500"
                  >
                    📄 Artifacts {artifacts.length > 0 ? "(" + artifacts.length + ")" : ""}
                  </button>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {activeTab === "chat" && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={"flex " + (msg.role === "user" ? "justify-end" : "justify-start")}>
                        <div className={"max-w-[85%] rounded-xl p-5 shadow-lg " + (msg.role === "user" ? "bg-amber-600 text-white" : "bg-[#222222] border border-[#2D2D2D] text-[#E3E3E3]")}>
                          <div className="text-xs font-mono text-[#A0A0A0] mb-2 flex justify-between items-center space-x-6">
                            <span className="font-bold text-amber-500">{msg.role === "user" ? "USER TRANSACTION" : "SAMM AI ENGINE"}</span>
                            <span>{msg.simulated ? "SIMULATED · " : ""}{msg.timestamp}</span>
                          </div>
                          {msg.error ? (
                            <ErrorCard message={msg.error.message} details={msg.error.details} status={msg.error.status} />
                          ) : (
                            <MessageBody msg={msg} onOpenArtifact={openArtifact} />
                          )}
                          {msg.sqlArtifact && (
                            <button
                              onClick={() => openArtifact(msg.sqlArtifact.id)}
                              data-testid="sql-chip"
                              className="mt-3 text-xs font-mono text-amber-500 hover:text-amber-400 underline"
                            >
                              Show executed SQL
                            </button>
                          )}
                          <ResultTable rows={msg.rows} />
                          {msg.suggestions && msg.suggestions.length > 0 && msg === messages[messages.length - 1] && (
                            <div className="flex flex-wrap gap-2 mt-3" data-testid="suggestions">
                              {msg.suggestions.map((sg) => (
                                <button key={sg} data-testid="suggestion" disabled={isLoading} onClick={() => sendText(sg)}
                                  className="text-xs border border-[#3D3D3D] hover:border-amber-500 text-[#D0D0D0] px-3 py-1.5 rounded-full disabled:opacity-50">{sg}</button>
                              ))}
                            </div>
                          )}
                          {msg.meta && (
                            <div className="text-[10px] text-[#707070] mt-2 font-mono">
                              role {msg.meta.role} · tenant {msg.meta.tenant} · row cap {msg.meta.cap}{msg.meta.truncated ? " · results truncated at the cap" : ""}
                              {msg.meta.finops && (" · scanned " + fmtBytes(msg.meta.finops.scanned_bytes) + " of " + fmtBytes(msg.meta.finops.ceiling_bytes) + " limit · est. $" + msg.meta.finops.est_cost_usd.toFixed(5))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-4 flex items-center space-x-3">
                          <span className="text-xs font-mono text-[#A0A0A0] animate-pulse">⚙️ Compiling Bedrock pipeline...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                )}

                {activeTab === "onboarding" && !demo && (
                  <OnboardingHub
                    session={session}
                    onViewsChanged={loadViews}
                    onAsk={(v) => {
                      loadViews();
                      setActiveView(v);
                      setActiveTab("chat");
                      addMessage({ role: "assistant", text: "Now answering from the dataset **" + v.replace(/^gold_ai_/, "") + "**. Ask a question, for example: How many records are there?" });
                    }}
                  />
                )}

                {activeTab === "onboarding" && demo && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <div className="mt-2"><SimBadge>Simulated: ingestion endpoint not connected</SimBadge></div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className="block text-xs font-mono text-[#A0A0A0] mb-1">Source file (S3 path)</label>
                        <input
                          id="s3path"
                          value={s3Path}
                          onChange={(e) => setS3Path(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label htmlFor="ctx" className="block text-xs font-mono text-[#A0A0A0] mb-1">Context payload (JSON)</label>
                        <textarea
                          id="ctx"
                          rows={4}
                          value={contextPayload}
                          onChange={(e) => setContextPayload(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      {formError && <div className="text-xs text-red-400 font-mono">{formError}</div>}
                      <button
                        onClick={handlePipelineTrigger}
                        disabled={isLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
                      >
                        Trigger Pipeline Ingestion (simulated)
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === "governance" && (
                  demo ? (
                    <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
                      <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
                      <SimBadge>Demo mode: sign in with an administrator token to manage users and policy</SimBadge>
                    </div>
                  ) : (
                    <GovernanceHub session={session} identity={identity} />
                  )
                )}
              </div>

              {activeTab === "chat" && (
                <form onSubmit={handleSendMessage} className="border-t border-[#2D2D2D] bg-[#1A1A1A] p-4">
                  <div className="max-w-4xl mx-auto flex space-x-3">
                    <select
                      aria-label="Persona"
                      value={persona}
                      onChange={(e) => setPersona(e.target.value)}
                      className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg px-2 text-xs text-white font-mono focus:outline-none focus:border-amber-500"
                    >
                      {PERSONAS.map((p) => <option key={p.value} value={p.value}>{p.label}</option>)}
                    </select>
                    <input
                      aria-label="Ask a question"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      disabled={isLoading}
                      placeholder="Ask a question about your Gold data..."
                      className="flex-1 bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 disabled:opacity-50"
                    />
                    <button
                      type="submit"
                      disabled={isLoading || !input.trim()}
                      className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-6 rounded-lg transition"
                    >
                      Send
                    </button>
                  </div>
                </form>
              )}
            </div>

            {/* RIGHT-HAND ARTIFACT PANEL */}
            <ArtifactPanel
              open={panelOpen}
              artifacts={artifacts}
              activeId={activeArtifact}
              onSelect={setActiveArtifact}
              onClose={() => setPanelOpen(false)}
            />
          </div>
        );
      }

      function App() {
        const [session, setSession] = useState(null);
        const [demo, setDemo] = useState(FORCE_DEMO);
        if (demo) return <SammConsole demo={true} onSignOut={() => setDemo(false)} />;
        if (!session) {
          return <SignIn defaultUrl={API_URL} onSignedIn={setSession} onDemo={() => setDemo(true)} />;
        }
        return <SammConsole session={session} demo={false} onSignOut={() => setSession(null)} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
