  <body style="margin: 0; padding: 0;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // ------------------------------------------------------------------
      // CONFIG
      // Paste your Lambda Function URL below (the one for SAMM-AI-Query-Engine), e.g.
      //   "https://abcdefghij.lambda-url.eu-west-2.on.aws/"
      // Leave it empty to use DEMO MODE only (simulated replies, nothing is sent).
      // You can also open the page with ?demo=1 to force demo mode.
      //
      // IMPORTANT: configure CORS on the Function URL ONLY (Allow headers: content-type, authorization).
      // lambda_function.py v4 deliberately sends no CORS headers of its own, because
      // duplicate Access-Control-Allow-Origin headers make browsers report "Failed to fetch".
      // ------------------------------------------------------------------
      const API_URL = "";
      const FORCE_DEMO = new URLSearchParams(window.location.search).get("demo") === "1";

      // Roles are DISPLAY labels only. Real permissions are enforced by the backend from your token.
      const ROLE_LABELS = {
        report_viewer: "Report viewer",
        viewer: "Viewer",
        analyst: "Data Analyst",
        engineer: "Data Engineer",
        admin: "Client Administrator",
        system_admin: "System Administrator",
      };
      const ROLE_HELP = {
        report_viewer: "Opens and drills into only the reports an engineer has shared with them. Nothing else.",
        viewer: "Asks questions. Small row cap.",
        analyst: "Larger row cap. Power BI DAX and Sisense output.",
        engineer: "Uploads files, runs the pipeline, maps fields, builds Gold views.",
        admin: "Manages the users and policies of their own client.",
        system_admin: "Platform owner. Every client, every role.",
      };
      const ROLE_ROW_CAP = { report_viewer: 100, viewer: 100, analyst: 500, engineer: 1000, admin: 1000, system_admin: 1000 };
      const CAN_ONBOARD = ["engineer", "admin", "system_admin"];
      const CAN_GOVERN = ["admin", "system_admin"];
      const CAN_GOLD = ["analyst", "engineer", "admin", "system_admin"];
      const PERSONAS = [
        { value: "architect", label: "Architect" },
        { value: "guard", label: "Guard" },
        { value: "finops", label: "FinOps" },
      ];

      const friendlyDs = (name, title) => title || String(name || "").replace(/^silver_/, "").replace(/_/g, " ");
      const callPublic = async (url, payload) => {   // for the invitation page: the code in the link is the only credential
        let res;
        try { res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) }); }
        catch (e) { throw new ApiError("Could not reach SAMM. Check your connection and try the link again.", [], 0); }
        let data = {};
        try { data = await res.json(); } catch (_) { data = {}; }
        if (res.ok && !data.error) return data;
        throw new ApiError(data.error || data.message || ("Request failed (HTTP " + res.status + ")."), [], res.status);
      };
      const REMEMBER_KEY = "samm_device";
      const rememberGet = () => { try { const v = JSON.parse(localStorage.getItem(REMEMBER_KEY) || "null"); return v && v.url && v.token ? v : null; } catch (_) { return null; } };
      const rememberSet = (url, token) => { try { localStorage.setItem(REMEMBER_KEY, JSON.stringify({ url, token })); } catch (_) { /* optional */ } };
      const rememberClear = () => { try { localStorage.removeItem(REMEMBER_KEY); } catch (_) { /* optional */ } };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ------------------------------------------------------------------
      // Markdown helpers: split text into plain parts and fenced code blocks.
      // An unterminated fence is left as plain text (never swallowed).
      // ------------------------------------------------------------------
      function splitBlocks(text) {
        const parts = [];
        const re = /```([\w+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
        let last = 0;
        let m;
        while ((m = re.exec(text || "")) !== null) {
          if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
          parts.push({ type: "code", lang: (m[1] || "text").toLowerCase(), code: m[2].replace(/\s+$/, "") });
          last = re.lastIndex;
        }
        if (last < (text || "").length) parts.push({ type: "text", text: text.slice(last) });
        return parts;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      // ------------------------------------------------------------------
      // Backend client with detailed diagnostics.
      // ------------------------------------------------------------------
      class ApiError extends Error {
        constructor(message, details, status) {
          super(message);
          this.details = details || [];
          this.status = status || 0;
        }
      }

      async function callBackend(url, token, payload) {
        let res;
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify((() => { const c = payload && payload.client !== undefined ? payload.client : window.__sammClient; return c ? { ...payload, client: c } : payload; })()),
          });
        } catch (err) {
          // The browser hides the real reason for security reasons. These are the usual causes.
          throw new ApiError(
            "Could not reach the SAMM endpoint (the browser reported: " + (err && err.message ? err.message : "network error") + ").",
            [
              "Duplicate CORS headers: CORS must be configured on the Lambda Function URL only. Deploy lambda_function.py v4, which sends no CORS headers itself.",
              "The Function URL's CORS 'Allow headers' must include both: content-type and authorization (preflight fails otherwise).",
              "The Function URL's CORS 'Allow origins' must include this page's origin (" + window.location.origin + ") or *, and 'Allow methods' must include POST.",
              "Function URL auth type must be NONE and its resource policy must allow public invocation (otherwise AWS returns 403 without CORS headers).",
              "Check the URL is correct, and that the Lambda timeout (about 60 s) is long enough for Athena and Bedrock.",
              "Open the browser console (F12), Network tab, and look at the OPTIONS and POST rows for the exact status.",
            ],
            0
          );
        }
        let data = {};
        let rawText = "";
        try {
          rawText = await res.text();
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          data = {};
        }
        if (res.ok && !data.error) return data;

        const serverMsg = data.error || data.message || (rawText ? rawText.slice(0, 200) : "");
        const status = res.status;
        const hints = {
          400: ["The request or the generated SQL was rejected. Try rephrasing the question."],
          401: payload && payload.action === "login" ? ["Check the e-mail and password. After five wrong tries the account pauses for 15 minutes.", "New accounts start on the starting password; your administrator can reset yours."] : ["Your sign-in is missing, wrong or has ended. Sign out and sign in again.", "If you use an access token, ask an admin to check SAMM_TOKEN_REGISTRY on the Lambda."],
          403: [
            "If the message names a role or column, your role is not allowed to do that.",
            "If it is a bare AWS 'Forbidden', the Function URL resource policy does not allow public invocation (auth NONE needs a lambda:InvokeFunctionUrl permission for principal *).",
          ],
          409: /tenant isolation|tenant column/i.test(serverMsg || "") ? ["The Gold view has no tenant column, so tenant isolation cannot be enforced. Rebuild that view from the Silver tab, or set ALLOW_UNSCOPED=true for single-tenant testing only."] : [],
          413: ["FinOps circuit breaker: this question would scan more than the per-query data limit, so SAMM stopped it before it could cost money.", "Narrow it by date range, dataset or site, then ask again."],
          429: payload && payload.action === "login" ? ["The account is paused after too many wrong tries. Wait the time shown, then try again."] : ["Too many requests or Bedrock throttling. Wait a moment and retry."],
          502: ["The model returned an empty or unusable answer. Retry; check Bedrock model access and MODEL_ID."],
          503: ["The server has no token registry configured (SAMM_TOKEN_REGISTRY is empty)."],
          504: ["The Lambda timed out. Raise the function timeout (about 60 s)."],
        };
        throw new ApiError(
          serverMsg || "Request failed (HTTP " + status + ").",
          hints[status] || (status >= 500 ? ["Server error. Check the CloudWatch logs for SAMM-AI-Query-Engine."] : []),
          status
        );
      }

      // ------------------------------------------------------------------
      // Demo data (clearly labelled as simulated everywhere it is shown)
      // ------------------------------------------------------------------
      const fmtBytes = (n) => { n = Number(n) || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; };
      const DEMO_IDENTITY = { email: "demo@samm.local", role: "admin", tenant_id: "DEMO_TENANT", row_cap: 1000 };

      function demoQuery(prompt) {
        const wantsBi = /power\s*bi|dax|sisense|json/i.test(prompt);
        const sql = "SELECT account_matrix_id, profile_score\nFROM tenant_scoped\nWHERE profile_score > 0.75\nORDER BY profile_score DESC\nLIMIT 10";
        let report = "**Simulated answer.** No query ran against your lakehouse.\n\nTen demo accounts have a profile score above 0.75.";
        if (wantsBi) {
          report += "\n\n```dax\nEVALUATE\nTOPN(10, FILTER('Gold', 'Gold'[profile_score] > 0.75), 'Gold'[profile_score], DESC)\n```\n\n```json\n{\n  \"table_name\": \"gold_accounts_profile_matrix\",\n  \"columns\": [\"account_matrix_id\", \"profile_score\"]\n}\n```";
        }
        return {
          generated_sql: sql,
          executed_sql: "WITH tenant_scoped AS (SELECT * FROM gold WHERE tenant_id = 'DEMO_TENANT')\n" + sql,
          report_markdown: report,
          raw_data_grid: [
            { account_matrix_id: "1001", profile_score: "0.93" },
            { account_matrix_id: "1002", profile_score: "0.88" },
            { account_matrix_id: "1003", profile_score: "0.81" },
          ],
          role: "admin",
          tenant_id: "DEMO_TENANT",
          row_cap: 1000,

      // ------------------------------------------------------------------
      // Small components

      function ResultTable({ rows }) {

      // ------------------------------------------------------------------
      // v18: automatic charts, pivot tables and pinned dashboard tiles. All drawn in the browser from the rows SAMM returned.
      // ------------------------------------------------------------------
      const CHART_COLORS = ["#8ef4b2", "#6ea8ff", "#F59E0B", "#F472B6", "#A78BFA", "#FB923C"];

      function PivotPanel({ rows }) {

                    {!card.isDs && !done && <select data-testid="card-tile-mode" aria-label={"What to do with " + t.title} value={t.mode} disabled={busy} onChange={(e) => onAct(card, "mode", { i: t.i, mode: e.target.value })} className={sel + " ml-auto"}><option value="update" disabled={!t.newRows}>Update with today's numbers</option><option value="keep">Keep as it was</option><option value="drop">Drop from the report</option></select>}
                  </div>
                  <div data-testid="card-tile-note" className="text-[10px] mt-1 text-[#78869b]">
                    {t.fail ? <span className="text-amber-200">Could not be run again: {t.fail}. It stays as it was.</span>
                      : t.newRows && !t.sameCols ? <span className="text-amber-200">The columns are different from before, so it is set to Keep. Choose Update if the new version is right.</span>
                      : t.same ? "Same numbers as before." + (t.via ? " (from " + t.via + ")" : "") : (t.via ? "From " + t.via + ". " : "") + "Now " + (t.newRows || []).length + " row" + ((t.newRows || []).length === 1 ? "" : "s") + (t.oldRows ? " (was " + t.oldRows.length + ")" : "") + "."}
                  </div>
                  {t.newRows && t.mode !== "drop" && !t.same && <div className="mt-2" data-testid="card-tile-preview"><DataTable rows={(t.mode === "keep" && t.oldRows ? t.oldRows : t.newRows).slice(0, 3)} pretty /></div>}
                </div>
              ))}
              {!done && (
                <div className="space-y-1 text-[11px] text-[#D0D0D0]">
                  <label data-testid="rp-keep-copy" className="flex items-center gap-2"><input type="checkbox" checked={!!card.keepCopy} onChange={(e) => onAct(card, "opt", { key: "keepCopy", value: e.target.checked })} />Keep the report as it is now, under Older versions</label>
                  <label data-testid="rp-pbi" className={"flex items-center gap-2 " + (card.pbiOk ? "" : "opacity-60")}><input type="checkbox" disabled={!card.pbiOk} checked={!!card.pbi} onChange={(e) => onAct(card, "opt", { key: "pbi", value: e.target.checked })} />Also send it to Power BI{!card.pbiOk && <span className="text-amber-200"> (not ready: {card.pbiMsg})</span>}</label>
                  <label data-testid="rp-sis" className={"flex items-center gap-2 " + (card.sisOk ? "" : "opacity-60")}><input type="checkbox" disabled={!card.sisOk} checked={!!card.sis} onChange={(e) => onAct(card, "opt", { key: "sis", value: e.target.checked })} />Also open it in Sisense{!card.sisOk && <span className="text-amber-200"> (not ready: {card.sisMsg})</span>}</label>
                  <div className="text-[10px] text-[#78869b]">You can also type here: "rename it to ...", "drop the second tile", "keep a copy", "also send it to Power BI".</div>
                </div>
              )}
            </div>
          );
          footer = !done && <div className="flex gap-2">{keepBtn("Republish" + (card.isDs ? "" : " " + nUp + " updated" + (nDrop ? ", " + nDrop + " dropped" : "")) + (card.pbi ? " and send to Power BI" : ""), false)}{discardBtn}</div>;
        } else if (card.kind === "admin") {
          body = <div className="text-xs text-[#D0D0D0] space-y-1"><div className="text-white font-semibold">{card.heading}</div>{card.facts.map((f, i) => <div key={i} data-testid="card-fact">{f}</div>)}{card.warn && <div data-testid="card-warn" className="text-amber-200">{card.warn}</div>}</div>;
          footer = !done && <div className="flex gap-2">{keepBtn(card.keepLabel || "Keep", false)}{discardBtn}</div>;
        } else if (card.kind === "tile_edit") {
          body = <div className="text-xs text-[#D0D0D0]">{card.op === "remove" ? <>Remove the tile <b>{card.tile.title}</b>.</> : <>Rename <b>{card.tile.title}</b> to <b>{card.to}</b>.</>}</div>;
          footer = !done && <div className="flex gap-2">{keepBtn("Keep", false)}{discardBtn}</div>;
        } else if (card.kind === "sources") {
          const picked = new Set(); card.rows.forEach((t) => t.matches.forEach((m) => { if (m.on) picked.add(m.id || m.view); }));
          body = (
            <div className="space-y-2">
              {card.rows.map((t, i) => (
                <div key={i} data-testid="card-source-group" className="border border-[#2c385d] rounded-xl p-2 bg-white/5 space-y-1">
                  <div className="text-[11px] text-[#b8c2d6]">{t.term ? "\"" + t.term + "\"" : "Everything available"}{t.via === "customer" ? " (customer: all of its tables and reports)" : ""}</div>
                  {t.matches.length === 0 && <div className="text-[11px] text-amber-200">Nothing matched.{t.other.length ? " " + t.other.map((o) => o.name).join(", ") + " is another customer: switch client first." : ""}</div>}
                  {t.matches.map((m, j) => <label key={(m.id || m.view)} data-testid="card-source" className="flex items-center gap-2 text-xs text-white"><input type="checkbox" checked={!!m.on} disabled={done} onChange={() => onAct(card, "toggle", { row: i, col: j })} /><span className="text-[10px] uppercase tracking-wide text-[#8ef4b2] w-12 shrink-0">{m.kind}</span><span className="truncate">{m.title}</span></label>)}
                  {t.more > 0 && <div className="text-[10px] text-[#78869b]">{t.more} more not shown. Use a more specific name.</div>}
                </div>
              ))}
              {!done && <input aria-label="New report name" data-testid="card-title" value={card.title} onChange={(e) => onAct(card, "title", e.target.value)} placeholder="Name of the new report" className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-xs text-white focus:outline-none focus:border-amber-500" />}
            </div>
          );
          footer = !done && <div className="flex gap-2">{keepBtn("Combine " + picked.size + " into a new report", picked.size === 0)}{discardBtn}</div>;
        } else if (card.kind === "publish") {
          body = <div className="text-xs text-[#D0D0D0] space-y-1"><div>{card.tool === "powerbi" ? "Send the dashboard to Power BI as " : "Open Sisense for "}<b>{card.title}</b>.</div>{card.emails.length > 0 && <div>E-mail the link to: {card.emails.join(", ")}</div>}</div>;
          footer = !done && <div className="flex gap-2">{keepBtn(card.tool === "powerbi" ? "Send to Power BI" : "Check Sisense and get the link", false)}{discardBtn}</div>;
        }
        return (
          <div data-testid="review-card" data-kind={card.kind} className="mt-2 border border-[#2c385d] rounded-2xl p-3 bg-[#13214a]/60 space-y-2">
            <div className="flex items-center gap-2">
              <div className="flex-1 text-[10px] uppercase tracking-wide text-[#78869b]">Review{done ? " · done" : ""}</div>
              <Chevron open={!cardShut} onClick={() => setCardShut(!cardShut)} label="review" testid="review-collapse" />
              <button type="button" data-testid="review-close" aria-label="Close this review" title={done ? "Close" : "Close without saving"} disabled={busy} onClick={() => onDiscard(card)} className="shrink-0 w-6 h-6 rounded border border-[#3D3D3D] text-[#b8c2d6] hover:text-white text-sm leading-none disabled:opacity-40">&times;</button>
            </div>
            {cardShut && <div data-testid="review-summary" className="text-xs text-[#b8c2d6]">{done ? (card.doneText || "Done.") : "Waiting for your choice."}</div>}
            {!cardShut && <>
            {body}
            {card.error && <div data-testid="card-error" className="text-[11px] text-red-300">{card.error}</div>}
            {done && <div data-testid="card-done" className="text-xs text-[#8ef4b2]">{card.doneText}</div>}
            {done && card.openId && <button data-testid="card-open-new" onClick={() => onAct(card, "open", card.openId)} className="text-xs border border-[#8ef4b2] text-[#8ef4b2] px-3 py-1.5 rounded-lg">{card.openLabel || "Open the new report"}</button>}
            {done && <CardLinks card={card} />}
            {footer}
            </>}
          </div>
        );
      }
      // The chat drawer on the Reports tab
      function useWide(min) {
          const [w, setW] = useState(() => (typeof window !== "undefined" ? window.innerWidth >= min : true));
          useEffect(() => { const f = () => setW(window.innerWidth >= min); window.addEventListener("resize", f); return () => window.removeEventListener("resize", f); }, [min]);
          return w;
        }
      // v58: opening one panel closes the one that was open before it ("versions", "share", "drill" on a report page)
      const announcePanel = (name) => { try { window.dispatchEvent(new CustomEvent("samm-panel", { detail: name })); } catch (_) { /* optional */ } };
      function Chevron({ open, onClick, label, testid }) {
        return <button type="button" data-testid={testid || "card-collapse"} aria-expanded={open} aria-label={(open ? "Collapse " : "Expand ") + (label || "card")} title={open ? "Collapse" : "Expand"} onClick={onClick} className="shrink-0 w-6 h-6 rounded border border-[#2c385d] hover:border-[#8ef4b2] text-[#b8c2d6] hover:text-white text-xs leading-none flex items-center justify-center">{open ? "\u25BE" : "\u25B8"}</button>;
      }
      function ReportView({ doc, api, client, onBack, onChanged, onAsk, canManage, viewerOnly, canRepublish }) {
        const [delAsk, setDelAsk] = useState(false);
        const [cur, setCur] = useState(doc);
        const [busy, setBusy] = useState(false);
        const [msg, setMsg] = useState("");
        const [vers, setVers] = useState(null);          // v52: older versions of this report (null = not opened)
        const [verDoc, setVerDoc] = useState(null);      // an older version being looked at (read only)
        useEffect(() => { setCur(doc); setVers(null); setVerDoc(null); }, [doc]);
        // v58: Undo / Redo while building the report, and collapsible tiles
        const [undo, setUndo] = useState([]);
        const [redo, setRedo] = useState([]);
        const [shut, setShut] = useState({});
        const prevDoc = useRef(null);
        const skipSig = useRef("");
        const snap = (d) => ({ title: d.title, accent: d.accent || "", tiles: d.tiles || [] });
        useEffect(() => { setUndo([]); setRedo([]); setShut({}); prevDoc.current = null; }, [cur.id]);
        useEffect(() => {
          const p = prevDoc.current;
          if (p && p.id === cur.id) {
            const a = JSON.stringify(snap(p)), b = JSON.stringify(snap(cur));
            if (a !== b) {
              if (skipSig.current === b) skipSig.current = "";
              else { setUndo((u) => [...u.slice(-19), snap(p)]); setRedo([]); }
            }
          }
          prevDoc.current = cur;
        }, [cur]);
        const loadVers = async () => { try { const r = await api({ action: "report_versions", id: cur.id }); setVers(r.versions || []); } catch (e) { setMsg(e.message || "Could not list older versions."); } };
        const AC = /^#[0-9a-fA-F]{6}$/.test(cur.accent || "") ? cur.accent : DT.mint;
        const [ren, setRen] = useState(null);
        const [hiers, setHiers] = useState([]);
        const [drillName, setDrillName] = useState("");
        useEffect(() => { let on = true; api({ action: "links_list" }).then((r) => { if (on) setHiers(r.hierarchies || []); }).catch(() => { /* older back end: no drill-downs */ }); return () => { on = false; }; }, [cur.client]);
        useEffect(() => { window.dispatchEvent(new CustomEvent("samm-report-opened", { detail: { id: cur.id, title: cur.title, accent: cur.accent || "" } })); }, [cur.id, cur.title, cur.accent]);
        useEffect(() => {
          const on = (e) => { const r = e.detail && e.detail.report; if (r && r.id === cur.id) { setCur(r); setVers(null); setVerDoc(null); if (onChanged) onChanged(); } };
          window.addEventListener("samm-report-updated", on);
          return () => window.removeEventListener("samm-report-updated", on);
        }, [cur.id]);
        const update = async (patch) => {
          setBusy(true); setMsg("");
          try { const r = await api({ action: "report_update", id: cur.id, ...patch }); setCur(r.report); setRen(null); if (onChanged) onChanged(); } catch (e) { setMsg(e.message || "Could not update the report."); } finally { setBusy(false); }
        };
        const restore = async (s, fromSet, toSet) => {
          setBusy(true); setMsg("");
          try {
            const r = await api({ action: "report_update", id: cur.id, title: s.title, accent: s.accent || "#8ef4b2", set_tiles: s.tiles });
            skipSig.current = JSON.stringify(snap(r.report));
            toSet((x) => [...x.slice(-19), snap(cur)]); fromSet((x) => x.slice(0, -1));
            setCur(r.report); setRen(null); if (onChanged) onChanged();
          } catch (e) { setMsg(e.message || "Could not undo that."); } finally { setBusy(false); }
        };
        const doUndo = () => { if (undo.length && !busy) restore(undo[undo.length - 1], setUndo, setRedo); };
        const doRedo = () => { if (redo.length && !busy) restore(redo[redo.length - 1], setRedo, setUndo); };
        const undoRef = useRef(null); undoRef.current = { doUndo, doRedo, can: !viewerOnly && !verDoc };
        useEffect(() => {
          const key = (e) => {
            const t = e.target; if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
            if (!(e.ctrlKey || e.metaKey) || !undoRef.current.can) return;
            const k = String(e.key || "").toLowerCase();
            if (k === "z" && !e.shiftKey) { e.preventDefault(); undoRef.current.doUndo(); }
            else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); undoRef.current.doRedo(); }
          };
          window.addEventListener("keydown", key); return () => window.removeEventListener("keydown", key);
        }, []);
        useEffect(() => {
          const on = (e) => { if (e.detail !== "versions") setVers(null); if (e.detail !== "drill") setDrillName(""); };
          window.addEventListener("samm-panel", on); return () => window.removeEventListener("samm-panel", on);
        }, []);
        const link = reportLink(cur.id, cur.client || client);
        const shown = verDoc || cur;
        const refresh = async () => {
          setBusy(true); setMsg("");
          try { const r = await api({ action: "report_refresh", id: cur.id }); setCur(r.report); setMsg("Numbers refreshed."); if (onChanged) onChanged(); } catch (e) { setMsg(e.message || "Could not refresh."); } finally { setBusy(false); }
        };
        const bt = "border border-[#2c385d] hover:border-[#8ef4b2] text-white text-xs px-3 py-1.5 rounded-lg disabled:opacity-50";
        return (
          <div data-testid="report-view" className="max-w-5xl mx-auto space-y-4 rounded-3xl p-6 border border-[#2c385d]" style={{ background: "radial-gradient(900px 380px at 75% -10%, #1d3a6b 0%, transparent 60%), linear-gradient(180deg,#13214a,#0f1c3f)" }}>
            <div className="flex items-center justify-between gap-3 flex-wrap">
              <img src={DATORE_LOGO} alt="datore" className="h-8" />
              <span className="text-[11px] text-[#78869b]">{cur.client || client} · updated {String(cur.updated || cur.created || "").slice(0, 16).replace("T", " ")} UTC · by {cur.by}</span>
            </div>
            {cur.held && cur.held.flagged > 0 && (
              <div data-testid="report-held" className="text-xs rounded-lg border border-amber-400/40 bg-amber-400/10 text-[#ffe08a] px-3 py-2">{cur.held.flagged} of {cur.held.total} rows are flagged for review{cur.held.hidden ? " and held out of these numbers" : " (they are still counted in these numbers)"}.</div>
            )}
            <h2 data-testid="report-title" className="text-3xl md:text-4xl font-extrabold text-white tracking-tight" dangerouslySetInnerHTML={{ __html: dtHeadline(shown.title).replace('class="hl"', 'style="color:' + AC + '"') }} />
            {!viewerOnly && <div data-testid="report-style" className="flex flex-wrap items-center gap-2 text-xs">
              {ren === null ? <button data-testid="report-rename" onClick={() => setRen(cur.title)} className="underline text-[#b8c2d6] hover:text-white">Rename</button> : (
                <span className="flex items-center gap-2">
                  <input data-testid="report-rename-input" aria-label="Report name" value={ren} maxLength={120} onChange={(e) => setRen(e.target.value)} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white w-64 focus:outline-none" />
                  <button data-testid="report-rename-save" disabled={busy || !ren.trim()} onClick={() => update({ title: ren })} className="bg-[#8ef4b2] text-[#13214a] font-bold px-3 py-1 rounded disabled:opacity-50">Save</button>
                  <button onClick={() => setRen(null)} className="text-[#b8c2d6] underline">Cancel</button>
                </span>
              )}
              <span className="text-[#78869b]">Colour</span>
              {ACCENT_SWATCHES.map(([n, hex]) => <button key={n} data-testid={"report-color-" + n} title={n} aria-label={"Colour " + n} onClick={() => update({ accent: hex })} className="w-5 h-5 rounded-full border-2" style={{ background: hex, borderColor: hex === AC ? "#fff" : "transparent" }} />)}
            </div>}
            <div className="flex flex-wrap gap-2">
              <button onClick={onBack} className={bt} data-testid="report-back">← All reports</button>
              {canRepublish && !verDoc && <button data-testid="report-versions" onClick={() => { if (vers === null) { announcePanel("versions"); loadVers(); } else setVers(null); }} className={bt}>{vers === null ? "Older versions" : "Hide older versions"}</button>}
              {!viewerOnly && !verDoc && <><button data-testid="report-undo" disabled={busy || undo.length === 0} title="Undo the last change to this report (Ctrl+Z)" onClick={doUndo} className={bt}>{"\u21B6"} Undo</button><button data-testid="report-redo" disabled={busy || redo.length === 0} title="Put back what you just undid (Ctrl+Shift+Z)" onClick={doRedo} className={bt}>Redo {"\u21B7"}</button></>}
              {(shown.tiles || []).length > 1 && <button data-testid="report-collapse-all" onClick={() => { const all = (shown.tiles || []).every((_, i) => shut[i]); const n = {}; (shown.tiles || []).forEach((_, i) => { n[i] = !all; }); setShut(n); }} className={bt}>{(shown.tiles || []).every((_, i) => shut[i]) ? "Expand all" : "Collapse all"}</button>}
              {cur.kind === "dataset" && !viewerOnly && <button onClick={refresh} disabled={busy} className={bt} data-testid="report-refresh">{busy ? "Refreshing..." : "Refresh numbers"}</button>}
              <button onClick={() => { try { navigator.clipboard.writeText(link); setMsg("Link copied."); } catch (_) { setMsg(link); } }} className={bt} data-testid="report-copy">Copy link</button>
              {canManage && (delAsk
                ? <span className="flex items-center gap-2 text-xs"><span className="text-amber-200">Delete this report for everyone?</span><button data-testid="report-del-yes" onClick={async () => { try { await api({ action: "report_delete", id: cur.id }); if (onChanged) onChanged(); onBack(); } catch (e) { setMsg(e.message || "Could not delete."); } }} className="underline text-red-300">Yes, delete</button><button onClick={() => setDelAsk(false)} className="underline text-[#b8c2d6]">No</button></span>
                : <button data-testid="report-del" onClick={() => setDelAsk(true)} className={bt}>Delete report</button>)}
              <button onClick={() => downloadBlob("samm-report-" + String(cur.title || "report").replace(/[^A-Za-z0-9]+/g, "_").slice(0, 30) + ".html", new Blob([reportHtml(cur.title, cur.client || client, cur.tiles || [], cur.accent)], { type: "text/html" }))} className={bt} data-testid="report-download">Download page</button>
              {hiers.length > 0 && (
                <select aria-label="Drill down" data-testid="report-drill" value={drillName} onChange={(e) => { if (e.target.value) announcePanel("drill"); setDrillName(e.target.value); }} className="bg-[#1b2a55] border border-[#2c385d] text-white text-xs rounded-lg px-2 py-1.5">
                  <option value="">Drill down...</option>{hiers.map((h) => <option key={h.name} value={h.name}>{h.name}</option>)}
                </select>
              )}
              {cur.dataset && !viewerOnly && <button data-testid="report-ask" title="Open the chat panel to ask SAMM about this report's data" onClick={() => openSplit({ dataset: cur.dataset, reportId: cur.id })} className={bt}>Ask SAMM</button>}
            </div>
            {(() => {
              const rpBtns = canRepublish && !verDoc ? <>
                <button data-testid="report-republish-share" title="Ask every tile again on today's data. You review the result in the middle of the page before anything is saved." onClick={() => window.dispatchEvent(new CustomEvent("samm-republish", { detail: { id: cur.id } }))} className={bt}>Republish</button>
                <button data-testid="report-republish-pbi" title="Same as Republish, with Power BI already ticked: the Power BI report is updated too and keeps its link." onClick={() => window.dispatchEvent(new CustomEvent("samm-republish", { detail: { id: cur.id, pbi: true } }))} className={bt}>Republish to Power BI</button></> : null;
              if (canManage && !viewerOnly) return <ReportShare api={api} reportId={cur.id} extra={rpBtns} />;
              return rpBtns ? <div className="flex flex-wrap gap-2">{rpBtns}</div> : null;
            })()}
            {msg && <div data-testid="report-msg" className="text-[11px] text-[#8ef4b2]">{msg}</div>}
            {vers !== null && !verDoc && (
              <div data-testid="versions-panel" className="rounded-xl border border-[#2c385d] bg-white/5 p-3 space-y-1 text-xs">
                <div className="text-white font-semibold">Older versions</div>
                {vers.length === 0 && <div data-testid="versions-empty" className="text-[#78869b]">None yet. Tick "Keep the report as it is now" when you republish, and the earlier version is saved here.</div>}
                {vers.map((v) => (
                  <div key={v.vid} data-testid="version-row" className="flex flex-wrap items-center gap-3">
                    <span className="text-white">{v.title}</span><span className="text-[#78869b]">{v.tiles} tile(s) · saved {String(v.saved_at || "").slice(0, 10)} by {v.saved_by}</span>
                    <button data-testid="version-open" onClick={async () => { try { const r = await api({ action: "report_version_get", id: cur.id, vid: v.vid }); setVerDoc(r.report); } catch (e) { setMsg(e.message || "Could not open that version."); } }} className="underline text-[#8ef4b2] hover:text-white">Open</button>
                    {canManage && <button data-testid="version-remove" onClick={async () => { try { await api({ action: "report_version_delete", id: cur.id, vid: v.vid }); loadVers(); } catch (e) { setMsg(e.message || "Could not remove it."); } }} className="underline text-[#78869b] hover:text-red-300">Remove</button>}
                  </div>
                ))}
              </div>
            )}
            {verDoc && (
              <div data-testid="version-banner" className="rounded-xl border border-amber-400/40 bg-amber-400/10 text-[#ffe08a] text-xs px-3 py-2 flex flex-wrap items-center gap-3">
                <span>You are looking at an older version: {verDoc.title}. It cannot be changed.</span>
                <button data-testid="version-back" onClick={() => setVerDoc(null)} className="underline text-white">Back to the current report</button>
              </div>
            )}
            {drillName && <DrillView api={api} name={drillName} reportId={cur.id} onClose={() => setDrillName("")} />}
            <div className="columns-1 lg:columns-2 gap-4" data-testid="report-tiles">
              {(shown.tiles || []).map((t, i) => {
                const single = t.rows.length === 1 ? Object.keys(t.rows[0]).filter((c) => numOf(t.rows[0][c]) !== null).slice(0, 4) : [];
                return (

      function PasswordForm({ url, token, oldPassword, forced, onDone, onCancel }) {
        const [old, setOld] = useState(oldPassword || "");
        const [n1, setN1] = useState("");

        const [busy, setBusy] = useState(false);

        const submit = async (e) => {
          e.preventDefault();
          setError(null);
          if (n1 !== n2) { setError(new ApiError("The two new passwords are not the same.", [])); return; }
          setBusy(true);
          try {
            const r = await callBackend(url, token, { action: "change_password", old_password: old, new_password: n1 });
            onDone(r.token);
          } catch (err) { setError(err); } finally { setBusy(false); }
        };
        const field = "w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-500";

          </form>

      function SignIn({ onSignedIn, onDemo, defaultUrl }) {
        const [url, setUrl] = useState(defaultUrl);
        const [mode, setMode] = useState("password");
        const [email, setEmail] = useState("");
        const [password, setPassword] = useState("");
        const [token, setToken] = useState("");
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);
        const [pending, setPending] = useState(null);      // signed in on the starting password: must choose their own

        const finish = async (u, t) => {
          const who = await callBackend(u, t, { action: "whoami" });
          onSignedIn({ url: u, token: t, identity: who });
        };

        const submit = async (e) => {
          e.preventDefault();
          setError(null);
          const u = url.trim();
          if (!/^https:\/\/\S+$/.test(u)) {
            setError(new ApiError("Endpoint must be an https:// URL (your Lambda Function URL).", []));
            return;
          }
          setBusy(true);
          try {
            if (mode === "token") {
              const t = token.trim();
              if (!t) throw new ApiError("Enter your access token.", []);
              await finish(u, t);
            } else {
              if (!email.trim() || !password) throw new ApiError("Enter your e-mail and password.", []);
              const r = await callBackend(u, "none", { action: "login", email: email.trim(), password });
              if (r.must_change) setPending({ url: u, token: r.token, old: password });
              else await finish(u, r.token);
            }
          } catch (err) {
            setError(err);
          } finally {
            setBusy(false);
          }
        };

        const field = "w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white focus:outline-none focus:border-amber-500";

              </div>
            ) : (
            <form onSubmit={submit} className="w-full samm-login-card p-8 space-y-4">
              <div className="flex flex-col items-center text-center space-y-2 pb-2">
                <SammMark size={44} />
                <h1 className="font-semibold text-xl text-white tracking-tight">SAMM AI</h1>
                <p className="text-xs text-[#A0A0A0]">{mode === "token" ? "Sign in with your access token" : "Sign in with your e-mail and password"}</p>
              </div>
              <div>
                <label htmlFor="endpoint" className="block text-xs font-mono text-[#A0A0A0] mb-1">Endpoint (Lambda Function URL)</label>
                <input
                  id="endpoint"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://xxxx.lambda-url.eu-west-2.on.aws/"
                  className={field + " font-mono"}
                />
              </div>
              {mode === "token" ? (
                <div>
                  <label htmlFor="token" className="block text-xs font-mono text-[#A0A0A0] mb-1">Access token</label>
                  <input id="token" type="password" autoComplete="off" value={token} onChange={(e) => setToken(e.target.value)} className={field + " font-mono"} />
                  <p className="text-[10px] text-[#707070] mt-1">Kept in memory only. It is gone when you close or refresh the tab.</p>
                </div>
              ) : (
                <>
                  <div>
                    <label htmlFor="email" className="block text-xs font-mono text-[#A0A0A0] mb-1">E-mail</label>
                    <input id="email" type="email" autoComplete="username" value={email} onChange={(e) => setEmail(e.target.value)} className={field} />
                  </div>
                  <div>
                    <label htmlFor="password" className="block text-xs font-mono text-[#A0A0A0] mb-1">Password</label>
                    <input id="password" type="password" autoComplete="current-password" value={password} onChange={(e) => setPassword(e.target.value)} className={field} />
                  </div>
                </>
              )}

              <button
                type="submit"
                disabled={busy}
                className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
              >
                {busy ? "Signing in..." : "Sign in"}

                {mode === "token" ? "Use my e-mail and password instead" : "Use an access token instead"}

              <button
                type="button"
                onClick={onDemo}
                className="w-full text-xs text-[#A0A0A0] hover:text-white underline"

                Explore in demo mode (simulated, nothing is sent)
              </button>
            </form>
            )}
          </AuthShell>
        );
      }

      function ArtifactPanel({ open, artifacts, activeId, onSelect, onClose }) {
        const [copied, setCopied] = useState("");
        const [copyFailed, setCopyFailed] = useState(false);
        const active = artifacts.find((a) => a.id === activeId) || artifacts[artifacts.length - 1];

        const doCopy = async () => {
          if (!active) return;

      // ------------------------------------------------------------------
      // Small safe markdown renderer: headings, **bold**, _italic_, `code`, tables, lists, > notes. Never inserts raw HTML.
      // ------------------------------------------------------------------
      function mdInline(text, kp) {
        const out = [];
        const re = /\*\*(.+?)\*\*|`([^`]+)`|_([^_\n]+?)_|\*([^*\n]+?)\*/g;
        let last = 0, m, n = 0;
        const s = String(text);
        while ((m = re.exec(s)) !== null) {
          if (m[3] !== undefined) {   // _italic_ only at word edges, so worked_hours stays as written
            const before = m.index === 0 ? " " : s[m.index - 1];
            const after = s[m.index + m[0].length] || " ";
            if (!/[\s(]/.test(before) || !/[\s).,;:!?]/.test(after)) { re.lastIndex = m.index + 1; continue; }
          }
          if (m.index > last) out.push(s.slice(last, m.index));
          const k = kp + "-" + n++;
          if (m[1] !== undefined) out.push(<strong key={k} className="text-white">{m[1]}</strong>);
          else if (m[2] !== undefined) out.push(<code key={k} className="font-mono text-amber-300 bg-[#151515] px-1 rounded">{m[2]}</code>);
          else out.push(<em key={k}>{m[3] !== undefined ? m[3] : m[4]}</em>);
          last = m.index + m[0].length;
        }
        if (last < s.length) out.push(s.slice(last));
        return out;
      }

      function Markdown({ text }) {
        const lines = String(text || "").split("\n");
        const blocks = [];
        let i = 0;
        const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        while (i < lines.length) {
          const l = lines[i];
          if (!l.trim()) { i++; continue; }
          let m;
          if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
            blocks.push(<div key={i} role="heading" aria-level={m[1].length} className="text-base font-bold text-white mt-1 mb-2">{mdInline(m[2], "h" + i)}</div>);
            i++; continue;
          }
          if (l.trim().startsWith("|") && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
            const head = cells(l); const body = []; i += 2;
            while (i < lines.length && lines[i].trim().startsWith("|")) { body.push(cells(lines[i])); i++; }
            blocks.push(
              <div key={"t" + i} className="overflow-x-auto my-2">
                <table data-testid="md-table" className="text-xs font-mono border border-[#2D2D2D] w-full">
                  <thead><tr className="bg-[#2D2D2D] text-amber-500">{head.map((h, j) => <th key={j} className="text-left px-3 py-1.5 whitespace-nowrap">{mdInline(h, "th" + j)}</th>)}</tr></thead>
                  <tbody>{body.map((r, ri) => <tr key={ri} className="border-t border-[#2D2D2D]">{head.map((_, j) => <td key={j} className="px-3 py-1.5 whitespace-nowrap">{mdInline(r[j] === undefined ? "" : r[j], "td" + ri + "-" + j)}</td>)}</tr>)}</tbody>
                </table>
              </div>
            );
            continue;
          }
          if (/^\s*[-*]\s+/.test(l)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
            blocks.push(<ul key={"u" + i} className="list-disc pl-5 my-1 space-y-0.5">{items.map((it, j) => <li key={j}>{mdInline(it, "li" + j)}</li>)}</ul>);
            continue;
          }
          if (/^>\s?/.test(l)) {
            const q = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
            blocks.push(<div key={"q" + i} className="border-l-2 border-amber-500 pl-3 my-2 text-xs text-[#A0A0A0]">{q.map((x, j) => <div key={j}>{mdInline(x, "q" + j)}</div>)}</div>);
            continue;
          }
          const para = [];
          while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s+/.test(lines[i]) && !lines[i].trim().startsWith("|") && !/^\s*[-*]\s+/.test(lines[i]) && !/^>\s?/.test(lines[i])) { para.push(lines[i]); i++; }
          if (!para.length) { para.push(lines[i]); i++; }
          blocks.push(<p key={"p" + i} className="my-1">{para.map((x, j) => <React.Fragment key={j}>{j > 0 && <br />}{mdInline(x, "p" + j)}</React.Fragment>)}</p>);
        }
        return <div data-testid="md">{blocks}</div>;

      function fmtWhen(iso) {
        if (!iso) return "";

        if (isNaN(d.getTime())) return String(iso).slice(0, 16).replace("T", " ");
        const p = (n) => String(n).padStart(2, "0");
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
      }
      function titleOf(view) { const t = (window.__sammTitles || {})[view]; return t && t.title ? t.title : ""; }
      function friendlyView(v, tenant) {
        if (titleOf(v)) return titleOf(v);

        n = n.replace(/^[A-Za-z0-9\-]+__/, "").replace(/_+/g, " ").trim();

      function putFile(url, file, onProgress) {
        const corsHelp = [
          "The S3 bucket needs a CORS rule that allows PUT from this site (" + window.location.origin + "). Run deploy_samm.py again with --origin set to this address.",
          "The upload link lasts 15 minutes; try again if it expired.",
        ];
        return new Promise((resolve, reject) => {
          const x = new XMLHttpRequest();
          x.open("PUT", url);
          x.upload.onprogress = (e) => { if (onProgress && e.lengthComputable && e.total) onProgress(Math.min(100, Math.round((e.loaded / e.total) * 100))); };
          x.onerror = () => reject(new ApiError("The browser could not upload the file to S3.", corsHelp, 0));
          x.onload = () => {
            if (x.status >= 200 && x.status < 300) { if (onProgress) onProgress(100); resolve(); return; }
            reject(new ApiError("S3 refused the upload (HTTP " + x.status + ").", ["The upload link may have expired; try again.", "The SAMM Lambda role must be allowed to write to the bucket (s3:PutObject)."], x.status));

                      {nr.kind === "unique" && <label className="flex items-center gap-1 text-[11px] text-[#C0C0C0]"><input type="checkbox" aria-label="New rule never empty" checked={!!nr.require} onChange={(e) => setNr({ ...nr, require: e.target.checked })} />never empty (a key)</label>}

                        {nr.then === "compare" && (<><select aria-label="New rule then comparison" value={nr.top} onChange={(e) => setNr({ ...nr, top: e.target.value })} className={inp}>{COMPARE_OPS.map((o) => <option key={o}>{o}</option>)}</select><input aria-label="New rule then number" type="number" value={nr.tval} onChange={(e) => setNr({ ...nr, tval: e.target.value })} className={inp + " w-20"} /></>)}

      // ------------------------------------------------------------------
      // One onboarding job: the back end does the work, this card only shows progress and asks for approvals
      // ------------------------------------------------------------------

      // v21: the staged view - Upload > Bronze > Silver > Map fields > Gold, with how much of the data is mapped so far.
      function jobStages(job) {
        const ds = Object.values(job.datasets || {});
        const auto = ds.reduce((a, d) => a + (d.auto_mapped || 0), 0);
        const open = ds.reduce((a, d) => a + ((d.queue || []).length), 0);
        const failed = job.status === "failed";
        const hasDs = ds.length > 0;
        const allDone = hasDs && ds.every((d) => d.state === "done");
        const inReview = ds.some((d) => d.state === "review" && !(d.queue || []).length);
        const mapPct = job.status === "done" || allDone ? 100 : inReview ? 50 : (auto + open) > 0 ? Math.round((auto / (auto + open)) * 100) : (hasDs ? 0 : null);
        const waiting = ds.some((d) => d.state === "approval" || d.state === "review");
        const st = (n) => n;
        const silverDone = hasDs;
        const mapDone = allDone || job.status === "done";
        const goldDone = job.status === "done" || allDone;
        const cur = failed ? -1 : goldDone ? 5 : mapDone ? 4 : silverDone ? 3 : 2;   // index of the stage in progress
        const overall = failed ? Math.max(job.progress || 0, 5) : goldDone ? 100 : mapDone ? 90 : silverDone ? 40 + Math.round(((mapPct || 0) / 100) * 45) : (job.progress >= 25 ? 35 : 25);
        const label = failed ? "Stopped with an error" : goldDone ? "Done" : mapDone ? "Building the Gold view" : inReview ? "Waiting for your review" : open > 0 ? "Waiting for your confirmation" : silverDone ? "Mapping fields" : "Converting to Silver";
        return { pct: mapPct, inReview, overall, label, auto, open, waiting, failed, cur,
          stages: [["Upload", true], ["Bronze", true], ["Silver", silverDone], ["Map fields", mapDone], ["Gold view", goldDone]] };
      }
      function StageTracker({ job }) {
        const j = jobStages(job);
        return (
          <div data-testid="stage-tracker" className="space-y-2">
            <div data-testid="overall-progress" className="space-y-1">
              <div className="flex justify-between text-[11px] font-mono text-[#C0C0C0]"><span>{j.label}</span><span>{j.overall}%</span></div>
              <div className="h-2 bg-[#2D2D2D] rounded"><div className={"h-2 rounded transition-all duration-500 " + (j.failed ? "bg-red-600" : j.overall >= 100 ? "bg-green-500" : "bg-amber-500")} style={{ width: j.overall + "%" }} /></div>
            </div>
            <div className="flex flex-wrap gap-2 text-[11px] font-mono">
              {j.stages.map(([label, done], n) => (
                <span key={label} data-testid={"stage-" + label.split(" ")[0].toLowerCase()} className={"px-2 py-1 rounded border " + (done ? "border-green-700 text-green-300" : n === j.cur && !j.failed ? "border-amber-500 text-amber-300" : j.failed && n === j.cur ? "border-red-700 text-red-300" : "border-[#333] text-[#707070]")}>
                  {(done ? "✓ " : "") + label}
                </span>
              ))}
            </div>
            {j.pct !== null && (
              <div data-testid="mapped-pct" className="space-y-1">
                <div className="flex justify-between text-[11px] font-mono text-[#C0C0C0]">
                  <span>Fields mapped</span>
                  <span>{j.inReview ? "needs your review" : j.pct + "%"}{j.open > 0 ? " · " + j.open + " need" + (j.open === 1 ? "s" : "") + " your confirmation" : ""}</span>
                </div>
                <div className="h-1.5 bg-[#2D2D2D] rounded"><div className={"h-1.5 rounded " + (j.inReview ? "bg-amber-500" : "bg-emerald-500")} style={{ width: j.pct + "%" }} /></div>
              </div>
            )}
          </div>
        );

      // v22: look at the data in each layer, publish a report, and open it again from a link.
      function reportLink(id, client) {
        return window.location.origin + window.location.pathname + "#report=" + id + (client ? "&client=" + encodeURIComponent(client) : "");
      }
      // v53: report tables show 1337718433 / 1,337,718,433 instead of 1.33771843332E9. Identifier-like columns and years are left as they are.
      const ID_COL = /(^|_|\b)(id|code|ref|key|no|num|number|seq|sequence|phone|postcode|zip|year|fy|uprn|account|sort)(_|\b|$)/i;
      function prettyCell(col, v) {
        const s = v === null || v === undefined ? "" : String(v);
        const t = s.trim();
        if (!/^-?\d+(\.\d+)?([eE][+-]?\d+)?$/.test(t) || /^-?0\d/.test(t)) return s;
        const n = Number(t); if (!isFinite(n)) return s;
        const sci = /[eE]/.test(t);
        if (!sci && ID_COL.test(String(col))) return s;
        const a = Math.abs(n), dec = (t.split(".")[1] || "");
        if (!sci && Number.isInteger(n) && (a < 1000 || (a >= 1900 && a <= 2100))) return s;
        if (!sci && a < 1000 && dec.length <= 2) return s;
        return n.toLocaleString("en-GB", { maximumFractionDigits: a >= 1e6 ? 0 : 2 });
      }
      function DataTable({ columns, rows, pretty }) {
        const cols = columns && columns.length ? columns : Object.keys((rows || [])[0] || {});
        const show = (c, v) => (pretty ? prettyCell(c, v) : String(v ?? ""));
        if (!rows || !rows.length) return <div className="text-xs text-[#808080]">No rows to show.</div>;
        return (
          <div className="overflow-auto max-h-80 border border-[#2D2D2D] rounded-lg">
            <table className="w-full text-[11px] font-mono">
              <thead><tr>{cols.map((c) => <th key={c} className="text-left text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D] whitespace-nowrap">{c}</th>)}</tr></thead>
              <tbody>{rows.map((r, i) => <tr key={i} className="border-t border-[#2D2D2D]">{cols.map((c) => <td key={c} className="px-2 py-1 text-[#D0D0D0] whitespace-nowrap max-w-[220px] truncate" title={String(r[c] ?? "")}>{show(c, r[c])}</td>)}</tr>)}</tbody>
            </table>
          </div>
        );
      }
      function DataViewer({ api, dataset, view, initial }) {
        const ctx = React.useContext(SplitCtx);
        const [showAll, setShowAll] = useState(false);

                    <button data-testid="gold-remove-apply" disabled={busy || typed.trim() !== dataset || !canDeleteAt("gold")} title={canDeleteAt("gold") ? "" : DELETE_NOTE} onClick={go} className="bg-red-700 hover:bg-red-600 text-white font-bold px-3 py-1 rounded-md disabled:opacity-50">{busy ? "Removing..." : "Remove Gold view"}</button>

      function GoldViews({ api, onAsk, tick }) {

                  </div>
                )}
                <DatasetTools api={api} dataset={d.dataset} view={d.view} onAsk={onAsk} layer="gold" />
                {["engineer", "admin", "system_admin"].includes(window.__sammRole) && <GoldRemove api={api} dataset={d.dataset} onDone={() => load()} />}
                {open === d.dataset && <MappingEditor key={d.dataset} dataset={d.dataset} api={api} onAsk={onAsk} onClose={() => setOpen(null)} onBuilt={() => load()} />}
              </div>
            ))}
          </div>
        );
      }

      // v24: drill-down through tables that belong together, and the screen where links are found, checked and approved.
      function DrillView({ api, name, reportId, onClose, onAdded }) {
        const [stack, setStack] = useState([]);              // chosen values so far: [{ key, label }]
        const [data, setData] = useState(null);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState(null);
        const [note, setNote] = useState("");
        const load = async (path, first) => {
          setBusy(true); setErr(null); setNote("");
          try { const r = await api({ action: "drill_query", name, depth: path.length, path: path.map((p) => p.key), check: !!first }); setData(r); setStack(path); }
          catch (e) { setErr(e); } finally { setBusy(false); }
        };
        useEffect(() => { load([], true); }, [name]);
        const nf = (v) => { const n = Number(v); return v === null || v === undefined || v === "" || isNaN(n) ? String(v ?? "") : n.toLocaleString(undefined, { maximumFractionDigits: 2 }); };
        const crumbs = data ? data.levels.map((l, i) => ({ i, label: l.label })) : [];
        const addToReport = async () => {
          if (!data || !reportId) return;
          const where = stack.map((s) => s.label || s.key).join(" › ");
          const rows = data.rows.map((r) => { const o = {}; Object.keys(r).forEach((k) => { if (k !== "key") o[k === "label" ? data.levels[data.depth].label : k] = r[k]; }); return o; });
          try {
            const r = await api({ action: "report_update", id: reportId, add_tile: { title: (name + (where ? ": " + where : "")).slice(0, 120), rows, chart: !data.final, at: new Date().toLocaleTimeString() } });
            window.dispatchEvent(new CustomEvent("samm-report-updated", { detail: { report: r.report } })); setNote("Added to the report."); if (onAdded) onAdded();
          } catch (e) { setErr(e); }
        };
        const totalCols = data && !data.final && data.rows[0] ? Object.keys(data.rows[0]).filter((k) => k.indexOf("total_") === 0) : [];
        return (
          <div data-testid="drill-view" className="border border-[#2c385d] rounded-2xl p-4 bg-white/5 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="text-sm font-bold text-white">Drill down · {name}</div>
              <button onClick={onClose} className="text-xs border border-[#3D3D3D] hover:border-amber-500 text-white px-2 py-1 rounded">Close ✕</button>
            </div>
            <div data-testid="drill-crumbs" className="flex flex-wrap items-center gap-1 text-xs">
              {crumbs.map((c) => (
                <span key={c.i} className="flex items-center gap-1">
                  {c.i > 0 && <span className="text-[#78869b]">›</span>}
                  {data && c.i < data.depth ? <button data-testid="crumb" onClick={() => load(stack.slice(0, c.i), c.i === 0)} className="underline text-[#8ef4b2]">{c.label}{stack[c.i] ? ": " + (stack[c.i].label || stack[c.i].key) : ""}</button>
                    : <span className={data && c.i === data.depth ? "text-white font-bold" : "text-[#78869b]"}>{c.label}</span>}
                </span>
              ))}
              {busy && <span className="text-[#78869b] ml-2">Loading...</span>}
            </div>
            <ErrBox err={err} />
            {data && !data.final && (
              <div className="overflow-auto max-h-96 border border-[#2D2D2D] rounded-lg">
                <table className="w-full text-[11px] font-mono">
                  <thead><tr><th className="text-left text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D]">{data.levels[data.depth].label}</th><th className="text-right text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D]">Rows</th>
                    {totalCols.map((c) => <th key={c} className="text-right text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D] whitespace-nowrap">{c.replace("total_", "Total ")}</th>)}</tr></thead>
                  <tbody>{data.rows.map((r, i) => (
                    <tr key={i} data-testid="drill-row" onClick={() => r.key && load(stack.concat([{ key: r.key, label: r.label }]))} className={"border-t border-[#2D2D2D] " + (r.key ? "cursor-pointer hover:bg-white/5" : "opacity-70")}>
                      <td className="px-2 py-1 text-white">{r.key ? (r.label || r.key) : "(no match)"} {r.key && <span className="text-[#78869b]">›</span>}</td>
                      <td className="px-2 py-1 text-right">{nf(r.rows)}</td>
                      {totalCols.map((c) => <td key={c} className="px-2 py-1 text-right">{nf(r[c])}</td>)}
                    </tr>))}</tbody>
                </table>
              </div>
            )}
            {data && data.final && <DataTable rows={data.rows} />}
            {data && data.rows.length === 0 && <div className="text-xs text-[#78869b]">Nothing at this level.</div>}
            <div className="flex flex-wrap items-center gap-3 text-xs">
              {reportId && data && <button data-testid="drill-add" onClick={addToReport} className="border border-[#8ef4b2]/60 text-[#8ef4b2] hover:bg-[#8ef4b2]/10 px-2 py-1 rounded">Add this view to the report</button>}
              {note && <span className="text-[#8ef4b2]">{note}</span>}
              <span className="text-[#78869b]">Totals come from the lowest table, so nothing is counted twice. Only approved links are used.</span>
            </div>
          </div>
        );
      }

      // v25: links between one client's tables are found and checked automatically; only strong, clean ones are approved without a person.
      async function autoLinkRun(api, say, dataset, scoped) {
        say("Looking for links between this client's tables...");
        const r = await api({ action: "links_suggest", ...(dataset ? { dataset } : {}), ...(scoped ? { scoped: true } : {}) });
        const all = r.candidates.filter((c) => c.status === "new");
        const todo = all.slice(0, 12);
        let approved = 0, review = 0;
        for (let i = 0; i < todo.length; i++) {
          say("Checking links " + (i + 1) + " of " + todo.length + "...");

      // v35: direct database connections (additive: files and folders work exactly as before)

        useEffect(() => { if (onPhase) onPhase(sel ? "tables" : "connect"); }, [sel ? sel.id : ""]);

        const save = async () => {

            let good = false;

            catch (e) { setErr(e); setMsg("Saved for " + ownerName + ", but the test connection failed (see below). Check the details and press Save again."); }

            <div className="text-[#A0A0A0]">SAMM reads the tables straight from the database and brings them through Bronze, Silver and Gold like any other data. The password is kept in a secure vault, never in this screen or in SAMM's files. SAMM only reads; it never writes to your database.</div>

      // v44: the home screen
      function OverviewHub({ session, demo, client, clientName, tiles, canOnboard, role, onGo, onAsk }) {
        const [facts, setFacts] = useState({ loading: true, datasets: null, conns: null, last: "", err: null });

          let live = true;

            try {

              const d = await call({ action: "datasets" });

              if (canOnboard) { try { conns = ((await call({ action: "db_list" })).connections || []).length; } catch (_) { conns = null; } }
