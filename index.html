                onDrop={(e) => { e.preventDefault(); setOver(false); addFiles(e.dataTransfer.files); }}
                className={"block cursor-pointer text-center rounded-xl border-2 border-dashed p-8 text-sm transition " + (over ? "border-amber-500 bg-[#2A2418]" : "border-[#3D3D3D] hover:border-amber-600")}
              >
                <div className="text-white font-semibold">Drop files here, or click to choose</div>
                <div className="text-[11px] text-[#808080] mt-1">Up to 25 MB for csv/json/txt, 50 MB for Excel, 100 MB for archives</div>
                <input id="onb-file" data-testid="onb-file" type="file" multiple accept={ACCEPT} className="hidden" onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
              </label>
              <details className="text-xs"><summary data-testid="more-options" className="cursor-pointer text-[#A0A0A0] hover:text-white">More options</summary><div className="flex flex-wrap items-center gap-3 mt-2">
                <button onClick={runPipeline} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">▶ Process files already uploaded</button>
                <button onClick={() => checkNew(false)} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">🔎 Check for new datasets</button>
                <button onClick={() => checkNew(true)} disabled={pipe.busy} data-testid="review-all" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">✏️ Check how columns are matched</button>
                <span className="text-[11px] text-[#808080]">Processes files that are already in Bronze with your orchestrator.</span></div></details>
              {pipe.msg && <div className="text-xs text-green-300">{pipe.msg}</div>}
              <ErrBox err={pipe.err} />
              </>)}
            </div>

            {tab === "upload" && (<>
            <div data-testid="onb-toolbar" className="flex flex-wrap items-center gap-3">
              <button onClick={() => setItems([])} disabled={items.length === 0} data-testid="clear-list" title="Empty this list (nothing is deleted; running jobs carry on and stay in History)" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-40">🧹 Clear list</button>
              <button onClick={() => { setTab("bronze"); loadHistory(history.limit); }} data-testid="history-toggle" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg">{history.open ? "Hide history" : "📜 History"}</button>
              <span className="text-[11px] text-[#808080]">{items.length === 0 ? "Your list is empty. Drop a file above to start." : items.length + " on this screen. Clearing only tidies the screen."}</span>
            </div>

            {items.some((i) => i.done) && (
              <div data-testid="done-banner" className="flex flex-wrap items-center gap-3 text-xs bg-[#10241A] border border-green-800 rounded-lg px-4 py-2 text-green-300">
                ✓ A data set is ready.
                <button data-testid="go-gold" onClick={() => setTab("gold")} className="underline text-green-200 hover:text-white">View it in Gold views</button>
              </div>
            )}
            {items.map((it) => {
              const idx = STAGES.findIndex((s) => s[0] === it.stage);
              const iapi = apiFor(it.client);
              return (
                <div key={it.id} className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3" data-testid="onb-item">
                  <div className="flex justify-between items-center gap-3">
                    <div className="text-sm text-white font-mono truncate">{it.name}</div>
                    <div className="flex items-center gap-3 shrink-0">
                      {it.client && <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-[#333] text-[#BBB]" data-testid="item-client">client: {it.client}</span>}
                      {it.size > 0 && <div className="text-[11px] text-[#808080]">{(it.size / 1024).toFixed(0)} KB</div>}
                      <button onClick={() => dismiss(it.id)} data-testid="item-dismiss" aria-label={"Dismiss " + it.name} title="Remove from this list (a running job carries on and stays in History)" className="text-[11px] text-[#A0A0A0] hover:text-white underline">Dismiss</button>
                    </div>
                  </div>
                  {it.job && <JobCard job={it.job} api={iapi} onUpdate={(j) => upd(it.id, { job: j })} onAsk={onAsk} onViewsChanged={onViewsChanged} onDismiss={() => dismiss(it.id)} />}
                  {!it.job && !it.error && !it.done && (
                    <div data-testid="upload-progress" className="space-y-1">
                      <div className="flex justify-between text-[11px] font-mono text-[#C0C0C0]"><span>{it.stage === "upload" ? "Uploading" : it.stage === "bronze" ? "Stored in Bronze" : "Working"}</span><span>{(it.stage === "upload" ? Math.round((it.uploadPct || 0) * 0.2) : 25)}%</span></div>
                      <div className="h-2 bg-[#2D2D2D] rounded"><div className="h-2 rounded bg-amber-500 transition-all duration-300" style={{ width: (it.stage === "upload" ? Math.round((it.uploadPct || 0) * 0.2) : 25) + "%" }} /></div>
                    </div>
                  )}
                  {!it.job && <div className="flex flex-wrap gap-2 text-[11px] font-mono">
                    {STAGES.map((s, n) => (
                      <span key={s[0]} className={"px-2 py-1 rounded border " + (it.done || n < idx ? "border-green-700 text-green-300" : n === idx && !it.error ? "border-amber-500 text-amber-300" : "border-[#333] text-[#707070]")}>
                        {(it.done || n < idx ? "✓ " : "") + s[1]}
                      </span>
                    ))}
                  </div>}
                  <div className="text-xs text-[#C0C0C0]" data-testid="onb-msg">{it.msg}</div>
                  <ErrBox err={it.error} />

                  {(it.order || []).map((ds) => it.datasets[ds] ? (
                    <MappingEditor key={ds} dataset={ds} api={iapi} onAsk={onAsk}
                      onBuilt={() => { upd(it.id, { stage: "gold", done: true, msg: "Gold view ready." }); onViewsChanged(); setViewsTick((n) => n + 1); }} />
                  ) : null)}
                </div>
              );
            })}
            </>)}

            {tab === "bronze" && history.open && (
              <div data-testid="job-list" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-4">
                <div>
                  <h3 className="text-sm font-bold text-white">Onboarding history{history.client ? " · " + history.client : ""}</h3>
                  <p className="text-[11px] text-[#808080] mt-1">Past onboarding jobs for the client you are viewing, including files dropped by other systems. Nothing here is deleted.</p>
                </div>
                {history.loading && <div className="text-xs text-[#A0A0A0]">Loading...</div>}
                <ErrBox err={history.err} />
                {!history.loading && !history.err && history.list.length === 0 && <div className="text-xs text-[#808080]">No jobs yet for this client.</div>}
                <div className="flex items-center gap-2 text-[11px] font-mono text-[#A0A0A0]">
                  <span>Order:</span>
                  <button data-testid="order-newest" onClick={() => setOrder("newest")} className={"px-2 py-1 rounded border " + (order === "newest" ? "border-amber-500 text-amber-300" : "border-[#3D3D3D]")}>Newest first ↓</button>
                  <button data-testid="order-oldest" onClick={() => setOrder("oldest")} className={"px-2 py-1 rounded border " + (order === "oldest" ? "border-amber-500 text-amber-300" : "border-[#3D3D3D]")}>Oldest first ↑</button>
                </div>
                {sortedHistory.map((j) => (
                  <div key={j.id} className="border border-[#2D2D2D] rounded-lg p-4 bg-[#1D1D1D] space-y-2" data-testid="job-row">
                    <div className="flex flex-wrap items-baseline justify-between gap-2">
                      <div className="text-sm text-white font-mono truncate">{j.file}</div>
                      <div data-testid="job-time" className="text-[11px] text-[#A0A0A0] font-mono">{fmtWhen(j.created)}{j.updated && j.updated !== j.created ? " · last update " + fmtWhen(j.updated) : ""}</div>
                    </div>
                    <JobCard job={j} api={apiFor(history.client)} onUpdate={mergeJob} onAsk={onAsk} onViewsChanged={onViewsChanged} onDismiss={() => setHistory((h) => ({ ...h, list: h.list.filter((x) => x.id !== j.id) }))} />
                  </div>
                ))}
                {history.list.length >= history.limit && history.limit < 100 && (
                  <button onClick={() => loadHistory(Math.min(history.limit + 10, 100))} disabled={history.loading} data-testid="history-more" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">Load more</button>
                )}
              </div>
            )}

            {tab === "silver" && <SilverTab api={api} onAsk={onAsk} tick={viewsTick} />}
            {tab === "gold" && <GoldViews api={api} onAsk={onAsk} tick={viewsTick} />}
            {tab === "links" && <LinksPanel key={acting} api={api} role={session.identity ? session.identity.role : ""} />}
            {tab === "tools" && (<><TeachPanel api={api} /><SelfTestPanel api={api} /></>)}

          </div>
        );
      }


      // ------------------------------------------------------------------
      // Governance: users and per-client policy (admins only; the server enforces everything)
      // ------------------------------------------------------------------

      function AddClientPanel({ api }) {
        const [name, setName] = useState("");
        const [msg, setMsg] = useState("");
        const [err, setErr] = useState(null);
        const add = async () => {
          setErr(null); setMsg("");
          try { const r = await api({ action: "client_add", name }); setMsg("Added " + r.name + ". Choose it in the Client box to add data for it."); setName(""); } catch (e) { setErr(e); }
        };
        return (
          <div data-testid="add-client" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <h3 className="text-sm font-bold text-white">Add a client</h3>
            <p className="text-[11px] text-[#808080]">A client is one of your customers, for example Landsec or DOC. Their datasets are kept separate from every other client's.</p>
            <div className="flex flex-wrap items-center gap-2 text-xs">
              <input aria-label="Client name" value={name} onChange={(e) => setName(e.target.value)} placeholder="Client name" className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white w-56 focus:outline-none focus:border-amber-500" />
              <button aria-label="Add client" onClick={add} disabled={name.trim().length < 2} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md disabled:opacity-40">Add client</button>
            </div>
            <ErrBox err={err} />
            {msg && <div data-testid="client-added" className="text-xs text-green-300">{msg}</div>}
          </div>
        );
      }

      function UnassignedPanel({ api, tenants }) {
        const [rows, setRows] = useState(null);
        const [to, setTo] = useState({});
        const [msg, setMsg] = useState("");
        const [err, setErr] = useState(null);
        const load = async () => { try { const r = await api({ action: "unassigned" }); setRows(r.datasets || []); } catch (e) { setErr(e); } };
        useEffect(() => { load(); }, []);
        const move = async (ds) => {
          setErr(null); setMsg("");
          try { const r = await api({ action: "dataset_move", dataset: ds, to_tenant: (to[ds] || "").trim() }); setMsg(r.note); } catch (e) { setErr(e); }
        };
        if (!rows && !err) return null;
        return (
          <div data-testid="unassigned-panel" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <h3 className="text-sm font-bold text-white">Unassigned data</h3>
            <p className="text-[11px] text-[#808080]">Files dropped without a client land under UNASSIGNED_NEW_CLIENT. Pick the right client and SAMM copies the data across. The original is kept.</p>
            <ErrBox err={err} />
            {rows && rows.length === 0 && <div className="text-xs text-[#808080]">Nothing is waiting.</div>}
            {(rows || []).map((d) => (
              <div key={d.dataset} className="flex flex-wrap items-center gap-2 text-xs">
                <span className="font-mono text-amber-400">{d.dataset}</span>
                <input aria-label={"Move " + d.dataset + " to client"} list="unassigned-tenants" value={to[d.dataset] || ""} onChange={(e) => setTo({ ...to, [d.dataset]: e.target.value })} placeholder="client id" className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white font-mono w-40" />
                <button aria-label={"Move " + d.dataset} onClick={() => move(d.dataset)} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md">Move</button>
              </div>
            ))}
            <datalist id="unassigned-tenants">{(tenants || []).map((t) => <option key={t} value={t} />)}</datalist>
            {msg && <div data-testid="move-note" className="text-xs text-green-300">{msg}</div>}
          </div>
        );
      }

      function GovernanceHub({ session, identity }) {
        const api = (payload) => callBackend(session.url, session.token, payload);
        const [data, setData] = useState(null);
        const [err, setErr] = useState("");
        const [busy, setBusy] = useState(false);
        const [issued, setIssued] = useState(null);
        const [copied, setCopied] = useState(false);
        const [form, setForm] = useState({ email: "", role: "viewer", tenant_id: "", expires_days: "" });
        const [tenants, setTenants] = useState([]);
        const [policyTenant, setPolicyTenant] = useState(identity.tenant_id);
        const [pol, setPol] = useState(null);
        const [polMsg, setPolMsg] = useState("");
        const isSys = identity.role === "system_admin";

        const fail = (e) => setErr((e && e.message) || "Something went wrong.");
        const loadUsers = async () => {
          try { setData(await api({ action: "users" })); setErr(""); } catch (e) { fail(e); }
        };
        const loadPolicy = async (t) => {
          try {
            const r = await api({ action: "policy_get", tenant_id: t });
            const p = r.policy || {};
            setPol({ restricted: (p.restricted_columns || []).join(", "), caps: { ...(p.row_caps || {}) }, scan: p.scan_limit_gb == null ? "" : String(p.scan_limit_gb), auto: p.auto_approve_confidence == null ? "" : String(Math.round(p.auto_approve_confidence * 100)), mode: p.mapping_mode || "", pii: !!p.pii_scan, meta: r });
            setPolMsg("");
          } catch (e) { fail(e); }
        };
        useEffect(() => { loadUsers(); if (isSys) api({ action: "tenants" }).then((r) => setTenants(r.tenants || [])).catch(() => {}); }, []);
        useEffect(() => { loadPolicy(policyTenant); }, [policyTenant]);

        const save = async (payload) => {
          setBusy(true); setErr("");
          try {
            const r = await api({ action: "user_save", ...payload });
            if (r.token) { setIssued({ email: r.user.email, token: r.token }); setCopied(false); }
            await loadUsers();
            return true;
          } catch (e) { fail(e); return false; } finally { setBusy(false); }
        };
        const addUser = async (e) => {
          e.preventDefault();
          const payload = { email: form.email, role: form.role };
          if (isSys && form.tenant_id) payload.tenant_id = form.tenant_id;
          if (form.expires_days) payload.expires_days = Number(form.expires_days);
          if (await save(payload)) setForm({ ...form, email: "", expires_days: "" });
        };
        const copy = async () => {
          try { await navigator.clipboard.writeText(issued.token); setCopied(true); } catch (_) { setCopied(false); }
        };
        const savePolicy = async () => {
          setBusy(true); setPolMsg(""); setErr("");
          try {
            const caps = {};
            Object.keys(pol.caps).forEach((r) => { if (pol.caps[r] !== "" && pol.caps[r] != null) caps[r] = Number(pol.caps[r]); });
            await api({ action: "policy_save", tenant_id: policyTenant, policy: { restricted_columns: pol.restricted, row_caps: caps, scan_limit_gb: pol.scan === "" ? null : Number(pol.scan), auto_approve_confidence: pol.auto === "" ? null : Number(pol.auto), mapping_mode: pol.mode || null, pii_scan: !!pol.pii } });
            setPolMsg("Saved. It applies to the next request.");
          } catch (e) { fail(e); } finally { setBusy(false); }
        };

        const inp = "bg-[#151515] border border-[#3D3D3D] rounded-md px-2 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-amber-500";
        const btn = "px-3 py-1.5 rounded-md text-xs font-semibold bg-amber-500 text-black hover:bg-amber-400 disabled:opacity-50";
        const link = "text-xs underline text-[#A0A0A0] hover:text-white";
        const roles = (data && data.assignable_roles) || [];
        const rows = (data && data.users) || [];
        const boot = (data && data.bootstrap) || [];

        return (
          <div data-testid="governance-hub" className="max-w-3xl mx-auto space-y-5">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
              <p className="text-xs text-[#A0A0A0] leading-relaxed">
                {isSys ? "You manage every client." : "You manage the users and policy of client " + identity.tenant_id + "."} Tokens are shown once and only a hash is stored. The server checks your role on every call.
              </p>
              {err && <div data-testid="gov-error" className="text-xs text-red-300 bg-red-900/20 border border-red-800 rounded-md p-2">{err}</div>}
              {issued && (
                <div data-testid="issued-token" className="text-xs bg-amber-500/10 border border-amber-600 rounded-md p-3 space-y-2">
                  <div className="text-amber-300 font-semibold">New access token for {issued.email}. It is shown only once.</div>
                  <div className="font-mono break-all text-white bg-[#151515] rounded p-2 select-all">{issued.token}</div>
                  <div className="flex gap-3 items-center">
                    <button onClick={copy} className={btn}>{copied ? "Copied" : "Copy token"}</button>
                    <button onClick={() => setIssued(null)} className={link}>I have saved it, hide</button>
                  </div>
                  <div className="text-[#A0A0A0]">Send it to the user privately. They paste it on the sign-in screen.</div>
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Add a user</h3>
              <form onSubmit={addUser} className="flex flex-wrap gap-2 items-end">
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">E-mail
                  <input aria-label="User e-mail" required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className={inp + " w-56"} placeholder="name@company.com" />
                </label>
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Role
                  <select aria-label="User role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className={inp}>
                    {roles.map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                  </select>
                </label>
                {isSys && (
                  <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Client
                    <input aria-label="User client" list="gov-tenants" value={form.tenant_id} onChange={(e) => setForm({ ...form, tenant_id: e.target.value })} className={inp + " w-32"} placeholder={identity.tenant_id} />
                    <datalist id="gov-tenants">{tenants.map((t) => <option key={t} value={t} />)}</datalist>
                  </label>
                )}
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Expires (days)
                  <input aria-label="Expiry days" type="number" min="1" max="730" value={form.expires_days} onChange={(e) => setForm({ ...form, expires_days: e.target.value })} className={inp + " w-24"} placeholder="never" />
                </label>
                <button type="submit" disabled={busy} className={btn}>Create user</button>
              </form>
              <p className="text-[10px] text-[#707070]">{ROLE_HELP[form.role]}</p>
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Users ({rows.length})</h3>
              {!data && !err && <div className="text-xs text-[#A0A0A0]">Loading...</div>}
              <div className="space-y-2">
                {rows.map((u) => (
                  <div key={u.email + u.tenant_id} data-testid="user-row" className="bg-[#151515] border border-[#2D2D2D] rounded-md p-3 flex flex-wrap gap-2 items-center text-xs font-mono">
                    <div className="flex-1 min-w-[12rem]">
                      <div className="text-white truncate">{u.email}</div>
                      <div className="text-[#707070]">{u.tenant_id}{u.expires_at ? " | expires " + u.expires_at.slice(0, 10) : ""}{u.status === "disabled" ? " | DISABLED" : ""}</div>
                    </div>
                    <select aria-label={"Role for " + u.email} value={u.role} disabled={busy || u.email === identity.email || !roles.includes(u.role)} onChange={(e) => save({ email: u.email, tenant_id: u.tenant_id, role: e.target.value })} className={inp}>
                      {ROLES_ORDER.map((r) => <option key={r} value={r} disabled={!roles.includes(r)}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <button disabled={busy || u.email === identity.email} onClick={() => save({ email: u.email, tenant_id: u.tenant_id, status: u.status === "disabled" ? "active" : "disabled" })} className={link}>{u.status === "disabled" ? "Enable" : "Disable"}</button>
                    <button disabled={busy} onClick={() => { if (window.confirm("Issue a new token for " + u.email + "? The old token stops working.")) save({ email: u.email, tenant_id: u.tenant_id, reset_token: true, expires_days: u.expires_at ? 90 : undefined }); }} className={link}>Reset token</button>
                  </div>
                ))}
                {data && rows.length === 0 && <div className="text-xs text-[#A0A0A0]">No managed users yet. Create the first one above.</div>}
              </div>
              {boot.length > 0 && (
                <div className="pt-2 border-t border-[#2D2D2D]">
                  <div className="text-[10px] text-[#707070] mb-1">Break-glass tokens (set in the Lambda environment, not editable here)</div>
                  {boot.map((b, i) => <div key={i} className="text-xs font-mono text-[#A0A0A0]">{b.email} | {ROLE_LABELS[b.role] || b.role} | {b.tenant_id}</div>)}
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <div className="flex items-center gap-3">
                <h3 className="text-sm font-bold text-white">Client policy</h3>
                {isSys && (
                  <>
                    <input aria-label="Policy client" list="gov-tenants" value={policyTenant} onChange={(e) => setPolicyTenant(e.target.value)} className={inp + " w-36"} />
                  </>
                )}
                {!isSys && <span className="text-xs font-mono text-[#A0A0A0]">{policyTenant}</span>}
              </div>
              {pol && (
                <div className="space-y-3 text-xs">
                  <label className="flex flex-col gap-1 text-[#A0A0A0]">Hidden columns (comma separated, hidden from Viewer and Data Analyst)
                    <input aria-label="Restricted columns" value={pol.restricted} onChange={(e) => setPol({ ...pol, restricted: e.target.value })} className={inp} placeholder="salary, id_number" />
                    {pol.meta.platform_restricted.length > 0 && <span className="text-[10px] text-[#707070]">Always hidden platform-wide: {pol.meta.platform_restricted.join(", ")}</span>}
                  </label>
                  <div className="grid grid-cols-5 gap-2">
                    {ROLES_ORDER.map((r) => (
                      <label key={r} className="flex flex-col gap-1 text-[10px] text-[#A0A0A0]">{ROLE_LABELS[r]} rows
                        <input aria-label={"Row cap " + r} type="number" min="1" max={pol.meta.hard_max_rows} value={pol.caps[r] == null ? "" : pol.caps[r]} onChange={(e) => setPol({ ...pol, caps: { ...pol.caps, [r]: e.target.value } })} className={inp} placeholder={String(pol.meta.default_row_caps[r])} />
                      </label>
                    ))}
                  </div>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Scan limit per question (GB)
                    <input aria-label="Scan limit" type="number" step="0.01" value={pol.scan} onChange={(e) => setPol({ ...pol, scan: e.target.value })} className={inp} placeholder={"platform " + pol.meta.platform_scan_limit_gb} />
                    <span className="text-[10px] text-[#707070]">Can only be lower than the platform limit ({pol.meta.platform_scan_limit_gb} GB). A lower limit is checked after the query; the platform limit is the hard stop.</span>
                  </label>
                  <label className="flex items-center gap-2 text-[#A0A0A0]">
                    <input aria-label="Personal data scan" type="checkbox" checked={!!pol.pii} onChange={(e) => setPol({ ...pol, pii: e.target.checked })} />
                    Scan new files for personal data (names, emails, phone numbers) when mapping
                    <span className="text-[10px] text-[#707070]">Uses Amazon Comprehend (about $0.0001 per 100 characters scanned, a few text columns per file). It only suggests restricting a column; it never restricts one by itself.</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">How new files are mapped
                    <select aria-label="Mapping mode" value={pol.mode} onChange={(e) => setPol({ ...pol, mode: e.target.value })} className={inp}>
                      <option value="">Review first (default)</option>
                      <option value="review">Review first</option>
                      <option value="auto">Auto: build straight away</option>
                    </select>
                    <span className="text-[10px] text-[#707070]">Review first: SAMM suggests the mapping and rules, and an engineer approves before the Gold view is built. Auto: SAMM builds at once using only technical rules; business rules still wait for approval.</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Auto-approve field mappings at or above (%)
                    <input aria-label="Auto-approve level" type="number" min="50" max="100" value={pol.auto} onChange={(e) => setPol({ ...pol, auto: e.target.value })} className={inp} placeholder="90 (default)" />
                    <span className="text-[10px] text-[#707070]">When a file arrives, SAMM maps fields it is at least this sure about on its own. Anything lower waits for a Data Engineer. Fields a person approved before are reused.</span>
                  </label>
                  <div className="flex items-center gap-3">
                    <button onClick={savePolicy} disabled={busy} className={btn}>Save policy</button>
                    {polMsg && <span data-testid="policy-saved" className="text-green-400">{polMsg}</span>}
                  </div>
                </div>
              )}
            </div>
            {isSys && <AddClientPanel api={api} />}
            {isSys && <UnassignedPanel api={api} tenants={tenants} />}
          </div>
        );
      }
      const ROLES_ORDER = ["viewer", "analyst", "engineer", "admin", "system_admin"];

      // ------------------------------------------------------------------
      // Main app
      // ------------------------------------------------------------------
      function SammConsole({ session, demo, onSignOut }) {
        const identity = demo ? DEMO_IDENTITY : session.identity;
        const [previewRole, setPreviewRole] = useState(demo ? "admin" : null);
        const role = demo ? previewRole : identity.role;

        const nextId = useRef(0);
        const stamp = () => new Date().toLocaleTimeString();
        const [messages, setMessages] = useState([
          {
            id: "init",
            role: "assistant",
            text: demo
              ? "Welcome to the SAMM Core Engine Console (DEMO MODE). Replies are simulated and nothing is sent to your lakehouse."
              : "Welcome to the SAMM Core Engine Console. Ask a natural language question to compile secure SQL against the Gold layer. Ask for Power BI or Sisense output to get DAX or JSON in the side panel.",
            timestamp: "System Ready",
          },
        ]);
        const [artifacts, setArtifacts] = useState([]);
        const [panelOpen, setPanelOpen] = useState(false);
        const [activeArtifact, setActiveArtifact] = useState(null);

        const [input, setInput] = useState("");
        const [persona, setPersona] = useState("architect");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");
        const [views, setViews] = useState([]);
        const [defaultView, setDefaultView] = useState("");
        const [activeView, setActiveView] = useState("");
        const dashKey = "samm_dash_" + (demo ? "demo" : (session && session.identity ? session.identity.tenant_id : "x"));
        const [tiles, setTiles] = useState(() => { try { return JSON.parse(localStorage.getItem("samm_dash_" + (demo ? "demo" : (session && session.identity ? session.identity.tenant_id : "x"))) || "[]"); } catch (_) { return []; } });
        useEffect(() => { try { if (tiles.length) localStorage.setItem(dashKey, JSON.stringify(tiles.slice(0, 12))); else localStorage.removeItem(dashKey); } catch (_) { /* storage is optional */ } }, [tiles]);
        const pinTile = (title, rows) => setTiles((p) => [{ id: "t" + Date.now(), title: String(title || "Chart").slice(0, 120), rows: rows.slice(0, 60), at: stamp() }].concat(p).slice(0, 12));
        const refreshTile = async (t) => {
          try {
            const d = await callBackend(session.url, session.token, { action: "query", prompt: t.title });
            if (Array.isArray(d.raw_data_grid) && d.raw_data_grid.length > 1) setTiles((p) => p.map((x) => x.id === t.id ? { ...x, rows: d.raw_data_grid.slice(0, 60), at: stamp() } : x));
          } catch (_) { /* the old numbers stay on the tile */ }
        };
        const [clients, setClients] = useState([]);
        const [clientNames, setClientNames] = useState({});
        const [acting, setActing] = useState("");
        const cname = (c) => clientNames[c] || c;
        useEffect(() => { window.__sammClient = null; window.__sammHome = identity.tenant_id; return () => { window.__sammClient = null; }; }, []);
        const [openReportId, setOpenReportId] = useState("");
        useEffect(() => {
          const take = (id) => { setActiveTab("dashboard"); setOpenReportId(id); };
          const m = /#report=([a-f0-9]{16})(?:&client=([A-Za-z0-9_\-]{1,64}))?/.exec(window.location.hash || "");
          if (m) {
            if (m[2] && m[2] !== identity.tenant_id) { window.__sammClient = m[2]; setActing(m[2]); }
            take(m[1]);
          }
          const on = (e) => e.detail && e.detail.id && take(e.detail.id);
          const again = () => loadViews();
          window.addEventListener("samm-open-report", on);
          window.addEventListener("samm-titles-changed", again);
          return () => { window.removeEventListener("samm-open-report", on); window.removeEventListener("samm-titles-changed", again); };
        }, []);
        useEffect(() => {
          if (demo) return;
          callBackend(session.url, session.token, { action: "clients" }).then((r) => { setClients((r.clients || []).filter((c) => c !== "UNASSIGNED_NEW_CLIENT")); setClientNames(r.names || {}); setActing((a) => a || r.home || ""); }).catch(() => {});
        }, [activeTab]);
        const switchClient = (c) => {
          window.__sammClient = c === identity.tenant_id ? null : c;
          setActing(c); setActiveView(""); setTalk(null); loadViews();
        };
        const [talk, setTalk] = useState(null);   // what the last answer was about: { state, context }
        const loadViews = async () => {
          if (demo) return;
          try {
            const r = await callBackend(session.url, session.token, { action: "views" });
            const tmap = {}; (r.views || []).forEach((v) => { if (v.title) tmap[v.name] = { title: v.title, subject: v.subject || "" }; });
            window.__sammTitles = tmap;
            setViews(r.views || []);
            setDefaultView(r.default || "");
          } catch (_) {
            /* older backend without datasets: the chat still works on the default view */
          }
        };
        useEffect(() => { loadViews(); }, []);

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current && messagesEndRef.current.scrollIntoView) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const canOnboard = CAN_ONBOARD.includes(role);
        const canGovern = CAN_GOVERN.includes(role);
        useEffect(() => {
          if (activeTab === "onboarding" && !canOnboard) setActiveTab("chat");
          if (activeTab === "governance" && !canGovern) setActiveTab("chat");
        }, [role]);

        const addMessage = (m) => setMessages((prev) => [...prev, { id: "m" + ++nextId.current, timestamp: stamp(), ...m }]);

        const registerArtifacts = (msgId, text, sql) => {
          const created = [];
          splitBlocks(text).forEach((p) => {
            if (p.type === "code") {
              created.push({ id: msgId + "-a" + created.length, lang: p.lang, title: p.lang.toUpperCase(), code: p.code });
            }
          });
          const list = [...created];
          let sqlArt = null;
          if (sql) {
            sqlArt = { id: msgId + "-sql", lang: "sql", title: "SQL (executed)", code: sql };
            list.push(sqlArt);
          }
          setArtifacts((prev) => [...prev, ...list]);
          // Open the panel automatically for BI output (DAX/JSON), not for plain SQL.
          if (created.length > 0) {
            setActiveArtifact(created[0].id);
            setPanelOpen(true);
          }
          return { inline: created, sqlArt };
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          return sendText(input.trim());
        };

        // v24: split view (chat docked beside a report or the data viewer) and report commands typed in the chat
        const [split, setSplit] = useState(null);       // { dataset, view, reportId, since }
        const [openReport, setOpenReport] = useState(null);   // the report last opened: { id, title, accent }
        const messagesRef = useRef(messages);
        messagesRef.current = messages;
        useEffect(() => {
          const ask = (e) => {
            const d = e.detail || {};
            const base = (x) => String(x || "").replace(/^silver_/, "");
            const v = (views || []).find((x) => x.name === d.view || (d.dataset && (x.dataset === d.dataset || base(x.dataset) === base(d.dataset))));
            if (v) setActiveView(v.name);
            setTalk(null);
            setSplit({ dataset: d.dataset || (v && v.dataset) || "", view: v ? v.name : (d.view || ""), reportId: d.reportId || "", since: messagesRef.current.length });
          };
          const opened = (e) => { if (e.detail && e.detail.id) setOpenReport(e.detail); };
          window.addEventListener("samm-split-ask", ask);
          window.addEventListener("samm-report-opened", opened);
          return () => { window.removeEventListener("samm-split-ask", ask); window.removeEventListener("samm-report-opened", opened); };
        }, [views]);
        useEffect(() => { if (activeTab === "chat" && split) setSplit(null); }, [activeTab]);
        const live = (() => {
          if (!split) return null;
          for (let i = messages.length - 1; i >= split.since; i--) {
            const m = messages[i];
            if (m.role === "assistant" && !m.error && Array.isArray(m.rows) && m.rows.length) return { id: m.id, question: m.question || "", rows: m.rows };
          }
          return null;
        })();
        const reportApi = (p) => callBackend(session.url, session.token, p);
        const addToReport = async (m) => {
          if (!split || !split.reportId) return;
          const r = await reportApi({ action: "report_update", id: split.reportId, add_tile: { title: String(m.question || "Answer").slice(0, 120), rows: m.rows.slice(0, 60), at: stamp() } });
          window.dispatchEvent(new CustomEvent("samm-report-updated", { detail: { report: r.report } }));
        };
        const runReportCommand = async (userText, cmd) => {
          addMessage({ role: "user", text: userText });
          setInput("");
          if (!openReport) { addMessage({ role: "assistant", text: "Open a report first (Reports in the menu), then ask me again and I will change it." }); return; }
          setIsLoading(true);
          try {
            const r = await reportApi({ action: "report_update", id: openReport.id, ...cmd });
            setOpenReport({ id: r.report.id, title: r.report.title, accent: r.report.accent || "" });
            window.dispatchEvent(new CustomEvent("samm-report-updated", { detail: { report: r.report } }));
            addMessage({ role: "assistant", text: cmd.title ? "Done. The report is now called **" + r.report.title + "**." : "Done. The report colour is now " + (cmd.accent.startsWith("#") ? cmd.accent : cmd.accent) + "." });
          } catch (e) {
            addMessage({ role: "assistant", error: { message: (e && e.message) || "Could not change the report.", details: [], status: (e && e.status) || 0 } });
          } finally { setIsLoading(false); }
        };
        const sendText = async (userText) => {
          if (!userText || isLoading) return;
          if (!demo) {
            const cmd = parseReportCommand(userText);
            if (cmd && (openReport || cmd.title)) return runReportCommand(userText, cmd);
          }
          addMessage({ role: "user", text: userText });
          setInput("");
          setIsLoading(true);
          try {
            let d;
            if (demo) {
              await sleep(700);
              d = demoQuery(userText);
            } else {
              // Note: no role and no tenant are sent. The server derives both from the token.
              d = await callBackend(session.url, session.token, { action: "query", prompt: userText, previous: (() => { const u = messages.filter((x) => x.role === "user"); return u.length ? String(u[u.length - 1].text).slice(0, 500) : undefined; })(), persona, state: talk ? talk.state : undefined, view: activeView && activeView !== defaultView ? activeView : undefined });
            }
            const msgId = "r" + ++nextId.current;
            setTalk(d.state ? { state: d.state, context: d.context || "" } : null);
            if (d.routed_view && d.view) setActiveView(d.view);   // the question named a dataset: stay on it for follow-ups
            const { inline, sqlArt } = registerArtifacts(msgId, d.report_markdown, d.executed_sql);
            setMessages((prev) => [
              ...prev,
              {
                id: msgId,
                role: "assistant",
                text: d.report_markdown || "",
                rows: d.raw_data_grid,
                artifacts: inline,
                sqlArtifact: sqlArt,
                meta: { role: d.role, tenant: d.tenant_id, cap: d.row_cap, truncated: d.truncated, finops: d.finops },
                suggestions: Array.isArray(d.suggestions) ? d.suggestions.slice(0, 5) : [],
                diagnostic: d.diagnostic || "",
                question: userText,
                simulated: demo,
                timestamp: stamp(),
              },
            ]);
          } catch (err) {
            addMessage({
              role: "assistant",
              error: { message: err.message || String(err), details: err.details || [], status: err.status || 0 },
            });
          } finally {
            setIsLoading(false);
          }
        };

        const handlePipelineTrigger = async () => {
          setFormError("");
          if (!/^s3:\/\/[^/\s]+\/\S+/.test(s3Path.trim())) {
            setFormError("Source path must look like s3://bucket/key.");
            return;
          }
          try {
            JSON.parse(contextPayload);
          } catch (_) {
            setFormError("Context payload is not valid JSON.");
            return;
          }
          setIsLoading(true);
          await sleep(600);
          // The ingestion endpoint is not connected yet, so this is always a simulation.
          addMessage({
            role: "assistant",
            simulated: true,
            text: "Simulated ingestion request\nTarget handler: shiftleft-superposition-pipeline-orchestrator\nAsset: " + s3Path.trim() + "\n\nNo request was sent: the ingestion endpoint is not connected to this page yet.",
          });
          setActiveTab("chat");
          setIsLoading(false);
        };

        const openArtifact = (id) => {
          setActiveArtifact(id);
          setPanelOpen(true);
        };

        const navClass = (tab, disabled) =>
          "w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition " +
          (activeTab === tab
            ? "bg-[#2D2D2D] text-white border-l-4 border-amber-500"
            : disabled
            ? "text-[#555555] cursor-not-allowed"
            : "text-[#A0A0A0] hover:bg-[#252525] hover:text-white");

        const splitLabel = split ? (split.reportId && openReport ? openReport.title : friendlyView(split.view || split.dataset, acting || identity.tenant_id)) : "";
        return (
          <SplitCtx.Provider value={{ open: !!split && activeTab !== "chat", dataset: split ? split.dataset : "", view: split ? split.view : "", reportId: split ? split.reportId : "", live }}>
          <div className="flex h-screen bg-[#191919] text-[#E3E3E3] font-sans overflow-hidden w-full">
            {/* LEFT SIDEBAR PANEL */}
            <div className="w-64 bg-[#202020] border-r border-[#2D2D2D] flex flex-col justify-between flex-shrink-0">
              <div>
                <div className="p-5 flex items-center space-x-3 border-b border-[#2D2D2D]">
                  <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                  <div>
                    <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                    <p className="text-[10px] text-amber-500 font-mono">Data intelligence</p>
                  </div>
                </div>
                {!demo && (
                  <div data-testid="client-box" className="px-4 pt-4">
                    <div className="text-[10px] uppercase tracking-wider text-[#808080] font-mono mb-1">Client</div>
                    {clients.length > 1 ? (
                      <select data-testid="client-switch" aria-label="Client" value={acting} onChange={(e) => switchClient(e.target.value)} className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md px-2 py-2 text-sm text-white focus:outline-none focus:border-amber-500">
                        {clients.map((c) => <option key={c} value={c}>{cname(c)}</option>)}
                      </select>
                    ) : (
                      <div data-testid="client-fixed" className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md px-2 py-2 text-sm text-white">{cname(acting || identity.tenant_id)}</div>
                    )}
                  </div>
                )}
                <nav className="p-4 space-y-2">
                  <button onClick={() => setActiveTab("chat")} className={navClass("chat", false)}>
                    <span>💬 Ask SAMM</span>
                  </button>
                  <button data-testid="nav-dashboard" onClick={() => setActiveTab("dashboard")} className={navClass("dashboard", false)}>
                    <span>📊 Reports{tiles.length ? " (" + tiles.length + ")" : ""}</span>
                  </button>
                  <button
                    onClick={() => canOnboard && setActiveTab("onboarding")}
                    disabled={!canOnboard}
                    title={canOnboard ? "" : "Requires Data Engineer or above"}
                    className={navClass("onboarding", !canOnboard)}
                  >
                    <span>📦 Onboarding</span>
                  </button>
                  <button
                    onClick={() => canGovern && setActiveTab("governance")}
                    disabled={!canGovern}
                    title={canGovern ? "" : "Requires a Client or System Administrator"}
                    className={navClass("governance", !canGovern)}
                  >
                    <span>🛡️ Admin</span>
                  </button>
                </nav>
              </div>
              <div className="p-4 border-t border-[#2D2D2D] bg-[#1E1E1E]">
                <div className="text-xs text-[#A0A0A0] mb-2"><span>🛡️ Identity Firewall</span></div>
                {demo ? (
                  <>
                    <select
                      aria-label="Preview role"
                      value={previewRole}
                      onChange={(e) => setPreviewRole(e.target.value)}
                      className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                    >
                      {Object.keys(ROLE_LABELS).map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <p className="text-[10px] text-[#707070] mt-2 leading-snug">Demo preview only. In live mode your role comes from the server.</p>
                  </>
                ) : (
                  <div className="text-xs font-mono space-y-1">
                    <div data-testid="who-role" className="text-white">{ROLE_LABELS[identity.role] || identity.role}</div>
                    <div className="text-[#A0A0A0] truncate" title={identity.email}>{identity.email}</div>
                    <div data-testid="who-version" className="text-[#707070]">Server {identity.version || "older than v24 - redeploy the backend"} · Screen v24</div>
                    <button onClick={onSignOut} className="mt-2 text-[#A0A0A0] hover:text-white underline">Sign out</button>
                  </div>
                )}
                {demo && <button onClick={onSignOut} className="mt-2 text-xs text-[#A0A0A0] hover:text-white underline">Exit demo</button>}
              </div>
            </div>

            {/* CENTRAL INTERACTIVE CHAT ENGINE FEED */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#191919]">
              <header className="h-16 border-b border-[#2D2D2D] px-6 flex items-center justify-between bg-[#1A1A1A]">
                <div className="flex items-center space-x-3">
                  <span data-testid="client-chip" className="text-xs bg-[#2D2D2D] text-amber-500 font-mono px-2.5 py-1 rounded border border-[#3D3D3D]">{demo ? "Demo" : cname(acting || identity.tenant_id)}</span>
                  {demo && <SimBadge>Demo mode: simulated</SimBadge>}
                </div>
                <div className="flex items-center space-x-4 text-xs font-mono text-[#A0A0A0]">
                  <span>👤 {String(role).toUpperCase()}</span>
                  {!demo && views.length > 1 && (
                    <label className="flex items-center space-x-1">
                      <span>Dataset</span>
                      <select
                        aria-label="Dataset"
                        data-testid="dataset-select"
                        value={activeView || defaultView}
                        onChange={(e) => setActiveView(e.target.value)}
                        className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-xs text-white font-mono max-w-[220px] focus:outline-none focus:border-amber-500"
                      >
                        {views.map((v) => <option key={v.name} value={v.name} title={v.name}>{friendlyView(v.name, acting || identity.tenant_id)}</option>)}
                      </select>
                    </label>
                  )}
                  <button
                    onClick={() => setPanelOpen((o) => !o)}
                    data-testid="panel-toggle"
                    className="border border-[#3D3D3D] rounded px-2 py-1 hover:text-white hover:border-amber-500"
                  >
                    📄 Files {artifacts.length > 0 ? "(" + artifacts.length + ")" : ""}
                  </button>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {activeTab === "chat" && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={"flex " + (msg.role === "user" ? "justify-end" : "justify-start")}>
                        <div className={"max-w-[85%] rounded-xl p-5 shadow-lg " + (msg.role === "user" ? "bg-amber-600 text-white" : "bg-[#222222] border border-[#2D2D2D] text-[#E3E3E3]")}>
                          <div className="text-xs font-mono text-[#A0A0A0] mb-2 flex justify-between items-center space-x-6">
                            <span className="font-bold text-amber-500">{msg.role === "user" ? "USER TRANSACTION" : "SAMM AI ENGINE"}</span>
                            <span>{msg.simulated ? "SIMULATED · " : ""}{msg.timestamp}</span>
                          </div>
                          {msg.error ? (
                            <ErrorCard message={msg.error.message} details={msg.error.details} status={msg.error.status} />
                          ) : (
                            <MessageBody msg={msg} onOpenArtifact={openArtifact} />
                          )}
                          {msg.sqlArtifact && (
                            <button
                              onClick={() => openArtifact(msg.sqlArtifact.id)}
                              data-testid="sql-chip"
                              className="mt-3 text-xs font-mono text-amber-500 hover:text-amber-400 underline"
                            >
                              Show executed SQL
                            </button>
                          )}
                          {!/\n\|[\s:|-]+\|/.test(msg.text || "") && <ResultTable rows={msg.rows} />}
                          {msg.role === "assistant" && !msg.error && <ChartBlock rows={msg.rows} title={msg.question} onPin={() => pinTile(msg.question, msg.rows)} />}
                          {msg.suggestions && msg.suggestions.length > 0 && msg === messages[messages.length - 1] && (
                            <div className="flex flex-wrap gap-2 mt-3" data-testid="suggestions">
                              {msg.suggestions.map((sg) => (
                                <button key={sg} data-testid="suggestion" disabled={isLoading} onClick={() => sendText(sg)}
                                  className="text-xs border border-[#3D3D3D] hover:border-amber-500 text-[#D0D0D0] px-3 py-1.5 rounded-full disabled:opacity-50">{sg}</button>
                              ))}
                            </div>
                          )}
                          {msg.diagnostic && (
                            <div data-testid="diagnostic" className="text-[10px] text-amber-400/80 mt-2 font-mono">Engineer note: {msg.diagnostic}</div>
                          )}
                          {msg.meta && (
                            <div className="text-[10px] text-[#707070] mt-2 font-mono">
                              role {msg.meta.role} · tenant {msg.meta.tenant} · row cap {msg.meta.cap}{msg.meta.truncated ? " · results truncated at the cap" : ""}
                              {msg.meta.finops && (" · scanned " + fmtBytes(msg.meta.finops.scanned_bytes) + " of " + fmtBytes(msg.meta.finops.ceiling_bytes) + " limit · est. $" + msg.meta.finops.est_cost_usd.toFixed(5))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-4 flex items-center space-x-3">
                          <span className="text-xs font-mono text-[#A0A0A0] animate-pulse">⚙️ Compiling Bedrock pipeline...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                )}

                {activeTab === "onboarding" && !demo && (
                  <OnboardingHub
                    session={session}
                    clients={clients}
                    clientNames={clientNames}
                    acting={acting || identity.tenant_id}
                    onViewsChanged={loadViews}
                    onAsk={(v) => {
                      loadViews();
                      setActiveView(v);
                      setTalk(null);
                      setActiveTab("chat");
                      addMessage({ role: "assistant", text: "Now answering from the dataset **" + friendlyView(v, acting || identity.tenant_id) + "**. Ask a question, for example: How many records are there?" });
                    }}
                  />
                )}

                {activeTab === "onboarding" && demo && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <div className="mt-2"><SimBadge>Simulated: ingestion endpoint not connected</SimBadge></div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className="block text-xs font-mono text-[#A0A0A0] mb-1">Source file (S3 path)</label>
                        <input
                          id="s3path"
                          value={s3Path}
                          onChange={(e) => setS3Path(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label htmlFor="ctx" className="block text-xs font-mono text-[#A0A0A0] mb-1">Context payload (JSON)</label>
                        <textarea
                          id="ctx"
                          rows={4}
                          value={contextPayload}
                          onChange={(e) => setContextPayload(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      {formError && <div className="text-xs text-red-400 font-mono">{formError}</div>}
                      <button
                        onClick={handlePipelineTrigger}
                        disabled={isLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
                      >
                        Trigger Pipeline Ingestion (simulated)
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === "dashboard" && (
                  <DashboardHub client={acting || identity.tenant_id} api={(p) => callBackend(session.url, session.token, p)} openId={openReportId} onOpenHandled={() => setOpenReportId("")} onPublished={(tool, title, n) => callBackend(session.url, session.token, { action: "publish_report", tool, title, tiles: n }).catch(() => {})} tiles={tiles} onRemove={(id) => setTiles((p) => p.filter((x) => x.id !== id))} onRefresh={refreshTile}
                    onAsk={(q) => { setActiveTab("chat"); sendText(q); }} />
                )}

                {activeTab === "governance" && (
                  demo ? (
                    <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
                      <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
                      <SimBadge>Demo mode: sign in with an administrator token to manage users and policy</SimBadge>
                    </div>
                  ) : (
                    <GovernanceHub session={session} identity={identity} />
                  )
                )}
              </div>

              {activeTab === "chat" && (
                <form onSubmit={handleSendMessage} className="border-t border-[#2D2D2D] bg-[#1A1A1A] p-4">
                  <div className="max-w-4xl mx-auto flex space-x-3">
                    <select
                      aria-label="Persona"
                      value={persona}
                      onChange={(e) => setPersona(e.target.value)}
                      className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg px-2 text-xs text-white font-mono focus:outline-none focus:border-amber-500"
                    >
                      {PERSONAS.map((p) => <option key={p.value} value={p.value}>{p.label}</option>)}
                    </select>
                    {talk && talk.context && (
                      <button data-testid="talk-chip" title="SAMM is answering follow-ups about this. Click to clear." onClick={() => setTalk(null)}
                        className="text-[10px] font-mono border border-amber-500/50 text-amber-300 rounded-full px-2 py-1 whitespace-nowrap hover:border-amber-400">Talking about: {talk.context} ✕</button>
                    )}
                    <input
                      aria-label="Ask a question"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      disabled={isLoading}
                      placeholder="Ask a question about your Gold data..."
                      className="flex-1 bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 disabled:opacity-50"
                    />
                    <button
                      type="submit"
                      disabled={isLoading || !input.trim()}
                      className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-6 rounded-lg transition"
                    >
                      Send
                    </button>
                  </div>
                </form>
              )}
            </div>

            {split && activeTab !== "chat" && (
              <SplitChat messages={messages} since={split.since + 1} isLoading={isLoading} input={input} setInput={setInput} onSend={sendText}
                onClose={() => setSplit(null)} label={splitLabel} reportId={split.reportId} onAdd={addToReport} onOpenArtifact={openArtifact} />
            )}
            {/* RIGHT-HAND ARTIFACT PANEL */}
            <ArtifactPanel
              open={panelOpen}
              artifacts={artifacts}
              activeId={activeArtifact}
              onSelect={setActiveArtifact}
              onClose={() => setPanelOpen(false)}
            />
          </div>
          </SplitCtx.Provider>
        );
      }

      function App() {
        const [session, setSession] = useState(null);
        const [demo, setDemo] = useState(FORCE_DEMO);
        if (demo) return <SammConsole demo={true} onSignOut={() => setDemo(false)} />;
        if (!session) {
          return <SignIn defaultUrl={API_URL} onSignedIn={setSession} onDemo={() => setDemo(true)} />;
        }
        return <SammConsole session={session} demo={false} onSignOut={() => setSession(null)} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
