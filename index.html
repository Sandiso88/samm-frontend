<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ SAMM Core AI Platform</title>
    <!-- React core (pinned, production builds) -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <!-- Standalone in-browser Babel compiler -->

    <!-- Tailwind CSS framework (pinned) -->

  </head>
  <body style="margin: 0; padding: 0; background-color: #191919; color: #E3E3E3; font-family: sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG CONFIGURATION INTERFACES
      // ------------------------------------------------------------------
      const API_URL = "";
      const DEMO_MODE = !API_URL;

      const ROLES = [
        { value: "viewer", label: "Viewer (Cap: 100 Rows)" },
        { value: "analyst", label: "Analyst (BI View Controls)" },
        { value: "engineer", label: "Engineer (Ingestion Access)" },
        { value: "admin", label: "Administrator (Full Access)" },
      ];

      const PERSONAS = [
        { value: "architect", label: "BI Report Architect" },
        { value: "guard", label: "Metadata Ingestion Guard" },
        { value: "finops", label: "FinOps Budget Analyst" }
      ];

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const demoReply = (text) => {
        const t = text.toLowerCase();
        
        if (t.includes("power bi") || t.includes("dax") || t.includes("replicate") || t.includes("image") || t.includes("report")) {
          return "### Multimodal Layout Analyser (Vision Active)\nLegacy chart framework matched successfully against active catalog fields.\n\n### 📊 Power BI DAX Expression Matrix Model\n```dax\nGoldAccountsProfileMatrix = \nSUMMARIZECOLUMNS(\n    'gold_accounts_profile_matrix'[client_name],\n    \"ResolutionRate\", AVERAGE('gold_accounts_profile_matrix'[resolution_rate_percentage]),\n    \"TotalComputeCost\", SUM('gold_accounts_profile_matrix'[total_compute_cost_index])\n)\n```\n\n### 📊 Sisense ElastiCube JSON Schema Structure\n```json\n{\n  \"elasticube\": {\n    \"name\": \"SAMM_Gold_Layer_Cube\",\n    \"tables\": [{\n      \"name\": \"gold_accounts_profile_matrix\",\n      \"expression\": \"SELECT * FROM tenant_scoped\"\n    }]\n  }\n}\n```\n\nCross-BI reports have been fully compiled out-of-band based on client data models.";
        }
        
        if (t.includes("create view") || t.includes("materialize")) {
          return "### ⚙️ View Materialization Success\nDatabase view `custom_client_matrix_view` compiled and deployed live to `glue_db_cvvdr97yl50zyt` out-of-band under strict multi-tenant firewall parameters.";
        }
        
        return "### Compiled SQL (simulated)\nSELECT account_matrix_id FROM tenant_scoped LIMIT 5\n\n### Analytical Summary (simulated)\nThis request was processed safely within your organizational compliance region boundaries.";
      };

      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0] || {});
        const shown = rows.slice(0, 10);
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {shown.map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        );
      }

      function SammConsole() {
        const nextId = useRef(0);
        const stamp = () => new Date().toLocaleTimeString();
        const makeMsg = (role, content, rows) => ({ id: `m${++nextId.current}`, role, content, rows, timestamp: stamp() });

        const [messages, setMessages] = useState([
          {
            id: "init",
            role: "assistant",
            content: "SAMM AI System Core Active. Mode: Integrated Command Control Dashboard. Select authorization role profiling below.",
            timestamp: "System Ready",
          },
        ]);
        const [input, setInput] = useState("");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);
        const [systemRole, setSystemRole] = useState("viewer");
        const [activePersona, setActivePersona] = useState("architect");

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");

        // Premium Multi-Role Functional Architecture States
        const [isDragging, setIsDragging] = useState(false);             
        const [uploadStatus, setUploadStatus] = useState("");           
        const [adminUsers, setAdminUsers] = useState([
          { email: "engineer@shiftleft.com", role: "engineer", tenant: "Client_Alpha_London" },
          { email: "analyst@shiftleft.com", role: "analyst", tenant: "Client_Beta_EU" }
        ]);
        const [newEmail, setNewEmail] = useState("");
        const [newRole, setNewRole] = useState("analyst");
        const [viewQueryInput, setViewQueryInput] = useState("SELECT * FROM tenant_scoped WHERE resolution_rate_percentage > 85");
        const [viewNameInput, setViewNameInput] = useState("high_efficiency_accounts");

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        // Security Responsibility Enforcement Mappings
        const isEngineer = ["engineer", "admin"].includes(systemRole);
        const isAdmin = systemRole === "admin";

        useEffect(() => {
          if (!isEngineer && activeTab === "onboarding") setActiveTab("chat");
          if (!isAdmin && activeTab === "governance") setActiveTab("chat");
        }, [systemRole]);

        const handleSendMessage = async (e) => {
          e.preventDefault();
          const userText = input.trim();
          if (!userText || isLoading) return;
          addMessage("user", userText);
          setInput("");
          setIsLoading(true);
          try {
            if (DEMO_MODE) {
              await sleep(1000);
              addMessage("assistant", demoReply(userText));
            } else {
              const res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt: userText, role: systemRole, persona: activePersona }),
              });
              let d = await res.json();
              if (!res.ok || d.error) throw new Error(d.error || `Request failed (${res.status})`);
              addMessage(
                "assistant",
                `### Compiled SQL\n${d.executed_sql || ""}\n\n### Analytical Summary\n${d.report_markdown || ""}`,
                d.raw_data_grid
              );
            }
          } catch (err) {
            addMessage("assistant", `⚠️ ${err.message}`);
          } finally {
            setIsLoading(false);
          }
        };

        const addMessage = (role, content, rows) => setMessages((prev) => [...prev, makeMsg(role, content, rows)]);

        const handleFileDrop = async (e) => {
          e.preventDefault();
          setIsDragging(false);
          const files = e.dataTransfer ? e.dataTransfer.files : e.target.files;
          if (!files || files.length === 0) return;
          
          setIsLoading(true);
          setUploadStatus(`Superposition Core: Uploading raw streaming asset ${files[0].name}...`);
          await sleep(1500);
          setUploadStatus("");
          addMessage("assistant", `🎉 **Superposition Ingestion Verified:** File data structure \`${files[0].name}\` streamed blind directly into S3 Bronze Landing Vault. Metacognition pipeline cleaning data states out-of-band.`);
          setActiveTab("chat");
          setIsLoading(false);
        };

        const handleCreateView = async () => {
          if (!viewNameInput.trim()) return;
          setIsLoading(true);
          await sleep(1000);
          addMessage("assistant", `### ⚙️ View Materialized Successfully\nDeployed custom layout view: \`custom_gold_${viewNameInput}\` into database catalog \`glue_db_cvvdr97yl50zyt\`.\nExpression pattern: \`${viewQueryInput}\``);
          setViewNameInput("");
          setIsLoading(false);
        };

        const handleAddUserPolicy = (e) => {
          e.preventDefault();
          if (!newEmail.trim()) return;
          setAdminUsers(prev => [...prev, { email: newEmail.trim(), role: newRole, tenant: "Client_Alpha_London" }]);
          setNewEmail("");
          addMessage("assistant", `🔒 **Security Governance Audit:** User authorization state changed. Profile \`${newEmail}\` provisioned natively as **${newRole.toUpperCase()}** access tier.`);
        };

        const navClass = (tab, disabled) =>
