<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>⚙️ SAMM Core AI Platform</title>
    <!-- React core (pinned, production builds) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Standalone in-browser Babel compiler (fine for a demo; use a real build for production) -->
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
    <!-- Tailwind CSS framework (pinned) -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <style>
      * { scrollbar-width: thin; scrollbar-color: #3d3d3d #1b1b1b; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-track { background: #1b1b1b; }
      *::-webkit-scrollbar-thumb { background: #3d3d3d; border-radius: 8px; border: 2px solid #1b1b1b; }
      *::-webkit-scrollbar-thumb:hover { background: #55607a; }
      *::-webkit-scrollbar-corner { background: #1b1b1b; }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #191919; color: #E3E3E3; font-family: sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG
      // Paste your Lambda Function URL below (the one for SAMM-AI-Query-Engine), e.g.
      //   "https://abcdefghij.lambda-url.eu-west-2.on.aws/"
      // Leave it empty to use DEMO MODE only (simulated replies, nothing is sent).
      // You can also open the page with ?demo=1 to force demo mode.
      //
      // IMPORTANT: configure CORS on the Function URL ONLY (Allow headers: content-type, authorization).
      // lambda_function.py v4 deliberately sends no CORS headers of its own, because
      // duplicate Access-Control-Allow-Origin headers make browsers report "Failed to fetch".
      // ------------------------------------------------------------------
      const API_URL = "";
      const FORCE_DEMO = new URLSearchParams(window.location.search).get("demo") === "1";

      // Roles are DISPLAY labels only. Real permissions are enforced by the backend from your token.
      const ROLE_LABELS = {
        viewer: "Viewer",
        analyst: "Data Analyst",
        engineer: "Data Engineer",
        admin: "Client Administrator",
        system_admin: "System Administrator",
      };
      const ROLE_HELP = {
        viewer: "Asks questions. Small row cap.",
        analyst: "Larger row cap. Power BI DAX and Sisense output.",
        engineer: "Uploads files, runs the pipeline, maps fields, builds Gold views.",
        admin: "Manages the users and policies of their own client.",
        system_admin: "Platform owner. Every client, every role.",
      };
      const ROLE_ROW_CAP = { viewer: 100, analyst: 500, engineer: 1000, admin: 1000, system_admin: 1000 };
      const CAN_ONBOARD = ["engineer", "admin", "system_admin"];
      const CAN_GOVERN = ["admin", "system_admin"];
      const PERSONAS = [
        { value: "architect", label: "Architect" },
        { value: "guard", label: "Guard" },
        { value: "finops", label: "FinOps" },
      ];

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ------------------------------------------------------------------
      // Markdown helpers: split text into plain parts and fenced code blocks.
      // An unterminated fence is left as plain text (never swallowed).
      // ------------------------------------------------------------------
      function splitBlocks(text) {
        const parts = [];
        const re = /```([\w+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
        let last = 0;
        let m;
        while ((m = re.exec(text || "")) !== null) {
          if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
          parts.push({ type: "code", lang: (m[1] || "text").toLowerCase(), code: m[2].replace(/\s+$/, "") });
          last = re.lastIndex;
        }
        if (last < (text || "").length) parts.push({ type: "text", text: text.slice(last) });
        return parts;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      // ------------------------------------------------------------------
      // Backend client with detailed diagnostics.
      // ------------------------------------------------------------------
      class ApiError extends Error {
        constructor(message, details, status) {
          super(message);
          this.details = details || [];
          this.status = status || 0;
        }
      }

      async function callBackend(url, token, payload) {
        let res;
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify((() => { const c = payload && payload.client !== undefined ? payload.client : window.__sammClient; return c ? { ...payload, client: c } : payload; })()),
          });
        } catch (err) {
          // The browser hides the real reason for security reasons. These are the usual causes.
          throw new ApiError(
            "Could not reach the SAMM endpoint (the browser reported: " + (err && err.message ? err.message : "network error") + ").",
            [
              "Duplicate CORS headers: CORS must be configured on the Lambda Function URL only. Deploy lambda_function.py v4, which sends no CORS headers itself.",
              "The Function URL's CORS 'Allow headers' must include both: content-type and authorization (preflight fails otherwise).",
              "The Function URL's CORS 'Allow origins' must include this page's origin (" + window.location.origin + ") or *, and 'Allow methods' must include POST.",
              "Function URL auth type must be NONE and its resource policy must allow public invocation (otherwise AWS returns 403 without CORS headers).",
              "Check the URL is correct, and that the Lambda timeout (about 60 s) is long enough for Athena and Bedrock.",
              "Open the browser console (F12), Network tab, and look at the OPTIONS and POST rows for the exact status.",
            ],
            0
          );
        }
        let data = {};
        let rawText = "";
        try {
          rawText = await res.text();
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          data = {};
        }
        if (res.ok && !data.error) return data;

        const serverMsg = data.error || data.message || (rawText ? rawText.slice(0, 200) : "");
        const status = res.status;
        const hints = {
          400: ["The request or the generated SQL was rejected. Try rephrasing the question."],
          401: ["Your token is missing, wrong or expired. Sign out and enter a valid access token.", "Ask an admin to check SAMM_TOKEN_REGISTRY on the Lambda."],
          403: [
            "If the message names a role or column, your role is not allowed to do that.",
            "If it is a bare AWS 'Forbidden', the Function URL resource policy does not allow public invocation (auth NONE needs a lambda:InvokeFunctionUrl permission for principal *).",
          ],
          409: ["The Gold view has no tenant column, so tenant isolation cannot be enforced. Add tenant_id to the Gold view, or set ALLOW_UNSCOPED=true for single-tenant testing only."],
          413: ["FinOps circuit breaker: this question would scan more than the per-query data limit, so SAMM stopped it before it could cost money.", "Narrow it by date range, dataset or site, then ask again."],
          429: ["Too many requests or Bedrock throttling. Wait a moment and retry."],
          502: ["The model returned an empty or unusable answer. Retry; check Bedrock model access and MODEL_ID."],
          503: ["The server has no token registry configured (SAMM_TOKEN_REGISTRY is empty)."],
          504: ["The Lambda timed out. Raise the function timeout (about 60 s)."],
        };
        throw new ApiError(
          serverMsg || "Request failed (HTTP " + status + ").",
          hints[status] || (status >= 500 ? ["Server error. Check the CloudWatch logs for SAMM-AI-Query-Engine."] : []),
          status
        );
      }

      // ------------------------------------------------------------------
      // Demo data (clearly labelled as simulated everywhere it is shown)
      // ------------------------------------------------------------------
      const fmtBytes = (n) => { n = Number(n) || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; };
      const DEMO_IDENTITY = { email: "demo@samm.local", role: "admin", tenant_id: "DEMO_TENANT", row_cap: 1000 };

      function demoQuery(prompt) {
        const wantsBi = /power\s*bi|dax|sisense|json/i.test(prompt);
        const sql = "SELECT account_matrix_id, profile_score\nFROM tenant_scoped\nWHERE profile_score > 0.75\nORDER BY profile_score DESC\nLIMIT 10";
        let report = "**Simulated answer.** No query ran against your lakehouse.\n\nTen demo accounts have a profile score above 0.75.";
        if (wantsBi) {
          report += "\n\n```dax\nEVALUATE\nTOPN(10, FILTER('Gold', 'Gold'[profile_score] > 0.75), 'Gold'[profile_score], DESC)\n```\n\n```json\n{\n  \"table_name\": \"gold_accounts_profile_matrix\",\n  \"columns\": [\"account_matrix_id\", \"profile_score\"]\n}\n```";
        }
        return {
          generated_sql: sql,
          executed_sql: "WITH tenant_scoped AS (SELECT * FROM gold WHERE tenant_id = 'DEMO_TENANT')\n" + sql,
          report_markdown: report,
          raw_data_grid: [
            { account_matrix_id: "1001", profile_score: "0.93" },
            { account_matrix_id: "1002", profile_score: "0.88" },
            { account_matrix_id: "1003", profile_score: "0.81" },
          ],
          role: "admin",
          tenant_id: "DEMO_TENANT",
          row_cap: 1000,
          truncated: false,
          finops: { scanned_bytes: 2400000, ceiling_bytes: 5368709120, est_cost_usd: 0.00005, pct_of_ceiling: 0.04, queries: 1 },
        };
      }

      // ------------------------------------------------------------------
      // Small components
      // ------------------------------------------------------------------
      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0]);
        const shown = rows.slice(0, 10);
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {shown.map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-[10px] text-[#A0A0A0] mt-1 font-mono">Showing {shown.length} of {rows.length} rows</div>
          </div>
        );
      }

      // ------------------------------------------------------------------
      // v18: automatic charts, pivot tables and pinned dashboard tiles. All drawn in the browser from the rows SAMM returned.
      // ------------------------------------------------------------------
      const CHART_COLORS = ["#8ef4b2", "#6ea8ff", "#F59E0B", "#F472B6", "#A78BFA", "#FB923C"];
      function numOf(v) {
        if (v === null || v === undefined || v === "") return null;
        const n = Number(String(v).replace(/,/g, ""));
        return Number.isFinite(n) ? n : null;
      }
      function chartModel(rows) {
        if (!Array.isArray(rows) || rows.length < 2 || rows.length > 400) return null;
        const cols = Object.keys(rows[0] || {});
        const numCols = cols.filter((c) => rows.some((r) => numOf(r[c]) !== null) && rows.every((r) => r[c] === "" || r[c] == null || numOf(r[c]) !== null));
        const label = cols.find((c) => !numCols.includes(c)) || cols[0];
        const series = numCols.filter((c) => c !== label);
        if (!label || !series.length) return null;
        const isTime = rows.every((r) => /^\d{4}(-\d{2}(-\d{2})?|-Q\d)?$/.test(String(r[label])));
        return { label, series, isTime };
      }
      function niceMax(m) {
        if (m <= 0) return 1;
        const p = Math.pow(10, Math.floor(Math.log10(m)));
        const f = m / p;
        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
      }
      function fmtNum(n) {
        if (n === null || n === undefined) return "";
        const a = Math.abs(n);
        if (a >= 1e9) return (n / 1e9).toFixed(1) + "B";
        if (a >= 1e6) return (n / 1e6).toFixed(1) + "M";
        if (a >= 1e4) return (n / 1e3).toFixed(0) + "k";
        return Number.isInteger(n) ? String(n) : n.toFixed(1);
      }
      function downloadBlob(name, blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
      }
      function rowsToCsv(rows) {
        const cols = Object.keys(rows[0] || {});
        const esc = (v) => { const t = String(v ?? ""); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
        return [cols.map(esc).join(",")].concat(rows.map((r) => cols.map((c) => esc(r[c])).join(","))).join("\n");
      }

      function AutoChart({ rows, title }) {
        const model = chartModel(rows);
        const [type, setType] = useState(model && model.isTime ? "line" : "bar");
        const ref = useRef(null);
        if (!model) return null;
        const { label, series, isTime } = model;
        const W = 640, H = 280, L = 56, R = 16, T = 16, B = 70;
        const pw = W - L - R, ph = H - T - B;
        let data = rows;
        let note = "";
        if (type === "bar" && !isTime && rows.length > 15) { data = rows.slice(0, 15); note = "Showing the first 15 of " + rows.length + " groups."; }
        if (type === "line" && rows.length > 60) { data = rows.slice(-60); note = "Showing the latest 60 points."; }
        const vals = [];
        data.forEach((r) => series.forEach((c) => { const v = numOf(r[c]); if (v !== null) vals.push(v); }));
        const max = niceMax(Math.max(...vals, 0));
        const y = (v) => T + ph - (v / max) * ph;
        const n = data.length;
        const step = pw / n;
        const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * max);
        const lab = (r) => { const t = String(r[label]); return t.length > 12 ? t.slice(0, 11) + "…" : t; };
        const rot = n > 6;
        const every = n > 24 ? Math.ceil(n / 12) : 1;
        const exportPng = () => {
          try {
            const svg = ref.current; const xml = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            img.onload = () => {
              const c = document.createElement("canvas"); c.width = W * 2; c.height = H * 2;
              const g = c.getContext("2d"); g.fillStyle = "#222222"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
              c.toBlob((b) => b && downloadBlob("samm-chart.png", b));
            };
            img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml);
          } catch (_) { /* export is a convenience only */ }
        };
        return (
          <div data-testid="chart" className="mt-4 border border-[#2D2D2D] rounded-lg p-3 bg-[#1D1D1D]">
            <div className="flex items-center justify-between gap-2 mb-1 text-[11px] font-mono">
              <span className="text-[#A0A0A0] truncate" title={title}>{title || "Chart"}</span>
              <span className="flex gap-2 shrink-0">
                <button data-testid="chart-bar" onClick={() => setType("bar")} className={"px-2 py-0.5 rounded border " + (type === "bar" ? "border-amber-500 text-amber-300" : "border-[#3D3D3D] text-[#A0A0A0]")}>Bars</button>
                <button data-testid="chart-line" onClick={() => setType("line")} className={"px-2 py-0.5 rounded border " + (type === "line" ? "border-amber-500 text-amber-300" : "border-[#3D3D3D] text-[#A0A0A0]")}>Line</button>
                <button onClick={exportPng} className="px-2 py-0.5 rounded border border-[#3D3D3D] text-[#A0A0A0] hover:text-white">PNG</button>
              </span>
            </div>
            <svg ref={ref} xmlns="http://www.w3.org/2000/svg" viewBox={"0 0 " + W + " " + H} className="w-full" role="img" aria-label={"Chart of " + series.join(", ") + " by " + label} fontFamily="ui-monospace, monospace">
              {ticks.map((t, i) => (
                <g key={i}>
                  <line x1={L} x2={W - R} y1={y(t)} y2={y(t)} stroke="#2D2D2D" />
                  <text x={L - 6} y={y(t) + 3} textAnchor="end" fontSize="10" fill="#A0A0A0">{fmtNum(t)}</text>
                </g>
              ))}
              {type === "bar" && data.map((r, i) => {
                const bw = Math.max(step * 0.7 / series.length, 2);
                return series.map((c, k) => {
                  const v = numOf(r[c]); if (v === null) return null;
                  const x = L + i * step + step * 0.15 + k * bw;
                  return <rect key={i + "-" + c} x={x} y={y(v)} width={bw} height={Math.max(T + ph - y(v), 0)} fill={CHART_COLORS[k % 6]} rx="1"><title>{r[label] + " - " + c + ": " + v}</title></rect>;
                });
              })}
              {type === "line" && series.map((c, k) => {
                const pts = data.map((r, i) => [L + i * step + step / 2, numOf(r[c]), r]);
                const segs = []; let cur = [];
                pts.forEach((p) => { if (p[1] === null) { if (cur.length) segs.push(cur); cur = []; } else cur.push(p); });
                if (cur.length) segs.push(cur);
                return (
                  <g key={c}>
                    {segs.map((sg, si) => <polyline key={si} fill="none" stroke={CHART_COLORS[k % 6]} strokeWidth="2" strokeDasharray={c === "projected" ? "5 4" : undefined} points={sg.map((p) => p[0] + "," + y(p[1])).join(" ")} />)}
                    {pts.filter((p) => p[1] !== null).map((p, i) => <circle key={i} cx={p[0]} cy={y(p[1])} r="3" fill={CHART_COLORS[k % 6]}><title>{p[2][label] + " - " + c + ": " + p[1]}</title></circle>)}
                  </g>
                );
              })}
              {data.map((r, i) => (i % every === 0) && (
                <text key={i} x={L + i * step + step / 2} y={T + ph + 14} fontSize="10" fill="#A0A0A0" textAnchor={rot ? "end" : "middle"} transform={rot ? "rotate(-35 " + (L + i * step + step / 2) + " " + (T + ph + 14) + ")" : undefined}>{lab(r)}</text>
              ))}
            </svg>
            <div className="flex flex-wrap gap-3 text-[10px] font-mono text-[#A0A0A0]">
              {series.length > 1 && series.map((c, k) => <span key={c}><span style={{ color: CHART_COLORS[k % 6] }}>■</span> {c}</span>)}
              {series.length === 1 && <span>{series[0]} by {label}</span>}
              {note && <span className="text-[#808080]">{note}</span>}
            </div>
          </div>
        );
      }

      function PivotPanel({ rows }) {
        const cols = Object.keys(rows[0] || {});
        const nums = cols.filter((c) => rows.some((r) => numOf(r[c]) !== null));
        const cats = cols.filter((c) => !nums.includes(c));
        const [rowF, setRowF] = useState(cats[0] || cols[0]);
        const [colF, setColF] = useState("");
        const [valF, setValF] = useState(nums[0] || "(count)");
        const [agg, setAgg] = useState(nums.length ? "sum" : "count");
        const selc = "bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white text-xs";
        const calc = (xs) => {
          if (agg === "count") return xs.length;
          const v = xs.map(numOf).filter((x) => x !== null);
          if (!v.length) return null;
          if (agg === "sum") return v.reduce((a, b) => a + b, 0);
          if (agg === "avg") return v.reduce((a, b) => a + b, 0) / v.length;
          if (agg === "min") return Math.min(...v);
          return Math.max(...v);
        };
        const rk = [], ck = [], cell = {}, rtot = {}, ctot = {}, all = [];
        rows.forEach((r) => {
          const a = String(r[rowF] ?? ""), b = colF ? String(r[colF] ?? "") : "Value";
          const v = valF === "(count)" ? 1 : r[valF];
          if (!rk.includes(a)) rk.push(a);
          if (!ck.includes(b)) ck.push(b);
          (cell[a + "\u0001" + b] = cell[a + "\u0001" + b] || []).push(v);
          (rtot[a] = rtot[a] || []).push(v); (ctot[b] = ctot[b] || []).push(v); all.push(v);
        });
        const f = (v) => v === null || v === undefined ? "" : (Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 2 }));
        const tooBig = rk.length > 50 || ck.length > 12;
        return (
          <div data-testid="pivot" className="mt-3 border border-[#2D2D2D] rounded-lg p-3 bg-[#1D1D1D] space-y-2">
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-mono text-[#A0A0A0]">
              rows <select aria-label="Pivot rows" value={rowF} onChange={(e) => setRowF(e.target.value)} className={selc}>{cols.map((c) => <option key={c}>{c}</option>)}</select>
              columns <select aria-label="Pivot columns" value={colF} onChange={(e) => setColF(e.target.value)} className={selc}><option value="">(none)</option>{cols.filter((c) => c !== rowF).map((c) => <option key={c}>{c}</option>)}</select>
              values <select aria-label="Pivot values" value={valF} onChange={(e) => setValF(e.target.value)} className={selc}><option>(count)</option>{nums.map((c) => <option key={c}>{c}</option>)}</select>
              <select aria-label="Pivot calculation" value={agg} onChange={(e) => setAgg(e.target.value)} className={selc}>{["sum", "avg", "count", "min", "max"].map((c) => <option key={c}>{c}</option>)}</select>
            </div>
            {tooBig ? <div className="text-xs text-amber-300">Too many distinct values to pivot ({rk.length} rows, {ck.length} columns). Choose fields with fewer values.</div> : (
              <div className="overflow-x-auto">
                <table className="text-xs font-mono border border-[#2D2D2D]">
                  <thead><tr className="bg-[#2D2D2D] text-amber-500"><th className="text-left px-3 py-1.5">{rowF}</th>{ck.map((c) => <th key={c} className="text-right px-3 py-1.5">{colF ? c : agg + " of " + valF}</th>)}{colF && <th className="text-right px-3 py-1.5">Total</th>}</tr></thead>
                  <tbody>
                    {rk.map((a) => <tr key={a} className="border-t border-[#2D2D2D]"><td className="px-3 py-1.5">{a}</td>{ck.map((b) => <td key={b} className="px-3 py-1.5 text-right">{f(calc(cell[a + "\u0001" + b] || []))}</td>)}{colF && <td className="px-3 py-1.5 text-right text-white">{f(calc(rtot[a]))}</td>}</tr>)}
                    <tr className="border-t-2 border-[#3D3D3D] text-white"><td className="px-3 py-1.5">Total</td>{ck.map((b) => <td key={b} className="px-3 py-1.5 text-right">{f(calc(ctot[b]))}</td>)}{colF && <td className="px-3 py-1.5 text-right">{f(calc(all))}</td>}</tr>
                  </tbody>
                </table>
              </div>
            )}

      const DT = { navy: "#13214a", navy2: "#0f1c3f", card: "#1b2a55", line: "#2c385d", mint: "#8ef4b2", mute: "#78869b", sky: "#6ea8ff", violet: "#a78bfa", amber: "#f5b657", pink: "#f472b6" };

      function parseReportCommand(text) {
        const t = String(text || "").trim();
        let m = /^(?:please\s+)?(?:rename|retitle|call|name)\s+(?:the\s+|this\s+|my\s+)?report\s+(?:to\s+|as\s+)?["“'‘]?(.{1,120}?)["”'’]?\s*\.?$/i.exec(t)
          || /^(?:please\s+)?(?:change|set)\s+(?:the\s+)?(?:report\s+)?(?:name|title)\s+(?:of\s+(?:the|this)\s+report\s+)?to\s+["“'‘]?(.{1,120}?)["”'’]?\s*\.?$/i.exec(t);
        if (m) return { title: m[1].trim() };
        if (/^(?:please\s+)?(?:make|change|set|turn|use|switch|paint)\b/i.test(t) && /\b(report|colou?r|accent|theme)\b/i.test(t)) {
          const hex = /#[0-9a-fA-F]{6}\b/.exec(t);
          if (hex) return { accent: hex[0] };
          const w = /\b(green|mint|blue|violet|purple|amber|orange|pink|red|teal|yellow|white|grey|gray)\s*[.!]?\s*$/i.exec(t);
          if (w) return { accent: w[1].toLowerCase() };
        }
        return null;
      }
      function SplitChat({ messages, since, isLoading, input, setInput, onSend, onClose, label, reportId, onAdd, onOpenArtifact }) {

        const add = async (m) => {
          setErr("");

      function SignIn({ onSignedIn, onDemo, defaultUrl }) {
        const [url, setUrl] = useState(defaultUrl);
        const [token, setToken] = useState("");
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);

        const submit = async (e) => {
          e.preventDefault();
          setError(null);
          const u = url.trim();
          const t = token.trim();
          if (!/^https:\/\/\S+$/.test(u)) {
            setError(new ApiError("Endpoint must be an https:// URL (your Lambda Function URL).", []));
            return;
          }
          if (!t) {
            setError(new ApiError("Enter your access token.", []));

      // ------------------------------------------------------------------
      // Small safe markdown renderer: headings, **bold**, _italic_, `code`, tables, lists, > notes. Never inserts raw HTML.
      // ------------------------------------------------------------------
      function mdInline(text, kp) {
        const out = [];
        const re = /\*\*(.+?)\*\*|`([^`]+)`|_([^_\n]+?)_|\*([^*\n]+?)\*/g;
        let last = 0, m, n = 0;
        const s = String(text);
        while ((m = re.exec(s)) !== null) {
          if (m[3] !== undefined) {   // _italic_ only at word edges, so worked_hours stays as written
            const before = m.index === 0 ? " " : s[m.index - 1];
            const after = s[m.index + m[0].length] || " ";
            if (!/[\s(]/.test(before) || !/[\s).,;:!?]/.test(after)) { re.lastIndex = m.index + 1; continue; }
          }
          if (m.index > last) out.push(s.slice(last, m.index));
          const k = kp + "-" + n++;
          if (m[1] !== undefined) out.push(<strong key={k} className="text-white">{m[1]}</strong>);
          else if (m[2] !== undefined) out.push(<code key={k} className="font-mono text-amber-300 bg-[#151515] px-1 rounded">{m[2]}</code>);
          else out.push(<em key={k}>{m[3] !== undefined ? m[3] : m[4]}</em>);
          last = m.index + m[0].length;
        }
        if (last < s.length) out.push(s.slice(last));
        return out;
      }

      function Markdown({ text }) {
        const lines = String(text || "").split("\n");
        const blocks = [];
        let i = 0;
        const cells = (l) => l.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
        while (i < lines.length) {
          const l = lines[i];
          if (!l.trim()) { i++; continue; }
          let m;
          if ((m = l.match(/^(#{1,4})\s+(.*)$/))) {
            blocks.push(<div key={i} role="heading" aria-level={m[1].length} className="text-base font-bold text-white mt-1 mb-2">{mdInline(m[2], "h" + i)}</div>);
            i++; continue;
          }
          if (l.trim().startsWith("|") && i + 1 < lines.length && /^\s*\|[\s:|-]+\|?\s*$/.test(lines[i + 1])) {
            const head = cells(l); const body = []; i += 2;
            while (i < lines.length && lines[i].trim().startsWith("|")) { body.push(cells(lines[i])); i++; }
            blocks.push(
              <div key={"t" + i} className="overflow-x-auto my-2">
                <table data-testid="md-table" className="text-xs font-mono border border-[#2D2D2D] w-full">
                  <thead><tr className="bg-[#2D2D2D] text-amber-500">{head.map((h, j) => <th key={j} className="text-left px-3 py-1.5 whitespace-nowrap">{mdInline(h, "th" + j)}</th>)}</tr></thead>
                  <tbody>{body.map((r, ri) => <tr key={ri} className="border-t border-[#2D2D2D]">{head.map((_, j) => <td key={j} className="px-3 py-1.5 whitespace-nowrap">{mdInline(r[j] === undefined ? "" : r[j], "td" + ri + "-" + j)}</td>)}</tr>)}</tbody>
                </table>
              </div>
            );
            continue;
          }
          if (/^\s*[-*]\s+/.test(l)) {
            const items = [];
            while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*]\s+/, "")); i++; }
            blocks.push(<ul key={"u" + i} className="list-disc pl-5 my-1 space-y-0.5">{items.map((it, j) => <li key={j}>{mdInline(it, "li" + j)}</li>)}</ul>);
            continue;
          }
          if (/^>\s?/.test(l)) {
            const q = [];
            while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, "")); i++; }
            blocks.push(<div key={"q" + i} className="border-l-2 border-amber-500 pl-3 my-2 text-xs text-[#A0A0A0]">{q.map((x, j) => <div key={j}>{mdInline(x, "q" + j)}</div>)}</div>);
            continue;
          }
          const para = [];
          while (i < lines.length && lines[i].trim() && !/^(#{1,4})\s+/.test(lines[i]) && !lines[i].trim().startsWith("|") && !/^\s*[-*]\s+/.test(lines[i]) && !/^>\s?/.test(lines[i])) { para.push(lines[i]); i++; }
          if (!para.length) { para.push(lines[i]); i++; }
          blocks.push(<p key={"p" + i} className="my-1">{para.map((x, j) => <React.Fragment key={j}>{j > 0 && <br />}{mdInline(x, "p" + j)}</React.Fragment>)}</p>);
        }
        return <div data-testid="md">{blocks}</div>;
      }

        if (titleOf(v)) return titleOf(v);

      const STAGES = [["upload", "Upload"], ["bronze", "Bronze"], ["silver", "Silver"], ["map", "Map fields"], ["gold", "Gold view"]];

      function putFile(url, file, onProgress) {
        const corsHelp = [
          "The S3 bucket needs a CORS rule that allows PUT from this site (" + window.location.origin + "). Run deploy_samm.py again with --origin set to this address.",
          "The upload link lasts 15 minutes; try again if it expired.",
        ];
        return new Promise((resolve, reject) => {
          const x = new XMLHttpRequest();
          x.open("PUT", url);
          x.upload.onprogress = (e) => { if (onProgress && e.lengthComputable && e.total) onProgress(Math.min(100, Math.round((e.loaded / e.total) * 100))); };
          x.onerror = () => reject(new ApiError("The browser could not upload the file to S3.", corsHelp, 0));
          x.onload = () => {
            if (x.status >= 200 && x.status < 300) { if (onProgress) onProgress(100); resolve(); return; }
            reject(new ApiError("S3 refused the upload (HTTP " + x.status + ").", ["The upload link may have expired; try again.", "The SAMM Lambda role must be allowed to write to the bucket (s3:PutObject)."], x.status));
          };
          x.send(file);
        });
      }

                        {r.note && <div className="basis-full text-[10px] text-[#707070]">{r.note}{r.confidence ? " (" + Math.round(r.confidence * 100) + "% sure)" : ""}</div>}
                      </div>
                    );
                  })}
                </div>
                {!locked && (
                  <div className="border border-[#2D2D2D] rounded-md p-3 space-y-2">

                      {nr.kind === "allowed" && <input aria-label="New rule values" value={nr.values} onChange={(e) => setNr({ ...nr, values: e.target.value })} className={inp + " w-48"} placeholder="a, b, c" />}

                      {nr.kind === "compare" && (<><select aria-label="New rule comparison" value={nr.op} onChange={(e) => setNr({ ...nr, op: e.target.value })} className={inp}>{COMPARE_OPS.map((o) => <option key={o}>{o}</option>)}</select><select aria-label="New rule other field" value={nr.column2} onChange={(e) => setNr({ ...nr, column2: e.target.value })} className={inp}><option value="">(choose)</option>{cols.map((c) => <option key={c}>{c}</option>)}</select></>)}

                  Hide rows that break an active business rule from the Gold view (otherwise they are only flagged)
                </label>

            <ErrBox err={err} />
            {built ? (

                <div className="flex flex-wrap items-center gap-3 text-xs">

      }

      // ------------------------------------------------------------------
      // One onboarding job: the back end does the work, this card only shows progress and asks for approvals
      // ------------------------------------------------------------------

      // v21: the staged view - Upload > Bronze > Silver > Map fields > Gold, with how much of the data is mapped so far.
      function jobStages(job) {
        const ds = Object.values(job.datasets || {});
        const auto = ds.reduce((a, d) => a + (d.auto_mapped || 0), 0);
        const open = ds.reduce((a, d) => a + ((d.queue || []).length), 0);
        const failed = job.status === "failed";
        const hasDs = ds.length > 0;
        const allDone = hasDs && ds.every((d) => d.state === "done");
        const inReview = ds.some((d) => d.state === "review" && !(d.queue || []).length);
        const mapPct = job.status === "done" || allDone ? 100 : inReview ? 50 : (auto + open) > 0 ? Math.round((auto / (auto + open)) * 100) : (hasDs ? 0 : null);
        const waiting = ds.some((d) => d.state === "approval" || d.state === "review");
        const st = (n) => n;
        const silverDone = hasDs;
        const mapDone = allDone || job.status === "done";
        const goldDone = job.status === "done" || allDone;
        const cur = failed ? -1 : goldDone ? 5 : mapDone ? 4 : silverDone ? 3 : 2;   // index of the stage in progress
        const overall = failed ? Math.max(job.progress || 0, 5) : goldDone ? 100 : mapDone ? 90 : silverDone ? 40 + Math.round(((mapPct || 0) / 100) * 45) : (job.progress >= 25 ? 35 : 25);
        const label = failed ? "Stopped with an error" : goldDone ? "Done" : mapDone ? "Building the Gold view" : inReview ? "Waiting for your review" : open > 0 ? "Waiting for your confirmation" : silverDone ? "Mapping fields" : "Converting to Silver";
        return { pct: mapPct, inReview, overall, label, auto, open, waiting, failed, cur,
          stages: [["Upload", true], ["Bronze", true], ["Silver", silverDone], ["Map fields", mapDone], ["Gold view", goldDone]] };
      }
      function StageTracker({ job }) {
        const j = jobStages(job);
        return (
          <div data-testid="stage-tracker" className="space-y-2">
            <div data-testid="overall-progress" className="space-y-1">
              <div className="flex justify-between text-[11px] font-mono text-[#C0C0C0]"><span>{j.label}</span><span>{j.overall}%</span></div>
              <div className="h-2 bg-[#2D2D2D] rounded"><div className={"h-2 rounded transition-all duration-500 " + (j.failed ? "bg-red-600" : j.overall >= 100 ? "bg-green-500" : "bg-amber-500")} style={{ width: j.overall + "%" }} /></div>
            </div>
            <div className="flex flex-wrap gap-2 text-[11px] font-mono">
              {j.stages.map(([label, done], n) => (
                <span key={label} data-testid={"stage-" + label.split(" ")[0].toLowerCase()} className={"px-2 py-1 rounded border " + (done ? "border-green-700 text-green-300" : n === j.cur && !j.failed ? "border-amber-500 text-amber-300" : j.failed && n === j.cur ? "border-red-700 text-red-300" : "border-[#333] text-[#707070]")}>
                  {(done ? "✓ " : "") + label}
                </span>
              ))}
            </div>
            {j.pct !== null && (
              <div data-testid="mapped-pct" className="space-y-1">
                <div className="flex justify-between text-[11px] font-mono text-[#C0C0C0]">
                  <span>Fields mapped</span>
                  <span>{j.inReview ? "needs your review" : j.pct + "%"}{j.open > 0 ? " · " + j.open + " need" + (j.open === 1 ? "s" : "") + " your confirmation" : ""}</span>
                </div>
                <div className="h-1.5 bg-[#2D2D2D] rounded"><div className={"h-1.5 rounded " + (j.inReview ? "bg-amber-500" : "bg-emerald-500")} style={{ width: j.pct + "%" }} /></div>
              </div>
            )}
          </div>
        );
      }

      // v22: look at the data in each layer, publish a report, and open it again from a link.
      function reportLink(id, client) {
        return window.location.origin + window.location.pathname + "#report=" + id + (client ? "&client=" + encodeURIComponent(client) : "");
      }
      function DataTable({ columns, rows }) {
        const cols = columns && columns.length ? columns : Object.keys((rows || [])[0] || {});
        if (!rows || !rows.length) return <div className="text-xs text-[#808080]">No rows to show.</div>;
        return (
          <div className="overflow-auto max-h-80 border border-[#2D2D2D] rounded-lg">
            <table className="w-full text-[11px] font-mono">
              <thead><tr>{cols.map((c) => <th key={c} className="text-left text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D] whitespace-nowrap">{c}</th>)}</tr></thead>
              <tbody>{rows.map((r, i) => <tr key={i} className="border-t border-[#2D2D2D]">{cols.map((c) => <td key={c} className="px-2 py-1 text-[#D0D0D0] whitespace-nowrap max-w-[220px] truncate" title={String(r[c] ?? "")}>{String(r[c] ?? "")}</td>)}</tr>)}</tbody>
            </table>
          </div>
        );
      }
      function DataViewer({ api, dataset, view, initial }) {
        const ctx = React.useContext(SplitCtx);
        const [showAll, setShowAll] = useState(false);
        const sameSet = (a, b) => String(a || "").replace(/^silver_/, "") === String(b || "").replace(/^silver_/, "");
        const liveOn = ctx.open && !ctx.reportId && sameSet(ctx.dataset, dataset) && ctx.live;
        useEffect(() => { setShowAll(false); }, [ctx.live && ctx.live.id]);
        const [layer, setLayer] = useState(initial || "gold");
        const [res, setRes] = useState({});
        const [busy, setBusy] = useState(false);
        const load = async (l) => {
          setLayer(l);
          if (res[l]) return;
          setBusy(true);
          try { const r = await api({ action: "data_peek", dataset, layer: l }); setRes((p) => ({ ...p, [l]: r })); }
          catch (e) { setRes((p) => ({ ...p, [l]: { error: e.message || "Could not load." } })); } finally { setBusy(false); }
        };
        useEffect(() => { load(initial || "gold"); }, []);
        const cur = res[layer];
        return (
          <div data-testid="data-viewer" className="border border-[#2D2D2D] rounded-lg p-3 bg-[#1B1B1B] space-y-2">
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-mono">
              {[["bronze", "Bronze · original file"], ["silver", "Silver · converted rows"], ["gold", "Gold · business view"]].map(([l, label]) => (
                <button key={l} data-testid={"layer-" + l} onClick={() => load(l)} className={"px-2 py-1 rounded border " + (layer === l ? "border-amber-500 text-amber-300" : "border-[#3D3D3D] text-[#A0A0A0] hover:text-white")}>{label}</button>
              ))}
              {busy && <span className="text-[#808080]">Loading...</span>}
              <button data-testid="data-ask" onClick={() => openSplit({ dataset, view })} className="ml-auto px-2 py-1 rounded border border-amber-500/60 text-amber-300 hover:bg-amber-500/10">Ask SAMM</button>
            </div>
            {liveOn && !showAll && (
              <div data-testid="live-banner" className="flex flex-wrap items-center gap-2 text-[11px] text-[#8ef4b2]">
                <span>Showing: {liveOn.question || "your last question"}</span>
                <button data-testid="show-all-data" onClick={() => setShowAll(true)} className="underline text-amber-300">Show all data</button>
              </div>
            )}
            {liveOn && !showAll && <div data-testid="live-table"><DataTable rows={liveOn.rows} /></div>}
            {cur && cur.error && <div data-testid="peek-error" className="text-xs text-amber-200">{cur.error}</div>}
            {cur && !cur.error && !(liveOn && !showAll) && (
              <>
                <div data-testid="peek-meta" className="text-[11px] text-[#A0A0A0]">
                  {cur.file ? cur.file + " · " : ""}{cur.total != null ? Number(cur.total).toLocaleString() + " rows" : ""}{(cur.rows || []).length ? " · showing the first " + cur.rows.length : ""}{cur.note ? " · " + cur.note : ""}
                </div>
                <DataTable columns={cur.columns} rows={cur.rows} />
              </>
            )}
          </div>
        );
      }
      function DatasetTools({ api, dataset, view, client, onAsk }) {
        const [show, setShow] = useState(false);
        const [ren, setRen] = useState({ open: false, title: "", subject: "", busy: false, err: null });
        const cur0 = (window.__sammTitles || {})[view] || {};
        const [shown, setShown] = useState(cur0);
        const saveTitle = async () => {
          setRen((r) => ({ ...r, busy: true, err: null }));
          try {
            const r = await api({ action: "dataset_rename", dataset, title: ren.title, subject: ren.subject });
            const next = r.title ? { title: r.title, subject: r.subject || "" } : {};
            window.__sammTitles = { ...(window.__sammTitles || {}) }; if (r.title) window.__sammTitles[view] = next; else delete window.__sammTitles[view];
            setShown(next); setRen({ open: false, title: "", subject: "", busy: false, err: null });
            window.dispatchEvent(new CustomEvent("samm-titles-changed"));
          } catch (e) { setRen((x) => ({ ...x, busy: false, err: e })); }
        };
        const [pub, setPub] = useState({ busy: false, doc: null, err: null, copied: false });
        const publish = async () => {
          setPub({ busy: true, doc: null, err: null, copied: false });
          try { const r = await api({ action: "report_publish", dataset }); setPub({ busy: false, doc: r, err: null, copied: false }); }
          catch (e) { setPub({ busy: false, doc: null, err: e, copied: false }); }
        };
        const link = pub.doc ? reportLink(pub.doc.id, pub.doc.client || client) : "";
        return (
          <div className="space-y-2" data-testid="dataset-tools">
            {(shown.title || ren.open) && !ren.open && <div data-testid="dataset-title" className="text-xs text-white"><span className="font-semibold">{shown.title}</span>{shown.subject ? <span className="text-[#A0A0A0]"> · {shown.subject}</span> : null}</div>}
            <div className="flex flex-wrap gap-3 text-xs font-mono">
              <button data-testid="rename-dataset" onClick={() => setRen({ open: !ren.open, title: shown.title || "", subject: shown.subject || "", busy: false, err: null })} className="underline text-amber-400 hover:text-amber-300">Rename</button>
              <button data-testid="view-data" onClick={() => setShow((v) => !v)} className="underline text-amber-400 hover:text-amber-300">{show ? "Hide data" : "View data (Bronze · Silver · Gold)"}</button>
              <button data-testid="publish-report" onClick={publish} disabled={pub.busy} className="underline text-amber-400 hover:text-amber-300 disabled:opacity-50">{pub.busy ? "Publishing..." : "Publish report"}</button>

            {ren.open && (
              <div data-testid="rename-form" className="border border-[#2D2D2D] rounded-lg p-3 bg-[#1B1B1B] space-y-2 text-xs">

                  <input aria-label="Dataset subject" value={ren.subject} maxLength={60} onChange={(e) => setRen({ ...ren, subject: e.target.value })} placeholder="Subject (optional), e.g. Purchase orders" className="w-64 bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white focus:outline-none focus:border-amber-500" />
                  <button data-testid="save-title" onClick={saveTitle} disabled={ren.busy} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1 rounded-md disabled:opacity-50">{ren.busy ? "Saving..." : "Save"}</button>

                </div>

                <ErrBox err={ren.err} />
              </div>
            )}
            {show && <DataViewer api={api} dataset={dataset} view={view} />}

      const JOB_STATUS = {
        queued: "Starting...", running: "SAMM is working on it...", waiting: "Waiting for the Excel conversion to finish...",

      };
      function JobCard({ job, api, onUpdate, onAsk, onViewsChanged, onDismiss }) {
        const live = ["queued", "running", "waiting"].includes(job.status);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState(null);
        const [gone, setGone] = useState(false);
        const [choice, setChoice] = useState({});
        const [editing, setEditing] = useState(null);
        const notified = useRef(false);
        useEffect(() => {
          if (!live || gone) return undefined;
          let stop = false;
          const t = setInterval(async () => {
            try { const r = await api({ action: "job_get", id: job.id }); if (!stop && r.job) onUpdate(r.job); } catch (e) {
              if (stop) return;
              if (e && e.status === 404) { setGone(true); return; }
              setErr(e);
            }
          }, 3000);
          return () => { stop = true; clearInterval(t); };
        }, [job.id, live, gone]);
        useEffect(() => { if (job.status === "done" && !notified.current) { notified.current = true; onViewsChanged(); } }, [job.status]);

        const waiting = Object.entries(job.datasets || {}).filter(([, d]) => d.state === "approval");
        const act = async (payload) => {
          setBusy(true); setErr(null);
          try { const r = await api(payload); if (r.job) onUpdate(r.job); } catch (e) { setErr(e); } finally { setBusy(false); }
        };
        const approve = () => {
          const decisions = {};
          waiting.forEach(([ds, d]) => {
            decisions[ds] = {};
            d.queue.forEach((q) => {
              const v = choice[ds + "|" + q.column] !== undefined ? choice[ds + "|" + q.column] : q.suggestion;
              decisions[ds][q.column] = v === "__keep" ? "" : v === "__hide" ? "-" : v;
            });
          });
          act({ action: "job_resolve", id: job.id, decisions });
        };
        const bar = job.status === "failed" ? "bg-red-600" : job.status === "needs_approval" ? "bg-amber-500" : "bg-green-600";
        return (
          <div data-testid="job-card" className="space-y-3">
            <StageTracker job={job} />
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-mono">
              <span className="px-2 py-0.5 rounded bg-[#333] text-[#BBB]">{job.source === "screen" ? "from this screen" : "back-end drop"}</span>
              <span data-testid="job-status" className={job.status === "failed" ? "text-red-300" : job.status === "done" ? "text-green-300" : "text-amber-300"}>{JOB_STATUS[job.status] || job.status}</span>
            </div>
            {gone && (
              <div data-testid="job-gone" className="text-xs text-amber-200 bg-[#2A2418] border border-amber-900 rounded-lg p-3 flex flex-wrap items-center gap-3">

                {onDismiss && <button onClick={onDismiss} data-testid="job-gone-dismiss" className="underline text-amber-400 hover:text-amber-300">Dismiss</button>}
              </div>
            )}
            {job.note && <div className="text-xs text-[#C0C0C0]">{job.note}</div>}
            {job.error && <div data-testid="job-error" className="text-xs text-red-300">{job.error}</div>}
            {Object.entries(job.datasets || {}).map(([ds, d]) => (
              <div key={ds} className="space-y-2">
              <div className="text-xs font-mono flex flex-wrap gap-3 items-center">
                <span className="text-amber-400" title={ds}>{(d.view && titleOf(d.view)) || ds}</span>
                <span className="text-[#A0A0A0]">{d.state}</span>
                {d.view && <span className="text-green-300">→ {d.view}</span>}
                {d.view && <button onClick={() => onAsk(d.view)} className="underline text-amber-400 hover:text-amber-300">Ask about it</button>}
                {(d.state === "review" || d.view) && <button data-testid={"job-edit-" + ds} onClick={() => setEditing(editing === ds ? null : ds)} className="underline text-amber-400 hover:text-amber-300">{d.state === "review" ? "Review mapping & rules" : "Edit mapping & rules"}</button>}
                {d.error && <span className="text-red-300">{d.error}</span>}
              </div>
              {d.view && <DatasetTools api={api} dataset={ds} view={d.view} onAsk={onAsk} />}
              </div>
            ))}
            {editing && <MappingEditor key={editing} dataset={editing} jobId={(job.datasets[editing] || {}).state === "review" ? job.id : null} api={api} onAsk={onAsk}
              onBuilt={(j) => { if (j) onUpdate(j); onViewsChanged(); }} onClose={() => setEditing(null)} />}
            {waiting.length > 0 && (
              <div data-testid="job-approvals" className="border border-amber-700 rounded-lg p-3 space-y-2 bg-[#241E10]">
                <div className="text-xs text-amber-300 font-semibold">SAMM is not sure about these fields. Choose what each one should be, then approve.</div>

                  <div key={ds + q.column} className="flex flex-wrap items-center gap-3 text-xs font-mono">
                    <span className="text-white w-40 truncate" title={q.column}>{q.column}</span>
                    <span className="text-[#808080] max-w-[160px] truncate" title={(q.samples || []).join(", ")}>{(q.samples || []).join(", ")}</span>
                    <select aria-label={"Decision for " + q.column} value={choice[ds + "|" + q.column] !== undefined ? choice[ds + "|" + q.column] : q.suggestion}
                      onChange={(e) => setChoice({ ...choice, [ds + "|" + q.column]: e.target.value })}
                      className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white">
                      <option value={q.suggestion}>use "{q.suggestion}" ({Math.round(q.confidence * 100)}% sure)</option>
                      <option value="__keep">keep its own name</option>
                      <option value="__hide">hide from Gold</option>

                <button data-testid="job-approve" onClick={approve} disabled={busy} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-xs px-4 py-2 rounded-lg">Approve and continue</button>

            )}
            <ErrBox err={err} />
            {(job.log || []).length > 0 && (
              <details className="text-[11px] text-[#808080]">
                <summary className="cursor-pointer">What SAMM did ({job.log.length} steps)</summary>
                <ul className="mt-1 space-y-0.5 font-mono">{job.log.map((l, i) => <li key={i}>{l.ts.slice(11, 19)} {l.msg}</li>)}</ul>
              </details>
            )}
          </div>
        );
      }

      function SelfTestPanel({ api, view }) {

      function TeachPanel({ api }) {

        const load = async () => { try { const r = await api({ action: "teach_list" }); if (!r || !r.taught || !r.columns) return; setD(r); setF((p) => ({ ...p, column: p.column || (r.columns[0] || {}).name || "" })); } catch (e) { setErr(e); } };
        useEffect(() => { load(); }, []);
        if (!d && !err) return null;
        if (err && !d) return <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5"><ErrBox err={err} /></div>;
        const save = async () => {
          setErr(null); setMsg("");
          try {
            const body = { action: "teach_save", kind: f.kind, phrase: f.phrase, column: f.column };
            if (f.kind === "filter") { body.op = f.op; body.value = f.value; }
            if (f.kind === "measure") body.fn = f.fn;
            const r = await api(body); setMsg(r.note); setF({ ...f, phrase: "", value: "" }); load();
          } catch (e) { setErr(e); }

        const del = async (payload) => { setErr(null); try { await api({ action: "teach_delete", ...payload }); load(); } catch (e) { setErr(e); } };
        const rules = [];
        Object.entries(d.taught.aliases || {}).forEach(([p, c]) => rules.push({ p, t: "means the column " + c }));

            <div className="flex flex-wrap items-center gap-2 text-xs">
              <input aria-label="Phrase" value={f.phrase} onChange={(e) => setF({ ...f, phrase: e.target.value })} placeholder="phrase, e.g. overdue" className={inp + " w-44"} />
              <select aria-label="Teach type" value={f.kind} onChange={(e) => setF({ ...f, kind: e.target.value })} className={inp}>

              {f.kind === "filter" && <select aria-label="Filter operation" value={f.op} onChange={(e) => setF({ ...f, op: e.target.value })} className={inp}>{d.ops.map((x) => <option key={x}>{x}</option>)}</select>}
              {f.kind === "filter" && !noValue && <input aria-label="Filter value" value={f.value} onChange={(e) => setF({ ...f, value: e.target.value })} placeholder={f.op === "between" ? "5, 20" : f.op === "in" ? "a, b, c" : "value"} className={inp + " w-40"} />}

      // v24: drill-down through tables that belong together, and the screen where links are found, checked and approved.
      function DrillView({ api, name, reportId, onClose, onAdded }) {
        const [stack, setStack] = useState([]);              // chosen values so far: [{ key, label }]
        const [data, setData] = useState(null);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState(null);
        const [note, setNote] = useState("");
        const load = async (path, first) => {
          setBusy(true); setErr(null); setNote("");
          try { const r = await api({ action: "drill_query", name, depth: path.length, path: path.map((p) => p.key), check: !!first }); setData(r); setStack(path); }
          catch (e) { setErr(e); } finally { setBusy(false); }
        };
        useEffect(() => { load([], true); }, [name]);
        const nf = (v) => { const n = Number(v); return v === null || v === undefined || v === "" || isNaN(n) ? String(v ?? "") : n.toLocaleString(undefined, { maximumFractionDigits: 2 }); };
        const crumbs = data ? data.levels.map((l, i) => ({ i, label: l.label })) : [];
        const addToReport = async () => {
          if (!data || !reportId) return;
          const where = stack.map((s) => s.label || s.key).join(" › ");
          const rows = data.rows.map((r) => { const o = {}; Object.keys(r).forEach((k) => { if (k !== "key") o[k === "label" ? data.levels[data.depth].label : k] = r[k]; }); return o; });
          try {
            const r = await api({ action: "report_update", id: reportId, add_tile: { title: (name + (where ? ": " + where : "")).slice(0, 120), rows, chart: !data.final, at: new Date().toLocaleTimeString() } });
            window.dispatchEvent(new CustomEvent("samm-report-updated", { detail: { report: r.report } })); setNote("Added to the report."); if (onAdded) onAdded();
          } catch (e) { setErr(e); }
        };
        const totalCols = data && !data.final && data.rows[0] ? Object.keys(data.rows[0]).filter((k) => k.indexOf("total_") === 0) : [];
        return (
          <div data-testid="drill-view" className="border border-[#2c385d] rounded-2xl p-4 bg-white/5 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div className="text-sm font-bold text-white">Drill down · {name}</div>
              <button onClick={onClose} className="text-xs border border-[#3D3D3D] hover:border-amber-500 text-white px-2 py-1 rounded">Close ✕</button>
            </div>

              {crumbs.map((c) => (
                <span key={c.i} className="flex items-center gap-1">

                    : <span className={data && c.i === data.depth ? "text-white font-bold" : "text-[#78869b]"}>{c.label}</span>}

              ))}
