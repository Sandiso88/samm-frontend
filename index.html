                    {totalCols.map((c) => <th key={c} className="text-right text-amber-400 px-2 py-1 sticky top-0 bg-[#1D1D1D] whitespace-nowrap">{c.replace("total_", "Total ")}</th>)}</tr></thead>
                  <tbody>{data.rows.map((r, i) => (
                    <tr key={i} data-testid="drill-row" onClick={() => r.key && load(stack.concat([{ key: r.key, label: r.label }]))} className={"border-t border-[#2D2D2D] " + (r.key ? "cursor-pointer hover:bg-white/5" : "opacity-70")}>
                      <td className="px-2 py-1 text-white">{r.key ? (r.label || r.key) : "(no match)"} {r.key && <span className="text-[#78869b]">›</span>}</td>
                      <td className="px-2 py-1 text-right">{nf(r.rows)}</td>
                      {totalCols.map((c) => <td key={c} className="px-2 py-1 text-right">{nf(r[c])}</td>)}
                    </tr>))}</tbody>
                </table>
              </div>
            )}
            {data && data.final && <DataTable rows={data.rows} />}
            {data && data.rows.length === 0 && <div className="text-xs text-[#78869b]">Nothing at this level.</div>}
            <div className="flex flex-wrap items-center gap-3 text-xs">
              {reportId && data && <button data-testid="drill-add" onClick={addToReport} className="border border-[#8ef4b2]/60 text-[#8ef4b2] hover:bg-[#8ef4b2]/10 px-2 py-1 rounded">Add this view to the report</button>}
              {note && <span className="text-[#8ef4b2]">{note}</span>}
              <span className="text-[#78869b]">Totals come from the lowest table, so nothing is counted twice. Only approved links are used.</span>
            </div>
          </div>
        );
      }

      function LinkStats({ link }) {
        const st = link.stats; if (!st) return null;
        const pct = Math.round((st.match || 0) * 100);
        return (
          <div data-testid="link-stats" className="mt-2 text-[11px] space-y-1">
            <div className="flex flex-wrap gap-2">
              <span className={"px-2 py-0.5 rounded-full border " + (st.hint === "strong" ? "border-green-700 text-green-300" : st.hint === "check" ? "border-amber-600 text-amber-300" : "border-red-800 text-red-300")} data-testid="link-match">{pct}% match</span>
              <span className="px-2 py-0.5 rounded-full border border-[#3D3D3D] text-[#C0C0C0]" data-testid="link-relation">{st.relation}</span>
              <span className="text-[#A0A0A0]">{(st.shared || 0).toLocaleString()} shared value(s) · {(st.orphans_a || 0).toLocaleString()} only in the first · {(st.orphans_b || 0).toLocaleString()} only in the second</span>
            </div>
            {(st.warnings || []).map((w, i) => <div key={i} data-testid="link-warning" className="text-amber-200">⚠ {w}</div>)}
            {(link.orphan_sample || []).length > 0 && <div className="text-[#A0A0A0]">Values with no match, for example: {link.orphan_sample.join(", ")}</div>}
          </div>
        );
      }

      function LinksPanel({ api, role, tableLabel }) {
        const [open, setOpen] = useState(false);
        const [busy, setBusy] = useState("");
        const [err, setErr] = useState(null);
        const [data, setData] = useState(null);
        const [prog, setProg] = useState("");
        const [chain, setChain] = useState(null);       // { levels: [dataset], labels: [..] }
        const [hname, setHname] = useState("");
        const [drill, setDrill] = useState("");
        const label = (ds) => ((data && data.labels && data.labels[ds]) || String(ds).replace(/^silver_/, ""));
        const load = async () => {
          setBusy("load"); setErr(null);
          try {
            const r = await api({ action: "links_suggest" });
            const labels = {}; r.candidates.forEach((c) => { labels[c.a.dataset] = c.a_label; labels[c.b.dataset] = c.b_label; });
            setData({ ...r, labels });
          } catch (e) { setErr(e); } finally { setBusy(""); }
        };
        const merge = (link) => setData((d) => d ? { ...d, candidates: d.candidates.map((c) => c.id === link.id ? { ...c, status: link.status, stats: link.stats, orphan_sample: link.orphan_sample } : c), links: d.links.filter((l) => l.id !== link.id).concat([link]) } : d);
        const check = async (c) => {
          setBusy(c.id); setErr(null);
          try { const r = await api({ action: "links_check", a: c.a, b: c.b }); merge(r.link); } catch (e) { setErr(e); } finally { setBusy(""); }
        };
        const checkAll = async () => {
          const todo = (data.candidates || []).filter((c) => !c.stats);
          for (let i = 0; i < todo.length; i++) {
            setProg("Checking " + (i + 1) + " of " + todo.length + "...");
            try { const r = await api({ action: "links_check", a: todo[i].a, b: todo[i].b }); merge(r.link); } catch (e) { setErr(e); break; }
          }
          setProg("");
        };
        const decide = async (c, decision) => {
          setBusy(c.id); setErr(null);
          try { const r = await api({ action: "links_decide", id: c.id, decision });
            setData((d) => ({ ...d, candidates: d.candidates.map((x) => x.id === c.id ? { ...x, status: r.link.status } : x), links: d.links.map((l) => l.id === c.id ? r.link : l), hierarchies: r.hierarchies_removed ? (d.hierarchies || []).filter((h) => true) : d.hierarchies }));
            if (r.hierarchies_removed) load();
          } catch (e) { setErr(e); } finally { setBusy(""); }
        };
        const suggest = async () => {
          setBusy("chain"); setErr(null);
          try { const r = await api({ action: "drill_suggest" }); setChain(r.chains.length ? r.chains[0] : { levels: [], labels: [] }); setHname(r.chains.length ? r.chains[0].labels.join(" > ") : ""); } catch (e) { setErr(e); } finally { setBusy(""); }
        };
        const move = (i, d) => setChain((c) => { const L = c.levels.slice(), B = c.labels.slice(); const j = i + d; if (j < 0 || j >= L.length) return c; [L[i], L[j]] = [L[j], L[i]]; [B[i], B[j]] = [B[j], B[i]]; return { levels: L, labels: B }; });
        const save = async () => {
          setBusy("save"); setErr(null);
          try { const r = await api({ action: "drill_save", name: hname, levels: chain.levels }); setData((d) => ({ ...d, hierarchies: r.hierarchies })); setChain(null); } catch (e) { setErr(e); } finally { setBusy(""); }
        };
        const del = async (n) => { try { const r = await api({ action: "drill_delete", name: n }); setData((d) => ({ ...d, hierarchies: r.hierarchies })); } catch (e) { setErr(e); } };
        // system administrators only: is a table filed under the wrong client?
        const [mis, setMis] = useState({ ds: "", busy: false, msg: "", verdict: undefined, detail: null, flagged: false });
        const checkClient = async () => {
          setMis((m) => ({ ...m, busy: true, msg: "Comparing...", verdict: undefined, flagged: false })); setErr(null);
          try {
            const plan = await api({ action: "links_misfile_plan", dataset: mis.ds });
            let own = null; const others = {}; let n = 0; const total = plan.own.length + Object.values(plan.others).reduce((a, b) => a + b.length, 0);
            for (const pr of plan.own) { setMis((m) => ({ ...m, msg: "Comparing " + (++n) + " of " + total + "..." })); const r = await api({ action: "links_check", a: pr.a, b: pr.b }); own = Math.max(own || 0, r.link.stats.match_a); }
            for (const oc of Object.keys(plan.others)) for (const pr of plan.others[oc]) { setMis((m) => ({ ...m, msg: "Comparing " + (++n) + " of " + total + "..." })); const r = await api({ action: "links_probe", a: pr.a, b: pr.b, other: oc }); others[oc] = Math.max(others[oc] || 0, r.match_a); }
            const v = await api({ action: "links_misfile_verdict", own_best: own, other_best: others });
            setMis((m) => ({ ...m, busy: false, msg: "", verdict: v.verdict, detail: { own, others } }));
          } catch (e) { setErr(e); setMis((m) => ({ ...m, busy: false, msg: "" })); }
        };
        const flag = async () => { try { await api({ action: "links_misfile_flag", dataset: mis.ds, to: mis.verdict.client }); setMis((m) => ({ ...m, flagged: true })); } catch (e) { setErr(e); } };
        const canManage = ["engineer", "admin", "system_admin"].includes(role);
        if (!canManage) return null;
        const pctT = (x) => Math.round((x || 0) * 100) + "%";
        return (
          <div data-testid="links-panel" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 space-y-3">
            <div className="flex flex-wrap items-center justify-between gap-2">
              <div><h3 className="text-sm font-bold text-white">🔗 Tables that belong together</h3><p className="text-[11px] text-[#A0A0A0]">SAMM suggests links between this client's tables, checks them against the real values, and only links you approve are used for drill-down.</p></div>
              <button data-testid="links-open" onClick={() => { setOpen(!open); if (!open && !data) load(); }} className="border border-[#3D3D3D] hover:border-amber-500 text-white text-xs px-3 py-1.5 rounded-lg">{open ? "Hide" : "Find links"}</button>
            </div>
            <ErrBox err={err} />
            {open && busy === "load" && <div className="text-xs text-[#A0A0A0]">Looking at the columns...</div>}
            {open && data && (
              <div className="space-y-3">
                {data.candidates.length === 0 && <div data-testid="links-none" className="text-xs text-[#A0A0A0]">No likely links found. Link finding needs at least two tables with key-like columns such as a code or id.</div>}
                {data.candidates.length > 0 && (
                  <div className="flex flex-wrap items-center gap-3 text-xs">
                    <button data-testid="links-check-all" onClick={checkAll} disabled={!!prog || data.candidates.every((c) => c.stats)} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md disabled:opacity-50">Check all</button>
                    {prog && <span data-testid="links-progress" className="text-amber-300">{prog}</span>}
                  </div>
                )}
                {data.candidates.map((c) => {
                  const link = (data.links || []).find((l) => l.id === c.id) || c;
                  return (
                    <div key={c.id} data-testid="link-row" className="border border-[#2D2D2D] rounded-lg p-3 bg-[#1B1B1B]">
                      <div className="flex flex-wrap items-center gap-2 text-xs">
                        <span className="text-white font-semibold">{c.a_label}<span className="text-amber-300 font-mono"> · {c.a.column}</span></span>
                        <span className="text-[#78869b]">↔</span>
                        <span className="text-white font-semibold">{c.b_label}<span className="text-amber-300 font-mono"> · {c.b.column}</span></span>
                        <span data-testid="link-status" className={"ml-auto px-2 py-0.5 rounded-full border text-[10px] " + (c.status === "approved" ? "border-green-700 text-green-300" : c.status === "rejected" ? "border-red-800 text-red-300" : "border-[#3D3D3D] text-[#A0A0A0]")}>{c.status === "new" ? "not checked" : c.status}</span>
                      </div>
                      <LinkStats link={{ ...link, stats: c.stats || link.stats }} />
                      <div className="flex gap-2 mt-2 text-xs">
                        <button data-testid="link-check" disabled={busy === c.id} onClick={() => check(c)} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-2 py-1 rounded disabled:opacity-50">{c.stats ? "Check again" : "Check"}</button>
                        {c.stats && c.status !== "approved" && <button data-testid="link-approve" disabled={busy === c.id} onClick={() => decide(c, "approve")} className="border border-green-700 text-green-300 hover:bg-green-900/30 px-2 py-1 rounded disabled:opacity-50">Approve</button>}
                        {c.stats && c.status !== "rejected" && <button data-testid="link-reject" disabled={busy === c.id} onClick={() => decide(c, "reject")} className="border border-red-800 text-red-300 hover:bg-red-900/30 px-2 py-1 rounded disabled:opacity-50">Reject</button>}
                      </div>
                    </div>
                  );
                })}
                <div className="border-t border-[#2D2D2D] pt-3 space-y-2" data-testid="drill-setup">
                  <div className="text-xs font-bold text-white">Drill-down levels</div>
                  {(data.hierarchies || []).map((h) => (
                    <div key={h.name} data-testid="drill-saved" className="flex flex-wrap items-center gap-3 text-xs">
                      <span className="text-white font-semibold">{h.name}</span><span className="text-[#A0A0A0]">{(h.labels || h.levels).join(" › ")}</span>
                      <button data-testid="drill-open" onClick={() => setDrill(h.name)} className="underline text-amber-400">Open</button>
                      <button onClick={() => del(h.name)} className="underline text-[#A0A0A0]">Delete</button>
                    </div>
                  ))}
                  <button data-testid="drill-suggest" onClick={suggest} disabled={busy === "chain"} className="border border-[#3D3D3D] hover:border-amber-500 text-white text-xs px-3 py-1 rounded-md disabled:opacity-50">Suggest levels from approved links</button>
                  {chain && chain.levels.length === 0 && <div data-testid="drill-none" className="text-xs text-amber-200">No chain yet. Approve at least one link where one table is the parent of another (for example Property and Site).</div>}
                  {chain && chain.levels.length > 0 && (
                    <div className="border border-[#2D2D2D] rounded-lg p-3 bg-[#1B1B1B] space-y-2 text-xs">
                      {chain.levels.map((d, i) => (
                        <div key={d} data-testid="drill-level" className="flex items-center gap-2">
                          <span className="text-[#78869b] w-12">Level {i + 1}</span><span className="text-white font-semibold">{chain.labels[i]}</span>
                          <button aria-label="Move up" data-testid="level-up" onClick={() => move(i, -1)} disabled={i === 0} className="border border-[#3D3D3D] px-1.5 rounded disabled:opacity-30">↑</button>
                          <button aria-label="Move down" data-testid="level-down" onClick={() => move(i, 1)} disabled={i === chain.levels.length - 1} className="border border-[#3D3D3D] px-1.5 rounded disabled:opacity-30">↓</button>
                        </div>
                      ))}
                      <div className="flex gap-2"><input aria-label="Drill-down name" value={hname} onChange={(e) => setHname(e.target.value)} maxLength={60} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white w-64" /><button data-testid="drill-save" onClick={save} disabled={busy === "save" || !hname.trim()} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1 rounded-md disabled:opacity-50">Save drill-down</button></div>
                    </div>
                  )}
                </div>
                {role === "system_admin" && (
                  <div className="border-t border-[#2D2D2D] pt-3 space-y-2" data-testid="misfile-box">
                    <div className="text-xs font-bold text-white">Is a table filed under the wrong client? <span className="text-[#78869b] font-normal">(system administrators only)</span></div>
                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <select aria-label="Table to check" data-testid="misfile-select" value={mis.ds} onChange={(e) => setMis({ ds: e.target.value, busy: false, msg: "", verdict: undefined, detail: null, flagged: false })} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white">
                        <option value="">Choose a table</option>{(data.tables || []).map((d) => <option key={d} value={d}>{label(d)}</option>)}
                      </select>
                      <button data-testid="misfile-run" disabled={!mis.ds || mis.busy} onClick={checkClient} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md disabled:opacity-50">Check which client it belongs to</button>
                      {mis.msg && <span className="text-amber-300">{mis.msg}</span>}
                    </div>
                    {mis.verdict === null && mis.detail && <div data-testid="misfile-ok" className="text-xs text-green-300">No sign of a mix-up. It matches this client {mis.detail.own == null ? "(nothing to compare with yet)" : "at " + pctT(mis.detail.own)}{Object.keys(mis.detail.others).length ? "; the best match elsewhere is " + pctT(Math.max.apply(null, Object.values(mis.detail.others))) : ""}.</div>}
                    {mis.verdict && (
                      <div data-testid="misfile-warn" className="border border-amber-700 bg-[#2A2410] rounded-lg p-3 text-xs text-amber-100 space-y-2">
                        <div>⚠ This table may belong to <b>{mis.verdict.client}</b>. Its values match {mis.verdict.client} at {pctT(mis.verdict.match_other)} but this client at only {pctT(mis.verdict.match_own)}.</div>
                        {!mis.flagged ? <button data-testid="misfile-flag" onClick={flag} className="border border-amber-500 text-amber-200 hover:bg-amber-900/30 px-3 py-1 rounded">Record a move request to {mis.verdict.client}</button>
                          : <div data-testid="misfile-flagged" className="text-green-300">Recorded and logged. To finish the move: upload the original file under {mis.verdict.client} (Onboarding), then remove this copy.</div>}
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
            {drill && <DrillView api={api} name={drill} onClose={() => setDrill("")} />}
          </div>
        );
      }

      function OnboardingHub({ session, onAsk, onViewsChanged, clients, clientNames, acting }) {
        const [items, setItems] = useState([]);
        const [over, setOver] = useState(false);
        const [pipe, setPipe] = useState({ busy: false, msg: "", err: null });
        const [history, setHistory] = useState({ open: false, loading: false, list: [], limit: 10, client: null, err: null });
        const [order, setOrderState] = useState(() => { try { return localStorage.getItem("samm_hist_order") === "oldest" ? "oldest" : "newest"; } catch (_) { return "newest"; } });
        const setOrder = (o) => { setOrderState(o); try { localStorage.setItem("samm_hist_order", o); } catch (_) { /* optional */ } };
        const sortedHistory = history.list.slice().sort((a, b) => (String(a.created || "") < String(b.created || "") ? -1 : 1) * (order === "oldest" ? 1 : -1));
        const [viewsTick, setViewsTick] = useState(0);
        const [tab, setTab] = useState("upload");
        const seq = useRef(0);
        const itemsRef = useRef([]);
        itemsRef.current = items;
        const prevCount = useRef(0);
        useEffect(() => {   // a newly dropped file appears right under the toolbar: bring it into view
          if (items.length > prevCount.current) { const el = document.querySelector("[data-testid=onb-toolbar]"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start", behavior: "smooth" }); }
          prevCount.current = items.length;
        }, [items.length]);
        const api = (payload) => callBackend(session.url, session.token, payload);
        const [target, setTarget] = useState("");
        const nowClient = () => target || acting || window.__sammClient || window.__sammHome || undefined;
        // Each upload is tied to the client it was started under, so switching client never breaks a running job.
        const apiFor = (client) => (payload) => callBackend(session.url, session.token, client ? { ...payload, client } : payload);
        const upd = (id, patch) => setItems((p) => p.map((i) => (i.id === id ? { ...i, ...patch } : i)));
        const updDs = (id, ds, patch) =>
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { ...i.datasets[ds], ...patch } } } : i)));

        const loadHistory = async (limit) => {
          setHistory((h) => ({ ...h, open: true, loading: true, err: null, limit }));
          try {
            const r = await api({ action: "jobs", limit });
            setHistory((h) => ({ ...h, loading: false, list: Array.isArray(r.jobs) ? r.jobs : [], client: r.client || nowClient() || "" }));
          } catch (e) { setHistory((h) => ({ ...h, loading: false, err: e })); }
        };
        const mergeJob = (j) => setHistory((h) => ({ ...h, list: h.list.some((x) => x.id === j.id) ? h.list.map((x) => (x.id === j.id ? j : x)) : [j, ...h.list] }));
        const liveItem = (i) => (i.job ? ["queued", "running", "waiting"].includes(i.job.status) : (!i.done && !i.error && ["upload", "bronze"].includes(i.stage)));
        const anyLive = items.some(liveItem);
        const dismiss = (id) => setItems((p) => p.filter((i) => i.id !== id));

        const loadMapping = async (id, ds) => {
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { open: true } } } : i)));
        };

        const runFile = async (id, file, client) => {
          const api = apiFor(client);
          try {
            upd(id, { stage: "upload", msg: "Requesting a secure upload link..." });
            const init = await api({ action: "upload_init", filename: file.name, size: file.size });
            upd(id, { msg: "Uploading to Bronze..." });
            await putFile(init.upload_url, file, (pct) => upd(id, { uploadPct: pct, msg: "Uploading to Bronze... " + pct + "%" }));
            upd(id, { stage: "bronze", msg: "Stored in Bronze. SAMM takes it from here..." });
            let started = null;
            try { started = await api({ action: "job_start", key: init.key }); } catch (e) {
              if (!(e && e.status === 400 && /unknown action/i.test(e.message || ""))) throw e;   // older back end: use the step-by-step flow below
            }
            if (started && started.job) { upd(id, { stage: "silver", msg: "", job: started.job }); return; }
            const ing = await api({ action: "ingest", key: init.key });
            if (ing.mode === "archived") {
              upd(id, { stage: "done", msg: ing.note, done: true });
              return;
            }
            let names = [];
            if (ing.mode === "done") {
              names = ing.datasets.map((d) => d.dataset);
            } else {
              upd(id, { stage: "silver", msg: ing.note + " Waiting for it to finish (up to 2 minutes)..." });
              for (let n = 0; n < 24 && names.length === 0; n++) {
                await sleep(5000);
                const r = await api({ action: "datasets", since: ing.since });
                names = r.datasets.map((d) => d.dataset);
              }
              if (names.length === 0) {
                throw new ApiError("The orchestrator has not produced any dataset yet.", [
                  "It may still be running: use 'Check for new datasets' below in a minute.",
                  "Check the CloudWatch logs of shiftleft-superposition-pipeline-orchestrator for errors.",
                ], 0);
              }
            }
            upd(id, { stage: "map", msg: "Reading columns and suggesting field mappings...", order: names, datasets: {} });
            for (const ds of names) await loadMapping(id, ds);
            upd(id, { msg: "Review the suggested mapping, then build the Gold view." });
          } catch (err) {
            upd(id, { error: err, msg: "Stopped." });
          }
        };

        const addFiles = (fileList) => {
          Array.from(fileList || []).forEach((file) => {
            const id = "f" + ++seq.current;
            setItems((p) => [{ id, client: nowClient(), name: file.name, size: file.size, stage: "upload", msg: "Queued", datasets: {}, order: [], error: null, done: false }, ...p]);
            runFile(id, file, nowClient());
          });
        };

        const runPipeline = async () => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "run_pipeline" });
            setPipe({ busy: false, msg: "Pipeline started (" + r.function + "). Files already in Bronze are being converted. Click 'Check for new datasets' in a minute.", err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const checkNew = async (all) => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "datasets" });
            const fresh = all === true ? r.datasets : r.datasets.filter((d) => !d.view);
            if (fresh.length === 0) {
              setPipe({ busy: false, msg: all === true ? "No datasets found yet." : "No datasets are waiting for a Gold view.", err: null });
              return;
            }
            const id = "f" + ++seq.current;
            const order = fresh.map((d) => d.dataset);
            setItems((p) => [{ id, client: nowClient(), name: "Datasets already in Silver", size: 0, stage: "map", msg: "Review the mapping, then build (or rebuild) the Gold view.", datasets: {}, order, error: null, done: false }, ...p]);
            for (const ds of order) await loadMapping(id, ds);
            setPipe({ busy: false, msg: order.length + (all === true ? " dataset(s) loaded." : " dataset(s) found without a Gold view."), err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const badge = (st) => {
          const c = { auto: "bg-green-900 text-green-200", review: "bg-amber-900 text-amber-200", saved: "bg-blue-900 text-blue-200", new: "bg-[#333] text-[#BBB]", duplicate: "bg-[#333] text-[#BBB]", skip: "bg-[#333] text-[#777]" }[st] || "bg-[#333] text-[#BBB]";
          return <span className={"px-2 py-0.5 rounded text-[10px] font-mono " + c}>{st}</span>;
        };

        return (
          <div className="max-w-4xl mx-auto space-y-5" data-testid="onboarding-hub">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-4">
              <div>
                <h2 className="text-lg font-bold text-white">📦 Onboarding</h2>
                <p className="text-xs text-[#A0A0A0] mt-1">Drop a file and SAMM keeps the original (Bronze), turns it into rows and columns (Silver), suggests how its columns match your standard names, and builds a view you can ask questions about (Gold). csv, tsv, json, jsonl, txt and Excel are structured; other formats are archived untouched.</p>
              </div>
              <div data-testid="onb-tabs" role="tablist" className="flex flex-wrap gap-2 border-b border-[#2D2D2D] pb-3">
                {[["upload", "⬆ Upload", "Drop a file and watch it move through"], ["bronze", "Bronze", "The original files, exactly as uploaded"], ["silver", "Silver", "Converted tables"], ["gold", "Gold views", "Ready to use: ask questions, publish reports"], ["links", "Links & drill-down", "Tables that belong together"], ["tools", "Tools", "Teach SAMM and self-test"]].map(([id, label, tip]) => (
                  <button key={id} role="tab" aria-selected={tab === id} title={tip} data-testid={"onb-tab-" + id} onClick={() => { setTab(id); if (id === "bronze" && !history.open) loadHistory(history.limit); }}
                    className={"px-3 py-1.5 rounded-lg text-xs font-semibold border transition " + (tab === id ? "border-amber-500 bg-amber-500/10 text-amber-300" : "border-[#3D3D3D] text-[#C0C0C0] hover:border-amber-600 hover:text-white")}>{label}</button>
                ))}
              </div>
              {tab === "upload" && (<>
              {(clients || []).length > 1 && (
                <label className="flex flex-wrap items-center gap-2 text-xs text-[#C0C0C0]">Which client is this data for?

                    {clients.map((c) => <option key={c} value={c}>{(clientNames || {})[c] || c}</option>)}
                  </select>

              <label
                htmlFor="onb-file"
                onDragOver={(e) => { e.preventDefault(); setOver(true); }}
