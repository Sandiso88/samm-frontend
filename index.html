                  <select aria-label="User role" value={form.role} onChange={(e) => setForm({ ...form, role: e.target.value })} className={inp}>
                    {roles.map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                  </select>
                </label>
                {isSys && (
                  <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Client
                    <input aria-label="User client" list="gov-tenants" value={form.tenant_id} onChange={(e) => setForm({ ...form, tenant_id: e.target.value })} className={inp + " w-32"} placeholder={identity.tenant_id} />
                    <datalist id="gov-tenants">{tenants.map((t) => <option key={t} value={t} />)}</datalist>
                  </label>
                )}
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Expires (days)
                  <input aria-label="Expiry days" type="number" min="1" max="730" value={form.expires_days} onChange={(e) => setForm({ ...form, expires_days: e.target.value })} className={inp + " w-24"} placeholder="never" />
                </label>
                <button type="submit" disabled={busy} className={btn}>Create user</button>
              </form>
              <p className="text-[10px] text-[#707070]">{ROLE_HELP[form.role]}</p>
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Users ({rows.length})</h3>
              {!data && !err && <div className="text-xs text-[#A0A0A0]">Loading...</div>}
              <div className="space-y-2">
                {rows.map((u) => (
                  <div key={u.email + u.tenant_id} data-testid="user-row" className="bg-[#151515] border border-[#2D2D2D] rounded-md p-3 flex flex-wrap gap-2 items-center text-xs font-mono">
                    <div className="flex-1 min-w-[12rem]">
                      <div className="text-white truncate">{u.email}</div>
                      <div className="text-[#707070]">{u.tenant_id}{u.expires_at ? " | expires " + u.expires_at.slice(0, 10) : ""}{u.status === "disabled" ? " | DISABLED" : ""}</div>
                    </div>
                    <select aria-label={"Role for " + u.email} value={u.role} disabled={busy || u.email === identity.email || !roles.includes(u.role)} onChange={(e) => save({ email: u.email, tenant_id: u.tenant_id, role: e.target.value })} className={inp}>
                      {ROLES_ORDER.map((r) => <option key={r} value={r} disabled={!roles.includes(r)}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <button disabled={busy || u.email === identity.email} onClick={() => save({ email: u.email, tenant_id: u.tenant_id, status: u.status === "disabled" ? "active" : "disabled" })} className={link}>{u.status === "disabled" ? "Enable" : "Disable"}</button>
                    <button disabled={busy} onClick={() => { if (window.confirm("Issue a new token for " + u.email + "? The old token stops working.")) save({ email: u.email, tenant_id: u.tenant_id, reset_token: true, expires_days: u.expires_at ? 90 : undefined }); }} className={link}>Reset token</button>
                  </div>
                ))}
                {data && rows.length === 0 && <div className="text-xs text-[#A0A0A0]">No managed users yet. Create the first one above.</div>}
              </div>
              {boot.length > 0 && (
                <div className="pt-2 border-t border-[#2D2D2D]">
                  <div className="text-[10px] text-[#707070] mb-1">Break-glass tokens (set in the Lambda environment, not editable here)</div>
                  {boot.map((b, i) => <div key={i} className="text-xs font-mono text-[#A0A0A0]">{b.email} | {ROLE_LABELS[b.role] || b.role} | {b.tenant_id}</div>)}
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <div className="flex items-center gap-3">
                <h3 className="text-sm font-bold text-white">Client policy</h3>
                {isSys && (
                  <>
                    <input aria-label="Policy client" list="gov-tenants" value={policyTenant} onChange={(e) => setPolicyTenant(e.target.value)} className={inp + " w-36"} />
                  </>
                )}
                {!isSys && <span className="text-xs font-mono text-[#A0A0A0]">{policyTenant}</span>}
              </div>
              {pol && (
                <div className="space-y-3 text-xs">
                  <label className="flex flex-col gap-1 text-[#A0A0A0]">Hidden columns (comma separated, hidden from Viewer and Data Analyst)
                    <input aria-label="Restricted columns" value={pol.restricted} onChange={(e) => setPol({ ...pol, restricted: e.target.value })} className={inp} placeholder="salary, id_number" />
                    {pol.meta.platform_restricted.length > 0 && <span className="text-[10px] text-[#707070]">Always hidden platform-wide: {pol.meta.platform_restricted.join(", ")}</span>}
                  </label>
                  <div className="grid grid-cols-5 gap-2">
                    {ROLES_ORDER.map((r) => (
                      <label key={r} className="flex flex-col gap-1 text-[10px] text-[#A0A0A0]">{ROLE_LABELS[r]} rows
                        <input aria-label={"Row cap " + r} type="number" min="1" max={pol.meta.hard_max_rows} value={pol.caps[r] == null ? "" : pol.caps[r]} onChange={(e) => setPol({ ...pol, caps: { ...pol.caps, [r]: e.target.value } })} className={inp} placeholder={String(pol.meta.default_row_caps[r])} />
                      </label>
                    ))}
                  </div>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Scan limit per question (GB)
                    <input aria-label="Scan limit" type="number" step="0.01" value={pol.scan} onChange={(e) => setPol({ ...pol, scan: e.target.value })} className={inp} placeholder={"platform " + pol.meta.platform_scan_limit_gb} />
                    <span className="text-[10px] text-[#707070]">Can only be lower than the platform limit ({pol.meta.platform_scan_limit_gb} GB). A lower limit is checked after the query; the platform limit is the hard stop.</span>
                  </label>
                  <label className="flex items-center gap-2 text-[#A0A0A0]">
                    <input aria-label="Personal data scan" type="checkbox" checked={!!pol.pii} onChange={(e) => setPol({ ...pol, pii: e.target.checked })} />
                    Scan new files for personal data (names, emails, phone numbers) when mapping
                    <span className="text-[10px] text-[#707070]">Uses Amazon Comprehend (about $0.0001 per 100 characters scanned, a few text columns per file). It only suggests restricting a column; it never restricts one by itself.</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">How new files are mapped
                    <select aria-label="Mapping mode" value={pol.mode} onChange={(e) => setPol({ ...pol, mode: e.target.value })} className={inp}>
                      <option value="">Review first (default)</option>
                      <option value="review">Review first</option>
                      <option value="auto">Auto: build straight away</option>
                    </select>
                    <span className="text-[10px] text-[#707070]">Review first: SAMM suggests the mapping and rules, and an engineer approves before the Gold view is built. Auto: SAMM builds at once using only technical rules; business rules still wait for approval.</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Auto-approve field mappings at or above (%)
                    <input aria-label="Auto-approve level" type="number" min="50" max="100" value={pol.auto} onChange={(e) => setPol({ ...pol, auto: e.target.value })} className={inp} placeholder="90 (default)" />
                    <span className="text-[10px] text-[#707070]">When a file arrives, SAMM maps fields it is at least this sure about on its own. Anything lower waits for a Data Engineer. Fields a person approved before are reused.</span>
                  </label>
                  <div className="flex items-center gap-3">
                    <button onClick={savePolicy} disabled={busy} className={btn}>Save policy</button>
                    {polMsg && <span data-testid="policy-saved" className="text-green-400">{polMsg}</span>}
                  </div>
                </div>
              )}
            </div>
            {isSys && <UnassignedPanel api={api} tenants={tenants} />}
          </div>
        );
      }
      const ROLES_ORDER = ["viewer", "analyst", "engineer", "admin", "system_admin"];

      // ------------------------------------------------------------------
      // Main app
      // ------------------------------------------------------------------
      function SammConsole({ session, demo, onSignOut }) {
        const identity = demo ? DEMO_IDENTITY : session.identity;
        const [previewRole, setPreviewRole] = useState(demo ? "admin" : null);
        const role = demo ? previewRole : identity.role;

        const nextId = useRef(0);
        const stamp = () => new Date().toLocaleTimeString();
        const [messages, setMessages] = useState([
          {
            id: "init",
            role: "assistant",
            text: demo
              ? "Welcome to the SAMM Core Engine Console (DEMO MODE). Replies are simulated and nothing is sent to your lakehouse."
              : "Welcome to the SAMM Core Engine Console. Ask a natural language question to compile secure SQL against the Gold layer. Ask for Power BI or Sisense output to get DAX or JSON in the side panel.",
            timestamp: "System Ready",
          },
        ]);
        const [artifacts, setArtifacts] = useState([]);
        const [panelOpen, setPanelOpen] = useState(false);
        const [activeArtifact, setActiveArtifact] = useState(null);

        const [input, setInput] = useState("");
        const [persona, setPersona] = useState("architect");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");
        const [views, setViews] = useState([]);
        const [defaultView, setDefaultView] = useState("");
        const [activeView, setActiveView] = useState("");
        const loadViews = async () => {
          if (demo) return;
          try {
            const r = await callBackend(session.url, session.token, { action: "views" });
            setViews(r.views || []);
            setDefaultView(r.default || "");
          } catch (_) {
            /* older backend without datasets: the chat still works on the default view */
          }
        };
        useEffect(() => { loadViews(); }, []);

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current && messagesEndRef.current.scrollIntoView) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const canOnboard = CAN_ONBOARD.includes(role);
        const canGovern = CAN_GOVERN.includes(role);
        useEffect(() => {
          if (activeTab === "onboarding" && !canOnboard) setActiveTab("chat");
          if (activeTab === "governance" && !canGovern) setActiveTab("chat");
        }, [role]);

        const addMessage = (m) => setMessages((prev) => [...prev, { id: "m" + ++nextId.current, timestamp: stamp(), ...m }]);

        const registerArtifacts = (msgId, text, sql) => {
          const created = [];
          splitBlocks(text).forEach((p) => {
            if (p.type === "code") {
              created.push({ id: msgId + "-a" + created.length, lang: p.lang, title: p.lang.toUpperCase(), code: p.code });
            }
          });
          const list = [...created];
          let sqlArt = null;
          if (sql) {
            sqlArt = { id: msgId + "-sql", lang: "sql", title: "SQL (executed)", code: sql };
            list.push(sqlArt);
          }
          setArtifacts((prev) => [...prev, ...list]);
          // Open the panel automatically for BI output (DAX/JSON), not for plain SQL.
          if (created.length > 0) {
            setActiveArtifact(created[0].id);
            setPanelOpen(true);
          }
          return { inline: created, sqlArt };
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          return sendText(input.trim());
        };

        const sendText = async (userText) => {
          if (!userText || isLoading) return;
          addMessage({ role: "user", text: userText });
          setInput("");
          setIsLoading(true);
          try {
            let d;
            if (demo) {
              await sleep(700);
              d = demoQuery(userText);
            } else {
              // Note: no role and no tenant are sent. The server derives both from the token.
              d = await callBackend(session.url, session.token, { action: "query", prompt: userText, previous: (() => { const u = messages.filter((x) => x.role === "user"); return u.length ? String(u[u.length - 1].text).slice(0, 500) : undefined; })(), persona, view: activeView && activeView !== defaultView ? activeView : undefined });
            }
            const msgId = "r" + ++nextId.current;
            if (d.routed_view && d.view) setActiveView(d.view);   // the question named a dataset: stay on it for follow-ups
            const { inline, sqlArt } = registerArtifacts(msgId, d.report_markdown, d.executed_sql);
            setMessages((prev) => [
              ...prev,
              {
                id: msgId,
                role: "assistant",
                text: d.report_markdown || "",
                rows: d.raw_data_grid,
                artifacts: inline,
                sqlArtifact: sqlArt,
                meta: { role: d.role, tenant: d.tenant_id, cap: d.row_cap, truncated: d.truncated, finops: d.finops },
                suggestions: Array.isArray(d.suggestions) ? d.suggestions.slice(0, 5) : [],
                diagnostic: d.diagnostic || "",
                simulated: demo,
                timestamp: stamp(),
              },
            ]);
          } catch (err) {
            addMessage({
              role: "assistant",
              error: { message: err.message || String(err), details: err.details || [], status: err.status || 0 },
            });
          } finally {
            setIsLoading(false);
          }
        };

        const handlePipelineTrigger = async () => {
          setFormError("");
          if (!/^s3:\/\/[^/\s]+\/\S+/.test(s3Path.trim())) {
            setFormError("Source path must look like s3://bucket/key.");
            return;
          }
          try {
            JSON.parse(contextPayload);
          } catch (_) {
            setFormError("Context payload is not valid JSON.");
            return;
          }
          setIsLoading(true);
          await sleep(600);
          // The ingestion endpoint is not connected yet, so this is always a simulation.
          addMessage({
            role: "assistant",
            simulated: true,
            text: "Simulated ingestion request\nTarget handler: shiftleft-superposition-pipeline-orchestrator\nAsset: " + s3Path.trim() + "\n\nNo request was sent: the ingestion endpoint is not connected to this page yet.",
          });
          setActiveTab("chat");
          setIsLoading(false);
        };

        const openArtifact = (id) => {
          setActiveArtifact(id);
          setPanelOpen(true);
        };

        const navClass = (tab, disabled) =>
          "w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition " +
          (activeTab === tab
            ? "bg-[#2D2D2D] text-white border-l-4 border-amber-500"
            : disabled
            ? "text-[#555555] cursor-not-allowed"
            : "text-[#A0A0A0] hover:bg-[#252525] hover:text-white");

        return (
          <div className="flex h-screen bg-[#191919] text-[#E3E3E3] font-sans overflow-hidden w-full">
            {/* LEFT SIDEBAR PANEL */}
            <div className="w-64 bg-[#202020] border-r border-[#2D2D2D] flex flex-col justify-between flex-shrink-0">
              <div>
                <div className="p-5 flex items-center space-x-3 border-b border-[#2D2D2D]">
                  <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                  <div>
                    <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                    <p className="text-[10px] text-amber-500 font-mono">Serverless Core v2.5</p>
                  </div>
                </div>
                <nav className="p-4 space-y-2">
                  <button onClick={() => setActiveTab("chat")} className={navClass("chat", false)}>
                    <span>💬 Cognitive Chat</span>
                  </button>
                  <button
                    onClick={() => canOnboard && setActiveTab("onboarding")}
                    disabled={!canOnboard}
                    title={canOnboard ? "" : "Requires Data Engineer or above"}
                    className={navClass("onboarding", !canOnboard)}
                  >
                    <span>📦 Data Onboarding</span>
                  </button>
                  <button
                    onClick={() => canGovern && setActiveTab("governance")}
                    disabled={!canGovern}
                    title={canGovern ? "" : "Requires a Client or System Administrator"}
                    className={navClass("governance", !canGovern)}
                  >
                    <span>🛡️ Governance</span>
                  </button>
                </nav>
              </div>
              <div className="p-4 border-t border-[#2D2D2D] bg-[#1E1E1E]">
                <div className="text-xs text-[#A0A0A0] mb-2"><span>🛡️ Identity Firewall</span></div>
                {demo ? (
                  <>
                    <select
                      aria-label="Preview role"
                      value={previewRole}
                      onChange={(e) => setPreviewRole(e.target.value)}
                      className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                    >
                      {Object.keys(ROLE_LABELS).map((r) => <option key={r} value={r}>{ROLE_LABELS[r]}</option>)}
                    </select>
                    <p className="text-[10px] text-[#707070] mt-2 leading-snug">Demo preview only. In live mode your role comes from the server.</p>
                  </>
                ) : (
                  <div className="text-xs font-mono space-y-1">
                    <div data-testid="who-role" className="text-white">{ROLE_LABELS[identity.role] || identity.role}</div>
                    <div className="text-[#A0A0A0] truncate" title={identity.email}>{identity.email}</div>
                    <div className="text-[#A0A0A0] truncate" title={identity.tenant_id}>{identity.all_clients ? "All clients (home: " + identity.tenant_id + ")" : "Client: " + identity.tenant_id}</div>
                    <div data-testid="who-version" className="text-[#707070]">Server {identity.version || "older than v15 - redeploy the backend"} · Screen v15</div>
                    <button onClick={onSignOut} className="mt-2 text-[#A0A0A0] hover:text-white underline">Sign out</button>
                  </div>
                )}
                {demo && <button onClick={onSignOut} className="mt-2 text-xs text-[#A0A0A0] hover:text-white underline">Exit demo</button>}
              </div>
            </div>

            {/* CENTRAL INTERACTIVE CHAT ENGINE FEED */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#191919]">
              <header className="h-16 border-b border-[#2D2D2D] px-6 flex items-center justify-between bg-[#1A1A1A]">
                <div className="flex items-center space-x-3">
                  <span className="text-xs uppercase bg-[#2D2D2D] text-amber-500 font-mono px-2.5 py-1 rounded border border-[#3D3D3D]">Active Console Context</span>
                  {demo && <SimBadge>Demo mode: simulated</SimBadge>}
                </div>
                <div className="flex items-center space-x-4 text-xs font-mono text-[#A0A0A0]">
                  <span>👤 {String(role).toUpperCase()}</span>
                  {!demo && views.length > 1 && (
                    <label className="flex items-center space-x-1">
                      <span>📚</span>
                      <select
                        aria-label="Dataset"
                        data-testid="dataset-select"
                        value={activeView || defaultView}
                        onChange={(e) => setActiveView(e.target.value)}
                        className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-xs text-white font-mono max-w-[220px] focus:outline-none focus:border-amber-500"
                      >
                        {views.map((v) => <option key={v.name} value={v.name}>{v.name.replace(/^gold_ai_/, "")}</option>)}
                      </select>
                    </label>
                  )}
                  <span>💾 Workgroup: shiftleft-superposition</span>
                  <button
                    onClick={() => setPanelOpen((o) => !o)}
                    data-testid="panel-toggle"
                    className="border border-[#3D3D3D] rounded px-2 py-1 hover:text-white hover:border-amber-500"
                  >
                    📄 Artifacts {artifacts.length > 0 ? "(" + artifacts.length + ")" : ""}
                  </button>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {activeTab === "chat" && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={"flex " + (msg.role === "user" ? "justify-end" : "justify-start")}>
                        <div className={"max-w-[85%] rounded-xl p-5 shadow-lg " + (msg.role === "user" ? "bg-amber-600 text-white" : "bg-[#222222] border border-[#2D2D2D] text-[#E3E3E3]")}>
                          <div className="text-xs font-mono text-[#A0A0A0] mb-2 flex justify-between items-center space-x-6">
                            <span className="font-bold text-amber-500">{msg.role === "user" ? "USER TRANSACTION" : "SAMM AI ENGINE"}</span>
                            <span>{msg.simulated ? "SIMULATED · " : ""}{msg.timestamp}</span>
                          </div>
                          {msg.error ? (
                            <ErrorCard message={msg.error.message} details={msg.error.details} status={msg.error.status} />
                          ) : (
                            <MessageBody msg={msg} onOpenArtifact={openArtifact} />
                          )}
                          {msg.sqlArtifact && (
                            <button
                              onClick={() => openArtifact(msg.sqlArtifact.id)}
                              data-testid="sql-chip"
                              className="mt-3 text-xs font-mono text-amber-500 hover:text-amber-400 underline"
                            >
                              Show executed SQL
                            </button>
                          )}
                          <ResultTable rows={msg.rows} />
                          {msg.suggestions && msg.suggestions.length > 0 && msg === messages[messages.length - 1] && (
                            <div className="flex flex-wrap gap-2 mt-3" data-testid="suggestions">
                              {msg.suggestions.map((sg) => (
                                <button key={sg} data-testid="suggestion" disabled={isLoading} onClick={() => sendText(sg)}
                                  className="text-xs border border-[#3D3D3D] hover:border-amber-500 text-[#D0D0D0] px-3 py-1.5 rounded-full disabled:opacity-50">{sg}</button>
                              ))}
                            </div>
                          )}
                          {msg.diagnostic && (
                            <div data-testid="diagnostic" className="text-[10px] text-amber-400/80 mt-2 font-mono">Engineer note: {msg.diagnostic}</div>
                          )}
                          {msg.meta && (
                            <div className="text-[10px] text-[#707070] mt-2 font-mono">
                              role {msg.meta.role} · tenant {msg.meta.tenant} · row cap {msg.meta.cap}{msg.meta.truncated ? " · results truncated at the cap" : ""}
                              {msg.meta.finops && (" · scanned " + fmtBytes(msg.meta.finops.scanned_bytes) + " of " + fmtBytes(msg.meta.finops.ceiling_bytes) + " limit · est. $" + msg.meta.finops.est_cost_usd.toFixed(5))}
                            </div>
                          )}
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-4 flex items-center space-x-3">
                          <span className="text-xs font-mono text-[#A0A0A0] animate-pulse">⚙️ Compiling Bedrock pipeline...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                )}

                {activeTab === "onboarding" && !demo && (
                  <OnboardingHub
                    session={session}
                    onViewsChanged={loadViews}
                    onAsk={(v) => {
                      loadViews();
                      setActiveView(v);
                      setActiveTab("chat");
                      addMessage({ role: "assistant", text: "Now answering from the dataset **" + v.replace(/^gold_ai_/, "") + "**. Ask a question, for example: How many records are there?" });
                    }}
                  />
                )}

                {activeTab === "onboarding" && demo && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <div className="mt-2"><SimBadge>Simulated: ingestion endpoint not connected</SimBadge></div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className="block text-xs font-mono text-[#A0A0A0] mb-1">Source file (S3 path)</label>
                        <input
                          id="s3path"
                          value={s3Path}
                          onChange={(e) => setS3Path(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label htmlFor="ctx" className="block text-xs font-mono text-[#A0A0A0] mb-1">Context payload (JSON)</label>
                        <textarea
                          id="ctx"
                          rows={4}
                          value={contextPayload}
                          onChange={(e) => setContextPayload(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      {formError && <div className="text-xs text-red-400 font-mono">{formError}</div>}
                      <button
                        onClick={handlePipelineTrigger}
                        disabled={isLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
                      >
                        Trigger Pipeline Ingestion (simulated)
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === "governance" && (
                  demo ? (
                    <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
                      <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
                      <SimBadge>Demo mode: sign in with an administrator token to manage users and policy</SimBadge>
                    </div>
                  ) : (
                    <GovernanceHub session={session} identity={identity} />
                  )
                )}
              </div>

              {activeTab === "chat" && (
                <form onSubmit={handleSendMessage} className="border-t border-[#2D2D2D] bg-[#1A1A1A] p-4">
                  <div className="max-w-4xl mx-auto flex space-x-3">
                    <select
                      aria-label="Persona"
                      value={persona}
                      onChange={(e) => setPersona(e.target.value)}
                      className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg px-2 text-xs text-white font-mono focus:outline-none focus:border-amber-500"
                    >
                      {PERSONAS.map((p) => <option key={p.value} value={p.value}>{p.label}</option>)}
                    </select>
                    <input
                      aria-label="Ask a question"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      disabled={isLoading}
                      placeholder="Ask a question about your Gold data..."
                      className="flex-1 bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 disabled:opacity-50"
                    />
                    <button
                      type="submit"
                      disabled={isLoading || !input.trim()}
                      className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-6 rounded-lg transition"
                    >
                      Send
                    </button>
                  </div>
                </form>
              )}
            </div>

            {/* RIGHT-HAND ARTIFACT PANEL */}
            <ArtifactPanel
              open={panelOpen}
              artifacts={artifacts}
              activeId={activeArtifact}
              onSelect={setActiveArtifact}
              onClose={() => setPanelOpen(false)}
            />
          </div>
        );
      }

      function App() {
        const [session, setSession] = useState(null);
        const [demo, setDemo] = useState(FORCE_DEMO);
        if (demo) return <SammConsole demo={true} onSignOut={() => setDemo(false)} />;
        if (!session) {
          return <SignIn defaultUrl={API_URL} onSignedIn={setSession} onDemo={() => setDemo(true)} />;
        }
        return <SammConsole session={session} demo={false} onSignOut={() => setSession(null)} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
