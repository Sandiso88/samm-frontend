<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAMM Core AI Platform</title>
    <!-- React 18 UMD (pinned), in-browser Babel (pinned), Tailwind CDN (pinned) -->
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>
  <body style="margin:0;background:#191919;color:#E3E3E3;font-family:system-ui,sans-serif;">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG: set API_URL to your API Gateway / Function URL to go live.
      // ------------------------------------------------------------------
      const API_URL = "https://on.aws";
      const DEMO_MODE = !API_URL;
      const DEMO_TENANT = "Client_Alpha_London";

      const ROLES = [
        { value: "viewer", label: "Viewer (Queries Only)" },
        { value: "analyst", label: "Analyst (BI View Controls)" },
        { value: "engineer", label: "Engineer (Ingestion Access)" },
        { value: "admin", label: "Administrator (Full Access)" },
      ];
      const PERSONAS = [
        { value: "architect", label: "BI Report Architect" },
        { value: "guard", label: "Metadata Ingestion Guard" },
        { value: "finops", label: "FinOps Budget Analyst" },
      ];
      const PLATFORMS = ["Power BI", "Sisense", "Tableau", "Looker", "QuickSight"];

      const VIEW_NAME_RE = /^[A-Za-z][A-Za-z0-9_]{0,63}$/;
      const EMAIL_RE = /^[^@\s]{1,64}@[^@\s]{1,255}$/;
      const TENANT_RE = /^[A-Za-z0-9_\-]{1,64}$/;
      const MAX_IMAGE_BYTES = 3.5 * 1024 * 1024; // keeps base64 under the backend's 5M-char limit

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      const demoReply = (text) => {
        const t = text.toLowerCase();
        if (t.includes("power bi") || t.includes("dax") || t.includes("replicate") || t.includes("image") || t.includes("report")) {
          return "### Multimodal Layout Analyser (simulated)\nLegacy chart framework matched against catalog fields.\n\n### Power BI DAX Expression Matrix Model (simulated)\n```dax\nGoldAccountsProfileMatrix = \nSUMMARIZECOLUMNS(\n    'gold_accounts_profile_matrix'[client_name],\n    \"ResolutionRate\", AVERAGE('gold_accounts_profile_matrix'[resolution_rate_percentage]),\n    \"TotalComputeCost\", SUM('gold_accounts_profile_matrix'[total_compute_cost_index])\n)\n```\n\n### Sisense ElastiCube JSON Schema (simulated)\n```json\n{\n  \"elasticube\": {\n    \"name\": \"SAMM_Gold_Layer_Cube\",\n    \"tables\": [{\n      \"name\": \"gold_accounts_profile_matrix\",\n      \"expression\": \"SELECT * FROM gold_accounts_profile_matrix WHERE tenant_id = '" + DEMO_TENANT + "'\"\n    }]\n  }\n}\n```";
        }
        return "### Compiled SQL (simulated)\nSELECT account_matrix_id FROM tenant_scoped LIMIT 5\n\n### Analytical Summary (simulated)\nThis is a demo response. Set API_URL to query the live gold layer.";
      };

      // Minimal markdown: ### headings and ``` code fences. Renders as React text (no innerHTML).
      function Rich({ text }) {
        return (text || "").split("```").map((part, i) => (
          <React.Fragment key={i}>
            {i % 2 ? (
              <pre className="mt-2 p-3 bg-[#111] border border-[#2D2D2D] rounded text-xs overflow-x-auto">{part.slice(part.indexOf("\n") + 1)}</pre>
            ) : (
              part.split("\n").map((ln, j) =>
                ln.startsWith("### ")
                  ? <h4 key={j} className="font-semibold text-amber-500 mt-2">{ln.slice(4)}</h4>
                  : ln ? <p key={j} className="whitespace-pre-wrap">{ln.replace(/\*\*/g, "")}</p> : null
              )
            )}
          </React.Fragment>
        ));
      }

      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0] || {});
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {rows.slice(0, 10).map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-xs text-gray-500 mt-1">Showing {Math.min(10, rows.length)} of {rows.length} rows</div>
          </div>
        );
      }

      const field = "w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500";
      const btn = "bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition";

      function SammConsole() {
        const nextId = useRef(0);
        const makeMsg = (role, content, rows) => ({ id: `m${++nextId.current}`, role, content, rows, timestamp: new Date().toLocaleTimeString() });

        const [messages, setMessages] = useState([{
          id: "init", role: "assistant", timestamp: "System ready",
          content: DEMO_MODE
            ? "SAMM AI System Core active in demo mode. Responses are simulated. Pick a role profile to preview each workspace."
            : "SAMM AI System Core connected. Paste your access token in the sidebar, then ask a question.",
        }]);
        const [input, setInput] = useState("");
        const [activeTab, setActiveTab] = useState("chat");
        const [isLoading, setIsLoading] = useState(false);
        const [systemRole, setSystemRole] = useState("viewer");
        const [activePersona, setActivePersona] = useState("architect");
        const [token, setToken] = useState("");
        const [platform, setPlatform] = useState("Power BI");

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");
        const [isDragging, setIsDragging] = useState(false);
        const [uploadStatus, setUploadStatus] = useState("");

        const [viewName, setViewName] = useState("high_efficiency_accounts");
        const [viewQuery, setViewQuery] = useState(
          `SELECT client_name, resolution_rate_percentage FROM gold_accounts_profile_matrix WHERE tenant_id = '${DEMO_TENANT}' AND resolution_rate_percentage > 85`
        );

        const [adminUsers, setAdminUsers] = useState([
          { email: "engineer@shiftleft.com", role: "engineer", tenant: DEMO_TENANT },
          { email: "analyst@shiftleft.com", role: "analyst", tenant: "Client_Beta_EU" },
        ]);
        const [newEmail, setNewEmail] = useState("");
        const [newRole, setNewRole] = useState("analyst");
        const [newTenant, setNewTenant] = useState(DEMO_TENANT);

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const addMessage = (role, content, rows) => setMessages((prev) => [...prev, makeMsg(role, content, rows)]);

        // UI gating only. In live mode the server enforces roles from the authenticated token.
        const isEngineer = ["engineer", "admin"].includes(systemRole);
        const isAnalyst = ["analyst", "engineer", "admin"].includes(systemRole);
        const isAdmin = systemRole === "admin";
        const canOnboard = isEngineer;

        useEffect(() => {
          const locked = (!isEngineer && activeTab === "onboarding") || (!isAdmin && activeTab === "governance");
          if (locked) {
            setActiveTab("chat");
            addMessage("assistant", "⚠️ **Access policy:** your active profile can't open that workspace. Switch to a role with access, or ask an administrator.");
          }
        }, [systemRole, activeTab]);

        // ---- API + helpers -------------------------------------------------
        const callApi = async (payload) => {
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json", ...(token ? { Authorization: token } : {}) },
            body: JSON.stringify(payload),
          });
          let d = {};
          try { d = await res.json(); } catch (_) {}
          if (!res.ok || d.error) throw new Error(d.error || `Request failed (${res.status})`);
          return d;
        };

        const run = async (fn) => {
          setIsLoading(true);
          try { await fn(); }
          catch (err) { addMessage("assistant", `⚠️ ${err.message}`); }
          finally { setIsLoading(false); }
        };

        // ---- Chat ----------------------------------------------------------
        const handleSendMessage = (e) => {
          e.preventDefault();
          const userText = input.trim();
          if (!userText || isLoading) return;
          addMessage("user", userText);
          setInput("");
          run(async () => {
            if (DEMO_MODE) { await sleep(800); addMessage("assistant", demoReply(userText)); return; }
            const d = await callApi({ action: "query", prompt: userText, persona: activePersona });
            addMessage("assistant", `### Compiled SQL\n${d.compiled_sql || ""}\n\n### Analytical Summary\n${d.summary || "No summary available."}`, d.rows);
          });
        };

        const handleReplicate = (e) => {
          const file = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!file) return;
          if (!["image/png", "image/jpeg"].includes(file.type)) { addMessage("assistant", "⚠️ Choose a PNG or JPEG screenshot."); return; }
          if (file.size > MAX_IMAGE_BYTES) { addMessage("assistant", "⚠️ That image is over 3.5 MB. Export a smaller screenshot."); return; }
          addMessage("user", `Replicate this dashboard (${file.name}) for ${platform}.`);
          run(async () => {
            if (DEMO_MODE) { await sleep(800); addMessage("assistant", demoReply("replicate")); return; }
            const b64 = await new Promise((resolve, reject) => {
              const r = new FileReader();
              r.onload = () => resolve(String(r.result).split(",")[1]);
              r.onerror = () => reject(new Error("Could not read the image file."));
              r.readAsDataURL(file);
            });
            const d = await callApi({ action: "replicate_dashboard", image_base64: b64, media_type: file.type, target_platform: platform });
            addMessage("assistant", `### ${platform} blueprint\n${d.compiled_report_blueprint || ""}`);
          });
        };

        // ---- Engineer: ingestion + views ----------------------------------
        const handleFileDrop = (e) => {
          e.preventDefault();
          setIsDragging(false);
          const files = e.dataTransfer ? e.dataTransfer.files : e.target.files;
          if (!files || files.length === 0) return;
          setFormError("");
          if (!/^s3:\/\/[a-z0-9.\-]{3,63}\/.+/.test(s3Path.trim())) { setFormError("Target must look like s3://bucket/key."); return; }
          try { JSON.parse(contextPayload); } catch (_) { setFormError("Context payload must be valid JSON."); return; }
          if (!DEMO_MODE) {
            addMessage("assistant", "⚠️ **Upload isn't connected.** The backend has no presigned-upload action yet, so nothing was sent.");
            setActiveTab("chat");
            return;
          }
          run(async () => {
            setUploadStatus(`Uploading ${files[0].name} (simulated)…`);
            await sleep(1200);
            setUploadStatus("");
            addMessage("assistant", `### Ingestion (simulated)\n${files[0].name} was not sent anywhere. In live mode it would land at ${s3Path.trim()}.`);
            setActiveTab("chat");
          });
        };

        const handleCreateView = () => {
          setFormError("");
          if (!VIEW_NAME_RE.test(viewName)) { setFormError("View name: letters, digits and underscores only, starting with a letter."); return; }
          if (!/tenant_id\s*=\s*'[^']+'/i.test(viewQuery)) { setFormError("The query needs a tenant_id = '<tenant>' filter."); return; }
          run(async () => {
            if (DEMO_MODE) {
              await sleep(800);
              addMessage("assistant", `### View deployment (simulated)\nWould create \`samm_view_${viewName}\` in \`glue_db_cvvdr97yl50zyt\`. Nothing was deployed.`);
              return;
            }
            const d = await callApi({ action: "materialize_view", view_name: viewName, query_logic: viewQuery });
            addMessage("assistant", `### View deployed\n${d.message || "Done."}\nExecution: ${d.execution_id || "n/a"}`);
          });
        };

        // ---- Admin: governance --------------------------------------------
        const handleAddUserPolicy = (e) => {
          e.preventDefault();
          const email = newEmail.trim().toLowerCase();
          const tenant = newTenant.trim();
          setFormError("");
          if (!EMAIL_RE.test(email)) { setFormError("Enter a valid email address."); return; }
          if (!TENANT_RE.test(tenant)) { setFormError("Tenant: letters, digits, _ and - only (max 64)."); return; }
          run(async () => {
            if (DEMO_MODE) await sleep(500);
            else await callApi({ action: "provision_user", user_email: email, role: newRole, tenant_id: tenant });
            setAdminUsers((prev) => [...prev.filter((u) => u.email !== email), { email, role: newRole, tenant }]);
            setNewEmail("");
            addMessage("assistant", `🔒 **Access policy ${DEMO_MODE ? "(simulated) " : ""}updated:** ${email} is now **${newRole}** on ${tenant}.`);
          });
        };

        const handlePipelineTrigger = () => {
          setFormError("");
          if (!/^s3:\/\/[^/\s]+\/\S+/.test(s3Path.trim())) { setFormError("Source path must look like s3://bucket/key."); return; }
          try { JSON.parse(contextPayload); } catch (_) { setFormError("Context payload is not valid JSON."); return; }
          run(async () => {
            await sleep(800);
            // No ingestion action exists on the backend yet, so this is always a simulation.
            addMessage("assistant", `### Simulated ingestion request\nTarget handler: shiftleft-superposition-pipeline-orchestrator\nAsset: ${s3Path.trim()}\n\nNo request was sent: the ingestion endpoint is not connected to this page yet.`);
            setActiveTab("chat");
          });
        };

        const navClass = (tab, disabled) =>
          `w-full text-left flex items-center space-x-3 px-4 py-3 rounded-lg text-sm font-medium transition ${
            activeTab === tab
              ? "bg-[#2D2D2D] text-white border-l-4 border-amber-500"
              : disabled
              ? "text-[#555555] cursor-not-allowed"
              : "text-[#A0A0A0] hover:bg-[#252525] hover:text-white"
          }`;
        const go = (tab, allowed) => { if (allowed) { setFormError(""); setActiveTab(tab); } };
        const label = "block text-xs font-mono text-[#A0A0A0] mb-1";

        return (
          <div className="flex h-screen bg-[#191919] text-[#E3E3E3] font-sans overflow-hidden w-full">
            {/* LEFT SIDEBAR PANEL */}
            <div className="w-64 bg-[#202020] border-r border-[#2D2D2D] flex flex-col justify-between overflow-y-auto">
              <div>
                <div className="p-5 flex items-center space-x-3 border-b border-[#2D2D2D]">
                  <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                  <div>
                    <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                    <p className="text-[10px] text-amber-500 font-mono">Serverless Core v2.4</p>
                  </div>
                </div>
                <nav className="p-4 space-y-2" aria-label="Workspaces">
                  <button onClick={() => go("chat", true)} className={navClass("chat", false)}>
                    <span>💬 Cognitive Chat</span>
                  </button>
                  <button
                    onClick={() => go("onboarding", canOnboard)}
                    disabled={!canOnboard}
                    title={canOnboard ? "" : "Requires Engineer or Administrator"}
                    className={navClass("onboarding", !canOnboard)}
                  >
                    <span>📦 Data Onboarding</span>
                  </button>
                  <button
                    onClick={() => go("governance", isAdmin)}
                    disabled={!isAdmin}
                    title={isAdmin ? "" : "Requires Administrator"}
                    className={navClass("governance", !isAdmin)}
                  >
                    <span>🔐 Access Governance</span>
                  </button>
                </nav>
              </div>
              <div className="p-4 border-t border-[#2D2D2D] bg-[#1E1E1E] space-y-3">
                <div className="text-xs text-[#A0A0A0]"><span>🛡️ Identity Firewall</span></div>
                <select
                  aria-label="Preview role"
                  value={systemRole}
                  onChange={(e) => setSystemRole(e.target.value)}
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                >
                  {ROLES.map((r) => <option key={r.value} value={r.value}>{r.label}</option>)}
                </select>
                <select
                  aria-label="Persona"
                  value={activePersona}
                  onChange={(e) => setActivePersona(e.target.value)}
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono cursor-pointer"
                >
                  {PERSONAS.map((p) => <option key={p.value} value={p.value}>{p.label}</option>)}
                </select>
                {!DEMO_MODE && (
                  <input
                    type="password"
                    aria-label="Access token"
                    value={token}
                    onChange={(e) => setToken(e.target.value)}
                    placeholder="Access token (kept in memory)"
                    className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1.5 px-3 text-xs text-white focus:outline-none focus:border-amber-500 font-mono"
                  />
                )}
                <p className="text-[10px] text-[#707070] leading-snug">
                  UI preview only. The server enforces your real role from your sign-in.
                </p>
              </div>
            </div>

            {/* CENTRAL INTERACTIVE CHAT ENGINE FEED */}
            <div className="flex-1 flex flex-col min-w-0 bg-[#191919]">
              <header className="h-16 border-b border-[#2D2D2D] px-6 flex items-center justify-between bg-[#1A1A1A]">
                <div className="flex items-center space-x-3">
                  <span className="text-xs uppercase bg-[#2D2D2D] text-amber-500 font-mono px-2.5 py-1 rounded border border-[#3D3D3D]">Active Console Context</span>
                  {DEMO_MODE && (
                    <span className="text-xs uppercase bg-amber-900/40 text-amber-400 font-mono px-2.5 py-1 rounded border border-amber-700">Demo mode: simulated</span>
                  )}
                </div>
                <div className="flex items-center space-x-4 text-xs font-mono text-[#A0A0A0]">
                  <span>👤 Context: {systemRole.toUpperCase()}</span>
                  <span>💾 Workgroup: shiftleft-superposition</span>
                </div>
              </header>

              <div className="flex-1 overflow-y-auto p-6 space-y-4">
                {activeTab === "chat" && (
                  <div className="max-w-4xl mx-auto space-y-6">
                    {messages.map((msg) => (
                      <div key={msg.id} className={`flex ${msg.role === "user" ? "justify-end" : "justify-start"}`}>
                        <div className={`max-w-[85%] rounded-xl p-5 shadow-lg ${msg.role === "user" ? "bg-amber-600 text-white" : "bg-[#222222] border border-[#2D2D2D] text-[#E3E3E3]"}`}>
                          <div className="text-xs font-mono text-[#A0A0A0] mb-2 flex justify-between items-center space-x-6">
                            <span className="font-bold text-amber-500">{msg.role === "user" ? "USER TRANSACTION" : "SAMM AI ENGINE"}</span>
                            <span>{msg.timestamp}</span>
                          </div>
                          <div className="text-sm leading-relaxed font-sans"><Rich text={msg.content} /></div>
                          <ResultTable rows={msg.rows} />
                        </div>
                      </div>
                    ))}
                    {isLoading && (
                      <div className="flex justify-start">
                        <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-4 flex items-center space-x-3">
                          <span className="text-xs font-mono text-[#A0A0A0] animate-pulse">⚙️ Compiling Bedrock pipeline...</span>
                        </div>
                      </div>
                    )}
                    <div ref={messagesEndRef} />
                  </div>
                )}

                {activeTab === "onboarding" && canOnboard && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <p className="text-xs text-[#A0A0A0] mt-1">Ingestion and file upload are simulated until the backend adds those actions. View deployment is live when API_URL is set.</p>
                    </div>
                    {formError && <div role="alert" className="text-xs text-red-400 font-mono">{formError}</div>}
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className={label}>Source file (S3 path)</label>
                        <input id="s3path" value={s3Path} onChange={(e) => setS3Path(e.target.value)} className={field} />
                      </div>
                      <div>
                        <label htmlFor="ctx" className={label}>Context payload (JSON)</label>
                        <textarea id="ctx" rows={3} value={contextPayload} onChange={(e) => setContextPayload(e.target.value)} className={field} />
                      </div>
                      <button onClick={handlePipelineTrigger} disabled={isLoading} className={btn + " w-full"}>Trigger Pipeline Ingestion</button>
                      <label
                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                        onDragLeave={() => setIsDragging(false)}
                        onDrop={handleFileDrop}
                        className={`block text-center text-xs font-mono rounded-lg border-2 border-dashed p-6 cursor-pointer ${isDragging ? "border-amber-500 bg-amber-900/20 text-amber-400" : "border-[#3D3D3D] text-[#A0A0A0] hover:bg-[#252525]"}`}
                      >
                        {uploadStatus || "Drop a file here, or click to choose one"}
                        <input type="file" className="sr-only" onChange={handleFileDrop} disabled={isLoading} />
                      </label>
                    </div>
                    <div className="border-t border-[#2D2D2D] pt-5 space-y-4">
                      <h3 className="text-base font-bold text-white">🧩 Deploy a view</h3>
                      <div>
                        <label htmlFor="viewname" className={label}>View name (created as samm_view_&lt;name&gt;)</label>
                        <input id="viewname" value={viewName} onChange={(e) => setViewName(e.target.value)} className={field} />
                      </div>
                      <div>
                        <label htmlFor="viewquery" className={label}>Query (read gold_accounts_profile_matrix, filter on your tenant_id)</label>
                        <textarea id="viewquery" rows={4} value={viewQuery} onChange={(e) => setViewQuery(e.target.value)} className={field} />
                      </div>
                      <button onClick={handleCreateView} disabled={isLoading} className={btn + " w-full"}>Deploy view</button>
                    </div>
                  </div>
                )}

                {activeTab === "governance" && isAdmin && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">🔐 Access Governance</h2>
                      <p className="text-xs text-[#A0A0A0] mt-1">{DEMO_MODE ? "Simulated: changes stay in this page only." : "Changes are written to the access policy table."}</p>
                    </div>
                    <div className="overflow-x-auto">
                      <table className="text-xs font-mono border border-[#2D2D2D] w-full">
                        <thead><tr className="bg-[#2D2D2D] text-amber-500 text-left"><th className="px-3 py-1.5">Email</th><th className="px-3 py-1.5">Role</th><th className="px-3 py-1.5">Tenant</th></tr></thead>
                        <tbody>
                          {adminUsers.map((u) => (
                            <tr key={u.email} className="border-t border-[#2D2D2D]"><td className="px-3 py-1.5">{u.email}</td><td className="px-3 py-1.5">{u.role}</td><td className="px-3 py-1.5">{u.tenant}</td></tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                    {formError && <div role="alert" className="text-xs text-red-400 font-mono">{formError}</div>}
                    <form onSubmit={handleAddUserPolicy} className="space-y-4">
                      <div>
                        <label htmlFor="newemail" className={label}>User email</label>
                        <input id="newemail" value={newEmail} onChange={(e) => setNewEmail(e.target.value)} placeholder="name@company.com" className={field} />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label htmlFor="newrole" className={label}>Role</label>
                          <select id="newrole" value={newRole} onChange={(e) => setNewRole(e.target.value)} className={field}>
                            {ROLES.map((r) => <option key={r.value} value={r.value}>{r.value}</option>)}
                          </select>
                        </div>
                        <div>
                          <label htmlFor="newtenant" className={label}>Tenant</label>
                          <input id="newtenant" value={newTenant} onChange={(e) => setNewTenant(e.target.value)} className={field} />
                        </div>
                      </div>
                      <button disabled={isLoading} className={btn + " w-full"}>Save access</button>
                    </form>
                  </div>
                )}
              </div>

              {activeTab === "chat" && (
                <form onSubmit={handleSendMessage} className="border-t border-[#2D2D2D] bg-[#1A1A1A] p-4 space-y-3">
                  {isAnalyst && (
                    <div className="max-w-4xl mx-auto flex flex-wrap items-center gap-3 text-xs font-mono text-[#A0A0A0]">
                      <span>Replicate a dashboard screenshot as</span>
                      <select aria-label="BI platform" value={platform} onChange={(e) => setPlatform(e.target.value)} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-1 px-2 text-white focus:outline-none focus:border-amber-500">
                        {PLATFORMS.map((p) => <option key={p}>{p}</option>)}
                      </select>
                      <label className="px-3 py-1 rounded-md border border-[#3D3D3D] hover:bg-[#252525] cursor-pointer focus-within:border-amber-500">
                        Choose image
                        <input type="file" accept="image/png,image/jpeg" className="sr-only" onChange={handleReplicate} disabled={isLoading} />
                      </label>
                    </div>
                  )}
                  <div className="max-w-4xl mx-auto flex space-x-3">
                    <input
                      aria-label="Ask a question"
                      value={input}
                      onChange={(e) => setInput(e.target.value)}
                      disabled={isLoading}
                      placeholder="Ask a question about your Gold data..."
                      className="flex-1 bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg py-2.5 px-4 text-sm text-white focus:outline-none focus:border-amber-500 disabled:opacity-50"
                    />
                    <button type="submit" disabled={isLoading || !input.trim()} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-6 rounded-lg transition">
                      Send
                    </button>
                  </div>
                </form>
              )}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<SammConsole />);
    </script>
  </body>
</html>
