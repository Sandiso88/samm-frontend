    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      // ------------------------------------------------------------------
      // CONFIG

        admin: "Manages the users and policies of their own client.",
        system_admin: "Platform owner. Every client, every role.",
      };
      const ROLE_ROW_CAP = { viewer: 100, analyst: 500, engineer: 1000, admin: 1000, system_admin: 1000 };
      const CAN_ONBOARD = ["engineer", "admin", "system_admin"];
      const CAN_GOVERN = ["admin", "system_admin"];
      const PERSONAS = [
        { value: "architect", label: "Architect" },

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      // ------------------------------------------------------------------
      // Markdown helpers: split text into plain parts and fenced code blocks.
      // An unterminated fence is left as plain text (never swallowed).
      // ------------------------------------------------------------------
      function splitBlocks(text) {
        const parts = [];
        const re = /```([\w+-]*)[ \t]*\r?\n([\s\S]*?)```/g;
        let last = 0;
        let m;
        while ((m = re.exec(text || "")) !== null) {
          if (m.index > last) parts.push({ type: "text", text: text.slice(last, m.index) });
          parts.push({ type: "code", lang: (m[1] || "text").toLowerCase(), code: m[2].replace(/\s+$/, "") });
          last = re.lastIndex;
        }
        if (last < (text || "").length) parts.push({ type: "text", text: text.slice(last) });
        return parts;
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (_) { /* fall through to the legacy path */ }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          return ok;
        } catch (_) {
          return false;
        }
      }

      // ------------------------------------------------------------------
      // Backend client with detailed diagnostics.
      // ------------------------------------------------------------------
      class ApiError extends Error {
        constructor(message, details, status) {
          super(message);
          this.details = details || [];
          this.status = status || 0;
        }
      }

      async function callBackend(url, token, payload) {
        let res;
        try {
          res = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify(payload),
          });
        } catch (err) {
          // The browser hides the real reason for security reasons. These are the usual causes.
          throw new ApiError(
            "Could not reach the SAMM endpoint (the browser reported: " + (err && err.message ? err.message : "network error") + ").",
            [
              "Duplicate CORS headers: CORS must be configured on the Lambda Function URL only. Deploy lambda_function.py v4, which sends no CORS headers itself.",
              "The Function URL's CORS 'Allow headers' must include both: content-type and authorization (preflight fails otherwise).",
              "The Function URL's CORS 'Allow origins' must include this page's origin (" + window.location.origin + ") or *, and 'Allow methods' must include POST.",
              "Function URL auth type must be NONE and its resource policy must allow public invocation (otherwise AWS returns 403 without CORS headers).",
              "Check the URL is correct, and that the Lambda timeout (about 60 s) is long enough for Athena and Bedrock.",
              "Open the browser console (F12), Network tab, and look at the OPTIONS and POST rows for the exact status.",
            ],
            0
          );
        }
        let data = {};
        let rawText = "";
        try {
          rawText = await res.text();
          data = rawText ? JSON.parse(rawText) : {};
        } catch (_) {
          data = {};
        }
        if (res.ok && !data.error) return data;

        const serverMsg = data.error || data.message || (rawText ? rawText.slice(0, 200) : "");
        const status = res.status;
        const hints = {
          400: ["The request or the generated SQL was rejected. Try rephrasing the question."],
          401: ["Your token is missing, wrong or expired. Sign out and enter a valid access token.", "Ask an admin to check SAMM_TOKEN_REGISTRY on the Lambda."],
          403: [
            "If the message names a role or column, your role is not allowed to do that.",
            "If it is a bare AWS 'Forbidden', the Function URL resource policy does not allow public invocation (auth NONE needs a lambda:InvokeFunctionUrl permission for principal *).",
          ],
          409: ["The Gold view has no tenant column, so tenant isolation cannot be enforced. Add tenant_id to the Gold view, or set ALLOW_UNSCOPED=true for single-tenant testing only."],
          413: ["FinOps circuit breaker: this question would scan more than the per-query data limit, so SAMM stopped it before it could cost money.", "Narrow it by date range, dataset or site, then ask again."],
          429: ["Too many requests or Bedrock throttling. Wait a moment and retry."],
          502: ["The model returned an empty or unusable answer. Retry; check Bedrock model access and MODEL_ID."],
          503: ["The server has no token registry configured (SAMM_TOKEN_REGISTRY is empty)."],
          504: ["The Lambda timed out. Raise the function timeout (about 60 s)."],
        };
        throw new ApiError(
          serverMsg || "Request failed (HTTP " + status + ").",
          hints[status] || (status >= 500 ? ["Server error. Check the CloudWatch logs for SAMM-AI-Query-Engine."] : []),
          status
        );
      }

      // ------------------------------------------------------------------
      // Demo data (clearly labelled as simulated everywhere it is shown)
      // ------------------------------------------------------------------
      const fmtBytes = (n) => { n = Number(n) || 0; const u = ["B", "KB", "MB", "GB", "TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (i ? n.toFixed(n < 10 ? 1 : 0) : n) + " " + u[i]; };
      const DEMO_IDENTITY = { email: "demo@samm.local", role: "admin", tenant_id: "DEMO_TENANT", row_cap: 1000 };

      function demoQuery(prompt) {
        const wantsBi = /power\s*bi|dax|sisense|json/i.test(prompt);
        const sql = "SELECT account_matrix_id, profile_score\nFROM tenant_scoped\nWHERE profile_score > 0.75\nORDER BY profile_score DESC\nLIMIT 10";
        let report = "**Simulated answer.** No query ran against your lakehouse.\n\nTen demo accounts have a profile score above 0.75.";
        if (wantsBi) {
          report += "\n\n```dax\nEVALUATE\nTOPN(10, FILTER('Gold', 'Gold'[profile_score] > 0.75), 'Gold'[profile_score], DESC)\n```\n\n```json\n{\n  \"table_name\": \"gold_accounts_profile_matrix\",\n  \"columns\": [\"account_matrix_id\", \"profile_score\"]\n}\n```";
        }
        return {
          generated_sql: sql,
          executed_sql: "WITH tenant_scoped AS (SELECT * FROM gold WHERE tenant_id = 'DEMO_TENANT')\n" + sql,
          report_markdown: report,
          raw_data_grid: [
            { account_matrix_id: "1001", profile_score: "0.93" },
            { account_matrix_id: "1002", profile_score: "0.88" },
            { account_matrix_id: "1003", profile_score: "0.81" },
          ],
          role: "admin",
          tenant_id: "DEMO_TENANT",
          row_cap: 1000,
          truncated: false,
          finops: { scanned_bytes: 2400000, ceiling_bytes: 5368709120, est_cost_usd: 0.00005, pct_of_ceiling: 0.04, queries: 1 },
        };
      }

      // ------------------------------------------------------------------
      // Small components
      // ------------------------------------------------------------------
      function ResultTable({ rows }) {
        if (!rows || rows.length === 0) return null;
        const cols = Object.keys(rows[0]);
        const shown = rows.slice(0, 10);
        return (
          <div className="mt-4 overflow-x-auto">
            <table className="text-xs font-mono border border-[#2D2D2D] w-full">
              <thead>
                <tr className="bg-[#2D2D2D] text-amber-500">
                  {cols.map((c) => <th key={c} className="text-left px-3 py-1.5 whitespace-nowrap">{c}</th>)}
                </tr>
              </thead>
              <tbody>
                {shown.map((r, i) => (
                  <tr key={i} className="border-t border-[#2D2D2D]">
                    {cols.map((c) => <td key={c} className="px-3 py-1.5 whitespace-nowrap">{String(r[c] ?? "")}</td>)}
                  </tr>
                ))}
              </tbody>
            </table>
            <div className="text-[10px] text-[#A0A0A0] mt-1 font-mono">Showing {shown.length} of {rows.length} rows</div>
          </div>

      }

      function ErrorCard({ message, details, status }) {
        return (
          <div data-testid="error-card" className="border border-red-800 bg-red-950/40 rounded-lg p-4 text-sm">
            <div className="font-bold text-red-300">
              ⚠️ {status === 413 ? "FinOps circuit breaker" : status ? "Error " + status : "Connection problem"}
            </div>
            <div className="text-red-200 mt-1 whitespace-pre-wrap">{message}</div>
            {details && details.length > 0 && (
              <ul className="list-disc ml-5 mt-3 space-y-1 text-xs text-red-200/90">
                {details.map((d, i) => <li key={i}>{d}</li>)}
              </ul>
            )}
          </div>
        );
      }

      function SimBadge({ children }) {
        return (
          <span className="text-xs uppercase bg-amber-900/40 text-amber-400 font-mono px-2.5 py-1 rounded border border-amber-700">
            {children}
          </span>
        );
      }

      function SignIn({ onSignedIn, onDemo, defaultUrl }) {
        const [url, setUrl] = useState(defaultUrl);
        const [token, setToken] = useState("");
        const [busy, setBusy] = useState(false);
        const [error, setError] = useState(null);

        const submit = async (e) => {
          e.preventDefault();
          setError(null);
          const u = url.trim();
          const t = token.trim();
          if (!/^https:\/\/\S+$/.test(u)) {
            setError(new ApiError("Endpoint must be an https:// URL (your Lambda Function URL).", []));
            return;
          }
          if (!t) {
            setError(new ApiError("Enter your access token.", []));
            return;
          }
          setBusy(true);
          try {
            const who = await callBackend(u, t, { action: "whoami" });
            onSignedIn({ url: u, token: t, identity: who });
          } catch (err) {
            setError(err);
          } finally {
            setBusy(false);
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center bg-[#191919] p-4">
            <form onSubmit={submit} className="w-full max-w-md bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-4">
              <div className="flex items-center space-x-3 border-b border-[#2D2D2D] pb-4">
                <div className="bg-amber-600 px-3 py-1 rounded-lg text-white font-bold text-sm">SAMM</div>
                <div>
                  <h1 className="font-bold text-base text-white tracking-wide">SAMM AI</h1>
                  <p className="text-[10px] text-amber-500 font-mono">Sign in with your access token</p>
                </div>
              </div>
              <div>
                <label htmlFor="endpoint" className="block text-xs font-mono text-[#A0A0A0] mb-1">Endpoint (Lambda Function URL)</label>
                <input
                  id="endpoint"
                  value={url}
                  onChange={(e) => setUrl(e.target.value)}
                  placeholder="https://xxxx.lambda-url.eu-west-2.on.aws/"
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                />
              </div>
              <div>
                <label htmlFor="token" className="block text-xs font-mono text-[#A0A0A0] mb-1">Access token</label>
                <input
                  id="token"
                  type="password"
                  autoComplete="off"
                  value={token}
                  onChange={(e) => setToken(e.target.value)}
                  className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                />
                <p className="text-[10px] text-[#707070] mt-1">Kept in memory only. It is gone when you close or refresh the tab.</p>
              </div>
              {error && <ErrorCard message={error.message} details={error.details} status={error.status} />}
              <button
                type="submit"
                disabled={busy}
                className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
              >
                {busy ? "Checking token..." : "Sign in"}
              </button>
              <button
                type="button"
                onClick={onDemo}
                className="w-full text-xs text-[#A0A0A0] hover:text-white underline"
              >
                Explore in demo mode (simulated, nothing is sent)
              </button>
            </form>
          </div>
        );
      }

      function ArtifactPanel({ open, artifacts, activeId, onSelect, onClose }) {
        const [copied, setCopied] = useState("");
        const [copyFailed, setCopyFailed] = useState(false);
        const active = artifacts.find((a) => a.id === activeId) || artifacts[artifacts.length - 1];

        const doCopy = async () => {
          if (!active) return;
          const ok = await copyText(active.code);
          setCopyFailed(!ok);
          setCopied(ok ? active.id : "");
          if (ok) setTimeout(() => setCopied(""), 1800);
        };

        return (
          <aside
            data-testid="artifact-panel"
            aria-hidden={!open}
            style={{ width: open ? 480 : 0, transition: "width 300ms ease" }}
            className="bg-[#1E1E1E] border-l border-[#2D2D2D] overflow-hidden flex-shrink-0"
          >
            <div style={{ width: 480 }} className="h-full flex flex-col">
              <div className="h-16 px-4 border-b border-[#2D2D2D] flex items-center justify-between">
                <span className="text-xs uppercase text-amber-500 font-mono">Artifacts ({artifacts.length})</span>
                <button onClick={onClose} aria-label="Close artifact panel" className="text-[#A0A0A0] hover:text-white text-lg px-2">×</button>
              </div>
              <div className="flex overflow-x-auto border-b border-[#2D2D2D] text-xs font-mono">
                {artifacts.map((a) => (
                  <button
                    key={a.id}
                    onClick={() => onSelect(a.id)}
                    className={"px-3 py-2 whitespace-nowrap " + (active && active.id === a.id ? "text-white border-b-2 border-amber-500" : "text-[#A0A0A0] hover:text-white")}
                  >
                    {a.title}
                  </button>
                ))}
              </div>
              {active ? (
                <div className="flex-1 flex flex-col min-h-0 p-4">
                  <div className="flex items-center justify-between mb-2">
                    <span className="text-[10px] uppercase text-[#A0A0A0] font-mono">{active.lang}</span>
                    <button
                      onClick={doCopy}
                      data-testid="copy-btn"
                      className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-md transition"
                    >
                      {copied === active.id ? "Copied ✓" : "Copy"}
                    </button>
                  </div>
                  {copyFailed && <div className="text-xs text-red-300 mb-2">Copy was blocked by the browser. Select the text below and press Ctrl+C.</div>}
                  <pre data-testid="artifact-code" className="flex-1 overflow-auto bg-[#151515] border border-[#2D2D2D] rounded-md p-3 text-xs font-mono text-[#E3E3E3] whitespace-pre">{active.code}</pre>
                </div>
              ) : (
                <div className="p-4 text-xs text-[#A0A0A0]">Nothing here yet. DAX, JSON and SQL from replies appear here.</div>
              )}
            </div>
          </aside>
        );
      }

      // Renders message text; fenced code blocks become clickable chips that open the artifact panel.
      function MessageBody({ msg, onOpenArtifact }) {
        const parts = splitBlocks(msg.text || "");
        let codeIdx = 0;
        return (
          <div className="text-sm leading-relaxed font-sans">
            {parts.map((p, i) => {
              if (p.type === "text") return <div key={i} className="whitespace-pre-wrap">{p.text}</div>;
              const art = (msg.artifacts || [])[codeIdx++];
              return (
                <button
                  key={i}
                  data-testid="artifact-chip"
                  onClick={() => art && onOpenArtifact(art.id)}
                  className="my-2 w-full text-left bg-[#151515] border border-[#3D3D3D] hover:border-amber-500 rounded-lg px-3 py-2 transition"
                >
                  <span className="text-amber-500 font-mono text-xs uppercase">{p.lang}</span>
                  <span className="text-[#A0A0A0] text-xs ml-2">{p.code.split("\n").length} lines · click to open in side panel</span>
                </button>
              );
            })}
          </div>
        );
      }


      // ------------------------------------------------------------------
      // Data Onboarding hub (live): upload -> Bronze -> Silver -> field mapping -> Gold view
      // ------------------------------------------------------------------
      const STAGES = [["upload", "Upload"], ["bronze", "Bronze"], ["silver", "Silver"], ["map", "Map fields"], ["gold", "Gold view"]];
      const ACCEPT = ".xlsx,.xlsm,.csv,.tsv,.json,.jsonl,.txt,.pdf,.docx,.pptx,.png,.jpg,.jpeg,.xml,.parquet,.zip,.md,.log";

      async function putFile(url, file) {
        let res;
        try {
          res = await fetch(url, { method: "PUT", body: file });
        } catch (_) {
          throw new ApiError("The browser could not upload the file to S3.", [
            "The S3 bucket needs a CORS rule that allows PUT from this site (" + window.location.origin + "). Run deploy_samm.py again with --origin set to this address.",
            "The upload link lasts 15 minutes; try again if it expired.",
          ], 0);
        }
        if (!res.ok) {
          throw new ApiError("S3 refused the upload (HTTP " + res.status + ").", [
            "The upload link may have expired; try again.",
            "The SAMM Lambda role must be allowed to write to the bucket (s3:PutObject).",
          ], res.status);
        }
      }

      function ErrBox({ err }) {
        if (!err) return null;
        return (
          <div className="mt-2 bg-[#2A1515] border border-red-900 rounded-lg p-3 text-xs text-red-200" data-testid="onb-error">
            <div className="font-bold">{err.status ? "Error " + err.status : "Error"}: {err.message}</div>
            {(err.details || []).length > 0 && (
              <ul className="list-disc ml-5 mt-1 space-y-0.5 text-red-300">
                {err.details.map((d, i) => <li key={i}>{d}</li>)}
              </ul>
            )}
          </div>
        );
      }



      // ------------------------------------------------------------------
      // Mapping + rules editor: the full table you had before, plus rules. Used for new files and for views that already exist.
      // ------------------------------------------------------------------
      const DATE_FORMATS = ["dd/MM/yyyy", "MM/dd/yyyy", "yyyyMMdd", "yyyy-MM-dd"];
      const COMPARE_OPS = ["<=", "<", ">=", ">", "=", "<>"];
      const ARITH_OPS = ["+", "-", "*", "/"];
      function MappingEditor({ dataset, jobId, api, onBuilt, onClose, onAsk }) {
        const [pm, setPm] = useState(null);
        const [err, setErr] = useState(null);
        const [edits, setEdits] = useState({});
        const [rules, setRules] = useState([]);
        const [hide, setHide] = useState(false);
        const [tab, setTab] = useState("map");
        const [busy, setBusy] = useState(false);
        const [built, setBuilt] = useState(null);
        const [quality, setQuality] = useState(null);
        const [nr, setNr] = useState({ kind: "range", column: "", column2: "", name: "", min: "", max: "", values: "", fmt: "dd/MM/yyyy", decimal: ".", op: "<=" });
        const seq = useRef(0);

        useEffect(() => {
          let live = true;
          (async () => {
            try {
              const r = await api({ action: "profile_map", dataset });
              if (!live) return;
              const e = {};
              r.rows.forEach((x) => { e[x.name] = (x.status === "auto" || x.status === "saved" || x.status === "duplicate") ? (x.target || "") : ""; });
              setPm(r); setEdits(e); setRules(r.rules || []); setHide(!!r.hide_failed);
              setNr((p) => ({ ...p, column: (r.rows.find((x) => x.status !== "skip") || {}).name || "" }));
            } catch (x) { if (live) setErr(x); }
          })();
          return () => { live = false; };
        }, [dataset]);

        if (!pm) return <div className="text-xs text-[#A0A0A0] p-3" data-testid="editor-loading">{err ? <ErrBox err={err} /> : "Reading the dataset..."}</div>;
        const cols = pm.rows.filter((r) => r.status !== "skip").map((r) => r.name);
        const canTech = pm.can_edit, canBiz = pm.can_edit_business;
        const locked = !pm.can_edit;
        const setRule = (i, patch) => setRules((p) => p.map((r, n) => (n === i ? { ...r, ...patch } : r)));
        const setParam = (i, k, v) => setRules((p) => p.map((r, n) => (n === i ? { ...r, params: { ...(r.params || {}), [k]: v } } : r)));
        const ruleLocked = (r) => (r.cls === "business" ? !canBiz : !canTech);
        const label = (r) => (pm.rule_kinds[r.kind] || {}).help || r.kind;
        const addRule = () => {
          const k = nr.kind;
          const r = { id: "u" + (++seq.current) + Date.now().toString(36).slice(-4), kind: k, cls: (pm.rule_kinds[k] || {}).cls, column: nr.column, status: "active", origin: "user", params: {} };
          if (k === "range") r.params = { min: nr.min === "" ? null : Number(nr.min), max: nr.max === "" ? null : Number(nr.max) };
          if (k === "allowed") r.params = { values: nr.values };
          if (k === "to_date") r.params = { fmt: nr.fmt };
          if (k === "to_number") r.params = { decimal: nr.decimal };
          if (k === "compare") { r.column2 = nr.column2 || cols[0]; r.params = { op: nr.op }; }
          if (k === "derive") { r.column2 = nr.column2 || cols[0]; r.params = { op: ARITH_OPS.includes(nr.op) ? nr.op : "-" }; r.name = nr.name; }
          setRules((p) => [...p, r]);
        };
        const addSuggested = () => {
          const have = new Set(rules.map((r) => [r.kind, r.column, r.column2 || ""].join("|")));
          setRules((p) => [...p, ...(pm.suggested_rules || []).filter((s2) => !have.has([s2.kind, s2.column, s2.column2 || ""].join("|")))]);
        };
        const build = async () => {
          const mapping = {};
          pm.rows.forEach((r) => { if (r.status !== "skip") mapping[r.name] = (edits[r.name] || "").trim() || null; });
          const payload = { dataset, mapping, hide_failed: hide, rules: rules.map(({ description, ...rest }) => rest) };
          setBusy(true); setErr(null);
          try {
            let res;
            if (jobId) { const r = await api({ action: "job_mapped", id: jobId, ...payload }); res = r.built; onBuilt && onBuilt(r.job); }
            else { res = await api({ action: "build_view", ...payload }); onBuilt && onBuilt(null); }
            setBuilt(res);
          } catch (e) { setErr(e); } finally { setBusy(false); }
        };
        const runQuality = async () => {
          setBusy(true); setErr(null);
          try { const r = await api({ action: "dq_report", dataset }); setQuality(r); } catch (e) { setErr(e); } finally { setBusy(false); }
        };
        const badge = (st) => {
          const c = { auto: "bg-green-900 text-green-200", review: "bg-amber-900 text-amber-200", saved: "bg-blue-900 text-blue-200" }[st] || "bg-[#333] text-[#BBB]";
          return <span className={"px-2 py-0.5 rounded text-[10px] font-mono " + c}>{st}</span>;
        };
        const inp = "bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white font-mono text-xs focus:outline-none focus:border-amber-500 disabled:opacity-60";
        const tabBtn = (k, t) => <button onClick={() => setTab(k)} data-testid={"tab-" + k} className={"px-3 py-1.5 text-xs rounded-t-md border-b-2 " + (tab === k ? "border-amber-500 text-white" : "border-transparent text-[#808080] hover:text-white")}>{t}</button>;
        const active = rules.filter((r) => r.status === "active").length;

        return (
          <div className="border border-amber-800 rounded-lg p-4 space-y-3 bg-[#1D1D1D]" data-testid="mapping-editor">
            <div className="flex flex-wrap justify-between items-center gap-2">
              <div>
                <div className="text-sm text-amber-400 font-mono">{dataset}</div>
                <div className="text-[11px] text-[#808080]">{pm.view_exists ? "Existing view " + pm.view + " · owner " + pm.owner : "New view " + pm.view} · about {pm.estimated_rows} rows · {pm.rows.length} fields</div>
              </div>
              {onClose && <button onClick={onClose} className="text-xs text-[#A0A0A0] hover:text-white underline">Close</button>}
            </div>
            {locked && <div data-testid="editor-locked" className="text-xs text-amber-300 bg-[#241E10] border border-amber-800 rounded p-2">You can look at this view but not change it. Only its owner ({pm.owner}) or an administrator can.</div>}
            <div className="flex gap-1 border-b border-[#2D2D2D]">{tabBtn("map", "Field mapping")}{tabBtn("rules", "Rules (" + active + " active)")}</div>

            {tab === "map" && (
              <div className="space-y-2">
                <div className="overflow-x-auto">
                  <table className="w-full text-xs">
                    <thead><tr className="text-left text-[#808080]"><th className="py-1 pr-3">Source field</th><th className="pr-3">Type</th><th className="pr-3">Filled</th><th className="pr-3">Examples</th><th className="pr-3">Maps to</th><th>Match</th></tr></thead>
                    <tbody>
                      {pm.rows.map((r) => (
                        <tr key={r.name} className="border-t border-[#2A2A2A]">
                          <td className="py-1.5 pr-3 font-mono text-white">{r.name}</td>
                          <td className="pr-3 text-[#A0A0A0]">{r.kind}</td>
                          <td className="pr-3 text-[#A0A0A0]">{r.fill_pct}%</td>
                          <td className="pr-3 text-[#808080] max-w-[160px] truncate" title={r.samples.join(", ")}>{r.samples.join(", ")}</td>
                          <td className="pr-3">
                            {r.status === "skip" ? <span className="text-[#606060]">skipped</span> : r.status === "duplicate" ? (
                              <label className="flex items-center gap-2 text-[11px] text-[#C0C0C0]" title={r.reason}>
                                <input type="checkbox" aria-label={"Hide " + r.name} disabled={locked || !!built} checked={edits[r.name] === "-"} onChange={(e) => setEdits({ ...edits, [r.name]: e.target.checked ? "-" : "" })} />
                                hide (same as {r.duplicate_of})
                              </label>
                            ) : (
                              <div>
                                <input list={"ed-targets-" + dataset} aria-label={"Maps to for " + r.name} value={edits[r.name] || ""} disabled={locked || !!built} placeholder={r.name + " (keep)"}
                                  onChange={(e) => setEdits({ ...edits, [r.name]: e.target.value })} className={inp + " w-44"} />
                                {r.status === "review" && r.target && !locked && !built && (edits[r.name] || "") !== r.target && (
                                  <button data-testid={"use-" + r.name} onClick={() => setEdits({ ...edits, [r.name]: r.target })} className="block mt-1 text-[10px] text-amber-400 hover:text-amber-300 underline">use suggestion "{r.target}"?</button>
                                )}
                              </div>
                            )}
                          </td>
                          <td>{r.pii && <span data-testid={"pii-" + r.name} title={"Possible personal data: " + r.pii.join(", ") + ". Consider restricting this column in Governance."} className="mr-1 text-[10px] border border-red-500/60 text-red-300 rounded px-1">PII: {r.pii.join(", ").toLowerCase()}</span>}{badge(r.status)} {r.confidence > 0 && <span className="text-[10px] text-[#707070]">{Math.round(r.confidence * 100)}%</span>}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <datalist id={"ed-targets-" + dataset}>{pm.targets.map((t) => <option key={t} value={t} />)}</datalist>
                </div>
                <p className="text-[11px] text-[#707070]">Leave "Maps to" empty to keep the field's own name. Names must be lowercase letters, digits and underscores.</p>
                {pm.previous_mapping && !locked && (
                  <button data-testid="restore-mapping" onClick={() => { const e = { ...edits }; Object.keys(e).forEach((k) => { if (k in pm.previous_mapping) e[k] = pm.previous_mapping[k] || ""; }); setEdits(e); }} className="text-[11px] text-[#A0A0A0] hover:text-white underline">Load the previous mapping into the table</button>
                )}
              </div>
            )}

            {tab === "rules" && (
              <div className="space-y-3" data-testid="rules-panel">
                <p className="text-[11px] text-[#707070]">Technical rules change how a field is read. Business rules flag rows that look wrong in a <span className="font-mono">dq_flags</span> column; nothing is deleted. Only rules marked <b>active</b> are applied. Bronze and Silver are never changed.</p>
                <div className="space-y-2">
                  {rules.length === 0 && <div className="text-xs text-[#808080]">No rules yet.</div>}
                  {rules.map((r, i) => {
                    const dis = ruleLocked(r) || !!built;
                    return (
                      <div key={r.id} data-testid="rule-row" className="flex flex-wrap items-center gap-2 text-xs bg-[#151515] border border-[#2D2D2D] rounded-md p-2">
                        <span className={"px-2 py-0.5 rounded text-[10px] font-mono " + (r.cls === "technical" ? "bg-blue-900 text-blue-200" : "bg-purple-900 text-purple-200")}>{r.cls}</span>
                        <span className="font-mono text-white">{r.column}</span>
                        <span className="text-[#A0A0A0]">{label(r)}</span>
                        {r.kind === "range" && (<>
                          <input aria-label={"Minimum for " + r.id} type="number" disabled={dis} value={r.params.min == null ? "" : r.params.min} onChange={(e) => setParam(i, "min", e.target.value === "" ? null : Number(e.target.value))} className={inp + " w-20"} placeholder="min" />
                          <input aria-label={"Maximum for " + r.id} type="number" disabled={dis} value={r.params.max == null ? "" : r.params.max} onChange={(e) => setParam(i, "max", e.target.value === "" ? null : Number(e.target.value))} className={inp + " w-20"} placeholder="max" />
                        </>)}
                        {r.kind === "allowed" && <input aria-label={"Allowed values for " + r.id} disabled={dis} value={Array.isArray(r.params.values) ? r.params.values.join(", ") : (r.params.values || "")} onChange={(e) => setParam(i, "values", e.target.value)} className={inp + " w-56"} />}
                        {r.kind === "to_date" && <select aria-label={"Date format for " + r.id} disabled={dis} value={r.params.fmt} onChange={(e) => setParam(i, "fmt", e.target.value)} className={inp}>{DATE_FORMATS.map((f) => <option key={f}>{f}</option>)}</select>}
                        {r.kind === "to_number" && <select aria-label={"Decimal mark for " + r.id} disabled={dis} value={r.params.decimal || "."} onChange={(e) => setParam(i, "decimal", e.target.value)} className={inp}><option value=".">decimal point</option><option value=",">decimal comma</option></select>}
                        {r.kind === "compare" && (<>
                          <select aria-label={"Comparison for " + r.id} disabled={dis} value={r.params.op} onChange={(e) => setParam(i, "op", e.target.value)} className={inp}>{COMPARE_OPS.map((o) => <option key={o}>{o}</option>)}</select>
                          <select aria-label={"Other field for " + r.id} disabled={dis} value={r.column2} onChange={(e) => setRule(i, { column2: e.target.value })} className={inp}>{cols.map((c) => <option key={c}>{c}</option>)}</select>
                        </>)}
                        {r.kind === "derive" && (<>
                          <select aria-label={"Operation for " + r.id} disabled={dis} value={r.params.op} onChange={(e) => setParam(i, "op", e.target.value)} className={inp}>{ARITH_OPS.map((o) => <option key={o}>{o}</option>)}</select>
                          <select aria-label={"Second field for " + r.id} disabled={dis} value={r.column2} onChange={(e) => setRule(i, { column2: e.target.value })} className={inp}>{cols.map((c) => <option key={c}>{c}</option>)}</select>
                          <input aria-label={"New column name for " + r.id} disabled={dis} value={r.name || ""} onChange={(e) => setRule(i, { name: e.target.value })} className={inp + " w-32"} placeholder="new column" />
                        </>)}
                        <select aria-label={"Status for " + r.id} disabled={dis} value={r.status} onChange={(e) => setRule(i, { status: e.target.value })} className={inp + " ml-auto"}>
                          <option value="active">active</option><option value="suggested">suggested</option><option value="off">off</option>
                        </select>
                        {!dis && <button aria-label={"Remove " + r.id} onClick={() => setRules((p) => p.filter((_, n) => n !== i))} className="text-[#808080] hover:text-red-300">✕</button>}
                        {r.note && <div className="basis-full text-[10px] text-[#707070]">{r.note}{r.confidence ? " (" + Math.round(r.confidence * 100) + "% sure)" : ""}</div>}
                      </div>
                    );
                  })}
                </div>
                {!locked && (
                  <div className="border border-[#2D2D2D] rounded-md p-3 space-y-2">
                    <div className="text-[11px] text-[#A0A0A0]">Add a rule</div>
                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <select aria-label="New rule type" value={nr.kind} onChange={(e) => setNr({ ...nr, kind: e.target.value })} className={inp}>{Object.keys(pm.rule_kinds).map((k) => <option key={k} value={k}>{pm.rule_kinds[k].help}</option>)}</select>
                      <select aria-label="New rule field" value={nr.column} onChange={(e) => setNr({ ...nr, column: e.target.value })} className={inp}>{cols.map((c) => <option key={c}>{c}</option>)}</select>
                      {nr.kind === "range" && (<><input aria-label="New rule minimum" type="number" value={nr.min} onChange={(e) => setNr({ ...nr, min: e.target.value })} className={inp + " w-20"} placeholder="min" /><input aria-label="New rule maximum" type="number" value={nr.max} onChange={(e) => setNr({ ...nr, max: e.target.value })} className={inp + " w-20"} placeholder="max" /></>)}
                      {nr.kind === "allowed" && <input aria-label="New rule values" value={nr.values} onChange={(e) => setNr({ ...nr, values: e.target.value })} className={inp + " w-48"} placeholder="a, b, c" />}
                      {nr.kind === "to_date" && <select aria-label="New rule date format" value={nr.fmt} onChange={(e) => setNr({ ...nr, fmt: e.target.value })} className={inp}>{DATE_FORMATS.map((f) => <option key={f}>{f}</option>)}</select>}
                      {nr.kind === "compare" && (<><select aria-label="New rule comparison" value={nr.op} onChange={(e) => setNr({ ...nr, op: e.target.value })} className={inp}>{COMPARE_OPS.map((o) => <option key={o}>{o}</option>)}</select><select aria-label="New rule other field" value={nr.column2} onChange={(e) => setNr({ ...nr, column2: e.target.value })} className={inp}><option value="">(choose)</option>{cols.map((c) => <option key={c}>{c}</option>)}</select></>)}
                      {nr.kind === "derive" && (<><select aria-label="New rule operation" value={ARITH_OPS.includes(nr.op) ? nr.op : "-"} onChange={(e) => setNr({ ...nr, op: e.target.value })} className={inp}>{ARITH_OPS.map((o) => <option key={o}>{o}</option>)}</select><select aria-label="New rule second field" value={nr.column2} onChange={(e) => setNr({ ...nr, column2: e.target.value })} className={inp}><option value="">(choose)</option>{cols.map((c) => <option key={c}>{c}</option>)}</select><input aria-label="New rule column name" value={nr.name} onChange={(e) => setNr({ ...nr, name: e.target.value })} className={inp + " w-32"} placeholder="new column" /></>)}
                      <button data-testid="add-rule" onClick={addRule} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md">Add</button>
                      <button data-testid="add-suggested" onClick={addSuggested} className="text-amber-400 hover:text-amber-300 underline">Add SAMM's suggestions I don't have yet</button>
                    </div>
                  </div>
                )}
                <label className="flex items-center gap-2 text-xs text-[#C0C0C0]">
                  <input type="checkbox" aria-label="Hide rows that break a rule" disabled={locked || !!built} checked={hide} onChange={(e) => setHide(e.target.checked)} />
                  Hide rows that break an active business rule from the Gold view (otherwise they are only flagged)
                </label>
                {pm.previous_rules && !locked && <button data-testid="restore-rules" onClick={() => setRules(pm.previous_rules)} className="text-[11px] text-[#A0A0A0] hover:text-white underline">Load the previous rules into the list</button>}
              </div>
            )}

            <ErrBox err={err} />
            {built ? (
              <div className="space-y-2" data-testid="editor-built">
                <div className="flex flex-wrap items-center gap-3 text-xs">
                  <span className="text-green-300">✓ Built <span className="font-mono">{built.view}</span> ({built.rows == null ? "?" : built.rows} rows, {built.mapped} fields renamed{built.hidden ? ", " + built.hidden + " hidden" : ""}, {built.rules_applied} rule(s) applied)</span>
                  <button onClick={() => { setBuilt(null); setQuality(null); }} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1.5 rounded-lg" data-testid="edit-again">Edit again</button>
                  {built.flags && <button onClick={runQuality} disabled={busy} data-testid="run-quality" className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1.5 rounded-lg disabled:opacity-50">Run quality check</button>}
                  <button onClick={() => onAsk(built.view)} className="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3 py-1.5 rounded-lg">Ask about this dataset</button>
                </div>
                {quality && (
                  <div data-testid="quality-result" className="text-xs bg-[#151515] border border-[#2D2D2D] rounded-md p-3 space-y-1">
                    <div className="text-white">{quality.quality.flagged} of {quality.quality.total} rows break at least one rule.</div>
                    {quality.quality.by_rule.map((r) => <div key={r.id} className="text-[#A0A0A0]">{r.rule}: <b className="text-white">{r.broken_rows}</b></div>)}
                    {quality.note && <div className="text-[#808080]">{quality.note}</div>}
                  </div>
                )}
              </div>
            ) : (
              <button onClick={build} disabled={busy || locked} data-testid="editor-build" className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-4 py-2 rounded-lg">
                {busy ? "Building Gold view..." : pm.view_exists ? "Approve changes & rebuild Gold view" : "Approve mapping & rules, build Gold view"}
              </button>
            )}
          </div>
        );
      }

      // ------------------------------------------------------------------
      // One onboarding job: the back end does the work, this card only shows progress and asks for approvals
      // ------------------------------------------------------------------
      const JOB_STATUS = {
        queued: "Starting...", running: "SAMM is working on it...", waiting: "Waiting for the Excel conversion to finish...",
        needs_approval: "Needs your confirmation", done: "Done", failed: "Stopped with an error",
      };
      function JobCard({ job, api, onUpdate, onAsk, onViewsChanged }) {
        const live = ["queued", "running", "waiting"].includes(job.status);
        const [busy, setBusy] = useState(false);
        const [err, setErr] = useState(null);
        const [choice, setChoice] = useState({});
        const [editing, setEditing] = useState(null);
        const notified = useRef(false);
        useEffect(() => {
          if (!live) return undefined;
          let stop = false;
          const t = setInterval(async () => {
            try { const r = await api({ action: "job_get", id: job.id }); if (!stop && r.job) onUpdate(r.job); } catch (e) { if (!stop) setErr(e); }
          }, 3000);
          return () => { stop = true; clearInterval(t); };
        }, [job.id, live]);
        useEffect(() => { if (job.status === "done" && !notified.current) { notified.current = true; onViewsChanged(); } }, [job.status]);

        const waiting = Object.entries(job.datasets || {}).filter(([, d]) => d.state === "approval");
        const act = async (payload) => {
          setBusy(true); setErr(null);
          try { const r = await api(payload); if (r.job) onUpdate(r.job); } catch (e) { setErr(e); } finally { setBusy(false); }
        };
        const approve = () => {
          const decisions = {};
          waiting.forEach(([ds, d]) => {
            decisions[ds] = {};
            d.queue.forEach((q) => {
              const v = choice[ds + "|" + q.column] !== undefined ? choice[ds + "|" + q.column] : q.suggestion;
              decisions[ds][q.column] = v === "__keep" ? "" : v === "__hide" ? "-" : v;
            });
          });
          act({ action: "job_resolve", id: job.id, decisions });
        };
        const bar = job.status === "failed" ? "bg-red-600" : job.status === "needs_approval" ? "bg-amber-500" : "bg-green-600";
        return (
          <div data-testid="job-card" className="space-y-3">
            <div className="flex flex-wrap items-center gap-2 text-[11px] font-mono">
              <span className="px-2 py-0.5 rounded bg-[#333] text-[#BBB]">{job.source === "screen" ? "from this screen" : "back-end drop"}</span>
              <span data-testid="job-status" className={job.status === "failed" ? "text-red-300" : job.status === "done" ? "text-green-300" : "text-amber-300"}>{JOB_STATUS[job.status] || job.status}</span>
              <span className="text-[#707070]">{job.progress}%</span>
            </div>
            <div className="h-1.5 bg-[#2D2D2D] rounded"><div className={"h-1.5 rounded " + bar} style={{ width: job.progress + "%" }} /></div>
            {job.note && <div className="text-xs text-[#C0C0C0]">{job.note}</div>}
            {job.error && <div data-testid="job-error" className="text-xs text-red-300">{job.error}</div>}
            {Object.entries(job.datasets || {}).map(([ds, d]) => (
              <div key={ds} className="text-xs font-mono flex flex-wrap gap-3 items-center">
                <span className="text-amber-400">{ds}</span>
                <span className="text-[#A0A0A0]">{d.state}</span>
                {d.view && <span className="text-green-300">→ {d.view}</span>}
                {d.view && <button onClick={() => onAsk(d.view)} className="underline text-amber-400 hover:text-amber-300">Ask about it</button>}
                {(d.state === "review" || d.view) && <button data-testid={"job-edit-" + ds} onClick={() => setEditing(editing === ds ? null : ds)} className="underline text-amber-400 hover:text-amber-300">{d.state === "review" ? "Review mapping & rules" : "Edit mapping & rules"}</button>}
                {d.error && <span className="text-red-300">{d.error}</span>}
              </div>
            ))}
            {editing && <MappingEditor key={editing} dataset={editing} jobId={(job.datasets[editing] || {}).state === "review" ? job.id : null} api={api} onAsk={onAsk}
              onBuilt={(j) => { if (j) onUpdate(j); onViewsChanged(); }} onClose={() => setEditing(null)} />}
            {waiting.length > 0 && (
              <div data-testid="job-approvals" className="border border-amber-700 rounded-lg p-3 space-y-2 bg-[#241E10]">
                <div className="text-xs text-amber-300 font-semibold">SAMM is not sure about these fields. Choose what each one should be, then approve.</div>
                {waiting.map(([ds, d]) => d.queue.map((q) => (
                  <div key={ds + q.column} className="flex flex-wrap items-center gap-3 text-xs font-mono">
                    <span className="text-white w-40 truncate" title={q.column}>{q.column}</span>
                    <span className="text-[#808080] max-w-[160px] truncate" title={(q.samples || []).join(", ")}>{(q.samples || []).join(", ")}</span>
                    <select aria-label={"Decision for " + q.column} value={choice[ds + "|" + q.column] !== undefined ? choice[ds + "|" + q.column] : q.suggestion}
                      onChange={(e) => setChoice({ ...choice, [ds + "|" + q.column]: e.target.value })}
                      className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white">
                      <option value={q.suggestion}>use "{q.suggestion}" ({Math.round(q.confidence * 100)}% sure)</option>
                      <option value="__keep">keep its own name</option>
                      <option value="__hide">hide from Gold</option>
                    </select>
                  </div>
                )))}
                <button data-testid="job-approve" onClick={approve} disabled={busy} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-xs px-4 py-2 rounded-lg">Approve and continue</button>
              </div>
            )}
            {job.status === "failed" && (
              <button data-testid="job-retry" onClick={() => act({ action: "job_retry", id: job.id })} disabled={busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-1.5 rounded-lg">Retry</button>
            )}
            <ErrBox err={err} />
            {(job.log || []).length > 0 && (
              <details className="text-[11px] text-[#808080]">
                <summary className="cursor-pointer">What SAMM did ({job.log.length} steps)</summary>
                <ul className="mt-1 space-y-0.5 font-mono">{job.log.map((l, i) => <li key={i}>{l.ts.slice(11, 19)} {l.msg}</li>)}</ul>
              </details>
            )}
          </div>
        );
      }

      function SelfTestPanel({ api, view }) {
        const [rows, setRows] = useState([]);
        const [busy, setBusy] = useState(false);
        const [done, setDone] = useState(null);
        const [err, setErr] = useState(null);
        const run = async () => {
          setBusy(true); setErr(null); setRows([]); setDone(null);
          try {
            let off = 0, all = [], total = 0;
            while (off !== null && off !== undefined) {
              const r = await api({ action: "selftest", offset: off, limit: 5, view: view || undefined });
              all = all.concat(r.results || []); total = r.total; setRows(all); off = r.next;
            }
            setDone({ total, bad: all.filter((x) => !x.ok).length });
          } catch (e) { setErr(e); } finally { setBusy(false); }
        };
        return (
          <div data-testid="selftest-panel" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <div>
              <h3 className="text-sm font-bold text-white">Self-test</h3>
              <p className="text-[11px] text-[#808080] mt-1">Asks SAMM about 24 different kinds of question, written from this dataset's real columns and values, and checks each query with Athena without scanning any data (no cost). A failure shows the exact reason.</p>
            </div>
            <button data-testid="selftest-run" disabled={busy} onClick={run} className="border border-[#3D3D3D] hover:border-amber-500 text-white text-xs px-3 py-1.5 rounded-md disabled:opacity-50">{busy ? "Testing..." : "Run self-test"}</button>
            {err && <ErrBox err={err} />}
            {done && <div data-testid="selftest-summary" className={"text-xs " + (done.bad ? "text-red-300" : "text-emerald-300")}>{done.total - done.bad} of {done.total} passed{done.bad ? " - " + done.bad + " need attention (listed below)" : ""}</div>}
            <div className="space-y-1 text-xs font-mono">
              {rows.map((r, i) => (
                <div key={i} className="flex gap-2"><span className={r.ok ? "text-emerald-400" : "text-red-400"}>{r.ok ? "PASS" : "FAIL"}</span><span className="text-[#D0D0D0]">{r.question}</span>{r.error && <span className="text-red-300 break-all">{r.error}</span>}</div>
              ))}
            </div>
          </div>
        );
      }

      function TeachPanel({ api }) {
        const [d, setD] = useState(null);
        const [err, setErr] = useState(null);
        const [msg, setMsg] = useState("");
        const [f, setF] = useState({ kind: "filter", phrase: "", column: "", op: "eq", value: "", fn: "count" });
        const inp = "bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-amber-500";
        const load = async () => { try { const r = await api({ action: "teach_list" }); if (!r || !r.taught || !r.columns) return; setD(r); setF((p) => ({ ...p, column: p.column || (r.columns[0] || {}).name || "" })); } catch (e) { setErr(e); } };
        useEffect(() => { load(); }, []);
        if (!d && !err) return null;
        if (err && !d) return <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5"><ErrBox err={err} /></div>;
        const save = async () => {
          setErr(null); setMsg("");
          try {
            const body = { action: "teach_save", kind: f.kind, phrase: f.phrase, column: f.column };
            if (f.kind === "filter") { body.op = f.op; body.value = f.value; }
            if (f.kind === "measure") body.fn = f.fn;
            const r = await api(body); setMsg(r.note); setF({ ...f, phrase: "", value: "" }); load();
          } catch (e) { setErr(e); }
        };
        const del = async (payload) => { setErr(null); try { await api({ action: "teach_delete", ...payload }); load(); } catch (e) { setErr(e); } };
        const rules = [];
        Object.entries(d.taught.aliases || {}).forEach(([p, c]) => rules.push({ p, t: "means the column " + c }));
        Object.entries(d.taught.filters || {}).forEach(([p, x]) => rules.push({ p, t: "filters " + x.column + " " + x.op + (x.value !== undefined ? " " + (Array.isArray(x.value) ? x.value.join(", ") : x.value) : "") }));
        Object.entries(d.taught.measures || {}).forEach(([p, x]) => rules.push({ p, t: "calculates " + x.fn + (x.column ? " of " + x.column : "") }));
        const noValue = f.op === "null" || f.op === "notnull";
        return (
          <div data-testid="teach-panel" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <div>
              <h3 className="text-sm font-bold text-white">Teach SAMM</h3>
              <p className="text-[11px] text-[#808080] mt-1">Your team's own words. Teach a phrase once (for example "overdue" means status is Pending) and everyone at this client can use it in questions.</p>
            </div>
            {d.unmatched.length > 0 && (
              <div data-testid="unmatched-list" className="space-y-1">
                <div className="text-[11px] text-[#A0A0A0]">Questions SAMM could not answer</div>
                {d.unmatched.slice(0, 6).map((u) => (
                  <div key={u.q} className="flex items-center gap-3 text-xs">
                    <span className="text-white font-mono truncate max-w-[60%]" title={u.q}>{u.q}</span>
                    <span className="text-[#707070]">asked {u.n}x</span>
                    <button onClick={() => setF({ ...f, phrase: u.q.toLowerCase().slice(0, 40) })} className="text-amber-400 hover:text-amber-300 underline">Teach this</button>
                    <button aria-label={"Dismiss " + u.q} onClick={() => del({ unmatched: u.q })} className="text-[#808080] hover:text-white">✕</button>
                  </div>
                ))}
              </div>
            )}
            <div className="flex flex-wrap items-center gap-2 text-xs">
              <input aria-label="Phrase" value={f.phrase} onChange={(e) => setF({ ...f, phrase: e.target.value })} placeholder="phrase, e.g. overdue" className={inp + " w-44"} />
              <select aria-label="Teach type" value={f.kind} onChange={(e) => setF({ ...f, kind: e.target.value })} className={inp}>
                <option value="filter">is a filter</option><option value="alias">is another name for a column</option><option value="measure">is a calculation</option>
              </select>
              {f.kind === "measure" && <select aria-label="Calculation" value={f.fn} onChange={(e) => setF({ ...f, fn: e.target.value })} className={inp}>{d.fns.map((x) => <option key={x}>{x}</option>)}</select>}
              {!(f.kind === "measure" && f.fn === "count") && <select aria-label="Teach column" value={f.column} onChange={(e) => setF({ ...f, column: e.target.value })} className={inp}>{d.columns.map((c) => <option key={c.name}>{c.name}</option>)}</select>}
              {f.kind === "filter" && <select aria-label="Filter operation" value={f.op} onChange={(e) => setF({ ...f, op: e.target.value })} className={inp}>{d.ops.map((x) => <option key={x}>{x}</option>)}</select>}
              {f.kind === "filter" && !noValue && <input aria-label="Filter value" value={f.value} onChange={(e) => setF({ ...f, value: e.target.value })} placeholder={f.op === "between" ? "5, 20" : f.op === "in" ? "a, b, c" : "value"} className={inp + " w-40"} />}
              <button data-testid="teach-save" onClick={save} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md">Teach</button>
            </div>
            <ErrBox err={err} />
            {msg && <div data-testid="teach-note" className="text-xs text-green-300">{msg}</div>}
            {rules.length > 0 && (
              <div className="space-y-1" data-testid="taught-list">
                {rules.map((r) => (
                  <div key={r.p} className="flex items-center gap-3 text-xs">
                    <span className="font-mono text-amber-400">{r.p}</span><span className="text-[#A0A0A0]">{r.t}</span>
                    <button aria-label={"Forget " + r.p} onClick={() => del({ phrase: r.p })} className="text-[#808080] hover:text-red-300">✕</button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      }

      function GoldViews({ api, onAsk, tick }) {
        const [rows, setRows] = useState(null);
        const [open, setOpen] = useState(null);
        const [err, setErr] = useState(null);
        const load = async () => { try { const r = await api({ action: "datasets" }); setRows((r.datasets || []).filter((d) => d.view)); } catch (e) { setErr(e); } };
        useEffect(() => { load(); }, [tick]);
        if (!rows && !err) return null;
        return (
          <div data-testid="gold-views" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <div>
              <h3 className="text-sm font-bold text-white">Your Gold views</h3>
              <p className="text-[11px] text-[#808080] mt-1">Views stay editable after they are built. The owner or an administrator can change the mapping and rules at any time; the old version is kept.</p>
            </div>
            <ErrBox err={err} />
            {rows && rows.length === 0 && <div className="text-xs text-[#808080]">No Gold views yet.</div>}
            {(rows || []).map((d) => (
              <div key={d.dataset} data-testid="gold-row" className="border border-[#2D2D2D] rounded-lg p-3 bg-[#1D1D1D] space-y-2">
                <div className="flex flex-wrap items-center gap-3 text-xs">
                  <span className="font-mono text-amber-400">{d.view}</span>
                  <span className="text-[#808080]">owner {d.owner || "none"}{d.built_at ? " · built " + String(d.built_at).slice(0, 10) : ""}</span>
                  {d.rules && d.rules.active > 0 && <span className="text-[#A0A0A0]">{d.rules.active} rule(s) active</span>}
                  <button onClick={() => onAsk(d.view)} className="underline text-amber-400 hover:text-amber-300">Ask about it</button>
                  <button data-testid={"gold-edit-" + d.dataset} onClick={() => setOpen(open === d.dataset ? null : d.dataset)} className="underline text-amber-400 hover:text-amber-300">{d.can_edit ? "Edit mapping & rules" : "View mapping & rules"}</button>
                </div>
                {open === d.dataset && <MappingEditor key={d.dataset} dataset={d.dataset} api={api} onAsk={onAsk} onClose={() => setOpen(null)} onBuilt={() => load()} />}
              </div>
            ))}
          </div>
        );
      }

      function OnboardingHub({ session, onAsk, onViewsChanged }) {
        const [items, setItems] = useState([]);
        const [over, setOver] = useState(false);
        const [pipe, setPipe] = useState({ busy: false, msg: "", err: null });
        const [jobs, setJobs] = useState([]);
        const [viewsTick, setViewsTick] = useState(0);
        const seq = useRef(0);
        const itemsRef = useRef([]);
        itemsRef.current = items;
        const api = (payload) => callBackend(session.url, session.token, payload);
        const upd = (id, patch) => setItems((p) => p.map((i) => (i.id === id ? { ...i, ...patch } : i)));
        const updDs = (id, ds, patch) =>
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { ...i.datasets[ds], ...patch } } } : i)));

        const loadJobs = async () => {
          try { const r = await api({ action: "jobs" }); setJobs(Array.isArray(r.jobs) ? r.jobs : []); } catch (_) { /* older back end: the manual flow below still works */ }
        };
        useEffect(() => { loadJobs(); const t = setInterval(loadJobs, 20000); return () => clearInterval(t); }, []);
        const mergeJob = (j) => setJobs((p) => (p.some((x) => x.id === j.id) ? p.map((x) => (x.id === j.id ? j : x)) : [j, ...p]));

        const loadMapping = async (id, ds) => {
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { open: true } } } : i)));
        };

        const runFile = async (id, file) => {
          try {
            upd(id, { stage: "upload", msg: "Requesting a secure upload link..." });
            const init = await api({ action: "upload_init", filename: file.name, size: file.size });
            upd(id, { msg: "Uploading to Bronze..." });
            await putFile(init.upload_url, file);
            upd(id, { stage: "bronze", msg: "Stored in Bronze. SAMM takes it from here..." });
            let started = null;
            try { started = await api({ action: "job_start", key: init.key }); } catch (e) {
              if (!(e && e.status === 400 && /unknown action/i.test(e.message || ""))) throw e;   // older back end: use the step-by-step flow below
            }
            if (started && started.job) { upd(id, { stage: "silver", msg: "", job: started.job }); return; }
            const ing = await api({ action: "ingest", key: init.key });
            if (ing.mode === "archived") {
              upd(id, { stage: "done", msg: ing.note, done: true });
              return;
            }
            let names = [];
            if (ing.mode === "done") {
              names = ing.datasets.map((d) => d.dataset);
            } else {
              upd(id, { stage: "silver", msg: ing.note + " Waiting for it to finish (up to 2 minutes)..." });
              for (let n = 0; n < 24 && names.length === 0; n++) {
                await sleep(5000);
                const r = await api({ action: "datasets", since: ing.since });
                names = r.datasets.map((d) => d.dataset);
              }
              if (names.length === 0) {
                throw new ApiError("The orchestrator has not produced any dataset yet.", [
                  "It may still be running: use 'Check for new datasets' below in a minute.",
                  "Check the CloudWatch logs of shiftleft-superposition-pipeline-orchestrator for errors.",
                ], 0);
              }
            }
            upd(id, { stage: "map", msg: "Reading columns and suggesting field mappings...", order: names, datasets: {} });
            for (const ds of names) await loadMapping(id, ds);
            upd(id, { msg: "Review the suggested mapping, then build the Gold view." });
          } catch (err) {
            upd(id, { error: err, msg: "Stopped." });
          }
        };

        const addFiles = (fileList) => {
          Array.from(fileList || []).forEach((file) => {
            const id = "f" + ++seq.current;
            setItems((p) => [{ id, name: file.name, size: file.size, stage: "upload", msg: "Queued", datasets: {}, order: [], error: null, done: false }, ...p]);
            runFile(id, file);
          });
        };

        const runPipeline = async () => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "run_pipeline" });
            setPipe({ busy: false, msg: "Pipeline started (" + r.function + "). Files already in Bronze are being converted. Click 'Check for new datasets' in a minute.", err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const checkNew = async (all) => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "datasets" });
            const fresh = all === true ? r.datasets : r.datasets.filter((d) => !d.view);
            if (fresh.length === 0) {
              setPipe({ busy: false, msg: all === true ? "No datasets found yet." : "No datasets are waiting for a Gold view.", err: null });
              return;
            }
            const id = "f" + ++seq.current;
            const order = fresh.map((d) => d.dataset);
            setItems((p) => [{ id, name: "Datasets already in Silver", size: 0, stage: "map", msg: "Review the mapping, then build (or rebuild) the Gold view.", datasets: {}, order, error: null, done: false }, ...p]);
            for (const ds of order) await loadMapping(id, ds);
            setPipe({ busy: false, msg: order.length + (all === true ? " dataset(s) loaded." : " dataset(s) found without a Gold view."), err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const badge = (st) => {
          const c = { auto: "bg-green-900 text-green-200", review: "bg-amber-900 text-amber-200", saved: "bg-blue-900 text-blue-200", new: "bg-[#333] text-[#BBB]", duplicate: "bg-[#333] text-[#BBB]", skip: "bg-[#333] text-[#777]" }[st] || "bg-[#333] text-[#BBB]";
          return <span className={"px-2 py-0.5 rounded text-[10px] font-mono " + c}>{st}</span>;
        };

        return (
          <div className="max-w-4xl mx-auto space-y-5" data-testid="onboarding-hub">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-4">
              <div>
                <h2 className="text-lg font-bold text-white">📦 Data Onboarding</h2>
                <p className="text-xs text-[#A0A0A0] mt-1">Upload raw files. SAMM lands them in Bronze, structures them in Silver, suggests how their fields map to your standard names, and builds a Gold view the chat can query. csv, tsv, json, jsonl, txt and Excel are structured; other formats are archived untouched.</p>
              </div>
              <label
                htmlFor="onb-file"
                onDragOver={(e) => { e.preventDefault(); setOver(true); }}
                onDragLeave={() => setOver(false)}
                onDrop={(e) => { e.preventDefault(); setOver(false); addFiles(e.dataTransfer.files); }}
                className={"block cursor-pointer text-center rounded-xl border-2 border-dashed p-8 text-sm transition " + (over ? "border-amber-500 bg-[#2A2418]" : "border-[#3D3D3D] hover:border-amber-600")}
              >
                <div className="text-white font-semibold">Drop files here, or click to choose</div>
                <div className="text-[11px] text-[#808080] mt-1">Up to 25 MB for csv/json/txt, 50 MB for Excel, 100 MB for archives</div>
                <input id="onb-file" data-testid="onb-file" type="file" multiple accept={ACCEPT} className="hidden" onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
              </label>
              <div className="flex flex-wrap items-center gap-3">
                <button onClick={runPipeline} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">▶ Run pipeline now</button>
                <button onClick={() => checkNew(false)} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">🔎 Check for new datasets</button>
                <button onClick={() => checkNew(true)} disabled={pipe.busy} data-testid="review-all" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">✏️ Review existing mappings</button>
                <span className="text-[11px] text-[#808080]">Run pipeline = convert files already in Bronze with your orchestrator.</span>
              </div>
              {pipe.msg && <div className="text-xs text-green-300">{pipe.msg}</div>}
              <ErrBox err={pipe.err} />
            </div>

            {jobs.filter((j) => !items.some((i) => i.job && i.job.id === j.id)).length > 0 && (
              <div data-testid="job-list" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-4">
                <div>
                  <h3 className="text-sm font-bold text-white">Recent onboarding jobs</h3>
                  <p className="text-[11px] text-[#808080] mt-1">Files from this screen and files dropped by other systems run the same job. Anything SAMM is unsure about waits here for you.</p>
                </div>
                {jobs.filter((j) => !items.some((i) => i.job && i.job.id === j.id)).slice(0, 8).map((j) => (
                  <div key={j.id} className="border border-[#2D2D2D] rounded-lg p-4 bg-[#1D1D1D] space-y-2" data-testid="job-row">
                    <div className="text-sm text-white font-mono truncate">{j.file}</div>
                    <JobCard job={j} api={api} onUpdate={mergeJob} onAsk={onAsk} onViewsChanged={onViewsChanged} />
                  </div>
                ))}
              </div>
            )}

            <GoldViews api={api} onAsk={onAsk} tick={viewsTick} />
            <TeachPanel api={api} />
            <SelfTestPanel api={api} />

            {items.map((it) => {
              const idx = STAGES.findIndex((s) => s[0] === it.stage);
              return (
                <div key={it.id} className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3" data-testid="onb-item">
                  <div className="flex justify-between items-center">
                    <div className="text-sm text-white font-mono truncate">{it.name}</div>
                    {it.size > 0 && <div className="text-[11px] text-[#808080]">{(it.size / 1024).toFixed(0)} KB</div>}
                  </div>
                  {it.job && <JobCard job={it.job} api={api} onUpdate={(j) => upd(it.id, { job: j })} onAsk={onAsk} onViewsChanged={onViewsChanged} />}
                  {!it.job && <div className="flex flex-wrap gap-2 text-[11px] font-mono">
                    {STAGES.map((s, n) => (
                      <span key={s[0]} className={"px-2 py-1 rounded border " + (it.done || n < idx ? "border-green-700 text-green-300" : n === idx && !it.error ? "border-amber-500 text-amber-300" : "border-[#333] text-[#707070]")}>
                        {(it.done || n < idx ? "✓ " : "") + s[1]}
                      </span>
                    ))}
                  </div>}
                  <div className="text-xs text-[#C0C0C0]" data-testid="onb-msg">{it.msg}</div>
                  <ErrBox err={it.error} />

                  {(it.order || []).map((ds) => it.datasets[ds] ? (
                    <MappingEditor key={ds} dataset={ds} api={api} onAsk={onAsk}
                      onBuilt={() => { upd(it.id, { stage: "gold", done: true, msg: "Gold view ready." }); onViewsChanged(); setViewsTick((n) => n + 1); }} />
                  ) : null)}
                </div>
              );
            })}
          </div>
        );
      }


      // ------------------------------------------------------------------
      // Governance: users and per-client policy (admins only; the server enforces everything)
      // ------------------------------------------------------------------
      function UnassignedPanel({ api, tenants }) {
        const [rows, setRows] = useState(null);
        const [to, setTo] = useState({});
        const [msg, setMsg] = useState("");
        const [err, setErr] = useState(null);
        const load = async () => { try { const r = await api({ action: "unassigned" }); setRows(r.datasets || []); } catch (e) { setErr(e); } };
        useEffect(() => { load(); }, []);
        const move = async (ds) => {
          setErr(null); setMsg("");
          try { const r = await api({ action: "dataset_move", dataset: ds, to_tenant: (to[ds] || "").trim() }); setMsg(r.note); } catch (e) { setErr(e); }
        };
        if (!rows && !err) return null;
        return (
          <div data-testid="unassigned-panel" className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 shadow space-y-3">
            <h3 className="text-sm font-bold text-white">Unassigned data</h3>
            <p className="text-[11px] text-[#808080]">Files dropped without a client land under UNASSIGNED_NEW_CLIENT. Pick the right client and SAMM copies the data across. The original is kept.</p>
            <ErrBox err={err} />
            {rows && rows.length === 0 && <div className="text-xs text-[#808080]">Nothing is waiting.</div>}
            {(rows || []).map((d) => (
              <div key={d.dataset} className="flex flex-wrap items-center gap-2 text-xs">
                <span className="font-mono text-amber-400">{d.dataset}</span>
                <input aria-label={"Move " + d.dataset + " to client"} list="unassigned-tenants" value={to[d.dataset] || ""} onChange={(e) => setTo({ ...to, [d.dataset]: e.target.value })} placeholder="client id" className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white font-mono w-40" />
                <button aria-label={"Move " + d.dataset} onClick={() => move(d.dataset)} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md">Move</button>
              </div>
            ))}
            <datalist id="unassigned-tenants">{(tenants || []).map((t) => <option key={t} value={t} />)}</datalist>
            {msg && <div data-testid="move-note" className="text-xs text-green-300">{msg}</div>}
          </div>
        );
      }

      function GovernanceHub({ session, identity }) {
        const api = (payload) => callBackend(session.url, session.token, payload);
        const [data, setData] = useState(null);
        const [err, setErr] = useState("");
        const [busy, setBusy] = useState(false);
        const [issued, setIssued] = useState(null);
        const [copied, setCopied] = useState(false);
        const [form, setForm] = useState({ email: "", role: "viewer", tenant_id: "", expires_days: "" });
        const [tenants, setTenants] = useState([]);
        const [policyTenant, setPolicyTenant] = useState(identity.tenant_id);
        const [pol, setPol] = useState(null);
        const [polMsg, setPolMsg] = useState("");
        const isSys = identity.role === "system_admin";

        const fail = (e) => setErr((e && e.message) || "Something went wrong.");
        const loadUsers = async () => {
          try { setData(await api({ action: "users" })); setErr(""); } catch (e) { fail(e); }
        };
        const loadPolicy = async (t) => {
          try {
            const r = await api({ action: "policy_get", tenant_id: t });
            const p = r.policy || {};
            setPol({ restricted: (p.restricted_columns || []).join(", "), caps: { ...(p.row_caps || {}) }, scan: p.scan_limit_gb == null ? "" : String(p.scan_limit_gb), auto: p.auto_approve_confidence == null ? "" : String(Math.round(p.auto_approve_confidence * 100)), mode: p.mapping_mode || "", pii: !!p.pii_scan, meta: r });
            setPolMsg("");
          } catch (e) { fail(e); }
        };
        useEffect(() => { loadUsers(); if (isSys) api({ action: "tenants" }).then((r) => setTenants(r.tenants || [])).catch(() => {}); }, []);
        useEffect(() => { loadPolicy(policyTenant); }, [policyTenant]);

        const save = async (payload) => {
          setBusy(true); setErr("");
          try {
            const r = await api({ action: "user_save", ...payload });
            if (r.token) { setIssued({ email: r.user.email, token: r.token }); setCopied(false); }
            await loadUsers();
            return true;
          } catch (e) { fail(e); return false; } finally { setBusy(false); }
        };
        const addUser = async (e) => {
          e.preventDefault();
          const payload = { email: form.email, role: form.role };
          if (isSys && form.tenant_id) payload.tenant_id = form.tenant_id;
          if (form.expires_days) payload.expires_days = Number(form.expires_days);
          if (await save(payload)) setForm({ ...form, email: "", expires_days: "" });
        };
        const copy = async () => {
          try { await navigator.clipboard.writeText(issued.token); setCopied(true); } catch (_) { setCopied(false); }
        };
        const savePolicy = async () => {
          setBusy(true); setPolMsg(""); setErr("");
          try {
            const caps = {};
            Object.keys(pol.caps).forEach((r) => { if (pol.caps[r] !== "" && pol.caps[r] != null) caps[r] = Number(pol.caps[r]); });
            await api({ action: "policy_save", tenant_id: policyTenant, policy: { restricted_columns: pol.restricted, row_caps: caps, scan_limit_gb: pol.scan === "" ? null : Number(pol.scan), auto_approve_confidence: pol.auto === "" ? null : Number(pol.auto), mapping_mode: pol.mode || null, pii_scan: !!pol.pii } });
            setPolMsg("Saved. It applies to the next request.");
          } catch (e) { fail(e); } finally { setBusy(false); }
        };

        const inp = "bg-[#151515] border border-[#3D3D3D] rounded-md px-2 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-amber-500";
        const btn = "px-3 py-1.5 rounded-md text-xs font-semibold bg-amber-500 text-black hover:bg-amber-400 disabled:opacity-50";
        const link = "text-xs underline text-[#A0A0A0] hover:text-white";
        const roles = (data && data.assignable_roles) || [];
        const rows = (data && data.users) || [];
        const boot = (data && data.bootstrap) || [];

        return (
          <div data-testid="governance-hub" className="max-w-3xl mx-auto space-y-5">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h2 className="text-lg font-bold text-white">🛡️ Governance</h2>
              <p className="text-xs text-[#A0A0A0] leading-relaxed">
                {isSys ? "You manage every client." : "You manage the users and policy of client " + identity.tenant_id + "."} Tokens are shown once and only a hash is stored. The server checks your role on every call.
              </p>
              {err && <div data-testid="gov-error" className="text-xs text-red-300 bg-red-900/20 border border-red-800 rounded-md p-2">{err}</div>}
              {issued && (
                <div data-testid="issued-token" className="text-xs bg-amber-500/10 border border-amber-600 rounded-md p-3 space-y-2">
                  <div className="text-amber-300 font-semibold">New access token for {issued.email}. It is shown only once.</div>
                  <div className="font-mono break-all text-white bg-[#151515] rounded p-2 select-all">{issued.token}</div>
                  <div className="flex gap-3 items-center">
                    <button onClick={copy} className={btn}>{copied ? "Copied" : "Copy token"}</button>
                    <button onClick={() => setIssued(null)} className={link}>I have saved it, hide</button>
                  </div>
                  <div className="text-[#A0A0A0]">Send it to the user privately. They paste it on the sign-in screen.</div>
                </div>
              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <h3 className="text-sm font-bold text-white">Add a user</h3>
              <form onSubmit={addUser} className="flex flex-wrap gap-2 items-end">
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">E-mail
                  <input aria-label="User e-mail" required value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} className={inp + " w-56"} placeholder="name@company.com" />
                </label>
                <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Role
