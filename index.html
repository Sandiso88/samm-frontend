            } catch (e) { if (live) setFacts({ loading: false, datasets: null, conns: null, last: "", err: e }); }
          })();
          return () => { live = false; };
        }, [client, demo]);
        const cards = [
          ["datasets", "Datasets", facts.datasets, "Bronze, Silver and Gold tables SAMM holds", canOnboard, "datasets"],
          ["connections", "Connections", facts.conns, "Files and databases data comes in from", canOnboard, "connections"],
          ["s3", "S3 bucket", null, "Every file stored for this client", canOnboard, "s3"],
          ["reports", "Reports", tiles.length, "Pinned and published reports", true, "dashboard"],
          ["chat", "Chat with SAMM", null, "Ask, build reports and manage, in plain words", role !== "report_viewer", "chat"],
        ].filter((c) => c[4]);
        return (
          <div className="max-w-5xl mx-auto space-y-6" data-testid="overview-hub">
            <div className="samm-crumbs" data-testid="overview-crumbs">Clients <span className="opacity-60">/</span> {clientName || client} <span className="opacity-60">/</span> <b>Overview</b></div>
            <div>
              <div className="samm-eyebrow" data-testid="overview-eyebrow">Overview</div>
              {facts.last && <p className="text-sm mt-2" style={{ color: "var(--muted)" }} data-testid="overview-last">Newest data arrived {String(facts.last).replace("T", " ").slice(0, 16)}</p>}
            </div>
            <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-5" data-testid="overview-tiles">
              {cards.map(([id, title, n, tip, , go]) => (
                <button key={id} data-testid={"tile-" + id} onClick={() => onGo(go)} className="samm-card samm-tile">
                  <div className="samm-eyebrow">{title}</div>
                  <div className="n mt-2">{facts.loading && n === null && id !== "chat" && id !== "s3" ? "…" : (n === null || n === undefined ? (id === "chat" || id === "s3" ? "→" : "–") : n)}</div>
                  <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{tip}</div>
                </button>
              ))}
            </div>
            {role !== "report_viewer" && (
              <form className="samm-card p-5 flex flex-wrap items-center gap-3" onSubmit={(e) => { e.preventDefault(); if (q.trim()) onAsk(q.trim()); }}>
                <label htmlFor="overview-ask" className="samm-eyebrow w-full">Ask a question straight away</label>
                <input id="overview-ask" data-testid="overview-ask" value={q} onChange={(e) => setQ(e.target.value)} placeholder="For example: what is the total contract value per site?" className="flex-1 min-w-[220px] bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-amber-500" />
                <button data-testid="overview-ask-go" type="submit" disabled={!q.trim()} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-40 text-white text-sm font-semibold px-5 py-3 rounded-lg">Ask SAMM</button>
              </form>
            )}
            {facts.err && <ErrBox err={facts.err} />}
          </div>
        );
      }

      // v44: a read-only look at the files this client has in the S3 ingest bucket
      function S3Browser({ api }) {
        const [view, setView] = useState({ loading: true, err: null, data: null });
        const [prefix, setPrefix] = useState("");
        const [q, setQ] = useState("");
        const [term, setTerm] = useState("");
        const load = async (p, search) => {
          setView((v) => ({ ...v, loading: true, err: null }));
          try { const data = await api({ action: "s3_browse", prefix: p || undefined, q: search || undefined }); setView({ loading: false, err: null, data }); }
          catch (e) { setView({ loading: false, err: e, data: null }); }
        };
        useEffect(() => { load(prefix, term); }, [prefix, term]);
        const d = view.data;
        const crumbs = () => {
          if (!prefix) return [];
          const root = (d && d.root) || "";
          const out = [];
          if (root) out.push({ label: (d && d.layer) || "Folder", to: root });
          const rest = prefix.slice(root.length).split("/").filter(Boolean);
          rest.forEach((seg, i) => out.push({ label: seg, to: root + rest.slice(0, i + 1).join("/") + "/" }));
          return out;
        };
        const fileRows = (files) => (
          <div className="overflow-x-auto"><table className="w-full text-xs" data-testid="s3-files"><thead><tr className="text-left" style={{ color: "var(--muted)" }}><th className="py-1.5 pr-3">File</th><th className="py-1.5 pr-3">Size</th><th className="py-1.5 pr-3">Last changed</th><th className="py-1.5">Area</th></tr></thead>
            <tbody>{files.map((f) => (
              <tr key={f.prefix + f.name} data-testid="s3-file" className="border-t border-[#2D2D2D]"><td className="py-1.5 pr-3 font-mono break-all text-white">{term ? f.path : f.name}</td><td className="py-1.5 pr-3 whitespace-nowrap">{f.size}</td><td className="py-1.5 pr-3 whitespace-nowrap">{f.last}</td><td className="py-1.5" style={{ color: "var(--muted)" }}>{f.layer}</td></tr>
            ))}</tbody></table></div>
        );
        return (
          <div className="space-y-4" data-testid="s3-browser">
            <div className="flex flex-wrap items-end justify-between gap-3">
              <div>
                <h3 className="text-sm font-bold text-white">S3 bucket</h3>
                <p className="text-[11px] mt-1" style={{ color: "var(--faint)" }}>Every file this client has in the ingest bucket{d && d.bucket ? " (" + d.bucket + ")" : ""}. Read-only: you can look, not change. To remove data use Remove on the Silver or Gold tab.</p>
              </div>
              <form className="flex gap-2" onSubmit={(e) => { e.preventDefault(); setTerm(q.trim()); }}>
                <input data-testid="s3-search" aria-label="Search file names" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Search file names" className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-lg px-3 py-1.5 text-xs text-white w-52 focus:outline-none focus:border-amber-500" />
                <button data-testid="s3-search-go" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-1.5 rounded-lg">Search</button>
                {term && <button type="button" data-testid="s3-search-clear" onClick={() => { setQ(""); setTerm(""); }} className="text-xs underline" style={{ color: "var(--muted)" }}>Clear</button>}
              </form>
            </div>
            <ErrBox err={view.err} />
            {view.loading && <div className="text-xs text-[#A0A0A0]">Loading...</div>}
            {d && d.mode === "top" && !term && (<>
              <div data-testid="s3-totals" className="text-xs" style={{ color: "var(--soft)" }}>{d.totals.files} file{d.totals.files === 1 ? "" : "s"} · {d.totals.size}{d.totals.last ? " · newest " + d.totals.last : ""}</div>
              <div className="grid gap-3 sm:grid-cols-3">
                {d.areas.map((a) => (
                  <button key={a.prefix} data-testid="s3-area" onClick={() => setPrefix(a.prefix)} className="samm-card samm-tile">
                    <div className="samm-eyebrow">{a.label}</div>
                    <div className="n mt-2">{a.files}{a.truncated ? "+" : ""}</div>
                    <div className="text-xs mt-1" style={{ color: "var(--muted)" }}>{a.size}{a.last ? " · " + a.last : ""}</div>
                  </button>
                ))}
              </div>
              {d.totals.files === 0 && <div className="text-xs text-[#808080]" data-testid="s3-empty">No files yet for this client.</div>}
            </>)}
            {d && d.mode === "folder" && !term && (<>
              <div className="flex flex-wrap items-center gap-1 text-xs" data-testid="s3-crumbs">
                <button data-testid="s3-up" onClick={() => setPrefix("")} className="underline" style={{ color: "var(--muted)" }}>All areas</button>
                {crumbs().map((c) => <span key={c.to} className="flex items-center gap-1"><span className="opacity-60">/</span><button onClick={() => setPrefix(c.to)} className={c.to === prefix ? "text-white font-semibold" : "underline"} style={c.to === prefix ? undefined : { color: "var(--muted)" }}>{c.label}</button></span>)}
              </div>
              {d.folders.length > 0 && <div className="flex flex-wrap gap-2">{d.folders.map((f) => <button key={f.prefix} data-testid="s3-folder" onClick={() => setPrefix(f.prefix)} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-1.5 rounded-lg font-mono">📁 {f.name}</button>)}</div>}
              {d.files.length > 0 ? fileRows(d.files) : (d.folders.length === 0 && <div className="text-xs text-[#808080]">This folder is empty.</div>)}
              {d.truncated && <div className="text-[11px] text-amber-300">Only the first entries are shown. Search by file name to find a specific file.</div>}
            </>)}
            {d && d.mode === "search" && (<>
              <div className="text-xs" style={{ color: "var(--soft)" }} data-testid="s3-found">{d.found} file{d.found === 1 ? "" : "s"} match “{d.q}”{d.found > d.files.length ? " (showing the newest " + d.files.length + ")" : ""}{d.truncated ? ". The search stopped at the first 20,000 files." : ""}</div>
              {d.files.length > 0 && fileRows(d.files)}
            </>)}
          </div>
        );
      }

      // ------------------------------------------------------------------
      // v61: guided onboarding for one client: Connect -> Choose tables -> Link -> Map & calculate.
      // Every step reuses what SAMM already does (extract, automatic linking, field mapping and rules). This only puts it in order.
      // ------------------------------------------------------------------
      const WIZ_STEPS = [["connect", "Connect", "Name the client and say where its data comes from"], ["tables", "Choose tables", "Pick the tables you want and bring them in"]];
      const WIZ_ORDER = ["connect", "tables"];
      // v62: after the data is in Bronze the rest of the flow lives in Datasets > Links & drill-down
      const DS_STEPS = [["choose", "Choose tables", "Pick the tables to link"], ["link", "Link", "SAMM links the tables that belong together"], ["review", "Review links", "Check, approve or undo the links"], ["map", "Mapping & calculations", "Standard names, calculated fields and views"], ["ready", "Move to reporting", "Your Gold views are ready for the analysts"]];
      const DS_ORDER = ["choose", "link", "review", "map", "ready"];
      const wizSlug = (x) => { let n = String(x || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 60); if (n && !/^[a-z]/.test(n)) n = "f_" + n; return n; };

      function OnboardStepper({ phase, reached, onGo, clientLabel, steps, order, prefix, testid, lead }) {
        const STEPS = steps || WIZ_STEPS, ORDER = order || WIZ_ORDER, PRE = prefix || "step-";
        const cur = ORDER.indexOf(phase);
        return (
          <div data-testid={testid || "onb-stepper"} className="space-y-2">
            <ol className="flex flex-wrap items-center gap-2 text-xs">
              {STEPS.map(([id, label, tip], n) => {
                const done = n < cur, now = n === cur, can = n <= reached && !now;
                return (
                  <li key={id} className="flex items-center gap-2">
                    <button type="button" data-testid={PRE + id} aria-current={now ? "step" : undefined} disabled={!can} title={tip} onClick={() => onGo(id)}
                      className={"flex items-center gap-2 px-3 py-1.5 rounded-lg font-semibold border transition " + (now ? "border-amber-500 bg-amber-500/10 text-amber-300" : done ? "border-green-700 text-green-300 hover:border-green-500" : "border-[#3D3D3D] text-[#808080]") + (can ? "" : " cursor-default")}>
                      <span className={"w-5 h-5 rounded-full text-[10px] flex items-center justify-center border " + (now ? "border-amber-500" : done ? "border-green-600" : "border-[#4a4a4a]")}>{done ? "✓" : n + 1}</span>{label}
                    </button>
                    {n < STEPS.length - 1 && <span className="text-[#4b5a7a]" aria-hidden="true">›</span>}
                  </li>
                );
              })}
            </ol>
            {clientLabel && <div data-testid={(testid || "onb-stepper") + "-client"} className="text-[11px] text-[#808080]">{lead || "Onboarding data for"} <b className="text-white">{clientLabel}</b></div>}
          </div>
        );
      }

      function WizBar({ back, backLabel, next, nextLabel, nextOff, hint, testid, alt }) {
        return (
          <div data-testid={testid || "wiz-bar"} className="flex flex-wrap items-center gap-3 pt-1">
            {back && <button type="button" data-testid="wiz-back" onClick={back} className="border border-[#3D3D3D] hover:border-amber-500 text-white text-sm px-4 py-2 rounded-lg">← {backLabel || "Back"}</button>}
            <span data-testid="wiz-hint" className="flex-1 min-w-[12rem] text-[11px] text-[#A0A0A0]">{hint}</span>
            {alt && <button type="button" data-testid="wiz-alt" onClick={alt.onClick} disabled={alt.busy} className="text-xs text-amber-400 hover:text-amber-300 underline disabled:opacity-60">{alt.label}</button>}
            {next && <button type="button" data-testid="wiz-next" onClick={next} disabled={nextOff} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-5 py-2 rounded-lg">{nextLabel} →</button>}
          </div>
        );
      }

      // Step 3: this client's tables are ticked for linking and SAMM links the ones that belong together on its own.
      function WizLink({ api, role, datasets, onBack, onNext, backLabel }) {
        const [st, setSt] = useState({ busy: true, prog: "", text: "", err: null, tick: 0 });
        const key = datasets.join("|");
        useEffect(() => {
          let live = true;
          (async () => {
            setSt((s) => ({ ...s, busy: true, prog: "Choosing this client's tables...", text: "", err: null }));
            try {
              let cur = [];
              try { const sc = await api({ action: "links_scope_get" }); cur = sc && Array.isArray(sc.selected) ? sc.selected : []; } catch (_) { /* start from this onboarding's tables */ }
              await api({ action: "links_scope_set", datasets: Array.from(new Set([...cur, ...datasets])) });
              const r = await autoLinkRun(api, (p) => { if (live) setSt((s) => ({ ...s, prog: p })); }, undefined, true);
              try { await api({ action: "drill_auto" }); } catch (_) { /* drill-downs are a bonus */ }
              if (live) setSt((s) => ({ ...s, busy: false, prog: "", text: r.text || (datasets.length < 2 ? "There is only one table so far, so there is nothing to link yet." : "SAMM found no new links to make."), tick: s.tick + 1 }));
            } catch (e) { if (live) setSt((s) => ({ ...s, busy: false, prog: "", err: e, tick: s.tick + 1 })); }
          })();
          return () => { live = false; };
        }, [key]);
        return (
          <div data-testid="wiz-link" className="space-y-4">
            <div className="rounded-xl border border-[#2D2D2D] p-4 space-y-2">
              <div className="text-sm font-semibold text-white">Link this client's tables</div>
              <p className="text-xs text-[#A0A0A0]">SAMM compares the values in each table (for example site codes or fiscal years) and links the tables that belong together. Links it is sure about are approved for you; the rest wait for your decision in the next step. Only the tables you chose are used.</p>
              {st.busy && <div data-testid="wiz-link-busy" className="text-xs text-amber-300">⏳ {st.prog || "Working..."}</div>}
              {!st.busy && st.text && <div data-testid="wiz-link-result" className="text-xs text-green-300">{st.text}</div>}
              <ErrBox err={st.err} />
            </div>
            <WizBar back={onBack} backLabel={backLabel || "Back"} next={onNext} nextLabel="Next: review the links" nextOff={st.busy} hint={st.busy ? "Linking... this takes a moment." : "Done. Press Next to review the links."} />
          </div>
        );
      }

      // Step 4, one table: how much SAMM matched by itself, calculations and views it suggests, your own fields, then the mapping editor.
      function MapCard({ api, d, open, onToggle, onAsk, onBuilt }) {
        const [sug, setSug] = useState(null);
        const [err, setErr] = useState(null);
        const [extra, setExtra] = useState([]);
        const [note, setNote] = useState("");
        const [f, setF] = useState({ kind: "calc", name: "", a: "", op: "*", b: "", num: "", useNum: false, value: "" });
        const [built, setBuilt] = useState(0);
        const load = async () => { try { setSug(await api({ action: "calc_suggest", dataset: d.ds })); setErr(null); } catch (e) { setErr(e); } };
        useEffect(() => { if (open && !sug && !err) load(); }, [open]);
        const title = (d.view && titleOf(d.view)) || friendlyDs(d.ds);
        const cols = sug ? (sug.columns || []) : [];
        const numCols = cols.filter((c) => c.kind === "double").length >= 2 ? cols.filter((c) => c.kind === "double") : cols;
        const names = new Set([...(sug ? (sug.added || []).map((a) => a.name) : []), ...extra.map((r) => r.name)]);
        const addRule = (rule, text) => {
          if (names.has(rule.name)) { setNote("There is already a field called " + rule.name + "."); return; }
          setExtra((p) => [...p, rule]); setNote(text + " Press Approve below to build it into the Gold view.");
        };
        const addCustom = () => {
          const name = wizSlug(f.name);
          if (!name) { setNote("Give the new field a name."); return; }
          if (f.kind === "calc") {
            if (!f.a) { setNote("Choose the first field."); return; }
            if (!f.useNum && !f.b) { setNote("Choose the second field, or a number."); return; }
            if (f.useNum && (f.num === "" || !isFinite(Number(f.num)))) { setNote("Type the number to use."); return; }
            addRule({ kind: "derive", column: f.a, ...(f.useNum ? {} : { column2: f.b }), params: { op: f.op, ...(f.useNum ? { const: Number(f.num) } : {}) }, name, status: "active", origin: "user" }, "Added the calculated field " + name + ".");
          } else {
            if (f.value === "") { setNote("Type the value every row should have."); return; }
            addRule({ kind: "constant", column: "", params: { value: f.value }, name, status: "active", origin: "user" }, "Added the field " + name + ".");
          }
          setF({ ...f, name: "", num: "", value: "" });
        };
        const inp = "bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white text-xs focus:outline-none focus:border-amber-500";
        const m = sug && sug.mapping;
        const ready = d.state === "done" || d.state === "review";
        return (
          <div data-testid="map-card" className="border border-[#2D2D2D] rounded-xl bg-[#1B1B1B]">
            <button type="button" data-testid="map-card-head" aria-expanded={open} onClick={onToggle} className="w-full flex flex-wrap items-center gap-3 px-4 py-3 text-left">
              <span className="text-sm font-semibold text-white">{title}</span>
              <span className="text-[11px] font-mono text-[#808080]">{d.ds}</span>
              <span className="flex-1" />
              {m && <span data-testid="map-summary-chip" className="text-[10px] font-mono px-2 py-0.5 rounded bg-green-900 text-green-200">{m.matched} of {m.fields} matched</span>}
              {built > 0 && <span className="text-[10px] font-mono px-2 py-0.5 rounded bg-blue-900 text-blue-200">Gold view updated</span>}
              <span aria-hidden="true" className="text-[#808080]">{open ? "▾" : "▸"}</span>
            </button>
            {open && (
              <div className="px-4 pb-4 space-y-4">
                {!ready && <div data-testid="map-notready" className="text-xs text-amber-200 bg-[#241E10] border border-amber-800 rounded p-2">SAMM is still bringing this table in. Answer anything it asks in Connections, then come back here.</div>}
                <ErrBox err={err} />
                {ready && !sug && !err && <div className="text-xs text-[#A0A0A0]">SAMM is reading the table...</div>}
                {ready && sug && (<>
                  <div data-testid="map-auto" className="text-xs text-[#C0C0C0]">
                    SAMM matched <b className="text-white">{m.matched}</b> of {m.fields} fields to your standard names on its own{m.review ? "; " + m.review + " need a look" : ""}{m.own_name ? "; " + m.own_name + " keep their own name" : ""}{m.hidden ? "; " + m.hidden + " copies are hidden" : ""}. Check the table below, add what you need, then press Approve.
                  </div>
                  {note && <div data-testid="map-note" className="text-xs text-green-300">{note}</div>}
                  <div className="space-y-2">
                    <div className="text-xs font-semibold text-white">Suggested calculations</div>
                    {sug.calculations.length === 0 && <div className="text-[11px] text-[#808080]">No obvious calculation for this table. You can add your own below.</div>}
                    {sug.calculations.map((c) => {
                      const on = names.has(c.name) || extra.some((r) => r.name === c.name);
                      return (
                        <div key={c.id} data-testid="calc-suggestion" className="flex flex-wrap items-center gap-2 text-xs bg-[#151515] border border-[#2D2D2D] rounded-md p-2">
                          <span className="font-mono text-white">{c.name}</span><span className="text-[#C0C0C0]">= {c.label}</span><span className="text-[#808080] flex-1 min-w-[10rem]">{c.why}</span>
                          <button type="button" data-testid="calc-add" disabled={on} onClick={() => addRule(c.rule, "Added " + c.name + ".")} className="border border-[#3D3D3D] hover:border-amber-500 disabled:opacity-60 text-white px-3 py-1 rounded-md">{on ? "Added ✓" : "Add"}</button>
                        </div>
                      );
                    })}
                  </div>
                  <div className="space-y-2">
                    <div className="text-xs font-semibold text-white">Add a field of your own</div>
                    <div className="flex flex-wrap items-center gap-2 text-xs">
                      <select data-testid="add-kind" aria-label="What to add" value={f.kind} onChange={(e) => setF({ ...f, kind: e.target.value })} className={inp}><option value="calc">Calculated field</option><option value="constant">Field with a fixed value</option></select>
                      <input data-testid="add-name" aria-label="Name of the new field" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="name, e.g. total_with_vat" className={inp + " w-44"} />
                      {f.kind === "calc" ? (<>
                        <span className="text-[#808080]">=</span>
                        <select data-testid="add-a" aria-label="First field" value={f.a} onChange={(e) => setF({ ...f, a: e.target.value })} className={inp}><option value="">(first field)</option>{numCols.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}</select>
                        <select data-testid="add-op" aria-label="Operation" value={f.op} onChange={(e) => setF({ ...f, op: e.target.value })} className={inp}>{["*", "/", "+", "-"].map((o) => <option key={o}>{o}</option>)}</select>
                        {f.useNum
                          ? <input data-testid="add-num" aria-label="A number" type="number" value={f.num} onChange={(e) => setF({ ...f, num: e.target.value })} className={inp + " w-24"} placeholder="number" />
                          : <select data-testid="add-b" aria-label="Second field" value={f.b} onChange={(e) => setF({ ...f, b: e.target.value })} className={inp}><option value="">(second field)</option>{numCols.map((c) => <option key={c.name} value={c.name}>{c.name}</option>)}</select>}
                        <label className="flex items-center gap-1 text-[#C0C0C0]"><input data-testid="add-usenum" type="checkbox" checked={f.useNum} onChange={(e) => setF({ ...f, useNum: e.target.checked })} /> use a number instead</label>
                      </>) : (<>
                        <span className="text-[#808080]">=</span>
                        <input data-testid="add-value" aria-label="Value on every row" value={f.value} onChange={(e) => setF({ ...f, value: e.target.value })} placeholder="value on every row" className={inp + " w-44"} />
                      </>)}
                      <button type="button" data-testid="add-field" onClick={addCustom} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1 rounded-md">Add</button>
                    </div>
                    {(sug.added || []).length > 0 && <div className="text-[11px] text-[#808080]">Already in the Gold view: {(sug.added || []).map((a) => a.text).join("; ")}.</div>}
                  </div>
                  <div className="space-y-1">
                    <div className="text-xs font-semibold text-white">Suggested views</div>
                    {sug.views.length === 0 && <div className="text-[11px] text-[#808080]">No view to suggest yet.</div>}
                    {sug.views.map((v) => (
                      <div key={v.question} data-testid="view-suggestion" className="flex flex-wrap items-center gap-2 text-xs">
                        <span className="text-[#C0C0C0] flex-1 min-w-[10rem]">{v.question}</span>

              {links && links.length > 0 && (

            </div>
            <WizBar back={onBack} backLabel="Back to mapping" next={onReports} nextLabel="Move to reporting" nextOff={!built.length} hint={built.length ? "Opens Reports for " + (clientLabel || "this client") + ", where analysts pick these views and join them." : "Build at least one Gold view first."} />
          </div>

      // v62: Datasets > Links & drill-down is the guided flow after the data is in Bronze: Link, Map & calculate, Move to reporting.
      function DatasetsWizard({ api, role, clientLabel, phase, reached, onGo, onAsk, onChanged, onReports, onConnections, sel, onSel }) {
        const [rows, setRows] = useState(null);
        const [meta, setMeta] = useState({});        // what each table is (main, lookup or shared list; files or database; links), when the server can say
        const [err, setErr] = useState(null);
        const [tick, setTick] = useState(0);
        useEffect(() => {
          let live = true;
          (async () => {
            let m = null;
            try { const sc = await api({ action: "links_scope_get" }); if (sc && Array.isArray(sc.tables)) { m = {}; sc.tables.forEach((t) => { m[t.dataset] = t; }); } } catch (_) { /* the list still works without the extra detail */ }
            try { const r = await api({ action: "datasets" }); if (live) { if (m) setMeta(m); setRows(r.datasets || []); setErr(null); } } catch (e) { if (live) { setErr(e); setRows((x) => x || []); } }
          })();
          return () => { live = false; };
        }, [tick]);
        const everyDs = (rows || []).map((d) => ({ ds: d.dataset, state: "done", view: d.view || "", jobId: null }));
        const chosen = sel === null ? everyDs.map((d) => d.ds) : everyDs.map((d) => d.ds).filter((x) => sel.includes(x));
        const ds = everyDs.filter((d) => chosen.includes(d.ds));
        const toggle = (x) => onSel(chosen.includes(x) ? chosen.filter((y) => y !== x) : [...chosen, x]);
        const publishAll = async () => {
          const tg = (await api({ action: "batch_targets", datasets: ds.filter((d) => d.view).map((d) => d.ds) })).targets || [];
          let ok = 0, bad = 0;
          for (const t of tg) { try { await api({ action: "report_publish", dataset: t.dataset }); ok++; } catch (_) { bad++; } }
          onChanged();
          return ok ? "Published " + ok + " report" + (ok === 1 ? "" : "s") + (bad ? " (" + bad + " could not be published)" : "") + ". Find them under Reports." : "No report could be published yet. Open a view in Reports to build one.";
        };
        return (
          <div data-testid="ds-wizard" className="space-y-4">
            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-5 space-y-3">
              <div>
                <h3 className="text-sm font-bold text-white">Get {clientLabel || "this client"}'s data ready for reporting</h3>
                <p className="text-[11px] text-[#808080] mt-1">Five steps with Next: choose the tables, SAMM links them, you review the links, SAMM maps the fields and suggests calculations, then the Gold views are ready for analysts to join and report on.</p>
              </div>
              <OnboardStepper phase={phase} reached={reached} onGo={onGo} steps={DS_STEPS} order={DS_ORDER} prefix="dstep-" testid="ds-stepper" lead="Working on" clientLabel={clientLabel} />
            </div>
            <ErrBox err={err} />
            {rows === null && <div data-testid="ds-loading" className="text-xs text-[#A0A0A0]">Loading this client's tables...</div>}
            {rows !== null && everyDs.length === 0 && (
              <div data-testid="ds-empty" className="rounded-xl border border-amber-800 bg-[#241E10] p-4 text-xs text-amber-200 space-y-2">
                <div>{clientLabel || "This client"} has no tables yet. Bring data in on Connections first, then come back here.</div>
                <button type="button" data-testid="ds-to-connections" onClick={onConnections} className="border border-[#3D3D3D] hover:border-amber-500 text-white px-3 py-1.5 rounded-lg">Go to Connections</button>
              </div>
            )}
            {rows !== null && everyDs.length > 0 && phase === "choose" && <WizChoose rows={everyDs} meta={meta} chosen={chosen} clientLabel={clientLabel} onToggle={toggle} onAll={(on) => onSel(on ? everyDs.map((d) => d.ds) : [])} onNext={() => onGo("link")} />}
            {rows !== null && everyDs.length > 0 && phase === "link" && <WizLink api={api} role={role} datasets={chosen} onBack={() => onGo("choose")} backLabel="Back to the tables" onNext={() => onGo("review")} />}
            {rows !== null && everyDs.length > 0 && phase === "review" && <WizReview api={api} role={role} onBack={() => onGo("link")} onNext={() => onGo("map")} />}
            {rows !== null && everyDs.length > 0 && phase === "map" && <WizMap api={api} datasets={ds} onAsk={onAsk} onBuilt={() => { onChanged(); setTick((n) => n + 1); }} onBack={() => onGo("review")} onNext={() => onGo("ready")} nextLabel="Next: move to reporting" />}
            {rows !== null && everyDs.length > 0 && phase === "ready" && <WizReady api={api} datasets={ds} clientLabel={clientLabel} onAsk={onAsk} onReports={onReports} onBack={() => onGo("map")} onPublish={publishAll} />}
          </div>
        );
      }

      function OnboardingHub({ session, onAsk, onViewsChanged, clients, clientNames, acting, mode, onMode, canAddClient, onClientsChanged }) {
        const [items, setItems] = useState([]);
        const [over, setOver] = useState(false);
        const [pipe, setPipe] = useState({ busy: false, msg: "", err: null });
        const [history, setHistory] = useState({ open: false, loading: false, list: [], limit: 10, client: null, err: null });
        const [order, setOrderState] = useState(() => { try { return localStorage.getItem("samm_hist_order") === "oldest" ? "oldest" : "newest"; } catch (_) { return "newest"; } });
        const setOrder = (o) => { setOrderState(o); try { localStorage.setItem("samm_hist_order", o); } catch (_) { /* optional */ } };
        const sortedHistory = history.list.slice().sort((a, b) => (String(a.created || "") < String(b.created || "") ? -1 : 1) * (order === "oldest" ? 1 : -1));
        const [viewsTick, setViewsTick] = useState(0);
        const DS_TABS = ["bronze", "silver", "links", "gold", "describe", "access", "tools"];
        const [tab, setTab] = useState(mode === "connections" ? "upload" : "gold");
        useEffect(() => { setTab((t) => (mode === "connections" ? "upload" : (DS_TABS.includes(t) ? t : "gold"))); }, [mode]);
        const goTab = (id) => { if (DS_TABS.includes(id) && mode === "connections" && onMode) onMode("datasets"); setTab(id); };
        const [autoMsg, setAutoMsg] = useState("");
        const autoBusy = useRef(false);
        const autoTimer = useRef(null);
        const runAutoLink = () => {   // a new Gold view exists: link it to the client's other tables without being asked
          clearTimeout(autoTimer.current);
          autoTimer.current = setTimeout(async () => {
            if (autoBusy.current) return;
            autoBusy.current = true;
            try { const r = await autoLinkRun(api, setAutoMsg); setAutoMsg(r.text); } catch (_) { setAutoMsg(""); } finally { autoBusy.current = false; }
          }, 2500);
        };
        const viewsChanged = () => { onViewsChanged(); runAutoLink(); };
        const seq = useRef(0);
        const itemsRef = useRef([]);
        itemsRef.current = items;
        const prevCount = useRef(0);
        const [shutItems, setShutItems] = useState({});   // v58: upload cards can be collapsed; a new one opens and the earlier ones close
        useEffect(() => {
          if (items.length > prevCount.current && items.length > 1) setShutItems((s) => { const n = { ...s }; items.forEach((i, k) => { n[i.id] = k !== 0; }); return n; });
        }, [items.length]);
        useEffect(() => {   // a newly dropped file appears right under the toolbar: bring it into view
          if (items.length > prevCount.current) { const el = document.querySelector("[data-testid=onb-toolbar]"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start", behavior: "smooth" }); }
          prevCount.current = items.length;
        }, [items.length]);
        const api = (payload) => callBackend(session.url, session.token, payload);
        const [target, setTarget] = useState("");
        const NONE_CLIENT = "__none__";
        // v61: the client is chosen on purpose. "" / NONE = not chosen yet, NEW = a new client is being named
        const nowClient = () => (target === NONE_CLIENT || target === NEW_CLIENT ? undefined : (target || acting || window.__sammClient || window.__sammHome || undefined));
        const [phase, setPhase] = useState("connect");        // v61: connect -> tables -> link -> map -> done
        const [reached, setReached] = useState(0);
        const goPhase = (p) => {
          setPhase(p); setReached((r) => Math.max(r, WIZ_ORDER.indexOf(p)));
          setTimeout(() => { const el = document.querySelector("[data-testid=onb-stepper]"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "start", behavior: "smooth" }); }, 50);
        };
        const dbPhase = (p) => { setPhase((cur) => (cur === "connect" || cur === "tables" ? p : cur)); setReached((r) => Math.max(r, WIZ_ORDER.indexOf(p))); };
        useEffect(() => { setPhase("connect"); setReached(0); }, [acting]);
        const [newClient, setNewClient] = useState({ name: "", busy: false, err: null });
        // Each upload is tied to the client it was started under, so switching client never breaks a running job.
        const apiFor = (client) => { const f = (payload) => callBackend(session.url, session.token, client ? { ...payload, client } : payload); f.__client = client; return f; };
        const upd = (id, patch) => setItems((p) => p.map((i) => (i.id === id ? { ...i, ...patch } : i)));
        const updDs = (id, ds, patch) =>
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { ...i.datasets[ds], ...patch } } } : i)));

        const loadHistory = async (limit) => {
          setHistory((h) => ({ ...h, open: true, loading: true, err: null, limit }));
          try {
            const r = await api({ action: "jobs", limit });
            setHistory((h) => ({ ...h, loading: false, list: Array.isArray(r.jobs) ? r.jobs : [], client: r.client || nowClient() || "" }));
          } catch (e) { setHistory((h) => ({ ...h, loading: false, err: e })); }
        };
        const mergeJob = (j) => setHistory((h) => ({ ...h, list: h.list.some((x) => x.id === j.id) ? h.list.map((x) => (x.id === j.id ? j : x)) : [j, ...h.list] }));
        const liveItem = (i) => (i.job ? ["queued", "running", "waiting"].includes(i.job.status) : (!i.done && !i.error && ["upload", "bronze"].includes(i.stage)));
        const anyLive = items.some(liveItem);
        const dismiss = (id) => setItems((p) => p.filter((i) => i.id !== id));
        const [renameMsg, setRenameMsg] = useState("");
        useEffect(() => {   // a dataset was renamed: bring the cards on this screen up to date so their buttons point at the new name
          const on = (e) => {
            if (e && e.detail && e.detail.msg) setRenameMsg(e.detail.msg);
            itemsRef.current.forEach(async (i) => { if (i.job) { try { const r = await apiFor(i.client)({ action: "job_get", id: i.job.id }); if (r && r.job) upd(i.id, { job: r.job }); } catch (_) { /* the card keeps its old text */ } } });
            if (history.open) loadHistory(history.limit);
          };
          window.addEventListener("samm-datasets-changed", on);
          return () => window.removeEventListener("samm-datasets-changed", on);
        });

        const loadMapping = async (id, ds) => {
          setItems((p) => p.map((i) => (i.id === id ? { ...i, datasets: { ...i.datasets, [ds]: { open: true } } } : i)));
        };

        const runFile = async (id, file, client, dsName, opts) => {
          const api = apiFor(client);
          try {
            upd(id, { stage: "upload", msg: "Requesting a secure upload link..." });
            const init = await api({ action: "upload_init", filename: file.name, size: file.size, ...(dsName ? { dataset_name: dsName } : {}) });
            upd(id, { dsName: init.dataset, fileAs: init.file, willUpdate: !!init.existing, aliasUsed: !!init.alias_used });
            upd(id, { msg: "Uploading to Bronze..." });
            await putFile(init.upload_url, file, (pct) => upd(id, { uploadPct: pct, msg: "Uploading to Bronze... " + pct + "%" }));
            upd(id, { stage: "bronze", msg: "Stored in Bronze. SAMM takes it from here..." });
            let started = null;
            try { started = await api({ action: "job_start", key: init.key, ...(opts && opts.toReports ? { to_reports: true, batch: opts.batch } : {}) }); } catch (e) {
              if (!(e && e.status === 400 && /unknown action/i.test(e.message || ""))) throw e;   // older back end: use the step-by-step flow below
            }
            if (started && started.job) { upd(id, { stage: "silver", msg: "", job: started.job }); return; }
            const ing = await api({ action: "ingest", key: init.key });
            if (ing.mode === "archived") {
              upd(id, { stage: "done", msg: ing.note, done: true });
              return;
            }
            let names = [];
            if (ing.mode === "done") {
              names = ing.datasets.map((d) => d.dataset);
            } else {
              upd(id, { stage: "silver", msg: ing.note + " Waiting for it to finish (up to 2 minutes)..." });
              for (let n = 0; n < 24 && names.length === 0; n++) {
                await sleep(5000);
                const r = await api({ action: "datasets", since: ing.since });
                names = r.datasets.map((d) => d.dataset);
              }
              if (names.length === 0) {
                throw new ApiError("The orchestrator has not produced any dataset yet.", [
                  "It may still be running: use 'Check for new datasets' below in a minute.",
                  "Check the CloudWatch logs of shiftleft-superposition-pipeline-orchestrator for errors.",
                ], 0);
              }
            }
            upd(id, { stage: "map", msg: "Reading columns and suggesting field mappings...", order: names, datasets: {} });
            for (const ds of names) await loadMapping(id, ds);
            upd(id, { msg: "Review the suggested mapping, then build the Gold view." });
          } catch (err) {
            upd(id, { error: err, msg: "Stopped." });
          }
        };

        const [staged, setStaged] = useState([]);
        const slugName = (x) => String(x || "").toLowerCase().replace(/\.[a-z0-9]{1,5}$/, "").replace(/\s*\(\d+\)\s*$/, "").replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
        const prefixFor = (c) => (String(c || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 30) || "client") + "_";
        const addFiles = (fileList) => {
          const c = nowClient();
          const added = Array.from(fileList || []).map((file) => ({ sid: "s" + ++seq.current, file, name: "", client: c }));   // read the list now: the input is cleared right after
          setStaged((p) => [...p, ...added]);
        };
        const startStaged = () => {
          staged.forEach((sf) => {
            const id = "f" + ++seq.current;
            const c = sf.client;
            setItems((p) => [{ id, client: c, name: sf.file.name, size: sf.file.size, stage: "upload", msg: "Queued", datasets: {}, order: [], error: null, done: false }, ...p]);
            runFile(id, sf.file, c, sf.name.trim());
          });
          setStaged([]); goPhase("tables");
        };

        // v34: choose a whole folder for one client and run it all the way to reports
        const DATA_EXT = /\.(csv|tsv|json|jsonl|txt|xlsx|xlsm)$/i;
        const [folder, setFolder] = useState(null);
        const [toReports, setToReports] = useState(false);       // v61: the guided steps map and link first; this skips them
        const [runs, setRuns] = useState([]);
        const pickFolder = (fileList) => {
          const all = Array.from(fileList || []);
          const files = all.filter((f) => DATA_EXT.test(f.name) && !/^(~\$|\.)/.test(f.name));
          const first = all[0] && all[0].webkitRelativePath ? String(all[0].webkitRelativePath).split("/")[0] : "folder";
          setFolder(all.length ? { name: first, files, skipped: all.length - files.length, client: nowClient() } : { name: "", files: [], skipped: 0, empty: true, client: nowClient() });
        };
        const startFolder = () => {
          if (!folder || !folder.files.length) return;
          const batch = "b" + Date.now().toString(36) + (++seq.current);
          const ids = [];
          folder.files.forEach((file) => {
            const id = "f" + ++seq.current; ids.push(id);
            setItems((p) => [{ id, client: folder.client, batch: toReports ? batch : undefined, name: file.name, size: file.size, stage: "upload", msg: "Queued", datasets: {}, order: [], error: null, done: false }, ...p]);
            runFile(id, file, folder.client, "", { toReports, batch });
          });
          if (toReports) setRuns((p) => [{ id: batch, client: folder.client, folder: folder.name, total: ids.length, status: "running", msg: "", reports: [], failed: 0 }, ...p]);
          setFolder(null); goPhase("tables");
        };
        const [method, setMethod] = useState("files");
        const addDbJobs = async ({ client, batch, name, toReports: tr, tables }) => {
          const a = apiFor(client); const ids = [];
          for (const t of tables) {
            let job = null;
            try { const r = await a({ action: "job_get", id: t.job_id }); job = r && r.job; } catch (_) { /* the card is skipped */ }
            if (!job) continue;
            const id = "f" + ++seq.current; ids.push(id);
            setItems((p) => [{ id, client, batch: tr ? batch : undefined, name: t.table + " (from " + name + ")", size: 0, stage: "silver", msg: "", datasets: {}, order: [], error: null, done: false, job }, ...p]);
          }
          if (tr && ids.length) setRuns((p) => [{ id: batch, client, folder: name, kind: "db", total: ids.length, status: "running", msg: "", reports: [], failed: 0 }, ...p]);
        };
        const finishRun = async (run) => {
          const a = apiFor(run.client);
          const say = (m) => setRuns((p) => p.map((r) => (r.id === run.id ? { ...r, msg: m } : r)));
          const mine = itemsRef.current.filter((i) => i.batch === run.id);
          const failed = mine.filter((i) => i.error || (i.job && i.job.status === "failed")).length;
          try {
            const dss = []; mine.forEach((i) => Object.keys((i.job && i.job.datasets) || {}).forEach((d) => { if (dss.indexOf(d) < 0) dss.push(d); }));
            say("Linking the tables...");
            try { await autoLinkRun(a, say); } catch (_) { /* links are a bonus: reports still go ahead */ }
            say("Setting up drill-downs...");
            try { await a({ action: "drill_auto" }); } catch (_) { /* optional */ }
            const tg = (await a({ action: "batch_targets", datasets: dss })).targets || [];
            const reports = [];
            for (let i = 0; i < tg.length; i++) {
              say("Publishing report " + (i + 1) + " of " + tg.length + "...");
              try { const r = await a({ action: "report_publish", dataset: tg[i].dataset }); reports.push({ id: r.id, title: r.title, client: r.client || run.client, replaced: !!(r.report && r.report.replaced) }); }
              catch (e) { reports.push({ title: tg[i].title, error: (e && e.message) || "Could not publish." }); }
            }
            setRuns((p) => p.map((r) => (r.id === run.id ? { ...r, status: "done", msg: "", reports, failed } : r)));
            onViewsChanged();
          } catch (e) { setRuns((p) => p.map((r) => (r.id === run.id ? { ...r, status: "failed", msg: "", err: e, failed } : r))); }
        };
        useEffect(() => {
          runs.filter((r) => r.status === "running").forEach((r) => {
            const mine = items.filter((i) => i.batch === r.id);
            if (mine.length < r.total) return;
            const over = (i) => i.error || i.done || (i.job && ["done", "failed"].includes(i.job.status));
            if (mine.every(over)) { setRuns((p) => p.map((x) => (x.id === r.id ? { ...x, status: "finishing" } : x))); finishRun(r); }
          });
        }, [items, runs]);

        const runPipeline = async () => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "run_pipeline" });
            setPipe({ busy: false, msg: "Pipeline started (" + r.function + "). Files already in Bronze are being converted. Click 'Check for new datasets' in a minute.", err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        const checkNew = async (all) => {
          setPipe({ busy: true, msg: "", err: null });
          try {
            const r = await api({ action: "datasets" });
            const fresh = all === true ? r.datasets : r.datasets.filter((d) => !d.view);
            if (fresh.length === 0) {
              setPipe({ busy: false, msg: all === true ? "No datasets found yet." : "No datasets are waiting for a Gold view.", err: null });
              return;
            }
            const id = "f" + ++seq.current;
            const order = fresh.map((d) => d.dataset);
            setItems((p) => [{ id, client: nowClient(), name: "Datasets already in Silver", size: 0, stage: "map", msg: "Review the mapping, then build (or rebuild) the Gold view.", datasets: {}, order, error: null, done: false }, ...p]);
            for (const ds of order) await loadMapping(id, ds);
            setPipe({ busy: false, msg: order.length + (all === true ? " dataset(s) loaded." : " dataset(s) found without a Gold view."), err: null });
          } catch (err) {
            setPipe({ busy: false, msg: "", err });
          }
        };

        // v61: what this onboarding has brought in for the client being worked on
        const wizClient = nowClient();
        const wizItems = items.filter((i) => i.client === wizClient && !i.error);
        const wizDs = [];
        wizItems.forEach((i) => {
          Object.entries((i.job && i.job.datasets) || {}).forEach(([ds, dd]) => { if (!wizDs.some((x) => x.ds === ds)) wizDs.push({ ds, state: dd.state, view: dd.view || "", jobId: i.job.id }); });
          (i.order || []).forEach((ds) => { if (!wizDs.some((x) => x.ds === ds)) wizDs.push({ ds, state: "done", view: "", jobId: null }); });
        });
        // v62: after Connections the flow continues in Datasets > Links & drill-down
        const [dsPhase, setDsPhase] = useState("choose");
        const [dsSel, setDsSel] = useState(null);        // null = every table ticked
        const [dsReached, setDsReached] = useState(0);
        const goDs = (p) => { setDsPhase(p); setDsReached((r) => Math.max(r, DS_ORDER.indexOf(p))); };
        const [dsClient, setDsClient] = useState(null);      // the client the Connections screen was working on, when it is not the one picked in the sidebar
        useEffect(() => { setDsPhase("choose"); setDsReached(0); setDsClient(null); setDsSel(null); }, [acting]);
        const openDatasets = () => { setDsPhase("choose"); setDsReached(0); setDsSel(null); setDsClient(wizClient && wizClient !== acting ? wizClient : null); goTab("links"); };
        const wizLive = wizItems.some(liveItem);
        const wizWaiting = wizDs.some((d) => d.state === "approval");
        const wizReady = wizDs.length > 0 && !wizLive && !wizWaiting;
        const wizLabel = (clientNames || {})[wizClient] || wizClient || "";
        const srcVisible = phase === "connect" || phase === "tables";
        const badge = (st) => {
          const c = { auto: "bg-green-900 text-green-200", review: "bg-amber-900 text-amber-200", saved: "bg-blue-900 text-blue-200", new: "bg-[#333] text-[#BBB]", duplicate: "bg-[#333] text-[#BBB]", skip: "bg-[#333] text-[#777]" }[st] || "bg-[#333] text-[#BBB]";

              </div>
              {method === "db" && <DbPanel client={nowClient()} clientName={(clientNames || {})[nowClient()]} apiFor={apiFor} onJobs={addDbJobs} clients={clients} clientNames={clientNames} canAddClient={canAddClient} onClientsChanged={onClientsChanged} onPhase={dbPhase} onClientPicked={(c) => setTarget(c)} />}
              {method === "files" && (<>
              <label
                htmlFor="onb-file"
                onDragOver={(e) => { e.preventDefault(); if (wizClient) setOver(true); }}
                onDragLeave={() => setOver(false)}
                onDrop={(e) => { e.preventDefault(); setOver(false); if (wizClient) addFiles(e.dataTransfer.files); }}
                aria-disabled={!wizClient}
                className={"block text-center rounded-xl border-2 border-dashed p-8 text-sm transition " + (!wizClient ? "opacity-50 cursor-not-allowed border-[#3D3D3D]" : "cursor-pointer " + (over ? "border-amber-500 bg-[#2A2418]" : "border-[#3D3D3D] hover:border-amber-600"))}
              >
                <div className="text-white font-semibold">Drop files here, or click to choose</div>
                <div className="text-[11px] text-[#808080] mt-1">Up to 25 MB for csv/json/txt, 50 MB for Excel, 100 MB for archives</div>
                <input id="onb-file" data-testid="onb-file" type="file" multiple accept={ACCEPT} disabled={!wizClient} className="hidden" onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }} />
              </label>
              <div className="text-[11px] text-[#808080]">or <label htmlFor="onb-folder" data-testid="folder-choose" className="underline cursor-pointer text-amber-400 hover:text-amber-300">choose a whole folder</label> for one client and let SAMM take it all the way to reports.
                <input id="onb-folder" data-testid="onb-folder" type="file" multiple webkitdirectory="" directory="" disabled={!wizClient} className="hidden" onChange={(e) => { pickFolder(e.target.files); e.target.value = ""; }} /></div>
              {folder && (
                <div data-testid="folder-card" className="border border-[#3D3D3D] rounded-xl p-4 space-y-3 bg-[#1E1E1E] text-xs">
                  {folder.files.length === 0 && (
                    <div data-testid="folder-empty" className="text-amber-200 bg-[#241E10] border border-amber-800 rounded p-2">
                      {folder.empty ? "No files were found in that folder. Check that you chose the folder that holds the files, not a folder that only contains other folders that are empty." : "No data files in this folder. SAMM reads csv, tsv, json, jsonl, txt, xlsx and xlsm files." + (folder.skipped > 0 ? " " + folder.skipped + " other file(s) were left out." : "")}
                    </div>
                  )}
                  <div className="text-sm font-semibold text-white">Upload the folder "{folder.name || "(empty)"}"</div>
                  <div className={folder.files.length ? "text-[#C0C0C0]" : "hidden"}><span data-testid="folder-count">{folder.files.length} file{folder.files.length === 1 ? "" : "s"}</span> will go to the client <b data-testid="folder-client" className="text-white">{(clientNames || {})[folder.client] || folder.client || "your client"}</b>{folder.skipped > 0 ? ". " + folder.skipped + " other file(s) in the folder are not data files and are left out" : ""}.</div>
                  {(clients || []).length > 1 && (
                    <label className="flex flex-wrap items-center gap-2 text-[#C0C0C0]">Client
                      <select data-testid="folder-client-select" aria-label="Client for this folder" value={folder.client || ""} onChange={(e) => setFolder({ ...folder, client: e.target.value })} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white">
                        {clients.map((c) => <option key={c} value={c}>{(clientNames || {})[c] || c}</option>)}
                      </select>
                    </label>
                  )}
                  <div className="text-[11px] text-[#808080] max-h-24 overflow-auto font-mono">{folder.files.slice(0, 40).map((f) => f.name).join(", ")}{folder.files.length > 40 ? " ..." : ""}</div>
                  <label className="flex items-center gap-2 text-[#C0C0C0]"><input data-testid="folder-to-reports" type="checkbox" checked={toReports} onChange={(e) => setToReports(e.target.checked)} /> Skip the steps: SAMM maps, builds, links and publishes a report for each Gold view without stopping to ask</label>
                  <div className="flex gap-2">
                    <button data-testid="folder-go" disabled={!folder.files.length} onClick={startFolder} className="bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm px-4 py-2 rounded-lg">Upload {folder.files.length} file{folder.files.length === 1 ? "" : "s"} to {(clientNames || {})[folder.client] || folder.client}</button>
                    <button onClick={() => setFolder(null)} className="border border-[#3D3D3D] text-white text-sm px-4 py-2 rounded-lg">Cancel</button>
                  </div>
                </div>

              {staged.length > 0 && (

                  <div className="text-[11px] text-[#A0A0A0]">The name decides the tables you will see everywhere, for example <span className="font-mono">{prefixFor(nowClient())}dim_po</span>. The client prefix is added automatically and cannot be changed here. If the name already exists, the file updates that dataset.</div>
                  {staged.map((sf) => (
                    <div key={sf.sid} data-testid="staged-row" className="flex flex-wrap items-center gap-2 text-xs">
                      <span className="text-[#C0C0C0] w-48 truncate" title={sf.file.name}>{sf.file.name}</span>
                      <span className="text-[#808080]">Uploading to <b data-testid="staged-client" className="text-white">{(clientNames || {})[sf.client] || sf.client || "your client"}</b></span>
                      {(clients || []).length > 1 && (
                        <select aria-label="Client for this file" value={sf.client || ""} onChange={(e) => setStaged((p) => p.map((x) => x.sid === sf.sid ? { ...x, client: e.target.value } : x))} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded px-2 py-1 text-white">
                          {clients.map((c) => <option key={c} value={c}>{(clientNames || {})[c] || c}</option>)}
                        </select>
                      )}
                      <span className="flex items-center">
                        <span data-testid="staged-prefix" className="bg-[#151515] border border-[#3D3D3D] border-r-0 rounded-l px-2 py-1 font-mono text-[#808080]">{prefixFor(sf.client)}</span>
                        <input data-testid="staged-name" aria-label="Name this dataset" value={sf.name} onChange={(e) => setStaged((p) => p.map((x) => x.sid === sf.sid ? { ...x, name: e.target.value } : x))} placeholder={slugName(sf.file.name) || "dataset_name"} className="bg-[#2D2D2D] border border-[#3D3D3D] rounded-r px-2 py-1 font-mono text-white w-56" />
                      </span>
                      <button onClick={() => setStaged((p) => p.filter((x) => x.sid !== sf.sid))} className="text-[#808080] hover:text-white underline">Remove</button>
                    </div>
                  ))}
                  <button data-testid="staged-go" onClick={startStaged} className="bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm px-4 py-2 rounded-lg">Upload {staged.length} file{staged.length === 1 ? "" : "s"}</button>
                </div>
              )}
              </>)}
              <details className="text-xs"><summary data-testid="more-options" className="cursor-pointer text-[#A0A0A0] hover:text-white">More options</summary><div className="flex flex-wrap items-center gap-3 mt-2">
                <button onClick={runPipeline} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">▶ Process files already uploaded</button>
                <button onClick={() => checkNew(false)} disabled={pipe.busy} className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">🔎 Check for new datasets</button>
                <button onClick={() => checkNew(true)} disabled={pipe.busy} data-testid="review-all" className="border border-[#3D3D3D] hover:border-amber-500 text-xs text-white px-3 py-2 rounded-lg disabled:opacity-50">✏️ Check how columns are matched</button>
                <span className="text-[11px] text-[#808080]">Processes files that are already in Bronze with your orchestrator.</span></div></details>
              {pipe.msg && <div className="text-xs text-green-300">{pipe.msg}</div>}
              <ErrBox err={pipe.err} />
              </div>)}
              {mode === "connections" && wizReady && (
                <div data-testid="tables-available" className="rounded-lg border border-green-700 bg-[#10241A] px-4 py-3 text-xs text-green-300">
                  ✓ {wizDs.length} table{wizDs.length === 1 ? " is" : "s are"} available in Datasets for {wizLabel || "this client"}. Next you link them, map their fields and add any calculated fields there.
                </div>
              )}
              {mode === "connections" && (phase === "tables" || (phase === "connect" && wizReady)) && (
                <WizBar testid="wiz-bar-tables" back={null} alt={!wizReady && !wizLive && wizClient ? { label: "or open the tables " + (wizLabel || "this client") + " already has in Datasets", onClick: openDatasets } : null}
                  next={openDatasets} nextLabel="Next: open Datasets" nextOff={!wizReady}
                  hint={wizWaiting ? "SAMM needs you to confirm some fields in the list below before it can go on." : wizLive ? "SAMM is bringing your data in..." : wizReady ? "Press Next to link and map them in Datasets." : method === "db" ? "Tick the tables you want and press Extract now. This button turns on when they are in." : "Add files, and this button turns on when they are in."} />
              )}
            </div>

      function GovernanceHub({ session, identity }) {
        const api = (payload) => callBackend(session.url, session.token, payload);

        const [copied, setCopied] = useState(false);
        const [form, setForm] = useState({ email: "", role: "viewer", tenant_id: "", expires_days: "" });
        const [inv, setInv] = useState({ email: "", role: "viewer", reports: [], busy: false, msg: "", err: "" });
        const [invites, setInvites] = useState([]);
        const [repList, setRepList] = useState([]);
        const loadInvites = async () => { try { const r = await api({ action: "invite_list" }); setInvites(r.invites || []); } catch (_) { /* older back end */ } };
        const loadRepList = async () => { try { const r = await api({ action: "report_access_get" }); setRepList(r.reports || []); } catch (_) { /* optional */ } };
        const sendInvite = async (e) => {
          e.preventDefault();
          setInv((x) => ({ ...x, busy: true, msg: "", err: "" }));
          try {
            const r = await api({ action: "invite_send", email: inv.email, role: inv.role, ...(inv.role === "report_viewer" ? { reports: inv.reports } : {}), ...(isSys && form.tenant_id ? { tenant_id: form.tenant_id } : {}) });
            setInv((x) => ({ ...x, busy: false, email: "", reports: [], msg: r.sent ? "Invitation sent to " + r.invite.email + ". The link works once for 72 hours." : "", err: r.sent ? "" : (r.error || "The invitation was created but the e-mail could not be sent.") }));
            await loadInvites(); await loadUsers();
          } catch (ex) { setInv((x) => ({ ...x, busy: false, err: (ex && ex.message) || "Could not send." })); await loadInvites(); }   // a refused e-mail still leaves a "failed" entry in the log
        };
        const resendInvite = async (id) => {
          setInv((x) => ({ ...x, busy: true, msg: "", err: "" }));
          try { const r = await api({ action: "invite_resend", id, ...(isSys && form.tenant_id ? { tenant_id: form.tenant_id } : {}) }); setInv((x) => ({ ...x, busy: false, msg: r.sent ? "A new invitation was sent. The old link no longer works." : "", err: r.sent ? "" : (r.error || "Could not send.") })); await loadInvites(); }
          catch (ex) { setInv((x) => ({ ...x, busy: false, err: (ex && ex.message) || "Could not resend." })); await loadInvites(); }
        };
        const [tenants, setTenants] = useState([]);
        const [policyTenant, setPolicyTenant] = useState(identity.tenant_id);
        const [pol, setPol] = useState(null);
        const [polMsg, setPolMsg] = useState("");
        const isSys = identity.role === "system_admin";

        const fail = (e) => setErr((e && e.message) || "Something went wrong.");
        const loadUsers = async () => {
          try { setData(await api({ action: "users" })); setErr(""); } catch (e) { fail(e); }
        };
        const loadPolicy = async (t) => {
          try {
            const r = await api({ action: "policy_get", tenant_id: t });
            const p = r.policy || {};
            setPol({ restricted: (p.restricted_columns || []).join(", "), caps: { ...(p.row_caps || {}) }, scan: p.scan_limit_gb == null ? "" : String(p.scan_limit_gb), auto: p.auto_approve_confidence == null ? "" : String(Math.round(p.auto_approve_confidence * 100)), mode: p.mapping_mode || "", pii: !!p.pii_scan, lang: !!p.language_layer, del: { bronze: "engineer", silver: "engineer", gold: "engineer", ...(p.delete_roles || {}) }, meta: r });
            setPolMsg("");
          } catch (e) { fail(e); }
        };
        useEffect(() => { loadInvites(); loadRepList(); }, []);
        useEffect(() => { loadUsers(); if (isSys) api({ action: "tenants" }).then((r) => setTenants(r.tenants || [])).catch(() => {}); }, []);
        useEffect(() => { loadPolicy(policyTenant); }, [policyTenant]);

        const save = async (payload) => {
          setBusy(true); setErr("");
          try {
            const r = await api({ action: "user_save", ...payload });
            if (r.token) { setIssued({ email: r.user.email, token: r.token }); setCopied(false); }
            await loadUsers();
            return true;
          } catch (e) { fail(e); return false; } finally { setBusy(false); }
        };
        const addUser = async (e) => {
          e.preventDefault();
          const payload = { email: form.email, role: form.role };

        const savePolicy = async () => {

            const caps = {};
            Object.keys(pol.caps).forEach((r) => { if (pol.caps[r] !== "" && pol.caps[r] != null) caps[r] = Number(pol.caps[r]); });
            await api({ action: "policy_save", tenant_id: policyTenant, policy: { restricted_columns: pol.restricted, row_caps: caps, scan_limit_gb: pol.scan === "" ? null : Number(pol.scan), auto_approve_confidence: pol.auto === "" ? null : Number(pol.auto), mapping_mode: pol.mode || null, pii_scan: !!pol.pii, language_layer: !!pol.lang, delete_roles: pol.del } });
            setPolMsg("Saved. It applies to the next request.");
          } catch (e) { fail(e); } finally { setBusy(false); }

        const inp = "bg-[#151515] border border-[#3D3D3D] rounded-md px-2 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-amber-500";
        const btn = "px-3 py-1.5 rounded-md text-xs font-semibold bg-amber-500 text-black hover:bg-amber-400 disabled:opacity-50";
        const link = "text-xs underline text-[#A0A0A0] hover:text-white";

        return (

                  <div className="flex gap-3 items-center">
                    <button onClick={copy} className={btn}>{copied ? "Copied" : "Copy token"}</button>
                    <button onClick={() => setIssued(null)} className={link}>I have saved it, hide</button>

                {isSys && (
                  <label className="text-[10px] text-[#A0A0A0] flex flex-col gap-1">Client

                    <button disabled={busy} data-testid={"pw-reset-" + u.email} onClick={async () => { if (window.confirm("Reset the password of " + u.email + " to the starting password? They will be asked to choose their own, and their current sign-in ends.")) { setBusy(true); try { const r = await api({ action: "password_reset", email: u.email }); setPwNote(r.note + " Starting password: " + r.starting_password); } catch (e) { setErr((e && e.message) || "Could not reset."); } finally { setBusy(false); } } }} className={link}>Reset password</button>
                    <button disabled={busy} onClick={() => { if (window.confirm("Issue a new token for " + u.email + "? The old token stops working.")) save({ email: u.email, tenant_id: u.tenant_id, reset_token: true, expires_days: u.expires_at ? 90 : undefined }); }} className={link}>Reset token</button>
                  </div>

                {data && rows.length === 0 && <div className="text-xs text-[#A0A0A0]">No managed users yet. Create the first one above.</div>}
              </div>
              {boot.length > 0 && (
                <div className="pt-2 border-t border-[#2D2D2D]">
                  <div className="text-[10px] text-[#707070] mb-1">Break-glass tokens (set in the Lambda environment, not editable here)</div>
                  {boot.map((b, i) => <div key={i} className="text-xs font-mono text-[#A0A0A0]">{b.email} | {ROLE_LABELS[b.role] || b.role} | {b.tenant_id}</div>)}

              )}
            </div>

            <div className="bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
              <div className="flex items-center gap-3">
                <h3 className="text-sm font-bold text-white">Client policy</h3>
                {isSys && (
                  <>
                    <input aria-label="Policy client" list="gov-tenants" value={policyTenant} onChange={(e) => setPolicyTenant(e.target.value)} className={inp + " w-36"} />

              </div>
              {pol && (
                <div className="space-y-3 text-xs">
                  <label className="flex flex-col gap-1 text-[#A0A0A0]">Hidden columns (comma separated, hidden from Viewer and Data Analyst)
                    <input aria-label="Restricted columns" value={pol.restricted} onChange={(e) => setPol({ ...pol, restricted: e.target.value })} className={inp} placeholder="salary, id_number" />
                    {pol.meta.platform_restricted.length > 0 && <span className="text-[10px] text-[#707070]">Always hidden platform-wide: {pol.meta.platform_restricted.join(", ")}</span>}
                  </label>
                  <div className="grid grid-cols-3 md:grid-cols-6 gap-2">
                    {ROLES_ORDER.map((r) => (
                      <label key={r} className="flex flex-col gap-1 text-[10px] text-[#A0A0A0]">{ROLE_LABELS[r]} rows
                        <input aria-label={"Row cap " + r} type="number" min="1" max={pol.meta.hard_max_rows} value={pol.caps[r] == null ? "" : pol.caps[r]} onChange={(e) => setPol({ ...pol, caps: { ...pol.caps, [r]: e.target.value } })} className={inp} placeholder={String(pol.meta.default_row_caps[r])} />
                      </label>
