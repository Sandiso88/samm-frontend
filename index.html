                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Scan limit per question (GB)
                    <input aria-label="Scan limit" type="number" step="0.01" value={pol.scan} onChange={(e) => setPol({ ...pol, scan: e.target.value })} className={inp} placeholder={"platform " + pol.meta.platform_scan_limit_gb} />
                    <span className="text-[10px] text-[#707070]">Can only be lower than the platform limit ({pol.meta.platform_scan_limit_gb} GB). A lower limit is checked after the query; the platform limit is the hard stop.</span>
                  </label>
                  <label className="flex items-center gap-2 text-[#A0A0A0]">
                    <input aria-label="Personal data scan" type="checkbox" checked={!!pol.pii} onChange={(e) => setPol({ ...pol, pii: e.target.checked })} />
                    Scan new files for personal data (names, emails, phone numbers) when mapping
                    <span className="text-[10px] text-[#707070]">Uses Amazon Comprehend (about $0.0001 per 100 characters scanned, a few text columns per file). It only suggests restricting a column; it never restricts one by itself.</span>
                  </label>
                  <label className="flex items-center gap-2 text-[#A0A0A0]">
                    <input aria-label="Language layer" data-testid="pol-language" type="checkbox" checked={!!pol.lang} onChange={(e) => setPol({ ...pol, lang: e.target.checked })} />
                    Use the language layer (Ollama) for questions SAMM does not understand
                    <span className="text-[10px] text-[#707070]" data-testid="pol-language-note">{pol.meta.language_configured ? "A language server is set up. It only rewrites the question; it never sees your data, and SAMM still builds and checks the answer." : "No language server is set up yet, so this switch has no effect until one is added at deploy time."}</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">How new files are mapped
                    <select aria-label="Mapping mode" value={pol.mode} onChange={(e) => setPol({ ...pol, mode: e.target.value })} className={inp}>
                      <option value="">Review first (default)</option>
                      <option value="review">Review first</option>
                      <option value="auto">Auto: build straight away</option>
                    </select>
                    <span className="text-[10px] text-[#707070]">Review first: SAMM suggests the mapping and rules, and an engineer approves before the Gold view is built. Auto: SAMM builds at once using only technical rules; business rules still wait for approval.</span>
                  </label>
                  <label className="flex flex-col gap-1 text-[#A0A0A0] max-w-xs">Auto-approve field mappings at or above (%)
                    <input aria-label="Auto-approve level" type="number" min="50" max="100" value={pol.auto} onChange={(e) => setPol({ ...pol, auto: e.target.value })} className={inp} placeholder="90 (default)" />
                    <span className="text-[10px] text-[#707070]">When a file arrives, SAMM maps fields it is at least this sure about on its own. Anything lower waits for a Data Engineer. Fields a person approved before are reused.</span>
                  </label>
                  <div data-testid="delete-perms" className="border border-[#2D2D2D] rounded-lg p-3 space-y-2 max-w-xl">
                    <div className="text-white font-semibold">Who may delete</div>
                    <div className="text-[10px] text-[#707070]">Choose the lowest role that may delete at each layer. Looking at what a delete would remove is always allowed. Putting a deleted file back (Restore) needs the Bronze permission.</div>
                    {[["bronze", "Bronze (uploaded files)"], ["silver", "Silver (tables, and removing duplicate rows)"], ["gold", "Gold (views)"]].map(([layer, title]) => (
                      <label key={layer} className="flex flex-wrap items-center gap-2 text-[#A0A0A0]">
                        <span className="w-64">{title}</span>
                        <select aria-label={"Who may delete in " + layer} value={(pol.del || {})[layer] || "engineer"} onChange={(e) => setPol({ ...pol, del: { ...(pol.del || {}), [layer]: e.target.value } })} className={inp}>
                          <option value="engineer">Data Engineer and above (default)</option>
                          <option value="admin">Administrator and above</option>
                          <option value="system_admin">System administrator only</option>
                        </select>
                      </label>
                    ))}
                  </div>
                  <div className="flex items-center gap-3">
                    <button onClick={savePolicy} disabled={busy} className={btn}>Save policy</button>
                    {polMsg && <span data-testid="policy-saved" className="text-green-400">{polMsg}</span>}
                  </div>
                </div>
              )}
            </div>
            {isSys && <AddClientPanel api={api} />}
            {isSys && <UnassignedPanel api={api} tenants={tenants} />}
          </div>
        );
      }
      const ROLES_ORDER = ["report_viewer", "viewer", "analyst", "engineer", "admin", "system_admin"];

      // ------------------------------------------------------------------
      // Main app
      // ------------------------------------------------------------------
      function SammConsole({ session, demo, onSignOut, onToken }) {
        const identity = demo ? DEMO_IDENTITY : session.identity;
        const [previewRole, setPreviewRole] = useState(demo ? "admin" : null);
        const role = demo ? previewRole : identity.role;

        const nextId = useRef(0);
        const stamp = () => new Date().toLocaleTimeString();
        const [messages, setMessages] = useState([
          {
            id: "init",
            role: "assistant",
            text: demo
              ? "Welcome to the SAMM Core Engine Console (DEMO MODE). Replies are simulated and nothing is sent to your lakehouse."
              : "Welcome to the SAMM Core Engine Console. Ask a natural language question to compile secure SQL against the Gold layer. Ask for Power BI or Sisense output to get DAX or JSON in the side panel.",
            timestamp: "System Ready",
          },
        ]);
        const [artifacts, setArtifacts] = useState([]);
        const [panelOpen, setPanelOpen] = useState(false);
        const [activeArtifact, setActiveArtifact] = useState(null);

        const [input, setInput] = useState("");
        const [persona, setPersona] = useState("architect");
        const [activeTab, setActiveTab] = useState(() => { let h = ""; try { h = String(window.location.hash || "").replace("#", ""); } catch (_) { /* optional */ } if (role === "report_viewer") return "dashboard"; return ["overview", "dashboard", "connections", "s3", "datasets", "governance"].includes(h) ? h : "overview"; });
        const [isLoading, setIsLoading] = useState(false);

        const [s3Path, setS3Path] = useState("s3://shiftleft-superposition-ingest-vault/CS.json");
        const [contextPayload, setContextPayload] = useState('{"environment": "production", "batch_priority": "high"}');
        const [formError, setFormError] = useState("");
        const [views, setViews] = useState([]);
        const [defaultView, setDefaultView] = useState("");
        const [activeView, setActiveView] = useState("");
        const dashKey = "samm_dash_" + (demo ? "demo" : (session && session.identity ? session.identity.tenant_id : "x"));
        // Tiles live under a key that names the client. If the key changes (the identity arrives after the first paint), the tiles are
        // read again from the new key, and nothing is written or removed until they have been. This stops an early render wiping saved tiles.
        const loadTiles = (k) => { try { const v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (_) { return []; } };
        const [tileStore, setTileStore] = useState(() => ({ key: dashKey, list: loadTiles(dashKey) }));
        const tiles = tileStore.key === dashKey ? tileStore.list : loadTiles(dashKey);
        const setTiles = (fn) => setTileStore((s) => { const cur = s.key === dashKey ? s.list : loadTiles(dashKey); return { key: dashKey, list: typeof fn === "function" ? fn(cur) : fn }; });
        useEffect(() => { if (tileStore.key !== dashKey) return; try { if (tileStore.list.length) localStorage.setItem(dashKey, JSON.stringify(tileStore.list.slice(0, 12))); else localStorage.removeItem(dashKey); } catch (_) { /* storage is optional */ } }, [tileStore, dashKey]);
        const pinTile = (title, rows) => setTiles((p) => [{ id: "t" + Date.now(), title: String(title || "Chart").slice(0, 120), rows: rows.slice(0, 60), at: stamp() }].concat(p).slice(0, 12));
        const refreshTile = async (t) => {
          try {
            const d = await callBackend(session.url, session.token, { action: "query", prompt: t.title });
            if (Array.isArray(d.raw_data_grid) && d.raw_data_grid.length > 0) setTiles((p) => p.map((x) => x.id === t.id ? { ...x, rows: d.raw_data_grid.slice(0, 60), at: stamp() } : x));
          } catch (_) { /* the old numbers stay on the tile */ }
        };
        const [clients, setClients] = useState([]);
        const [clientNames, setClientNames] = useState({});
        const [acting, setActing] = useState("");
        const cname = (c) => clientNames[c] || c;
        useEffect(() => { window.__sammClient = null; window.__sammHome = identity.tenant_id; return () => { window.__sammClient = null; }; }, []);
        const [openReportId, setOpenReportId] = useState("");
        useEffect(() => {
          const take = (id) => { setActiveTab("dashboard"); setOpenReportId(id); };
          const m = /#report=([a-f0-9]{16})(?:&client=([A-Za-z0-9_\-]{1,64}))?/.exec(window.location.hash || "");
          if (m) {
            if (m[2] && m[2] !== identity.tenant_id) { window.__sammClient = m[2]; setActing(m[2]); }
            take(m[1]);
          }
          const on = (e) => e.detail && e.detail.id && take(e.detail.id);
          const again = () => loadViews();
          window.addEventListener("samm-open-report", on);
          window.addEventListener("samm-titles-changed", again);
          return () => { window.removeEventListener("samm-open-report", on); window.removeEventListener("samm-titles-changed", again); };
        }, []);
        useEffect(() => {
          if (demo) return;
          callBackend(session.url, session.token, { action: "clients" }).then((r) => { setClients((r.clients || []).filter((c) => c !== "UNASSIGNED_NEW_CLIENT")); setClientNames(r.names || {}); setActing((a) => a || r.home || ""); }).catch(() => {});
        }, [activeTab]);
        const refreshClients = () => { callBackend(session.url, session.token, { action: "clients" }).then((r) => { setClients((r.clients || []).filter((c) => c !== "UNASSIGNED_NEW_CLIENT")); setClientNames(r.names || {}); }).catch(() => {}); };
        const switchClient = (c) => {
          window.__sammClient = c === identity.tenant_id ? null : c;
          setActing(c); setActiveView(""); setTalk(null); loadViews();
        };
        const [talk, setTalk] = useState(null);   // what the last answer was about: { state, context }
        const loadViews = async () => {
          if (demo) return;
          try {
            const r = await callBackend(session.url, session.token, { action: "views" });
            const tmap = { ...(r.titles || {}) }; (r.views || []).forEach((v) => { if (v.title) tmap[v.name] = { title: v.title, subject: v.subject || "" }; });
            window.__sammTitles = tmap;
            window.dispatchEvent(new CustomEvent("samm-titles-ready"));
            setViews(r.views || []);
            setDefaultView(r.default || "");
          } catch (_) {
            /* older backend without datasets: the chat still works on the default view */
          }
        };
        useEffect(() => { loadViews(); }, []);

        const messagesEndRef = useRef(null);
        useEffect(() => {
          if (messagesEndRef.current && messagesEndRef.current.scrollIntoView) messagesEndRef.current.scrollIntoView({ behavior: "smooth" });
        }, [messages, isLoading]);

        const isRV = role === "report_viewer";
        useEffect(() => { window.__sammRole = role; window.__sammCanDelete = (identity && identity.can_delete) || null; }, [role, identity]);
        useEffect(() => { if (isRV && activeTab !== "dashboard") setActiveTab("dashboard"); }, [isRV, activeTab]);
        const canOnboard = CAN_ONBOARD.includes(role);
        const canGovern = CAN_GOVERN.includes(role);
        const canGold = CAN_GOLD.includes(role);
        useEffect(() => {
          if ((activeTab === "connections" || activeTab === "s3" || activeTab === "datasets") && !canOnboard) setActiveTab("overview");
          if (activeTab === "governance" && !canGovern) setActiveTab("overview");
        }, [role]);

        const addMessage = (m) => setMessages((prev) => [...prev, { id: "m" + ++nextId.current, timestamp: stamp(), ...m }]);

        const registerArtifacts = (msgId, text, sql) => {
          const created = [];
          splitBlocks(text).forEach((p) => {
            if (p.type === "code") {
              created.push({ id: msgId + "-a" + created.length, lang: p.lang, title: p.lang.toUpperCase(), code: p.code });
            }
          });
          const list = [...created];
          let sqlArt = null;
          if (sql) {
            sqlArt = { id: msgId + "-sql", lang: "sql", title: "SQL (executed)", code: sql };
            list.push(sqlArt);
          }
          setArtifacts((prev) => [...prev, ...list]);
          // Open the panel automatically for BI output (DAX/JSON), not for plain SQL.
          if (created.length > 0) {
            setActiveArtifact(created[0].id);
            setPanelOpen(true);
          }
          return { inline: created, sqlArt };
        };

        const handleSendMessage = (e) => {
          e.preventDefault();
          return sendText(input.trim());
        };

        // v24: split view (chat docked beside a report or the data viewer) and report commands typed in the chat
        const [split, setSplit] = useState(null);       // { dataset, view, reportId, since }
        const [openReport, setOpenReport] = useState(null);   // the report last opened: { id, title, accent }
        const messagesRef = useRef(messages);
        messagesRef.current = messages;
        useEffect(() => {
          const ask = (e) => {
            const d = e.detail || {};

                )}

                {(activeTab === "connections" || activeTab === "datasets") && demo && (
                  <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-6">
                    <div className="border-b border-[#2D2D2D] pb-4">
                      <h2 className="text-lg font-bold text-white">⚙️ Pipeline Orchestration Hub</h2>
                      <div className="mt-2"><SimBadge>Simulated: ingestion endpoint not connected</SimBadge></div>
                    </div>
                    <div className="space-y-4">
                      <div>
                        <label htmlFor="s3path" className="block text-xs font-mono text-[#A0A0A0] mb-1">Source file (S3 path)</label>
                        <input
                          id="s3path"
                          value={s3Path}
                          onChange={(e) => setS3Path(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      <div>
                        <label htmlFor="ctx" className="block text-xs font-mono text-[#A0A0A0] mb-1">Context payload (JSON)</label>
                        <textarea
                          id="ctx"
                          rows={4}
                          value={contextPayload}
                          onChange={(e) => setContextPayload(e.target.value)}
                          className="w-full bg-[#2D2D2D] border border-[#3D3D3D] rounded-md py-2 px-3 text-sm text-white font-mono focus:outline-none focus:border-amber-500"
                        />
                      </div>
                      {formError && <div className="text-xs text-red-400 font-mono">{formError}</div>}
                      <button
                        onClick={handlePipelineTrigger}
                        disabled={isLoading}
                        className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg transition"
                      >
                        Trigger Pipeline Ingestion (simulated)
                      </button>
                    </div>
                  </div>
                )}

                {activeTab === "dashboard" && (
                  <DashboardHub setTiles={setTiles} role={role} activeView={activeView} defaultView={defaultView} viewerOnly={isRV} canManage={CAN_ONBOARD.includes(role)} client={acting || identity.tenant_id} api={(p) => callBackend(session.url, session.token, p)} openId={openReportId} onOpenHandled={() => setOpenReportId("")} onPublished={(tool, title, n) => callBackend(session.url, session.token, { action: "publish_report", tool, title, tiles: n }).catch(() => {})} tiles={tiles} onAddTiles={(list) => setTiles((p) => list.concat(p).slice(0, 12))} onRemove={(id) => setTiles((p) => p.filter((x) => x.id !== id))} onRefresh={refreshTile}
                    onAsk={(q) => { setChatOpen(true); sendText(q); }} />
                )}

                {activeTab === "governance" && (
                  demo ? (
                    <div className="max-w-2xl mx-auto bg-[#222222] border border-[#2D2D2D] rounded-xl p-6 shadow-xl space-y-3">
                      <h2 className="text-lg font-bold text-white">🛡️ Authorizations</h2>
                      <SimBadge>Demo mode: sign in with an administrator token to manage users and policy</SimBadge>
                    </div>
                  ) : (
                    <GovernanceHub session={session} identity={identity} />
                  )
                )}
              </div>

            </div>

            {panelVisible && (
              <aside data-testid="assistant-drawer" data-dock={wide ? "right" : "bottom"} style={wide ? { position: "fixed", top: 0, right: 0, bottom: 0, width: 440, zIndex: 40 } : { position: "fixed", left: 0, right: 0, bottom: 0, height: "50vh", zIndex: 40 }} className={"flex flex-col bg-[#10193a] border-[#2c385d] " + (wide ? "border-l" : "border-t")}>
                <div className="h-14 px-4 flex items-center justify-between border-b border-[#2c385d] shrink-0">
                  <div className="min-w-0"><div className="text-sm font-bold text-white">Chat with SAMM</div><div className="text-[10px] text-[#8ef4b2] font-mono truncate" data-testid="split-scope">{PAGE_TITLES[activeTab] || "SAMM"} · {cname(acting || identity.tenant_id)}{split ? " · About: " + splitLabel : ""}</div></div>
                  <button data-testid="assistant-close" onClick={closeChat} aria-label="Close chat panel" className="border border-[#3D3D3D] hover:border-[#8ef4b2] text-white text-xs px-2 py-1 rounded">Close ✕</button>
                </div>
                <div className="flex-1 overflow-y-auto p-3 space-y-3" data-testid="chat-feed">
                  {messages.length === 0 && <div data-testid="drawer-assistant" className="rounded-lg p-3 text-sm bg-[#1b2547] border border-[#2c385d] text-[#d6def0]">Tell me what you want, on any page. For example: build me a dashboard of total rent by site, give me the landsec report, combine the property table and the weekly tasks report, publish this to Power BI and email it to anna@company.com{CAN_ONBOARD.includes(role) ? ", invite jane@company.com as a viewer" : ""}. Or just ask a question about your data.</div>}
                  {messages.map((msg) => (
                    <div key={msg.id} data-testid={msg.role === "user" ? "drawer-user" : "drawer-assistant"} className={"rounded-lg p-3 text-sm " + (msg.role === "user" ? "bg-blue-600 text-white ml-8" : "bg-[#1b2547] border border-[#2c385d] text-[#E3E3E3] mr-2")}>
                      {msg.simulated && <div className="text-[10px] font-mono text-amber-400 mb-1">SIMULATED · {msg.timestamp}</div>}
                      {msg.error ? <ErrorCard message={msg.error.message} details={msg.error.details} status={msg.error.status} /> : <MessageBody msg={msg} onOpenArtifact={openArtifact} />}
                      {msg.sqlArtifact && <button onClick={() => openArtifact(msg.sqlArtifact.id)} data-testid="sql-chip" className="mt-2 text-xs font-mono text-amber-500 hover:text-amber-400 underline">Show executed SQL</button>}
                      {!/\n\|[\s:|-]+\|/.test(msg.text || "") && <ResultTable rows={msg.rows} />}
                      {msg.role === "assistant" && !msg.error && <ChartBlock rows={msg.rows} title={msg.question} onPin={() => pinTile(msg.question, msg.rows)} />}
                      {msg.role === "assistant" && !msg.error && split && split.reportId && Array.isArray(msg.rows) && msg.rows.length > 0 && (
                        <button data-testid="add-to-report" disabled={!!added[msg.id]} onClick={async () => { setPanelErr(""); try { await addToReport(msg); setAdded((x) => ({ ...x, [msg.id]: true })); } catch (e) { setPanelErr((e && e.message) || "Could not add that to the report."); } }} className="mt-2 text-xs border border-[#8ef4b2]/60 text-[#8ef4b2] hover:bg-[#8ef4b2]/10 px-2 py-1 rounded disabled:opacity-60">{added[msg.id] ? "Added to report ✓" : "Add to report"}</button>
                      )}
                      {msg.suggestions && msg.suggestions.length > 0 && msg === messages[messages.length - 1] && (
                        <div className="flex flex-wrap gap-2 mt-3" data-testid="suggestions">
                          {msg.suggestions.map((sg) => (
                            <button key={sg} data-testid="suggestion" disabled={isLoading} onClick={() => sendText(sg, { chip: true })} className="text-xs border border-[#3D3D3D] hover:border-[#8ef4b2] text-[#D0D0D0] px-3 py-1.5 rounded-full disabled:opacity-50">{sg}</button>
                          ))}
                        </div>
                      )}
                      {msg.buildDone && <button data-testid="open-dashboard" onClick={() => setActiveTab("dashboard")} className="mt-3 text-xs border border-[#8ef4b2] text-[#8ef4b2] px-3 py-1.5 rounded-lg">Open the dashboard</button>}
                      {msg.chips && msg.chips.length > 0 && msg === messages[messages.length - 1] && (
                        <div className="flex flex-wrap gap-2 mt-3" data-testid="chat-chips">
                          {msg.chips.map((c) => <button key={c.label} data-testid="chat-chip" disabled={isLoading} onClick={() => sendText(c.send)} className="text-xs border border-[#3D3D3D] hover:border-[#8ef4b2] text-[#D0D0D0] px-3 py-1.5 rounded-full disabled:opacity-50">{c.label}</button>)}
                        </div>
                      )}
                      {msg.remember && (
                        <div data-testid="remember" className="mt-3 text-[11px] text-[#b8c2d6] border-t border-[#2c385d] pt-2">
                          {msg.remember.saved
                            ? <span data-testid="remember-saved" className="text-[#8ef4b2]">Remembered. From now on, "{msg.remember.said}" means "{msg.remember.meant}" for your whole team.</span>
                            : <>Did that answer what you meant? <button data-testid="remember-btn" onClick={() => rememberSaying(msg.id)} className="underline text-[#8ef4b2] hover:text-white">Remember it for next time</button>{msg.remember.error && <span className="text-red-300"> {msg.remember.error}</span>}</>}
                        </div>
                      )}
                      {msg.diagnostic && <div data-testid="diagnostic" className="text-[10px] text-amber-400/80 mt-2 font-mono">Engineer note: {msg.diagnostic}</div>}
                      {msg.meta && (
                        <div className="text-[10px] text-[#707070] mt-2 font-mono">
                          role {msg.meta.role} · tenant {msg.meta.tenant} · row cap {msg.meta.cap}{msg.meta.truncated ? " · results truncated at the cap" : ""}
                          {msg.meta.finops && (" · scanned " + fmtBytes(msg.meta.finops.scanned_bytes) + " of " + fmtBytes(msg.meta.finops.ceiling_bytes) + " limit · est. $" + msg.meta.finops.est_cost_usd.toFixed(5))}
                        </div>
                      )}
                    </div>
                  ))}
                  {isLoading && <div className="text-xs font-mono text-[#A0A0A0] animate-pulse">SAMM is working...</div>}
                  {reviewCard && reviewCard.status === "done" && (
                    <div data-testid="review-done" className="rounded-lg p-3 bg-[#1b2547] border border-[#2c385d]">
                      <ReviewCard card={reviewCard} busy={reviewBusy} onAct={reviewAct} onDiscard={() => setReviewCard(null)} />
                      {reviewCard.kind === "dashboard" && <button data-testid="open-dashboard" onClick={() => setActiveTab("dashboard")} className="mt-3 text-xs border border-[#8ef4b2] text-[#8ef4b2] px-3 py-1.5 rounded-lg">Open the dashboard</button>}
                    </div>
                  )}
                  {panelErr && <div className="text-[11px] text-amber-200">{panelErr}</div>}
                  <div ref={messagesEndRef} />
                </div>
                <form onSubmit={handleSendMessage} className="border-t border-[#2c385d] p-3 space-y-2 shrink-0">
                  <div className="flex items-center gap-2">
                    <select aria-label="Persona" value={persona} onChange={(e) => setPersona(e.target.value)} className="bg-[#1b2547] border border-[#2c385d] rounded-lg px-2 py-1 text-[11px] text-white font-mono focus:outline-none focus:border-[#8ef4b2]">
                      {PERSONAS.map((p) => <option key={p.value} value={p.value}>{p.label}</option>)}
                    </select>
                    {talk && talk.context && (
                      <button type="button" data-testid="talk-chip" title="SAMM is answering follow-ups about this. Click to clear." onClick={() => setTalk(null)} className="text-[10px] font-mono border border-amber-500/50 text-amber-300 rounded-full px-2 py-1 truncate hover:border-amber-400">Talking about: {talk.context} ✕</button>
                    )}
                  </div>
                  <div className="flex gap-2">
                    <input aria-label="Ask a question" data-testid="drawer-input" value={input} onChange={(e) => setInput(e.target.value)} disabled={isLoading} placeholder="Describe what you want..." className="flex-1 bg-[#1b2547] border border-[#2c385d] rounded-lg py-2 px-3 text-sm text-white focus:outline-none focus:border-[#8ef4b2] disabled:opacity-50" />
                    <button type="submit" data-testid="drawer-send" disabled={isLoading || !input.trim()} className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white text-sm px-3 rounded-lg">Send</button>
                  </div>
                </form>
              </aside>
            )}
            {/* RIGHT-HAND ARTIFACT PANEL */}
            <ArtifactPanel
              open={panelOpen}
              artifacts={artifacts}
              activeId={activeArtifact}
              onSelect={setActiveArtifact}
              onClose={() => setPanelOpen(false)}
            />
          </div>
          </SplitCtx.Provider>
        );
      }

      function InviteLanding({ code, api, onDone, onSkip }) {
        const [info, setInfo] = useState(null);
        const [err, setErr] = useState(null);
        const [busy, setBusy] = useState(false);
        const [remember, setRemember] = useState(false);
        useEffect(() => {
          let on = true;
          callPublic(api, { action: "invite_info", code }).then((r) => on && setInfo(r)).catch((e) => on && setErr(e));
          return () => { on = false; };
        }, []);
        const go = async () => {
          setBusy(true); setErr(null);
          try {
            const r = await callPublic(api, { action: "invite_activate", code });
            const who = await callBackend(api, r.token, { action: "whoami" });
            if (remember) rememberSet(api, r.token);
            try { window.history.replaceState(null, "", window.location.pathname + window.location.search); } catch (_) { /* optional */ }
            onDone({ url: api, token: r.token, identity: who });
          } catch (e) { setErr(e); setBusy(false); }
        };
        return (
          <AuthShell testid="invite-shell">
            <div data-testid="invite-landing" className="w-full samm-login-card p-8 space-y-4">
              <div className="flex flex-col items-center text-center space-y-2 pb-2">
                <SammMark size={44} />
                <h1 className="font-semibold text-xl text-white tracking-tight">You have been invited</h1>
                <p className="text-xs text-[#A0A0A0]">One-time link</p>
              </div>
              {!info && !err && <div className="text-xs text-[#A0A0A0]">Checking your invitation...</div>}
              {info && (
                <div className="space-y-3 text-sm text-[#E3E3E3]">
                  <p data-testid="invite-text">You can use SAMM for <b className="text-white">{info.client_name || info.client}</b> as <b className="text-white">{ROLE_LABELS[info.role] || info.role}</b>: {info.role_words}.</p>
                  <p className="text-xs text-[#A0A0A0]">This invitation is for {info.email} and works once. It stops working on {String(info.expires_at || "").slice(0, 16).replace("T", " ")} UTC.</p>
                  <label className="flex items-center gap-2 text-xs text-[#C0C0C0]"><input data-testid="invite-remember" type="checkbox" checked={remember} onChange={(e) => setRemember(e.target.checked)} /> Keep me signed in on this device (do not tick on a shared computer)</label>
                  <button data-testid="invite-activate" onClick={go} disabled={busy} className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-sm py-2.5 rounded-lg">{busy ? "Activating..." : "Activate my access"}</button>
                </div>
              )}
              {err && <div data-testid="invite-error" className="text-xs text-red-300 bg-red-900/20 border border-red-800 rounded-md p-3">{err.message}</div>}
              <button onClick={onSkip} className="w-full text-xs text-[#A0A0A0] hover:text-white underline">I already have an access token</button>
            </div>
          </AuthShell>
        );
      }
      function parseInvite() {
        const m = /#invite=([A-Za-z0-9_\-]{1,64}\.[A-Za-z0-9_\-]{10,200})&api=([^&]+)/.exec(window.location.hash || "");
        if (!m) return null;
        let api = "";
        try { api = decodeURIComponent(m[2]); } catch (_) { return null; }
        return /^https:\/\/[A-Za-z0-9.\-]+\.on\.aws\/?$|^https:\/\/[A-Za-z0-9.\-]+\/?$/.test(api) ? { code: m[1], api } : null;
      }
      function App() {
        const [session, setSession] = useState(null);
        const [demo, setDemo] = useState(FORCE_DEMO);
        const [invite, setInvite] = useState(() => parseInvite());
        const [checking, setChecking] = useState(() => !parseInvite() && !!rememberGet());
        useEffect(() => {
          const d = rememberGet();
          if (!checking || !d) return;
          callBackend(d.url, d.token, { action: "whoami" }).then((who) => setSession({ url: d.url, token: d.token, identity: who })).catch(() => rememberClear()).finally(() => setChecking(false));
        }, []);
        if (demo) return <SammConsole demo={true} onSignOut={() => setDemo(false)} />;
        if (checking) return <div className="min-h-screen flex items-center justify-center samm-login-bg text-xs text-[#A0A0A0]">Signing you in...</div>;
        if (invite && !session) return <InviteLanding code={invite.code} api={invite.api} onDone={(s) => { setInvite(null); setSession(s); }} onSkip={() => setInvite(null)} />;
        if (!session) {
          return <SignIn defaultUrl={API_URL} onSignedIn={setSession} onDemo={() => setDemo(true)} />;
        }
        return <SammConsole session={session} demo={false} onSignOut={() => { rememberClear(); setSession(null); }} onToken={(t) => { setSession((s) => ({ ...s, token: t })); if (rememberGet()) rememberSet(session.url, t); }} />;
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
